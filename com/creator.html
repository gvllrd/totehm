<body>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = 'https://abujjbkbbiumxrokozph.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFidWpqYmtiYml1bXhyb2tvenBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NTUyODIsImV4cCI6MjA5MDUzMTI4Mn0.1baPwPzAeT91Re9xj6afBrNso-Ri46fvIIwvATZL2us';
const sb = createClient(SB_URL, SB_ANON);
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const BUILD = '2026-10-03-search-boxes';

/* ── DÉPART du pont SSO — copié de tools/sso_snippet.js (le lien) ── */
async function ssoVersDomaine(sb, cible, url){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const r = await fetch(SB_URL + '/functions/v1/sso-mint', { method:'POST',
        headers:{'authorization':'Bearer '+session.access_token,'apikey':SB_ANON,'content-type':'application/json'},
        body: JSON.stringify({ target: cible }) });
      if(r.ok){ const { code } = await r.json(); if(code){ location.href = url + (url.includes('#') ? '&' : '#') + 'sso=' + code; return; } }
      else console.error('[sso] mint', r.status);
    }
  }catch(e){ console.error('[sso]', e && e.message || e); }
  location.href = url;
}

const COLOR = { fight:'#E24B4A', flow:'#e48b31', enrich:'#fcbe21', love:'#639922', express:'#1D9E75', focus:'#378ADD', celebrate:'#7F77DD' };
/* Ce qu'un abonnement donne — une phrase, la même pour tous (brief du 01/10). */
const BEN = 'the shared TOTEHM · the exact place of shared spots with location on';
const money = (c, cur) => { try{ return new Intl.NumberFormat('en', { style:'currency', currency:(cur||'eur').toUpperCase(), maximumFractionDigits: c % 100 ? 2 : 0 }).format(c/100); }catch(_){ return (c/100) + ' ' + cur; } };
const day = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : '';

/* Le nom vient du chemin (/@nom) ou de ?n= ; sans nom, c'est la recherche. */
const NAME = (() => {
  const m = /^\/@([^/?#]{1,32})\/?$/.exec(location.pathname);
  const n = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('n');
  return n && n.trim() ? n.trim().slice(0, 32) : null;
})();
let me = null, C = null, PENDING = null;
window.__totehm_creator = () => ({ build: BUILD, mode: NAME ? 'page' : 'search', signed_in: !!me, loaded: !!C,
  ok: !!C?.ok, why: C?.why || null, open: !!C?.sale?.open, subscribed: !!C?.viewer?.subscribed,
  can_read: !!C?.viewer?.can_read });

let sessionSeq=0;
async function session(){
  const seq=++sessionSeq,previous=me?.id||null;
  const { data:{ session } } = await sb.auth.getSession();
  if(seq!==sessionSeq)return;
  me = session?.user || null;
  if(searchBooted&&previous!==(me?.id||null))searchCtl.authChanged();
  $('member').classList.toggle('is-in', !!me);
  $('member-txt').textContent = me ? 'My TOTEHM' : 'Sign in';
  if(me){const uid=me.id;const {data,error}=await sb.from('profiles').select('pseudo').eq('id',uid).maybeSingle();if(error)console.error('[member profile]',error.message);if(seq!==sessionSeq||me?.id!==uid)return;$('member-txt').textContent=data?.pseudo || 'My TOTEHM';}
  $('menu').innerHTML = (me ? '<a class="m-it" href="/totehm#in">My TOTEHM</a><a class="m-it" href="/console">Console</a>' : '<button class="m-it" type="button" data-signin="1">Sign in</button>') +
    '<a class="m-it" href="/search">Search</a>' + (me ? '<button class="m-it" type="button" data-out="1">Sign out</button>' : '') +
    '<a class="m-it m-terms" href="/terms" target="_blank" rel="noopener">Simple terms of use</a>';
}

/* TOTEHM SEARCH · copied into the independent COM pages, never imported. */
const searchViews=new Set();
function TotehmSearch({input,results,note,controls,more,onResults=()=>{}}){
  let seq=0,timer=0,scope='names',kind='',intention='',query='',offset=0,rows=[],running=false;
  const labels={h:'Habit',t:'Objective',r:'Repulsion',w:'Teaching',v:'Vision'};
  const money=(c,cur)=>{try{return new Intl.NumberFormat('en',{style:'currency',currency:(cur||'eur').toUpperCase(),maximumFractionDigits:c%100?2:0}).format(c/100);}catch{return c/100+' '+(cur||'eur');}};
  const href=(r,b)=>'/totehm?ro='+encodeURIComponent(r.pseudo)+(b?'&box_kind='+b.kind+'&box_key='+encodeURIComponent(b.key):'');
  controls.innerHTML='<div class="ts-modes" aria-label="Search mode">'+[['names','Names'],['subscriptions','My subscriptions'],['boxes','Boxes I can read']].map(([id,label])=>'<button class="ts-control" type="button" data-search-scope="'+id+'" aria-pressed="false">'+label+'</button>').join('')+'</div><div class="ts-filters hide"><label>Box<select class="ts-control" data-search-kind><option value="">All boxes</option>'+Object.entries(labels).map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('')+'</select></label><label>Intention<select class="ts-control" data-search-intention><option value="">All intentions</option>'+['fight','flow','enrich','love','express','focus','celebrate'].map(i=>'<option value="'+i+'">'+i[0].toUpperCase()+i.slice(1)+'</option>').join('')+'</select></label></div>';
  results.setAttribute('aria-live','polite');results.setAttribute('aria-label','TOTEHM search results');
  function paintModes(){
    controls.querySelectorAll('[data-search-scope]').forEach(b=>b.setAttribute('aria-pressed',String(scope===b.dataset.searchScope)));
    controls.querySelector('.ts-filters').classList.toggle('hide',scope!=='boxes');
    input.placeholder=scope==='boxes'?'words in a box':'a name or @link';
    input.maxLength=scope==='boxes'?96:80;
    input.setAttribute('aria-label',scope==='boxes'?'Search inside TOTEHMs I can read':'Search a TOTEHM by name or link');
  }
  function draw(){
    let similar=false;
    results.innerHTML=rows.map(r=>{
      let h='';if(r.match==='similar'&&!similar){similar=true;h='<div class="ts-section">Similar names</div>';}
      const status=r.own?'Your TOTEHM':r.can_read?'Subscribed · read & copy':r.offer?'Subscription required':'Read access unavailable';
      const price=r.offer&&!r.can_read&&r.price_cents?money(r.price_cents,r.currency)+' / year':'';
      h+='<article class="ts-result"><a class="srch-row ts-open" href="'+href(r)+'"><span class="srch-name tname">'+esc(r.pseudo)+'</span><span class="ts-arrow" aria-hidden="true">↗</span></a><div class="ts-meta"><span class="srch-meta">'+status+'</span>'+(price?'<span>'+esc(price)+'</span>':'')+'</div>';
      if(r.can_read&&Array.isArray(r.boxes))h+=r.boxes.map(b=>'<a class="ts-box" data-kind="'+b.kind+'" href="'+href(r,b)+'"><span class="ts-box-kind">'+(labels[b.kind]||'Box')+'</span><span class="ts-box-text">'+esc(b.text)+'</span></a>').join('');
      return h+'</article>';
    }).join('');onResults(rows.length);
  }
  function cancel(){seq++;clearTimeout(timer);running=false;results.setAttribute('aria-busy','false');more.disabled=false;}
  async function run(reset=true){
    clearTimeout(timer);const current=++seq,uid=me?.id||null;
    if(reset){offset=0;rows=[];results.replaceChildren();more.classList.add('hide');onResults(0);}
    running=true;results.setAttribute('aria-busy','true');more.disabled=true;note.textContent='Searching…';
    try{
      const {data,error}=await sb.rpc('totehm_discover',{p_q:query,p_scope:scope,p_kind:scope==='boxes'?kind:'',p_intention:scope==='boxes'?intention:'',p_offset:offset,p_limit:12});
      if(current!==seq||uid!==(me?.id||null))return;
      if(error){console.error('[totehm_discover]',error.message);throw error;}
      const items=Array.isArray(data?.items)?data.items:[];
      const seen=new Set(rows.map(x=>x.pseudo));rows=rows.concat(items.filter(x=>!seen.has(x.pseudo)));offset+=items.length;
      draw();more.classList.toggle('hide',!data?.more);
      if(data?.why==='signin'){note.innerHTML='Sign in to search your subscriptions and their boxes. <a class="ts-link" href="/totehm#in">Sign in</a>';}
      else note.textContent=rows.length?(data.total||rows.length)+' TOTEHMs'+(scope==='boxes'?' · your accessible boxes':''):scope==='subscriptions'?'Your subscriptions will appear here. Search a name to find a TOTEHM.':scope==='boxes'?'No accessible box matches. Try other words or clear the filters.':'No matching name. Try part of the name or an @link.';
    }catch(e){if(current===seq){note.textContent='Search unavailable. Try again.';more.classList.remove('hide');more.textContent='Retry';}}
    finally{if(current===seq){running=false;results.setAttribute('aria-busy','false');more.disabled=false;}}
  }
  controls.addEventListener('click',e=>{const b=e.target.closest('[data-search-scope]');if(!b)return;
    cancel();scope=b.dataset.searchScope;query=query||'';input.value=query;paintModes();more.textContent='More TOTEHMs';run();});
  controls.addEventListener('change',e=>{if(e.target.matches('[data-search-kind]'))kind=e.target.value;if(e.target.matches('[data-search-intention]'))intention=e.target.value;cancel();run();});
  input.addEventListener('input',()=>{cancel();query=input.value.trim();results.replaceChildren();more.classList.add('hide');onResults(0);note.textContent='Searching…';timer=setTimeout(()=>run(),240);});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();query=input.value.trim();run();}
    if(e.key==='ArrowDown'){e.preventDefault();results.querySelector('a')?.focus();}});
  results.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const f=Array.from(results.querySelectorAll('a'));const i=f.indexOf(document.activeElement);e.preventDefault();const j=i+(e.key==='ArrowDown'?1:-1);if(j<0)input.focus();else f[Math.min(j,f.length-1)]?.focus();});
  more.onclick=()=>{if(running)return;if(more.textContent==='Retry'){more.textContent='More TOTEHMs';run(rows.length===0);}else run(false);};
  paintModes();
  const controller={start(q='',s='names'){cancel();query=q;scope=['names','subscriptions','boxes'].includes(s)?s:'names';kind='';intention='';controls.querySelectorAll('select').forEach(e=>e.value='');paintModes();run();},cancel,authChanged(){cancel();rows=[];results.replaceChildren();more.classList.add('hide');onResults(0);note.textContent='';if(getComputedStyle(controls).visibility==='visible'&&controls.getClientRects().length)run();},reset(){cancel();rows=[];results.replaceChildren();more.classList.add('hide');onResults(0);note.textContent='';}};
  searchViews.add(controller);return controller;
}


/* ══ LA RECHERCHE ════════════════════════════════════════════════════ */
let searchBooted=false;
const searchCtl=TotehmSearch({input:$('q'),results:$('res'),note:$('q-note'),controls:$('search-controls'),more:$('search-more')});

/* ══ LA PAGE D'UN CRÉATEUR ═══════════════════════════════════════════ */
async function loadPage(){
  const { data, error } = await sb.rpc('creator_page', { p_pseudo: NAME });
  if(error){ console.error('[creator_page]', error.message); $('note').className = 'note no'; $('note').textContent = 'this page is unreachable right now'; return; }
  C = data || {};
  if(!C.ok){
    $('who').textContent = NAME;
    $('offer').innerHTML = '<div class="meta">' + (C.why === 'nobody' ? 'no TOTEHM by that name' : 'this TOTEHM is private') + '</div>';
    return;
  }
  document.title = C.pseudo + ' — TOTEHM';
  $('who').textContent = C.pseudo;
  $('pal').innerHTML = (C.palette || []).map(i => '<i style="background:' + (COLOR[i] || '#fff') + '" title="' + esc(i) + '"></i>').join('');
  paintOffer();
}
function paintOffer(){
  const s = C.sale || {}, v = C.viewer || {};
  const open = '<button class="btn" data-do="open" type="button">Open the TOTEHM</button>';
  let h = '';
  if(s.open) h += '<div class="price">' + money(s.price_cents, s.currency) + ' <span class="meta">/ year</span></div>' +
    '<div class="ben">' + BEN + '</div>';
  if(v.me){
    h += '<div class="meta">this is your TOTEHM</div><button class="btn" data-do="mine" type="button">Open my TOTEHM</button>' +
         '<a class="lnk" href="/console">Manage it in my console</a>';
  } else if(v.subscribed){
    h += '<div class="meta" style="color:#fff">subscribed' + (v.until ? ' · ' + (v.ending ? 'ends ' : 'renews ') + day(v.until) : '') + '</div>' + (v.can_read ? open : '');
  } else if(v.can_read){
    h += open;
  } else if(s.open){
    h += v.signed_in ? '<button class="btn" data-do="subscribe" type="button">Subscribe</button>'
                     : '<button class="btn" data-do="signin" type="button">Sign in to subscribe</button>';
  } else {
    h += '<div class="meta">not open to subscriptions yet</div>';
  }
  $('offer').innerHTML = h;
}
$('offer').addEventListener('click', async e => {
  const b = e.target.closest('[data-do]'); if(!b) return;
  const d = b.dataset.do;
  if(d === 'open') location.href = '/totehm?ro=' + encodeURIComponent(C.pseudo);
  if(d === 'mine') location.href = '/totehm#in';
  if(d === 'signin') showSignin('Sign in to subscribe');
  if(d === 'subscribe'){
    b.disabled = true; $('note').className = 'note'; $('note').textContent = 'opening checkout…';
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/creator-subscribe', { method:'POST',
      headers:{ 'content-type':'application/json', 'apikey':SB_ANON, 'authorization':'Bearer ' + (session?.access_token || SB_ANON) },
      body: JSON.stringify({ pseudo: C.pseudo, from: 'page' }) });
    const j = await r.json().catch(() => ({}));
    if(j.url){ location.href = j.url; return; }
    if(j.already){ await loadPage(); return; }
    $('note').className = 'note no';
    $('note').textContent = ({ closed:'not open to subscriptions', self:'this is you' })[j.error] || j.error || 'checkout unavailable';
    b.disabled = false;
  }
});

/* ══ SE CONNECTER — totehm.com est la source de l'identité ═══════════ */
function showSignin(why){
  PENDING = true;
  $('si-why').textContent = why || 'Sign in';
  $('signin').classList.remove('hide');
  $('si-email').classList.remove('hide'); $('si-code').classList.add('hide');
  setTimeout(() => $('si-email').focus(), 60);
  $('signin').scrollIntoView({ behavior:'smooth', block:'center' });
}
let mail = '';
$('si-email').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  const v = $('si-email').value.trim(), n = $('si-note');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ n.className = 'note no'; n.textContent = 'invalid email'; return; }
  n.className = 'note'; n.textContent = 'sending…';
  const { error } = await sb.auth.signInWithOtp({ email: v, options:{ shouldCreateUser: true } });
  if(error){ n.className = 'note no'; n.textContent = 'try again in a minute'; return; }
  mail = v; n.className = 'note ok'; n.textContent = 'code sent';
  $('si-email').classList.add('hide'); $('si-code').classList.remove('hide'); setTimeout(() => $('si-code').focus(), 60);
});
$('si-code').addEventListener('input', async () => {
  const t = $('si-code').value.trim(), n = $('si-note');
  if(t.length !== 6) return;
  n.className = 'note'; n.textContent = 'verifying…';
  const { error } = await sb.auth.verifyOtp({ email: mail, token: t, type: 'email' });
  if(error){ n.className = 'note no'; n.textContent = 'wrong code'; return; }
  n.textContent = ''; $('signin').classList.add('hide'); PENDING = null;
  await session(); if(NAME) loadPage();
});
$('si-x').onclick = () => { $('signin').classList.add('hide'); PENDING = null; };
$('member').onclick = () => $('menu').classList.toggle('is-open');
$('menu').addEventListener('click', async e => {
  if(e.target.closest('[data-signin]')){ $('menu').classList.remove('is-open'); showSignin('Sign in'); }
  if(e.target.closest('[data-out]')){ await sb.auth.signOut({ scope:'local' }); $('menu').classList.remove('is-open'); await session(); if(NAME) loadPage(); }
});
document.addEventListener('pointerdown', e => { if(!e.target.closest('#menu,#member')) $('menu').classList.remove('is-open'); });

/* ══ DÉMARRAGE ═══════════════════════════════════════════════════════ */
await session();
if(NAME){
  $('page').classList.remove('hide');
  await loadPage();
  if(new URLSearchParams(location.search).get('subscribed')){
    /* Le webhook peut arriver une seconde après le retour de Stripe. */
    $('note').className = 'note ok'; $('note').textContent = 'welcome — your subscription is being written';
    for(let k = 0; k < 6 && C?.ok && !C.viewer?.subscribed; k++){ await new Promise(r => setTimeout(r, 1500)); await loadPage(); }
    $('note').textContent = C?.viewer?.subscribed ? 'subscribed' : 'payment received — refresh in a moment';
  }
}else{
  $('search').classList.remove('hide');
  const q0 = new URLSearchParams(location.search).get('q');
  if(q0)$('q').value=q0;
  searchBooted=true;
  searchCtl.start(q0||'','names');
  setTimeout(() => $('q').focus(), 60);
}
sb.auth.onAuthStateChange(event=>{if(event==='INITIAL_SESSION')return;setTimeout(async()=>{await session();if(NAME)loadPage();},0);});
</script>
