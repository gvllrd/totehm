*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--mid);font-family:var(--mono);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
:focus-visible{outline:1px solid #fff;outline-offset:3px}

/* L'accès membre (haut gauche) : le NOM du Totehm en Quantico Coral, sans point. */
#member{position:fixed;top:14px;left:12px;z-index:40;display:flex;align-items:center;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);padding:8px 6px}
#member.is-in{font-family:var(--q);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--coral)}
/* Le menu membre — SIMPLE TERMS OF USE toujours en dernier. */
#menu{position:fixed;top:0;left:0;z-index:45;width:min(320px,88vw);background:var(--g2);padding:58px 16px 18px;display:flex;flex-direction:column;gap:6px;
  transform:translateY(-104%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
#menu.is-open{transform:none;visibility:visible;transition:transform .3s ease}
#menu .m-it{display:block;width:fit-content;text-align:left;background:var(--g4);border:none;border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--mid);
  font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#menu .m-terms{background:none;font-weight:400;color:var(--lo);margin-top:8px;padding-left:2px}

main{width:100%;max-width:520px;margin:0 auto;padding:max(84px,11dvh) 16px 96px;display:flex;flex-direction:column;align-items:center;text-align:center}
.kick{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--lo)}
.note{font-size:10px;letter-spacing:.1em;text-transform:uppercase;min-height:16px;color:var(--lo)}
.note.no{color:var(--no)}.note.ok{color:var(--on)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:fit-content;max-width:100%;font-family:var(--mono);font-weight:700;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--mid);background:var(--g4);border:none;border-radius:10px;cursor:pointer;padding:10px 16px;
  transition:background .15s,color .15s,transform .15s}
.btn.is-main{color:#fff;background:var(--g5);font-size:12px;padding:13px 22px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.lnk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lo);background:none;border:none;cursor:pointer;padding:6px 2px}
.in{width:100%;font-family:var(--q);font-size:16px;color:#fff;background:var(--g1);outline:none;border:none;border-radius:10px;padding:12px 14px;text-align:center;
  caret-color:#fff;-webkit-appearance:none;appearance:none}
.in:focus{background:#000}
.in::placeholder{color:rgba(255,255,255,.34)}

/* ══ LE PAPIER — le verso du Totehm : le papier navy perforé, et le NOM ══ */
.paper{position:relative;width:min(232px,64vw);aspect-ratio:1;background:var(--paper) 0 0/100% 100% no-repeat;
  display:flex;align-items:center;justify-content:center;padding:14%}
.tname{display:inline-block;max-width:100%;font-family:var(--q);font-weight:400;color:var(--coral);background:#000;border-radius:10px;
  padding:6px 12px;line-height:1.3;overflow-wrap:anywhere}
.paper .tname{font-size:var(--fs,26px)}
.ints{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:18px;min-height:18px}
.ints span{display:inline-flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.ints i{width:8px;height:8px;border-radius:50%;display:block}

/* ══ L'OFFRE — un panneau sombre, carré, sans bordure ══ */
.offer{width:100%;margin-top:28px;background:var(--g2);padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.price{display:flex;align-items:baseline;gap:8px;color:#fff;font-weight:700;font-size:30px;line-height:1.1}
.price small{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--lo)}
.gets{width:100%;display:flex;flex-direction:column;gap:2px;margin:4px 0 2px;text-align:left}
.get{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--g1);padding:12px 14px}
.get b{display:block;font-size:11px;letter-spacing:.06em;color:#fff}
.get p{font-size:10px;line-height:1.55;color:var(--lo)}
/* La croix des cinq vues (une forme, jamais un contenu) */
.croix{display:grid;grid-template-columns:repeat(3,8px);grid-template-rows:repeat(3,8px);gap:2px;justify-content:center}
.croix i{display:block}
.croix .c-t{grid-area:1/2;background:var(--blue)}.croix .c-w{grid-area:2/1;background:var(--wis)}.croix .c-h{grid-area:2/2;background:var(--navy)}
.croix .c-v{grid-area:2/3;background:var(--vis)}.croix .c-r{grid-area:3/2;background:var(--rep)}
/* Le point d'un space : là où il est, maintenant */
.pt{position:relative;width:12px;height:12px;margin:0 auto;border-radius:50%;background:#fff}
.pt::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:rgba(255,255,255,.14)}
.fine{font-size:9px;line-height:1.7;letter-spacing:.06em;color:var(--lo);max-width:380px}
.state{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.state.is-off{color:var(--lo)}
.mine{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#si-note{text-transform:none;letter-spacing:.04em}
#signin{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--g2);padding:0 18px 20px}
.foot{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:4px}

#q{font-size:clamp(22px,6.4vw,30px);color:var(--coral);caret-color:var(--coral);background:var(--g1);padding:14px 16px;margin-top:6px}

#q::placeholder{color:rgba(251,213,202,.32)}
.hint{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#res{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:4px;text-align:left}
.ns-label{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lo);padding:6px 2px 4px}
.srch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--g2);padding:10px 12px;transition:background .15s}
.srch-name{font-family:var(--q);font-size:17px;color:var(--coral);background:#000;border-radius:10px;padding:5px 11px;line-height:1.35;max-width:72%;overflow-wrap:anywhere}
.srch-meta{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lo);white-space:nowrap;margin-left:auto}
.srch-row::after{content:"\2192";font-size:14px;color:var(--dim)}
.srch-meta:empty+*,.srch-row:has(.srch-meta:empty)::after{margin-left:auto}
.srch-meta:empty{display:none}

@media(hover:hover){
  .btn:hover{background:var(--g5);color:#fff}.btn.is-main:hover{background:#44444b}
  .srch-row:hover{background:var(--g3)}.srch-row:hover::after{color:#fff}
  #menu .m-it:hover{background:var(--g5)}

.srch-meta:hover,
.srch-row:hover::after{color:#fff}
}

function resetComMemberOffer() { comOfferSeq++; paintComMemberOffer(null); }
async function readComMemberOffer(sb, currentUser) {
  const uid = currentUser()?.id || null, seq = ++comOfferSeq;
  if (!uid) { paintComMemberOffer(false); return false; }
  try {
    const { data, error } = await sb.rpc('my_console');
    if (seq !== comOfferSeq || uid !== currentUser()?.id) return;
    if (error) { console.error('[member offer]', error.message); paintComMemberOffer(null); return; }
    const enabled=data?.signed_in && typeof data.offer?.enabled === 'boolean' ? data.offer.enabled : null;
    paintComMemberOffer(enabled);return enabled;
  } catch (error) {
    if (seq !== comOfferSeq || uid !== currentUser()?.id) return;
    console.error('[member offer]', error?.message || error); paintComMemberOffer(null);
  }
}
function wireComMemberMenu(host, { open, bridge } = {}) {
  host.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button > 0) return;
    if (link.hasAttribute('data-com-open') && open) { event.preventDefault(); open(link); }
    else if (link.dataset.comBridge && bridge) { event.preventDefault(); bridge(link.dataset.comBridge, link.href); }
  });
}
/* Same 60s, one-use SSO bridge as tools/sso_snippet.js. No session in URLs. */
async function comMemberBridge(sb, target, url, apiURL, publicKey) {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const response = await fetch(apiURL + '/functions/v1/sso-mint', {
        method: 'POST', headers: { authorization: 'Bearer ' + session.access_token, apikey: publicKey, 'content-type': 'application/json' },
        body: JSON.stringify({ target })
      });
      if (response.ok) {
        const { code } = await response.json();
        if (code) { location.href = url + (url.includes('#') ? '&' : '#') + 'sso=' + code; return; }
      } else console.error('[member bridge]', response.status);
    }
  } catch (error) { console.error('[member bridge]', error?.message || error); }
  location.href = url;
}

/* END COM MEMBER MENU */
wireComMemberMenu($('menu'),{bridge:(target,url)=>comMemberBridge(sb,target,url,SB_URL,SB_ANON)});

const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const BUILD='2026-10-05-com-aplomb';

const COLOR = { fight:'#E24B4A', flow:'#e48b31', enrich:'#fcbe21', love:'#639922', express:'#1D9E75', focus:'#378ADD', celebrate:'#7F77DD' };
const money = (c, cur) => { try{ return new Intl.NumberFormat('en', { style:'currency', currency:(cur||'eur').toUpperCase(), maximumFractionDigits: c % 100 ? 2 : 0 }).format(c/100); }catch(_){ return (c/100) + ' ' + (cur||'eur'); } };
const day = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '';

/* Le nom vient du chemin (/@nom) ou de ?n= ; sans nom, c'est la recherche. */
const NAME = (() => {
  const m = /^\/@([^/?#]{1,32})\/?$/.exec(location.pathname);
  const n = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('n');
  return n && n.trim() ? n.trim().replace(/^@/,'').slice(0, 32) : null;
})();
let me = null, C = null, WANT = null, pageSeq = 0;
window.__totehm_creator = () => ({ build: BUILD, mode: NAME ? 'page' : 'search', signed_in: !!me, loaded: !!C,
  ok: !!C?.ok, why: C?.why || null, open: !!C?.sale?.open, subscribed: !!C?.viewer?.subscribed,
  can_read: !!C?.viewer?.can_read, me: !!C?.viewer?.me, signin_open: !$('signin').classList.contains('hide'),
  results: $('res')?.querySelectorAll('.srch-row').length || 0 });

/* ══ LA SESSION — un seul chemin ═════════════════════════════════════ */
let sessionSeq=0;
async function session(){
  const seq=++sessionSeq, avant=me?.id||null;
  const { data:{ session } } = await sb.auth.getSession();
  if(seq!==sessionSeq) return;
  me = session?.user || null;
  if(avant!==(me?.id||null)) searchViews.forEach(c=>c.authChanged());
  $('member').classList.toggle('is-in', !!me);
  $('member-txt').textContent = me ? 'My TOTEHM' : 'CONNECT WITH MY TOTEHM';
  $('menu').innerHTML=comMemberLinks(false,me?null:false)+(me?'<button class="m-it" type="button" data-out="1">Sign out</button>':'<button class="m-it" type="button" data-signin="1">CONNECT WITH MY TOTEHM</button>')+
    '<a class="m-it m-terms" href="/terms" target="_blank" rel="noopener">Simple terms of use</a>';
  if(me){
    const uid=me.id;
    const {data,error}=await sb.from('profiles').select('pseudo').eq('id',uid).maybeSingle();
    if(error) console.error('[member profile]',error.message);
    if(seq!==sessionSeq||me?.id!==uid) return;
    if(data?.pseudo) $('member-txt').textContent=data.pseudo;
  }
  readComMemberOffer(sb,()=>me);
}

/* ══ CHERCHER UN TOTEHM : UN NOM, ET C'EST TOUT — copié de totehm.html ══ */
const searchViews=new Set();
function NameSearch({input,results,note,onResults=()=>{}}){
  let seq=0,timer=0,rows=[];
  const href=p=>'/totehm?ro='+encodeURIComponent(p);
  const propre=v=>String(v||'').trim().replace(/^https?:\/\/[^/]+\//i,'').replace(/^@/,'').replace(/[/?#].*$/,'');
  const dire=t=>{ note.textContent=t; };
  function draw(q){
    results.innerHTML=(!q&&rows.length?'<div class="ns-label">My subscriptions</div>':'')
      +rows.map(r=>'<a class="srch-row" href="'+href(r.pseudo)+'"><span class="srch-name">'+esc(r.pseudo)+'</span>'
        +'<span class="srch-meta">'+(r.subscribed?'subscribed':'')+'</span></a>').join('');
    onResults(rows.length);
  }
  async function run(q,ouvrir=false){
    clearTimeout(timer); const mon=++seq, uid=me?.id||null;
    if(q.length===1){ rows=[]; draw(q); dire('two letters, minimum'); return; }
    if(!q&&!me){ rows=[]; draw(q); dire(''); return; }
    if(q) dire('searching\u2026');
    const {data,error}=await sb.rpc('totehm_search',{p_q:q,p_limit:12});
    if(mon!==seq||uid!==(me?.id||null)) return;               /* réponse tardive : jetée */
    if(error){ console.error('[totehm_search]',error.message); dire('search is unreachable right now'); return; }
    rows=Array.isArray(data)?data:[];
    dire(rows.length||!q?'':'no TOTEHM by that name');
    draw(q);
    if(ouvrir&&rows.length){
      const pile=rows.find(r=>r.pseudo.toLowerCase()===q.toLowerCase())||rows[0];
      location.href=href(pile.pseudo);
    }
  }
  input.addEventListener('input',()=>{ clearTimeout(timer); const v=propre(input.value); timer=setTimeout(()=>run(v),220); });
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); run(propre(input.value),true); }
    if(e.key==='ArrowDown'){ const a0=results.querySelector('a'); if(a0){ e.preventDefault(); a0.focus(); } }
  });
  results.addEventListener('keydown',e=>{
    if(!['ArrowDown','ArrowUp'].includes(e.key)) return;
    const f=Array.from(results.querySelectorAll('a')), i=f.indexOf(document.activeElement);
    e.preventDefault(); const j=i+(e.key==='ArrowDown'?1:-1);
    (j<0?input:f[Math.min(j,f.length-1)]).focus();
  });
  const controller={
    start(q=''){ run(propre(q)); },
    reset(){ seq++; clearTimeout(timer); rows=[]; results.replaceChildren(); onResults(0); dire(''); },
    authChanged(){ seq++; clearTimeout(timer); rows=[]; results.replaceChildren(); onResults(0); dire(''); }
  };
  searchViews.add(controller); return controller;
}

/* ══ LA PAGE D'UN MEMBRE ═════════════════════════════════════════════ */
function paintName(n){
  $('who').textContent = n;
  const L = [...n].length;
  $('paper').style.setProperty('--fs', (L <= 8 ? 28 : L <= 13 ? 22 : L <= 20 ? 17 : 14) + 'px');
}
async function loadPage(){
  const seq = ++pageSeq, uid = me?.id || null;
  const { data, error } = await sb.rpc('creator_page', { p_pseudo: NAME });
  if(seq !== pageSeq || uid !== (me?.id || null)) return false;      /* réponse tardive : jetée */
  if(error){ console.error('[creator_page]', error.message); say('this page is unreachable right now', 'no'); return false; }
  C = data || {};
  if(!C.ok){
    paintName(NAME); $('ints').innerHTML = '';
    $('offer').innerHTML = '<div class="state is-off">' + (C.why === 'nobody' ? 'No TOTEHM by that name' : 'This TOTEHM is private') + '</div>' +
      '<a class="btn" href="/search' + (C.why === 'nobody' ? '?q=' + encodeURIComponent(NAME) : '') + '">Search a TOTEHM</a>';
    document.title = 'TOTEHM';
    return true;
  }
  document.title = C.pseudo + ' · TOTEHM';
  paintName(C.pseudo);
  $('ints').innerHTML = (C.palette || []).map(i => '<span><i style="background:' + (COLOR[i] || '#fff') + '"></i>' + esc(i) + '</span>').join('');
  paintOffer();
  const v = C.viewer || {};
  if(WANT === 'subscribe' && me){
    WANT = null;
    if(C.sale?.open && !v.me && !v.subscribed && !v.can_read) subscribe(null);
  }
  return true;
}

const GETS = n =>
  '<div class="gets">' +
    '<div class="get"><span class="croix" aria-hidden="true"><i class="c-t"></i><i class="c-w"></i><i class="c-h"></i><i class="c-v"></i><i class="c-r"></i></span>' +
      '<span><b>' + esc(n) + '’s whole TOTEHM</b><p>habits · objectives · repulsions · vision · wisdom — read only, as it grows</p></span></div>' +
    '<div class="get"><span class="pt" aria-hidden="true"></span>' +
      '<span><b>Where ' + esc(n) + ' is, right now</b><p>the exact place of their shared spaces in SPACE, when they turn location on</p></span></div>' +
  '</div>';
const PRICE = s => '<div class="price">' + esc(money(s.price_cents, s.currency)) + '<small>/ year</small></div>';
const FINE = n => '<p class="fine">One payment a year, by Stripe. Stop anytime in your console: it runs to the end of the year. 80% goes to ' + esc(n) + '.</p>';

function paintOffer(){
  const s = C.sale || {}, v = C.viewer || {}, n = C.pseudo;
  const ouvrir = '<button class="btn is-main" data-do="open" type="button">Open the TOTEHM</button>';
  let h = '';
  if(v.me){
    h = '<div class="kick">This is your page</div>' +
        '<div class="mine"><button class="btn is-main" data-do="mine" type="button">Open my TOTEHM</button>' +
        '<a class="btn" href="/console">My console</a><button class="btn" data-do="copy" type="button">Copy my link</button></div>' +
        (s.open ? '<div class="kick" style="margin-top:6px">What visitors see</div>' + PRICE(s) + GETS(n) + FINE(n)
                : '<div class="state is-off">Your subscription is off</div><p class="fine">Set a yearly price and where to pay you in your console. This page sells it.</p>');
  } else if(v.subscribed){
    h = '<div class="kick">Your subscription</div>' +
        '<div class="state">' + (v.until ? (v.ending ? 'Ends ' : 'Renews ') + esc(day(v.until)) : 'Active') + '</div>' +
        (v.can_read ? ouvrir : '<p class="fine">' + esc(n) + ' keeps their TOTEHM private for now.</p>') +
        '<a class="lnk" href="/console">Manage in my console</a>';
  } else if(v.can_read){
    h = '<div class="kick">You can read this TOTEHM</div>' + ouvrir;
  } else if(s.open){
    h = '<div class="kick">Yearly subscription</div>' + PRICE(s) + GETS(n) +
        '<button class="btn is-main" data-do="subscribe" type="button">Subscribe</button>' + FINE(n);
  } else {
    h = '<div class="kick">Yearly subscription</div><div class="state is-off">Not open yet</div>' +
        '<p class="fine">' + esc(n) + ' has not opened subscriptions. Come back soon.</p>';
  }
  $('offer').innerHTML = h;
}
function say(t, k){ $('note').className = 'note' + (k ? ' ' + k : ''); $('note').textContent = t || ''; }

async function subscribe(b){
  if(b) b.disabled = true; say('opening checkout…');
  try{
    const { data:{ session:s } } = await sb.auth.getSession();
    if(!s){ WANT = 'subscribe'; showSignin(); if(b) b.disabled = false; say(''); return; }
    const r = await fetch(SB_URL + '/functions/v1/creator-subscribe', { method:'POST',
      headers:{ 'content-type':'application/json', 'apikey':SB_ANON, 'authorization':'Bearer ' + s.access_token },
      body: JSON.stringify({ pseudo: C.pseudo, from: 'page' }) });
    const j = await r.json().catch(() => ({}));
    if(j.url){ location.href = j.url; return; }
    if(j.already){ say('you are already subscribed', 'ok'); await loadPage(); return; }
    if(!r.ok) console.error('[creator-subscribe]', r.status, j.error || '');
    say(({ closed:'not open to subscriptions', self:'this is your own TOTEHM', signin:'connect first', nobody:'no TOTEHM by that name' })[j.error] || 'checkout is unavailable, try again', 'no');
  }catch(e){ console.error('[creator-subscribe]', e && e.message || e); say('checkout is unavailable, try again', 'no'); }
  if(b) b.disabled = false;
}
$('offer').addEventListener('click', async e => {
  const b = e.target.closest('[data-do]'); if(!b) return;
  const d = b.dataset.do;
  if(d === 'open') location.href = '/totehm?ro=' + encodeURIComponent(C.pseudo);
  if(d === 'mine') location.href = '/totehm#in';
  if(d === 'subscribe') subscribe(b);
  if(d === 'copy'){
    const url = 'https://www.totehm.com/@' + encodeURIComponent(C.pseudo);
    try{ await navigator.clipboard.writeText(url); say('link copied', 'ok'); }
    catch(_){ say(url); }
  }
});

/* ══ SE CONNECTER — ici, sur la source de l'identité ═════════════════
   « Subscribe » sans compte : l'email, le code, puis le paiement part
   tout seul (WANT), une fois la page relue sous la nouvelle session. */
function showSignin(){
  $('signin').classList.remove('hide');
  $('offer').querySelector('[data-do=subscribe]')?.classList.add('hide');
  $('si-email').classList.remove('hide'); $('si-code').classList.add('hide'); $('si-code').value = '';
  $('si-note').className = 'note'; $('si-note').textContent = '';
  setTimeout(() => $('si-email').focus(), 60);
}
function hideSignin(){
  $('signin').classList.add('hide');
  $('offer').querySelector('[data-do=subscribe]')?.classList.remove('hide');
}
$('si-x').onclick = () => { WANT = null; hideSignin(); };
$('signin').addEventListener('submit', e => e.preventDefault());
let mail = '';
$('si-email').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const v = $('si-email').value.trim(), n = $('si-note');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ n.className = 'note no'; n.textContent = 'invalid email'; return; }
  n.className = 'note'; n.textContent = 'sending…';
  const { error } = await sb.auth.signInWithOtp({ email: v, options:{ shouldCreateUser: true } });
  if(error){ console.error('[otp]', error.message); n.className = 'note no'; n.textContent = 'try again in a minute'; return; }
  mail = v; n.className = 'note ok'; n.textContent = 'code sent to ' + v;
  $('si-code').classList.remove('hide'); $('si-code').focus(); $('si-email').classList.add('hide');
});
$('si-code').addEventListener('input', async () => {
  const t = $('si-code').value.trim(), n = $('si-note');
  if(t.length !== 6) return;
  n.className = 'note'; n.textContent = 'verifying…';
  const { error } = await sb.auth.verifyOtp({ email: mail, token: t, type: 'email' });
  if(error){ console.error('[otp]', error.message); n.className = 'note no'; n.textContent = 'wrong code'; return; }
  n.textContent = ''; $('signin').classList.add('hide');
  await session(); if(NAME) loadPage();
});

/* ══ LE MENU ═════════════════════════════════════════════════════════ */
$('member').onclick = () => $('menu').classList.toggle('is-open');
$('menu').addEventListener('click', async e => {
  if(e.target.closest('[data-signin]')){
    $('menu').classList.remove('is-open');
    if(NAME && C?.ok && C.sale?.open && !C.viewer?.subscribed && !C.viewer?.can_read){ WANT = null; showSignin(); }
    else location.href = '/totehm#in';
  }
  if(e.target.closest('[data-out]')){ await sb.auth.signOut({ scope:'local' }); $('menu').classList.remove('is-open'); await session(); if(NAME) loadPage(); else searchCtl.start($('q').value); }
});
document.addEventListener('pointerdown', e => { if(!e.target.closest('#menu,#member')) $('menu').classList.remove('is-open'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') $('menu').classList.remove('is-open'); });

/* ══ DÉMARRAGE ═══════════════════════════════════════════════════════ */
const searchCtl = NameSearch({ input:$('q'), results:$('res'), note:$('q-note') });
await session();
if(NAME){
  $('page').classList.remove('hide');
  paintName(NAME);
  await loadPage();
  if(new URLSearchParams(location.search).get('subscribed')){
    /* Le webhook peut arriver quelques secondes après le retour de Stripe. */
    say('welcome · your subscription is being written', 'ok');
    for(let k = 0; k < 8 && C?.ok && !C.viewer?.subscribed; k++){ await new Promise(r => setTimeout(r, 1500)); await loadPage(); }
    say(C?.viewer?.subscribed ? 'you are subscribed' : 'payment received · refresh in a moment', 'ok');
    history.replaceState(null, '', location.pathname);
  }
}else{
  $('search').classList.remove('hide');
  const q0 = new URLSearchParams(location.search).get('q') || '';
  $('q').value = q0;
  searchCtl.start(q0);
  setTimeout(() => $('q').focus(), 60);
}
sb.auth.onAuthStateChange(event => { if(event === 'INITIAL_SESSION') return;
  setTimeout(async () => { await session(); if(NAME) loadPage(); else searchCtl.start($('q').value); }, 0); });
</script>
