<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOTEHM — Origins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --coral: #fbd5ca;
  --cw: min(82vw, 600px);
  --ch: min(65vh, 460px);
}
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

/* ── DECK ── */
#deck {
  position: fixed; inset: 0;
  display: flex; overflow: hidden;
  touch-action: none;
}
.slide {
  flex: 0 0 100%; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  will-change: transform;
  transition: transform .55s cubic-bezier(.65,0,.35,1);
}

/* ── PHOTO CARD (two faces) ── */
.card-scene {
  perspective: 1000px;
  width: var(--cw); height: var(--ch);
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.card-scene.grabbing { cursor: grabbing; }

.card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
}

/* both faces */
.card-front, .card-back {
  position: absolute; inset: 0;
  backface-visibility: hidden;
}

/* FRONT — the video */
.card-front {
  background: #000;
  overflow: hidden;
}
.card-front video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none; user-select: none;
}

/* BACK — white, like the back of a photo print */
.card-back {
  transform: rotateY(180deg);
  background: #fff;
}

/* ── COUNTER ── */
#counter {
  position: fixed; top: 20px; right: 20px;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #444; pointer-events: none;
}

/* ── DOTS ── */
#dots {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap; max-width: 90vw; justify-content: center;
}
.dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: #252525; border: none; cursor: pointer;
  transition: background .3s, transform .3s; padding: 0;
}
.dot.on { background: var(--coral); transform: scale(1.5); }
@media(hover:hover){ .dot:hover:not(.on){ background: #555; } }
</style>
</head>
<body>

<div id="deck"></div>
<div id="counter"></div>
<div id="dots"></div>

<script>
const BASE  = 'https://abujjbkbbiumxrokozph.supabase.co/storage/v1/object/public/wah/';
const FILES = [
  '1.mp4','2.mp4','3.mp4','4.mp4','5.mp4','6.mp4','7.mp4','8.mp4','9.mp4',
  '10.mp4','11.mp4','12.mp4','13.mp4','14.mp4','15.mp4','16.mp4','17.mp4','18.mp4','19.mp4','20.mp4',
  '21_Kobe_Bryant.mp4','22_Ghostemane.mp4','23_Kendrick_Lamar.mp4','24_xxxtentacion.mp4',
  '25_.nipsey.mp4','26_Mike_Tyson.mp4','27_Mike_Tyson_2.mp4'
];
const COUNT = FILES.length;
const deck      = document.getElementById('deck');
const counterEl = document.getElementById('counter');
const dotsEl    = document.getElementById('dots');
const videos    = [];
let cur = 0;

/* ── BUILD SLIDES ── */
for(let i = 0; i < COUNT; i++){
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.style.transform = `translateX(${i * 100}%)`;
  slide.innerHTML = `
    <div class="card-scene" id="scene${i}">
      <div class="card" id="card${i}">
        <div class="card-front">
          <video id="vid${i}" muted loop playsinline preload="none"></video>
        </div>
        <div class="card-back"></div>
      </div>
    </div>`;
  deck.appendChild(slide);
  videos.push(document.getElementById(`vid${i}`));

  const dot = document.createElement('button');
  dot.className = 'dot' + (i===0?' on':'');
  dot.setAttribute('aria-label', String(i+1));
  dot.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(dot);
}

/* ── VIDEO MANAGEMENT ── */
const loaded = new Array(COUNT).fill(false);
function loadVid(i){ if(loaded[i]) return; loaded[i]=true; videos[i].src=BASE+FILES[i]; videos[i].load(); }
function playVid(i){ loadVid(i); videos[i].play().catch(()=>{}); }
function pauseVid(i){ videos[i].pause(); }
function preloadAdj(i){ if(i>0) loadVid(i-1); if(i<COUNT-1) loadVid(i+1); }

/* ── TILT / FLIP CONTROLLER per card ── */
function makeTilt(sceneEl, cardEl){
  let rotX=3, rotY=8, velX=0, velY=0;
  let idleT=0, hoverX=null, hoverY=null;
  let lastTs=null, active=false, rafId=null;
  let grabbed=false, gx=0, gy=0, gRX=0, gRY=0, gt=0;

  function idlePos(t){
    return {
      x: Math.sin(t*.5)*4  + Math.cos(t*.9)*2,
      y: Math.cos(t*.35)*10 + Math.sin(t*.8)*4
    };
  }
  function tick(ts){
    if(!active) return;
    if(!lastTs) lastTs=ts;
    const dt=Math.min((ts-lastTs)/1000,.05); lastTs=ts;
    if(!grabbed){
      idleT+=dt*.25;
      const g=idlePos(idleT);
      const tx=hoverX!==null?hoverX:g.x, ty=hoverY!==null?hoverY:g.y;
      const k=hoverX!==null?8:4;
      velX+=((tx-rotX)*k-velX*3.5)*dt;
      velY+=((ty-rotY)*k-velY*3.5)*dt;
      rotX+=velX*dt; rotY+=velY*dt;
    }
    cardEl.style.transform=`rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
    rafId=requestAnimationFrame(tick);
  }

  /* hover parallax — desktop */
  sceneEl.addEventListener('mousemove',e=>{
    if(grabbed) return;
    const r=sceneEl.getBoundingClientRect();
    hoverX=-((e.clientY-r.top -r.height/2)/(r.height/2))*12;
    hoverY= ((e.clientX-r.left-r.width/2 )/(r.width/2 ))*18;
  });
  sceneEl.addEventListener('mouseleave',()=>{ hoverX=null; hoverY=null; });

  /* drag — physically rotates the card (flip + tilt) */
  function onDown(cx,cy,ts){
    grabbed=true; gx=cx; gy=cy; gRX=rotX; gRY=rotY; gt=ts;
    sceneEl.classList.add('grabbing');
  }
  function onMove(cx,cy){
    if(!grabbed) return;
    rotX=gRX-(cy-gy)*.45;
    rotY=gRY+(cx-gx)*.6;
    cardEl.style.transform=`rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
  }
  function onUp(cx,ts){
    if(!grabbed) return;
    const res={dx:cx-gx, dt:Math.max(1,ts-gt)};
    grabbed=false;
    /* spring back to upright if not significantly flipped */
    const absY=Math.abs(rotY%360);
    const flipped=(absY>90&&absY<270);
    if(!flipped){ rotY=Math.round(rotY/360)*360; } /* snap to 0 or 360 */
    velX=0; velY=0;
    sceneEl.classList.remove('grabbing');
    return res;
  }

  return {
    start(){ if(active) return; active=true; lastTs=null; rafId=requestAnimationFrame(tick); },
    stop() { active=false; if(rafId){ cancelAnimationFrame(rafId); rafId=null; } },
    onDown, onMove, onUp
  };
}

const tilts=[];
for(let i=0;i<COUNT;i++){
  tilts.push(makeTilt(
    document.getElementById(`scene${i}`),
    document.getElementById(`card${i}`)
  ));
}

/* ── NAVIGATION ── */
function updateUI(){
  counterEl.textContent=`${cur+1} / ${COUNT}`;
  dotsEl.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===cur));
}
function goTo(n){
  n=Math.max(0,Math.min(COUNT-1,n));
  if(n===cur) return;
  pauseVid(cur); tilts[cur].stop();
  cur=n;
  Array.from(deck.children).forEach((s,i)=>{ s.style.transform=`translateX(${(i-cur)*100}%)`; });
  playVid(cur); preloadAdj(cur); tilts[cur].start();
  updateUI();
}

/* ── POINTER — tilt + swipe ── */
(function(){
  let pid=null, x0=0, t0=0;
  const W=()=>window.innerWidth||1;
  document.addEventListener('pointerdown',e=>{
    if(pid!==null) return;
    pid=e.pointerId; x0=e.clientX; t0=e.timeStamp;
    tilts[cur].onDown(e.clientX,e.clientY,e.timeStamp);
  });
  document.addEventListener('pointermove',e=>{
    if(pid===null||e.pointerId!==pid) return;
    tilts[cur].onMove(e.clientX,e.clientY);
  });
  document.addEventListener('pointerup',e=>{
    if(pid===null||e.pointerId!==pid) return;
    const res=tilts[cur].onUp(e.clientX,e.timeStamp);
    pid=null;
    if(!res) return;
    const fast=Math.abs(res.dx)/res.dt>0.42, far=Math.abs(res.dx)>W()*0.28;
    if(fast||far) goTo(cur+(res.dx<0?1:-1));
  });
  document.addEventListener('pointercancel',()=>{ if(pid!==null){ tilts[cur].onUp(x0,t0); pid=null; } });

  let acc=0, wlock=0;
  document.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;
    e.preventDefault();
    if(Date.now()<wlock){acc=0;return;}
    acc+=e.deltaX;
    if(Math.abs(acc)<W()*0.2) return;
    const dir=acc>0?1:-1; acc=0; wlock=Date.now()+420;
    goTo(cur+dir);
  },{passive:false});
})();

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') goTo(cur+1);
  if(e.key==='ArrowLeft')  goTo(cur-1);
});
window.addEventListener('resize',()=>{
  Array.from(deck.children).forEach((s,i)=>{ s.style.transition='none'; s.style.transform=`translateX(${(i-cur)*100}%)`; });
});

/* ── INIT ── */
playVid(0); preloadAdj(0); tilts[0].start(); updateUI();
</script>
</body>
</html>
