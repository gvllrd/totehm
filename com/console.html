<!DOCTYPE html>
<!--
  ══ totehm.com/console — MA CONSOLE · 01/10/2026 ══════════════════════
  Elle vivait sur figher.club ; elle vit sur la source (totehm.com, où vit
  l'identité). figher.club/console redirige ici (308, la requête suit).
  Un appel : `my_console()`. Six questions, dans l'ordre :
    1 · qui voit mon TOTEHM      PRIVATE · VISIBLE TO MY SUBSCRIBERS (`visibility_set`)
    2 · mon abonnement           un prix PAR AN, où me payer, ON/OFF (`monetization_set`,
                                 `creator_payout_set`) ; le lien /@nom
    3 · mes abonnés              qui, depuis quand
    4 · mes abonnements          les TOTEHM que je suis ; arrêter à la fin de la période
                                 (`club-billing` · cancel_creator) ; en trouver un (/search)
    5 · ce qu'on me doit         le grand livre, le prochain versement
    6 · TotehmBot · mes paiements · Reveal the Box
  ⚠️ LA PAGE NE DÉCIDE RIEN : prix, accès, soldes viennent du serveur.
  ⚠️ L'abonnement à un créateur (annuel) n'a RIEN à voir avec TotehmBot
     (mensuel, offre séparée) : deux lignes, deux prix, jamais mêlés.
  Polices : Space Mono et Quantico. Aucun fond blanc. La tuile perforée
  navy = un nom de TOTEHM, rien d'autre.
-->

  border:6px solid transparent;border-image-source:var(--tile);border-image-slice:6 fill;border-image-repeat:round;padding:0 8px;background:none;cursor:pointer}

<body>
<button id="member" type="button" aria-label="Member menu"><i></i><span id="member-txt">CONNECT WITH MY TOTEHM</span></button>
<nav id="menu" aria-label="Member menu"></nav>

<main>
  <section id="signin" class="hide">
    <h2>My console</h2>
    <div class="kick">CONNECT WITH MY TOTEHM</div>
    <input class="in" id="si-email" type="email" placeholder="your@email" autocomplete="email">
    <input class="in hide" id="si-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
    <div class="note" id="si-note"></div>
  </section>

  <div id="app" class="hide" style="display:flex;flex-direction:column;gap:30px">
    <section>
      <button class="tname me" id="who" type="button" title="Open my TOTEHM">—</button>
      <div class="note" id="flash"></div>
    </section>

    <section id="s-vis">
      <h2>Who sees my TOTEHM</h2>
      <div class="tog" id="vis">
        <button class="btn" type="button" data-vis="private">Private<small>only me</small></button>
        <button class="btn" type="button" data-vis="subscribers">Visible to my subscribers<small>those who subscribe to me</small></button>
      </div>
      <div class="note" id="vis-note"></div>
    </section>

    <section id="s-offer">
      <h2>My subscription</h2>
      <div class="kick">My price · per year · I keep <span id="part">80</span> %</div>
      <input class="in" id="price" inputmode="decimal" placeholder="€ / year" style="max-width:160px">
      <div class="lbl">Where to pay me</div>
      <div class="tog"><button class="btn" id="pay-iban" type="button">IBAN</button><button class="btn" id="pay-paypal" type="button">PayPal</button></div>
      <input class="in" id="pay-handle" autocomplete="off" placeholder="IBAN or PayPal email">
      <div class="note" id="pay-fin"></div>
      <div class="lbl">Open to subscriptions</div>
      <div class="tog"><button class="btn" id="off-off" type="button">Off</button><button class="btn" id="off-on" type="button">On</button></div>
      <div class="note" id="off-note"></div>
      <button class="lnk hide" id="link" type="button">Copy my subscription link</button>
      <button class="lnk hide" id="post" type="button">Copy a post for my networks</button>
    </section>

    <section id="s-fans">
      <h2>My subscribers</h2>
      <div id="fans"></div>
    </section>

    <section id="s-subs">
      <h2>My subscriptions</h2>
      <div id="subs"></div>
      <div class="lbl">Subscribe to another TOTEHM</div>
      <input class="in" id="find" placeholder="a name" autocomplete="off" spellcheck="false">
      <div id="found"></div>
      <div class="note" id="subs-note"></div>
    </section>

    <section id="s-earn">
      <h2>What I earn</h2>
      <div id="earn"></div>
      <div id="paid"></div>
    </section>

    <section id="s-bot">
      <h2>TotehmBot · Higher Self</h2>
      <div id="bot"></div>
    </section>

    <section id="s-bill">
      <h2>My payments</h2>
      <div id="bill"></div>
      <button class="btn hide" id="portal" type="button">Cards and invoices</button>
      <div class="note" id="bill-note"></div>
    </section>

    <section id="s-reveal">
      <h2>Reveal the Box</h2>
      <input class="in" id="rv-in" placeholder="a cloth name, like 0.river" autocomplete="off" spellcheck="false">
      <div id="rv-box"></div>
      <div class="note" id="rv-note"></div>
    </section>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = 'https://abujjbkbbiumxrokozph.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFidWpqYmtiYml1bXhyb2tvenBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NTUyODIsImV4cCI6MjA5MDUzMTI4Mn0.1baPwPzAeT91Re9xj6afBrNso-Ri46fvIIwvATZL2us';
const sb = createClient(SB_URL, SB_ANON);
const FN = SB_URL + '/functions/v1/';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const BUILD='2026-10-05-spaces-boxes';
const money = (c, cur) => { try{ return new Intl.NumberFormat('en', { style:'currency', currency:(cur||'eur').toUpperCase(), maximumFractionDigits: (c||0) % 100 ? 2 : 0 }).format((c||0)/100); }catch(_){ return ((c||0)/100) + ' ' + cur; } };
const day = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';
async function fn(name, body){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(FN + name, { method:'POST', headers:{ 'content-type':'application/json', 'apikey':SB_ANON, 'authorization':'Bearer ' + (session?.access_token || SB_ANON) },
    body: JSON.stringify(body || {}) });
  let d = {}; try{ d = await r.json(); }catch(_){}
  return { ok: r.ok, status: r.status, d };
}
let me = null, C = null, PAYM = 'iban', SEQ = 0;
window.__totehm_console = () => ({ build: BUILD, signed_in: !!me, loaded: !!C, visibility: C?.visibility || null, offer_open: !!C?.offer?.open,
  period: C?.offer?.period || null, subscribers: C?.subscribers?.count ?? null, subscriptions: (C?.subscriptions || []).length, bot: !!C?.bot?.active });

/* ══ LE COIN MEMBRE — SIMPLE TERMS OF USE EN DERNIER ═════════════════ */
function paintMenu(){
  $('member').classList.toggle('is-in', !!me);
  $('member-txt').textContent = me ? (C?.pseudo || 'My TOTEHM') : 'CONNECT WITH MY TOTEHM';
  $('menu').innerHTML = (me ? '<a class="m-it" href="/totehm#in">My TOTEHM</a><a class="m-it" href="/search">Search</a><button class="m-it" type="button" data-out="1">Sign out</button>'
    : '<a class="m-it" href="/search">Search</a>') + '<a class="m-it m-terms" href="/terms" target="_blank" rel="noopener">Simple terms of use</a>';
}
$('member').onclick = () => { if(!me){ $('si-email').focus(); return; } $('menu').classList.toggle('is-open'); };
$('menu').addEventListener('click', async e => { if(e.target.closest('[data-out]')){ await sb.auth.signOut({ scope:'local' }); me = null; C = null; start(); } });
document.addEventListener('pointerdown', e => { if(!e.target.closest('#menu,#member')) $('menu').classList.remove('is-open'); });

/* ══ LA LECTURE — un appel, la réponse la plus fraîche gagne ══════════ */
async function load(){
  const seq = ++SEQ;
  const { data, error } = await sb.rpc('my_console');
  if(seq !== SEQ) return;
  if(error){ console.error('[my_console]', error.message); $('flash').className = 'note no'; $('flash').textContent = 'the console is unreachable right now'; return; }
  C = data || {};
  if(!C.signed_in){ me = null; return start(); }
  paint();
}
function paint(){
  paintMenu();
  $('who').textContent = C.pseudo || 'name my TOTEHM';
  $('vis').querySelectorAll('[data-vis]').forEach(b => b.classList.toggle('is-on', b.dataset.vis === C.visibility));
  const o = C.offer || {};
  $('part').textContent = o.part || 80;
  if(o.price_cents && document.activeElement !== $('price')) $('price').value = (o.price_cents/100).toString();
  PAYM = o.payout_method || PAYM;
  $('pay-iban').classList.toggle('is-on', PAYM === 'iban'); $('pay-paypal').classList.toggle('is-on', PAYM === 'paypal');
  $('pay-fin').textContent = o.payout_fin ? (o.payout_method === 'paypal' ? 'PayPal' : 'IBAN') + ' ···· ' + o.payout_fin : 'no payout method yet';
  $('off-off').classList.toggle('is-on', !o.enabled); $('off-on').classList.toggle('is-on', !!o.enabled);
  $('off-note').textContent = o.open ? 'open · ' + money(o.price_cents, o.currency) + ' / year'
    : o.enabled ? 'on — opens when my TOTEHM is visible to my subscribers' : 'off — nobody can subscribe';
  $('link').classList.toggle('hide', !o.open || !C.pseudo);
  $('post').classList.toggle('hide', !o.open || !C.pseudo);
  const f = C.subscribers || {};
  $('fans').innerHTML = (f.list || []).length ? f.list.map(x => '<div class="row"><a class="tname" href="/@' + encodeURIComponent(x.pseudo || '') + '">' + esc(x.pseudo || '—') + '</a><span class="sub">' +
    esc(x.status) + ' · since ' + day(x.since) + (x.renews ? '<br>' + (x.ending ? 'ends ' : 'renews ') + day(x.renews) : '') + '</span></div>').join('')
    : '<div class="empty">Nobody subscribes to me yet.</div>';
  const subs = C.subscriptions || [];
  $('subs').innerHTML = subs.length ? subs.map(s => { const live = ['active','trialing'].includes(s.status);
    return '<div class="row"><a class="tname" href="/@' + encodeURIComponent(s.creator || '') + '">' + esc(s.creator || '—') + '</a><span class="sub">' +
      money(s.price_cents, s.currency) + ' / year · ' + esc(s.status) + (s.renews ? '<br>' + (s.ending ? 'ends ' : 'renews ') + day(s.renews) : '') +
      (live && !s.ending ? '<br><button class="lnk" type="button" data-cancel="' + esc(s.creator) + '">Stop at the end of the year</button>' : '') + '</span></div>'; }).join('')
    : '<div class="empty">I do not subscribe to any TOTEHM yet.</div>';
  const e = C.earnings || {}, bals = (e.balances && e.balances.length) ? e.balances : [{ currency:'eur', earned_cents:0, pending_cents:0, paid_cents:0 }];
  $('earn').innerHTML = bals.map(b => '<div class="trio"><div><div class="lbl">earned</div><div class="big">' + money(b.earned_cents, b.currency) + '</div></div>' +
    '<div><div class="lbl">pending</div><div class="big">' + money(b.pending_cents, b.currency) + '</div></div><div><div class="lbl">paid out</div><div class="big">' + money(b.paid_cents, b.currency) + '</div></div></div>').join('');
  const th = e.threshold_cents || 2500, eur = bals.find(b => b.currency === 'eur') || { pending_cents:0 };
  $('paid').innerHTML = '<div class="row"><span>next payout · ' + day(e.next_payout) + '</span><span class="sub">' + (eur.pending_cents >= th ? money(eur.pending_cents) + ' will leave' : 'minimum ' + money(th)) + '</span></div>' +
    (C.payouts || []).map(x => '<div class="row"><span>' + money(x.amount_cents, x.currency) + '</span><span class="sub">' + esc(x.period) + ' · ' + esc(x.status) + (x.paid_at ? ' · ' + day(x.paid_at) : '') + '</span></div>').join('');
  const b = C.bot || {};
  $('bot').innerHTML = '<div class="row"><span>' + (b.active ? (b.comp ? 'open · offered' : 'active') : 'not active') + '</span><span class="sub">' + money(b.price_cents || 700, b.currency || 'eur') + ' / month · separate from any TOTEHM subscription' +
    (b.until ? '<br>' + (b.ending ? 'ends ' : 'renews ') + day(b.until) : '') + '</span></div><div class="empty">My spots and my TOTEHM stay mine, with or without the bot.</div>';
  const m = C.membership;
  $('bill').innerHTML = m && m.status ? '<div class="row"><span>FIGHER CLUB · annual</span><span class="sub">' + esc(m.status) + (m.until ? '<br>' + (m.ending ? 'ends ' : 'renews ') + day(m.until) : '') + '</span></div>' : '';
  $('portal').classList.toggle('hide', !(m && m.portal));
}

/* ══ 1 · QUI VOIT MON TOTEHM ═════════════════════════════════════════ */
$('vis').addEventListener('click', async e => {
  const b = e.target.closest('[data-vis]'); if(!b || b.dataset.vis === C?.visibility) return;
  const n = $('vis-note'); n.className = 'note'; n.textContent = 'saving…';
  const { data, error } = await sb.rpc('visibility_set', { p_visibility: b.dataset.vis });
  if(error){ console.error('[visibility_set]', error.message); n.className = 'note no'; n.textContent = 'not saved'; return; }
  if(!data?.ok){ n.className = 'note no'; n.textContent = data?.why === 'no_totehm' ? 'write my TOTEHM first' : 'not saved'; return; }
  n.className = 'note ok';
  n.textContent = data.visibility === 'private' && data.subscribers ? 'private — ' + data.subscribers + ' subscriber(s) can no longer read it; their subscription keeps running' : 'saved';
  load();
});

/* ══ 2 · MON ABONNEMENT ══════════════════════════════════════════════ */
async function saveOffer(enabled){
  const n = $('off-note'); n.className = 'note'; n.textContent = 'saving…';
  const euros = parseFloat(($('price').value || '').replace(',', '.'));
  const cents = Number.isFinite(euros) ? Math.round(euros*100) : null;
  const { data, error } = await sb.rpc('monetization_set', { p_enabled: enabled, p_price_cents: cents });
  if(error){ console.error('[monetization_set]', error.message); n.className = 'note no'; n.textContent = 'not saved'; return; }
  if(!data?.ok){ n.className = 'note no'; n.textContent = ({ price:'between 3 € and 1 000 € per year', price_first:'set my price first', payout_first:'tell where to pay me first' })[data.why] || data.why || 'not saved'; return; }
  await load();
}
$('off-on').onclick = () => saveOffer(true);
$('off-off').onclick = () => saveOffer(false);
$('price').addEventListener('keydown', e => { if(e.key === 'Enter') saveOffer(!!C?.offer?.enabled); });
$('price').addEventListener('blur', () => { if($('price').value.trim()) saveOffer(!!C?.offer?.enabled); });
$('pay-iban').onclick = () => { PAYM = 'iban'; $('pay-iban').classList.add('is-on'); $('pay-paypal').classList.remove('is-on'); $('pay-handle').focus(); };
$('pay-paypal').onclick = () => { PAYM = 'paypal'; $('pay-paypal').classList.add('is-on'); $('pay-iban').classList.remove('is-on'); $('pay-handle').focus(); };
$('pay-handle').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  const v = $('pay-handle').value.trim(), n = $('pay-fin');
  if(v.length < 6){ n.className = 'note no'; n.textContent = 'that does not look complete'; return; }
  $('pay-handle').value = '';   /* un IBAN affiché est un IBAN lu par-dessus l'épaule */
  const { error } = await sb.rpc('creator_payout_set', { p_method: PAYM, p_handle: v });
  if(error){ console.error('[creator_payout_set]', error.message); n.className = 'note no'; n.textContent = 'not saved'; return; }
  n.className = 'note ok'; load();
});
$('link').onclick = async () => {
  const link = 'https://www.totehm.com/@' + encodeURIComponent(C.pseudo);
  try{ await navigator.clipboard.writeText(link); $('link').textContent = 'copied'; setTimeout(() => $('link').textContent = 'Copy my subscription link', 1600); }
  catch(_){ $('off-note').textContent = link; }
};

/* ══ UN POST PRÊT À PUBLIER · 02/10/2026 ═════════════════════════════════
   Wah : l'audience de quelqu'un qui publie sur ses réseaux doit arriver
   ICI, sur sa page `/@nom` — « Souscrivez à mon Totehm pour partager des
   Spots, grind ensemble et se motiver stratégiquement ». La phrase est celle
   de Wah, en anglais (l'interface l'est) ; le lien est le même que le
   bouton du dessus. Aucun prix, aucun chiffre dans le texte : le prix se lit
   sur la page `/@nom`, où il vient du serveur.
   ⚠️ PAS UNE « PAGE POUR LES INFLUENCEURS » : BRAND dit qu'il n'existe pas de
   caste « créateur », ni dans le produit ni dans les mots. Tout membre peut
   ouvrir son offre ; le kit est dans SA console, pas sur une page à part. */
const POST = 'Subscribe to my TOTEHM to share Spots, grind together and stay strategically motivated.';
$('post').onclick = async () => {
  const link = 'https://www.totehm.com/@' + encodeURIComponent(C.pseudo), text = POST + '\n' + link;
  try{ await navigator.clipboard.writeText(text); $('post').textContent = 'copied'; setTimeout(() => $('post').textContent = 'Copy a post for my networks', 1600); }
  catch(_){ $('off-note').textContent = text; }
};

/* ══ 4 · MES ABONNEMENTS ═════════════════════════════════════════════ */
$('subs').addEventListener('click', async e => {
  const c = e.target.closest('[data-cancel]'); if(!c) return;
  c.disabled = true; $('subs-note').className = 'note'; $('subs-note').textContent = 'stopping…';
  const r = await fn('club-billing', { action:'cancel_creator', pseudo: c.dataset.cancel });
  if(!r.ok){ console.error('[club-billing]', r.status, r.d.error); $('subs-note').className = 'note no'; $('subs-note').textContent = r.d.error || 'not stopped'; c.disabled = false; return; }
  $('subs-note').className = 'note ok'; $('subs-note').textContent = 'stops on ' + day(r.d.until); load();
});
let fT = 0;
$('find').addEventListener('input', () => {
  clearTimeout(fT); const v = $('find').value.trim();
  if(v.length < 2){ $('found').innerHTML = ''; return; }
  fT = setTimeout(async () => {
    const { data, error } = await sb.rpc('totehm_search', { p_q: v, p_limit: 8 });
    if(error){ console.error('[totehm_search]', error.message); return; }
    $('found').innerHTML = (data || []).map(r => '<div class="row"><a class="tname" href="/@' + encodeURIComponent(r.pseudo) + '">' + esc(r.pseudo) + '</a><span class="sub">' +
      (r.subscribed ? 'subscribed' : r.offer ? money(r.price_cents, r.currency) + ' / year' : 'not open') + '</span></div>').join('') || '<div class="empty">no TOTEHM by that name</div>';
  }, 260);
});

/* ══ MES PAIEMENTS — le portail Stripe ═══════════════════════════════ */
$('portal').onclick = async () => {
  $('bill-note').className = 'note'; $('bill-note').textContent = 'opening…';
  const r = await fn('club-billing', { action:'portal' });
  if(r.d.url){ location.href = r.d.url; return; }
  console.error('[club-billing] portal', r.status); $('bill-note').className = 'note no'; $('bill-note').textContent = r.d.error || 'unavailable';
};

/* ══ REVEAL THE BOX — la donnée derrière l'objet, selon les droits ═══ */
$('rv-in').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  const v = $('rv-in').value.trim(), n = $('rv-note');
  if(v.length < 3){ n.textContent = 'a name like 0.river'; return; }
  const { data: r, error } = await sb.rpc('reveal_cloth', { p_name: v });
  if(error){ console.error('[reveal_cloth]', error.message); n.className = 'note no'; n.textContent = 'unavailable'; return; }
  n.textContent = '';
  if(!r?.found){ $('rv-box').innerHTML = '<div class="empty">No TOTEHM Cloth by that name.</div>'; return; }
  if(r.legacy || r.level === 'locked'){ $('rv-box').innerHTML = '<div class="row"><span>' + esc(r.legacy ? r.message : r.view || 'a box') + '</span><span class="sub">' + esc(r.name) + ' · ' + day(r.created_at) + '</span></div>'; return; }
  $('rv-box').innerHTML = '<div class="row"><span style="font-family:var(--q);color:#fff">' + esc(r.text) + '</span><span class="sub">' + esc(r.name) + ' · ' + esc(r.view || '') + (r.owner ? '<br>' + esc(r.owner) : '') + '</span></div>';
});
$('who').onclick = () => { location.href = '/totehm#in'; };

/* ══ SE CONNECTER — ici, sur la source de l'identité ═════════════════ */
let mail = '';
$('si-email').addEventListener('keydown', async e => {
  if(e.key !== 'Enter') return;
  const v = $('si-email').value.trim(), n = $('si-note');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ n.className = 'note no'; n.textContent = 'invalid email'; return; }
  n.className = 'note'; n.textContent = 'sending…';
  const { error } = await sb.auth.signInWithOtp({ email: v, options:{ shouldCreateUser: true } });
  if(error){ console.error('[otp]', error.message); n.className = 'note no'; n.textContent = 'try again in a minute'; return; }
  mail = v; n.className = 'note ok'; n.textContent = 'code sent';
  $('si-email').classList.add('hide'); $('si-code').classList.remove('hide'); setTimeout(() => $('si-code').focus(), 60);
});
$('si-code').addEventListener('input', async () => {
  const t = $('si-code').value.trim(), n = $('si-note'); if(t.length !== 6) return;
  n.className = 'note'; n.textContent = 'verifying…';
  const { error } = await sb.auth.verifyOtp({ email: mail, token: t, type:'email' });
  if(error){ n.className = 'note no'; n.textContent = 'wrong code'; return; }
  start();
});

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session?.user || null; paintMenu();
  $('signin').classList.toggle('hide', !!me); $('app').classList.toggle('hide', !me);
  if(!me) return;
  await load();
  const p = new URLSearchParams(location.search);
  if(p.get('subscribed')){ $('flash').className = 'note ok'; $('flash').textContent = 'subscribed to ' + p.get('subscribed') + ' — it appears below in a moment';
    history.replaceState(null, '', '/console'); setTimeout(load, 2500); }
  const to = p.get('to'); if(to) location.replace('/@' + encodeURIComponent(to));
}
start();
</script>
<script data-ecosystem-ui="2026-10-05">
/* 05/10/2026 — copied into each independent page; no runtime import. */
(() => {
  const roots = '.habit:not(.add):not(.filtre),.r-habit,.bx';
  const glass = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>';
  let sheet = null, previous = null, inert = [], overflow = '';
  function close() {
    if (!sheet) return;
    sheet.remove(); sheet = null;
    inert.forEach(([el, before]) => { if (el.isConnected) el.inert = before; }); inert = [];
    document.body.style.overflow = overflow; document.body.classList.remove('eco-modal');
    if (previous?.isConnected) previous.focus({preventScroll:true});
  }
  function open(content, title, source) {
    if (sheet) close();
    previous = source || document.activeElement; overflow = document.body.style.overflow;
    sheet = document.createElement('div'); sheet.className = 'eco-sheet'; sheet.setAttribute('role','dialog');
    sheet.setAttribute('aria-modal','true'); sheet.setAttribute('aria-label',title); sheet.tabIndex = -1;
    const card = document.createElement('section'); card.className = 'eco-card';
    const exit = document.createElement('button'); exit.type = 'button'; exit.className = 'eco-text-btn eco-close';
    exit.textContent = 'CLOSE'; exit.addEventListener('click',close);
    card.append(exit,content); sheet.append(card);
    inert = Array.from(document.body.children).filter(el => !['SCRIPT','STYLE'].includes(el.tagName)).map(el => [el,el.inert]);
    inert.forEach(([el]) => el.inert = true);
    document.body.append(sheet); document.body.style.overflow = 'hidden'; document.body.classList.add('eco-modal');
    sheet.addEventListener('click',e => { if (e.target === sheet) close(); }); exit.focus();
  }
  function zoom(box, source) {
    const copy = box.cloneNode(true); copy.classList.add('eco-box-copy'); copy.classList.remove('open','is-on');
    const sourceNodes = box.querySelectorAll('*'), copyNodes = copy.querySelectorAll('*');
    sourceNodes.forEach((el,i) => { if (getComputedStyle(el).display === 'none') copyNodes[i].remove(); });
    copy.querySelectorAll('[data-box-zoom],.w-x,.h-x,[data-kill],[data-x],.box-copy,.ro-copy,.pk-list,.pkw,.rk,.mini-x,.dash').forEach(el => el.remove());
    const originals = box.querySelectorAll('textarea,input');
    copy.querySelectorAll('textarea,input').forEach((el,i) => { const text = document.createElement('span'); text.className = 'v-name'; text.textContent = originals[i]?.value || ''; el.replaceWith(text); });
    [copy,...copy.querySelectorAll('*')].forEach(el => {
      for (const attr of Array.from(el.attributes)) if (/^(id|name|for|data-|on|tabindex|contenteditable|autofocus)/.test(attr.name)) el.removeAttribute(attr.name);
      el.removeAttribute('role'); el.style.removeProperty('height'); el.style.removeProperty('max-height');
    });
    copy.querySelectorAll('button,a,select').forEach(el => { const span = document.createElement('span'); span.className = el.className; span.innerHTML = el.innerHTML; el.replaceWith(span); });
    open(copy,'Enlarged TOTEHM box',source);
  }
  function enhance(scope) {
    if (!(scope instanceof Element) || scope.closest('.eco-sheet')) return;
    const parentBox = scope.closest(roots);
    const boxes = [...(parentBox ? [parentBox] : []),...scope.querySelectorAll(roots)];
    boxes.forEach(box => {
      if (box.closest('.eco-sheet') || box.querySelector('[data-box-zoom]')) return;
      const text = box.querySelector('.v-name,.h-text,.r-text,.nm')?.textContent?.trim() || box.querySelector('textarea')?.value?.trim();
      if (!text) return;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'eco-box-zoom'; b.dataset.boxZoom = '1';
      b.setAttribute('aria-label','Enlarge this box'); b.innerHTML = glass; box.append(b);
    });
    const buttonSelector = 'button,a.m-it,a.mw-link,a.btn-sig,a.btn,a.ro-action';
    const parentButton = scope.closest(buttonSelector);
    const buttons = [...(parentButton ? [parentButton] : []),...scope.querySelectorAll(buttonSelector)];
    buttons.forEach(b => {
      if (b.closest('#joy,#totehm-paper,.eco-sheet') || b.matches('.pick-habit,.h-T,.h-Ti,.h-x,.w-x,.cur,.eco-box-zoom,.mini-toggle,.rk-a')) return;
      const text = b.textContent.trim(); if (!text || /^[×+−\-↑↓←→↔↕✕✖?°\d\s]+$/.test(text)) return;
      if (/^sign\s*in\b/i.test(text)) {
        const leaf = b.querySelector('#member-txt,#conn-txt') || b;
        leaf.textContent = 'CONNECT WITH MY TOTEHM'; b.classList.add('eco-connect');
      } else if (text !== 'CONNECT WITH MY TOTEHM') b.classList.remove('eco-connect');
      if (b.textContent.trim() === 'CONNECT WITH MY TOTEHM') b.classList.add('eco-connect');
      b.classList.add('eco-text-btn');
    });
    if (document.body.dataset.ecoAuth === 'central') {
      for (const input of scope.querySelectorAll('#mw-email,#in-email,#pt-email')) {
        if (input.parentElement.querySelector('[data-eco-connect]')) continue;
        const b = document.createElement('button'); b.type = 'button'; b.dataset.ecoConnect = '1';
        b.className = 'eco-text-btn eco-connect'; b.textContent = 'CONNECT WITH MY TOTEHM'; input.before(b);
      }
    }
  }
  document.addEventListener('click',e => {
    const zoomButton = e.target.closest?.('[data-box-zoom]');
    if (zoomButton) { e.preventDefault(); e.stopImmediatePropagation(); const box = zoomButton.closest(roots); if (box) zoom(box,zoomButton); return; }
    const definition = e.target.closest?.('[data-space-about]');
    if (definition) { e.preventDefault(); e.stopImmediatePropagation(); const content = document.querySelector('#space-definition')?.content?.cloneNode(true); if (content) open(content,'What is a space?',definition); }
  },true);
  document.addEventListener('keydown',e => {
    if (!sheet) return;
    e.stopImmediatePropagation();
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Tab') {
      const list = [...sheet.querySelectorAll('button,a[href],input,textarea,select,[tabindex="0"]')].filter(el => !el.disabled && el.getClientRects().length);
      const first = list[0], last = list.at(-1);
      if (!first) { e.preventDefault(); sheet.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  },true);
  for (const name of ['pointerdown','touchstart','touchmove','touchend','wheel']) document.addEventListener(name,e => { if (sheet) e.stopImmediatePropagation(); },{capture:true,passive:true});
  const start = () => {
    enhance(document.body);
    new MutationObserver(records => {
      const scopes = new Set();
      for (const r of records) {
        if (r.target instanceof Element && !r.target.closest('.eco-sheet')) scopes.add(r.target);
        for (const node of r.addedNodes) if (node instanceof Element) scopes.add(node);
      }
      scopes.forEach(enhance);
    }).observe(document.body,{childList:true,subtree:true});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
</script>
