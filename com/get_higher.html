html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;padding:54px 24px 70px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.seq-block{position:absolute;width:100%;max-width:540px;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(15px);transition:opacity .65s ease,transform .65s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;align-items:center;gap:calc(15px*var(--rhythm))}
.seq-block.active{visibility:visible}.seq-block.show{opacity:1;transform:translateY(0);pointer-events:auto}
.seq-block.instant{transition:none}
.seq-block.coherence.show .coral-line{animation:settle .9s cubic-bezier(.22,.61,.36,1)}

function showSlide(i,instant){
  const blocks=stage.querySelectorAll('.seq-block');
  blocks.forEach((b,idx)=>{
    if(idx===i){if(instant)b.classList.add('instant');b.classList.add('active');
      requestAnimationFrame(()=>{b.classList.add('show');if(instant)requestAnimationFrame(()=>b.classList.remove('instant'));});}
    else{b.classList.remove('show');setTimeout(()=>b.classList.remove('active'),instant?0:FADE);}
  });
  curSlide=i;
  
  hideHint();
}

function goToSlide(i){if(isAnimating||i<0||i>=SLIDES.length||i===curSlide)return;isAnimating=true;showSlide(i,false);setTimeout(()=>isAnimating=false,FADE);}
function next(){goToSlide(curSlide+1);}
function prev(){goToSlide(curSlide-1);}

let wheelLock=false;
let y0=0;
window.addEventListener('touchstart',e=>{y0=e.changedTouches[0].screenY;},{passive:true});
let hg=false;function hideHint(){if(!hg){hg=true;vhint.classList.add('gone');}}

/* build + start */

showSlide(0,true);

function initPaper(){
  const scene = document.querySelector('.box-scene');
  const box   = document.querySelector('.box');
  if(!scene || !box) return;

  // Start at an angle that shows the box has depth
  let rotX=8, rotY=18, velX=0, velY=0;
  let idleT=0, grabbed=false;
  let startX=0, startY=0, dragRotX=0, dragRotY=0;
  let hoverX=null, hoverY=null;
  let lastTs=null;

  function idleXY(t){
    return {
      x: Math.sin(t*.6)*6  + Math.cos(t*1.1)*3,
      y: Math.cos(t*.4)*14 + Math.sin(t*.9)*6   // wider Y swing to show depth
    };
  }

  function normalizeY(a){ return a - Math.round(a/360)*360; }

  function tick(ts){
    if(!lastTs) lastTs=ts;
    const dt = Math.min((ts-lastTs)/1000, .05);
    lastTs=ts;
    if(!grabbed){
      idleT += dt*.3;
      const g  = idleXY(idleT);
      const tx = hoverX !== null ? hoverX : g.x;
      const ty = hoverY !== null ? hoverY : g.y;
      const k  = hoverX !== null ? 10 : 6, damp = 5;
      velX += ((tx-rotX)*k - velX*damp)*dt;
      velY += ((ty-rotY)*k - velY*damp)*dt;
      rotX += velX*dt;
      rotY += velY*dt;
    }
    box.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  scene.addEventListener('mousemove', e=>{
    if(grabbed) return;
    const r  = scene.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width/2)  / (r.width/2);
    const dy = (e.clientY - r.top  - r.height/2) / (r.height/2);
    hoverX = -dy*15; hoverY = dx*20;
  });
  scene.addEventListener('mouseleave', ()=>{ hoverX=null; hoverY=null; });

  function grabStart(cx,cy){
    grabbed=true; startX=cx; startY=cy; dragRotX=rotX; dragRotY=rotY;
    scene.style.cursor='grabbing';
  }
  function grabMove(cx,cy){
    if(!grabbed) return;
    rotX = Math.max(-80, Math.min(80, dragRotX-(cy-startY)*.5));
    rotY = dragRotY+(cx-startX)*.7;
  }
  function grabEnd(){
    if(!grabbed) return;
    grabbed=false; rotY=normalizeY(rotY); velX=0; velY=0;
    scene.style.cursor='grab';
  }

  scene.addEventListener('mousedown', e=>{ grabStart(e.clientX,e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e=>grabMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', grabEnd);

  scene.addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; grabStart(t.clientX,t.clientY);
  },{passive:true});
  scene.addEventListener('touchmove', e=>{
    const t=e.changedTouches[0]; grabMove(t.clientX,t.clientY);
  },{passive:true});
  scene.addEventListener('touchend', grabEnd, {passive:true});
}

async function hasAccess(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return false;
    const r = await fetch(GATE_FN,{ method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token,
                'Content-Type':'application/json' }});
    const j = await r.json();
    return j.access === true;
  }catch(e){ return false; }
}

(async function boot(){
  if(await hasAccess()) (window.top || window).location.replace(METHOD);
})();

async function toStripe(){
  const err = document.getElementById('err-code');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ goToSlide(1); return; } // Slide Mail
    const r = await fetch(PAY_FN, {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token,
                'Content-Type':'application/json' },
      body: JSON.stringify({ waiver: true, waiver_ts: new Date().toISOString() })
    });
    const j = await r.json();
    if(j.already){ (window.top || window).location.replace(METHOD); return; }
    if(!j.url) throw new Error(j.error || 'no url');
    /* get_higher.html peut être affiché DANS l'iframe de totehm.html.
       Une redirection window.location vers Stripe y est bloquée
       (Stripe envoie X-Frame-Options) : le navigateur annule en
       silence, rien dans la console. On sort donc vers le haut. */
    try{ (window.top || window).location.href = j.url; }
    catch(e){ window.open(j.url, '_blank'); }
  }catch(e){
    console.error('checkout:', e);
    if(err) err.textContent = 'Could not open checkout. Try again.';
  }
}

/* Délégation sur document plutôt que getElementById à 100 ms.
   Si l'élément n'existait pas encore à cet instant, le `if(btnBuy)`
   avalait l'erreur en silence : bouton visible, aucun écouteur,
   rien dans la console. La délégation ne peut pas rater. */
document.addEventListener('click', async (ev) => {

  if(session?.user?.email){ toStripe(); return; }
  goToSlide(1);
  setTimeout(()=>{ const el=document.getElementById('in-email'); if(el) el.focus(); },50);
});

// Attach Event Listeners

      if(error){ err.textContent='Could not send. Try again.'; return; }
      goToSlide(2); // Slide Code
      setTimeout(()=>document.getElementById('in-otp').focus(),50);

  }

  const btnVerify = document.getElementById('btn-verify');
  if(btnVerify) {
    btnVerify.addEventListener('click',async()=>{
      const email = document.getElementById('in-email').value.trim().toLowerCase();
      const token = document.getElementById('in-otp').value.trim();
      const err   = document.getElementById('err-code');
      if(token.length!==6){ err.textContent='Six digits.'; return; }
      err.textContent=''; btnVerify.disabled=true; btnVerify.textContent='Checking...';
      const { error } = await sb.auth.verifyOtp({ email, token, type:'email' });

      if(error){ err.textContent='Wrong or expired code.'; return; }
      if(await hasAccess()){ (window.top || window).location.replace(METHOD); return; }
      toStripe();
    });
  }

  const btnBackToSell = document.getElementById('btn-back-to-sell');
  if(btnBackToSell) btnBackToSell.addEventListener('click', () => goToSlide(0));

  const btnBackToMail = document.getElementById('btn-back-to-mail');
  if(btnBackToMail) btnBackToMail.addEventListener('click', () => goToSlide(1));

  const inEmail = document.getElementById('in-email');
  if(inEmail) inEmail.addEventListener('keydown',e=>{ if(e.key==='Enter') btnSend.click(); });

  const inOtp = document.getElementById('in-otp');
  if(inOtp) inOtp.addEventListener('keydown',e=>{ if(e.key==='Enter') btnVerify.click(); });

}, 100);

</script>
</body>
</html>
