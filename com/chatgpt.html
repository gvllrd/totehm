/* ══ LE MOT TOTEHM EST LE TOTEHM — copié de tools/totehm_word.css dans chaque page (jamais importé) ══
   Wah (12/11) : « à chaque fois qu'il y a le mot totehm, le TOTEHM recto-verso rotatif — recto le logo,
   verso le nom du membre — dont la grandeur s'adapte au texte ». Donc : dans TOUT texte des quatre
   domaines, le mot devient LA PIÈCE. Une seule pièce de papier, vue des deux côtés, exactement celle du
   coin membre (`tools/member_corner.css`) : mêmes faces, mêmes perforations, même nomenclature de nom
   (`tools/totehm_name.js`). Règle n° 1 : rien n'est réinterprété ici, tout est copié de la source.
   Le mot reste DANS le document (`.tw-s`, hors écran) : la page se lit, se cherche et s'entend comme avant.
   ⚠️ UNE SEULE ROTATION POUR TOUTE LA PAGE : l'angle est une variable CSS posée sur `:root` par un seul
   rAF (`--tw-th`) — vingt pièces dans un texte coûtent alors vingt `transform` de GPU, pas vingt boucles. */

.tw-s{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tw-p{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--tw-th,0deg))}

async function api(action,{id,body,auth=false}={}){
 const token=session?.access_token;if(auth&&!token)throw new Error('session');

 let r,d;try{r=await fetch('/chatgpt-api?'+q,opts);d=await r.json();}catch{throw new Error('unavailable');}
 if(!r.ok||d?.error)throw new Error(d?.error||'unavailable');return d;

function sayError(error){const messages={session:'Sign in again to continue.',expired:'This request has expired. Start again from ChatGPT.',request:'This connection request is not valid.',request_not_found:'This request has expired. Start again from ChatGPT.',invalid_request:'This connection request is not valid.',no_session:'Sign in again to continue.',unavailable:'The connection could not be reached. Try again.'};notice(messages[error?.message]||'That did not go through. Try again.');}
function validRequest(){return requestId&&params.getAll('request_id').length===1&&/^[a-zA-Z0-9_-]{16,200}$/.test(requestId);}
function validRedirect(value){
 try{

 heading(codeSent?'Check your email':'MY TOTEHM');text(codeSent?'Enter the code to continue.':'Use the email attached to your TOTEHM.');
 const form=el('form');form.autocomplete='on';const label=el('label',null,'field');label.append(el('span',codeSent?'EMAIL CODE':'EMAIL'));

 if(codeSent){input.pattern='[0-9]{6,8}';input.maxLength=8;}else{input.maxLength=254;input.placeholder='you@example.com';}
 label.append(input);form.append(label);const submit=el('button',codeSent?'CONTINUE':'SEND MY CODE','button primary');submit.type='submit';submit.disabled=busy;form.append(submit);
 form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const value=input.value.trim();if(!value)return;busy=true;notice('');
 if(!codeSent)email=value;submit.disabled=true;input.disabled=true;
 try{if(codeSent){const {data,error}=await sb.auth.verifyOtp({email,token:value,type:'email'});if(error)throw error;session=data.session;if(!session)throw new Error('session');codeSent=false;await readConnection();}
 else{const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;codeSent=true;}}
 catch{notice(codeSent?'That code did not open your TOTEHM. Try again.':'The code could not be sent. Check your email and try again.');}
 finally{busy=false;render();}});
 panel.append(form);if(codeSent)actions(button('USE ANOTHER EMAIL',()=>{codeSent=false;notice('');render();}));
}
function consent(){
 heading('CONNECT TO '+request.app_name);const account=el('div',session.user?.email||'My TOTEHM','account');panel.append(account);
 text('You choose the connection. Your TOTEHM stays yours.');const list=el('ul',null,'scope-list');
 for(const scope of request.scopes){list.append(el('li',scopeLabels[scope]||scope));}panel.append(list);
 text('ChatGPT can retrieve all five parts of your TOTEHM and their connections, inspiration from active subscriptions, and accessible Club spots when relevant. Read only. Media metadata only; no image files or GPS coordinates. Practice summaries require a separate sharing choice in your TOTEHM; private notes stay private.','subtle');
 actions(button('CONNECT MY TOTEHM',authorize,true),button('CANCEL',()=>{heading('Connection cancelled');text('Nothing was connected. You can close this page.');}));

}
function setup(){
 if(connection?.connected===true){heading('YOUR TOTEHM IS CONNECTED');const s=el('p','Connected to ChatGPT','connected');panel.append(s);text(connection.ecosystem_connected===true?'Your TOTEHM, shared boxes from your subscriptions and accessible Club spots are available when relevant.':'Your personal TOTEHM is connected. Reconnect TOTEHM in ChatGPT to authorize your subscriptions and Club spots.');const go=el('a','OPEN CHATGPT','button primary');go.href='https://chatgpt.com/';go.rel='noopener noreferrer';const practice=el('a','PRACTICE SHARING','button');practice.href='/totehm#settings';actions(go,practice,button('DISCONNECT',revoke));text('Live context is retrieved on demand, without automatically writing to ChatGPT’s saved memory. Disconnecting stops future access; it does not erase conversation history.','subtle');return;}
 heading('CONNECT FROM CHATGPT');text('In ChatGPT, open Settings → Apps. If “Create app” is available, add TOTEHM with this address.');
 const url=serverURL();if(url){const row=el('div',null,'server');row.append(el('code',url));row.append(button('COPY',async()=>{try{await navigator.clipboard.writeText(url);notice('Address copied.');}catch{notice('Select the address above to copy it.');}}));panel.append(row);}
 text('Choose OAuth, then connect with your TOTEHM. App availability depends on your ChatGPT account.','subtle');const go=el('a','OPEN CHATGPT','button primary');go.href='https://chatgpt.com/';go.rel='noopener noreferrer';actions(go,button('CHECK CONNECTION',refresh));
}
function render(){
 if(errorState){heading('START AGAIN FROM CHATGPT');text(errorState);return;}
 if(!status?.ready){heading('THE CONNECTION IS GETTING READY');text('Your TOTEHM is here. The ChatGPT connection is not available yet.');actions(button('TRY AGAIN',refresh),Object.assign(el('a','MY TOTEHM','button'),{href:'/totehm'}));return;}
 if(requestId){if(!request){heading('Opening the connection…');return;}if(!session)signIn();else consent();return;}
 if(!session){signIn();return;}setup();
}
async function readConnection(){if(!session)return;connection=await api('connection',{auth:true});}
async function authorize(){
 if(busy||!request)return;busy=true;notice('');render();
 try{const result=await api('authorize',{body:{request_id:requestId},auth:true});if(!validRedirect(result.redirect_url))throw new Error('invalid_request');location.assign(result.redirect_url);}
 catch(error){sayError(error);busy=false;render();}

async function revoke(){
 if(busy)return;busy=true;notice('');render();
 try{await api('revoke',{body:{},auth:true});connection={connected:false};notice('Disconnected. Future access has stopped.');}
 catch(error){sayError(error);}finally{busy=false;render();}
}
async function refresh(){
 if(busy)return;busy=true;notice('');errorState='';
 try{status=await api('status');if(status.ready){
   if(requestId){if(!validRequest())throw new Error('invalid_request');request=await api('request',{id:requestId});if(typeof request.app_name!=='string'||!request.app_name.trim()||!Array.isArray(request.scopes)||!request.scopes.length||request.scopes.length!==1||request.scopes[0]!=='totehm:read')throw new Error('invalid_request');if(request.expires_at&&(!Number.isFinite(Date.parse(request.expires_at))||Date.parse(request.expires_at)<=Date.now()))throw new Error('expired');}
   const {data:{session:current}}=await sb.auth.getSession();session=current;await readConnection();
 }}catch(error){if(requestId){errorState=error.message==='expired'?'This request has expired. Open the connection again from ChatGPT.':'This connection request could not be verified. Open it again from ChatGPT.';}else{status=null;sayError(error);}}
 finally{busy=false;render();}
}
window.__totehm_chatgpt=()=>({build:BUILD,ready:!!status?.ready,request:!!request,connected:connection?.connected===true,authenticated:!!session,busy});

<script>
/* ══ LE MOT TOTEHM EST LE TOTEHM — copié de tools/totehm_word.js dans chaque page (jamais importé) ══
   Wah (12/11) : « à chaque fois qu'il y a le mot totehm, mettre le TOTEHM recto-verso rotatif, recto le
   logo, verso le nom du TOTEHM de l'utilisateur, dont la grandeur s'adapte au texte — dans tous les
   textes des 4 plateformes ». Le mot n'est donc plus écrit : il est la PIÈCE, celle du coin membre
   (`tools/member_corner.*`) à la taille du texte qui la porte. Règle n° 1 : rien n'est réinterprété.

   CE QUI NE CHANGE PAS : le mot reste dans le document, hors écran (`.tw-s`) — la page se lit à la voix,
   se cherche au clavier, et un test qui lit `textContent` trouve le même texte qu'avant.
   CE QUI N'EST JAMAIS TOUCHÉ : ce que le membre a ÉCRIT (une box, une mini-box, son nom, un champ), une
   adresse (`totehm.com`, `www.totehm.space`), un mot qui continue (`TOTEHMIZE`), et tout nœud marqué
   `data-notw`. Un domaine se reconnaît à ce qui suit : un point SUIVI d'une lettre.
   UNE SEULE BOUCLE pour toute la page : l'angle est une variable CSS de `:root` (`--tw-th`) ; vingt
   pièces coûtent vingt transformations de GPU, pas vingt boucles. Elle s'arrête sans pièce, sans nom,
   onglet caché, ou en mouvement réduit (la pièce est alors posée sur son verso, le nom lisible).
   La taille vient de la POLICE héritée (`getComputedStyle`), jamais de `clientWidth` : mesurer la boîte
   forcerait un calcul de mise en page à chaque peinture de la liste du Totehm. */
window.TOTEHM_MOT = (() => {
  const MOT = 'TOTEHM', NM = MOT.length, K = 1.12;      /* K = la taille de la pièce, en em (CSS) */
  const SAUT = /^(SCRIPT|STYLE|TITLE|TEXTAREA|INPUT|SELECT|OPTION|CODE|PRE|NOSCRIPT|IFRAME|CANVAS|VIDEO|AUDIO|IMG|SVG)$/;
  /* les classes de ce que le MEMBRE a écrit, et celles de la pièce elle-même */
  const CL = ['tw', 'v-name', 'v-int', 'mini', 'mini-t', 'mi', 'nm', 'tn-l', 'mc', 'sl-name', 'ms-w', 'ns-mot'];
  const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
  const diag = { mots:0, pieces:0, passes:0, nom:'' };
  const cache = new Map();
  let nom = '', neuves = [], vivantes = new Set(), rafP = 0, raf = 0, th = 180, om = 0, last = 0, tmr = 0, aFaire = [];

  /* ── où le mot se trouve dans un texte ───────────────────────────────── */
  function places(s){
    const u = s.toUpperCase(), out = [];
    for(let i = 0;;){
      const a = u.indexOf(MOT, i); if(a < 0) break;
      const b = a + NM; i = b;
      if(a > 0 && /[\w/@.\-]/.test(s[a - 1])) continue;        /* www.totehm · /@totehm · un mot collé */
      const ap = s.slice(b, b + 2);
      if(/^[\w\-]/.test(ap)) continue;                          /* TOTEHMIZE · totehm-link */
      if(/^\.[A-Za-z]/.test(ap)) continue;                      /* totehm.com · totehm.space */
      out.push(a);
    }
    return out;
  }
  /* ── ce qu'on ne traverse jamais ─────────────────────────────────────── */
  function saute(el){
    if(!el || el.nodeType !== 1) return false;
    if(el.namespaceURI && el.namespaceURI !== 'http://www.w3.org/1999/xhtml') return true;
    if(SAUT.test(el.tagName)) return true;
    if(el.isContentEditable || el.hasAttribute('contenteditable')) return true;
    if(el.hasAttribute('data-notw') || el.hasAttribute('data-nom') || el.hasAttribute('data-edit')) return true;
    if(el.id === 'member-txt' || el.id === 'ast-name') return true;
    const c = el.classList;
    for(let i = 0; i < CL.length; i++) if(c.contains(CL[i])) return true;
    return false;
  }
  const interdit = n => { for(let e = n.parentNode; e && e.nodeType === 1; e = e.parentNode) if(saute(e)) return true; return false; };

  /* ── la pièce ────────────────────────────────────────────────────────── */
  function piece(mot){
    const s = document.createElement('span');
    s.className = 'tw';
    s.innerHTML = '<span class="tw-s">' + mot + '</span><span class="tw-p" aria-hidden="true">'
      + '<span class="tw-f tw-r"></span><span class="tw-f tw-b"></span></span>';
    diag.pieces++;
    return s;
  }
  function remplacer(t){
    const s = t.nodeValue;
    if(!s || s.length < NM || !t.parentNode) return;
    const occ = places(s); if(!occ.length) return;
    const frag = document.createDocumentFragment();
    let k = 0;
    for(const a of occ){
      if(a > k) frag.appendChild(document.createTextNode(s.slice(k, a)));
      const p = piece(s.substr(a, NM));
      frag.appendChild(p); neuves.push(p); vivantes.add(p);
      k = a + NM;
    }
    if(k < s.length) frag.appendChild(document.createTextNode(s.slice(k)));
    t.parentNode.replaceChild(frag, t);
    diag.mots += occ.length;
    planifier();
  }
  function parcourir(n){
    if(!n) return;
    if(n.nodeType === 3) return remplacer(n);
    if(n.nodeType !== 1 || saute(n)) return;
    const kids = n.childNodes, l = [];
    for(let i = 0; i < kids.length; i++) l.push(kids[i]);
    for(const k of l){ if(k.nodeType === 3) remplacer(k); else if(k.nodeType === 1) parcourir(k); }
  }

  /* ── le verso : le nom, par la nomenclature du TOTEHM ────────────────── */
  function dessinNom(S){
    const cle = nom + '|' + Math.round(S);
    let h = cache.get(cle);
    if(h != null) return h;
    const tmp = document.createElement('span');
    if(window.TOTEHM_NOM) window.TOTEHM_NOM.poser(tmp, nom, S);
    else {
      /* sans la nomenclature dans la page : une ligne, ajustée, jamais une devinette de grille */
      const l = Array.from(nom).slice(0, 16), px = Math.max(3, Math.min(S * .34, S * .82 / Math.max(1, l.length * .62)));
      const e = document.createElement('span');
      e.className = 'tn-l'; e.textContent = l.join('');
      e.style.cssText = 'left:50%;top:50%;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(' + (px / 24).toFixed(4) + ')';
      tmp.appendChild(e);
    }
    /* ⚠️ LA LETTRE N'EST PAS DU TEXTE DU DOCUMENT · 12/11. Posée en nœud de texte, elle entrait dans le
       `textContent` de la phrase : « your TOTEHMwah Habit… ». Elle passe donc en `data-c` et c'est le CSS
       qui la dessine (`content:attr(data-c)`) — un contenu généré ne compte dans aucun `textContent`, ni
       dans une recherche de page, ni dans un test. Le mot hors écran (`.tw-s`) reste le seul texte. */
    tmp.querySelectorAll('.tn-l').forEach(e => { e.setAttribute('data-c', e.textContent || ''); e.textContent = ''; });
    h = tmp.innerHTML;
    if(cache.size > 40) cache.clear();
    cache.set(cle, h);
    return h;
  }
  function habiller(el, S){
    const dos = el.querySelector('.tw-b'); if(!dos) return;
    el.classList.toggle('is-plat', !nom);
    if(!nom || !S){ if(dos.firstChild) dos.textContent = ''; dos.removeAttribute('data-vu'); return; }
    const cle = nom + '|' + Math.round(S);
    if(dos.getAttribute('data-vu') === cle) return;
    dos.innerHTML = dessinNom(S);
    dos.setAttribute('data-vu', cle);
  }
  function planifier(){ if(!rafP) rafP = requestAnimationFrame(poser); }
  function poser(){
    rafP = 0;
    const l = neuves; neuves = [];
    if(!l.length){ relancer(); return; }
    /* les tailles d'abord (calcul de style), les écritures ensuite : jamais entrelacées */
    const t = l.map(e => e.isConnected ? parseFloat(getComputedStyle(e).fontSize) * K || 0 : 0);
    l.forEach((e, i) => { if(t[i]) habiller(e, t[i]); });
    diag.passes++; relancer();
  }

  /* ── la rotation, une pour toute la page ─────────────────────────────── */
  function boucle(now){
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - (last || now)) / 1000)); last = now;
    const s = Math.sin(th * Math.PI / 180), nat = 22 * (.34 + .66 * s * s);   /* 22°/s de face : ~24 s le tour */
    om += (nat - om) * (1 - Math.exp(-dt / 1.6));
    th += om * dt; if(th > 3600) th %= 360;
    document.documentElement.style.setProperty('--tw-th', th.toFixed(2) + 'deg');
    if(vif()) raf = requestAnimationFrame(boucle);
  }
  const vif = () => !!nom && !document.hidden && !RM.matches && vivantes.size > 0;
  function relancer(){
    for(const p of vivantes) if(!p.isConnected) vivantes.delete(p);
    if(!raf && vif()){ last = 0; raf = requestAnimationFrame(boucle); }
  }
  document.addEventListener('visibilitychange', relancer);

  /* ── le nom : la page peut le dire, sinon il se trouve tout seul ─────── */
  function trouver(){
    const t = document.getElementById('member-txt');
    if(t && (t.textContent || '').trim()) return (t.textContent || '').trim();
    const a = document.getElementById('ast-name');
    if(a && (a.textContent || '').trim()) return (a.textContent || '').trim();
    const g = document.querySelector('[data-nom]');
    if(g && (g.getAttribute('data-nom') || '').trim()) return (g.getAttribute('data-nom') || '').trim();
    return '';
  }
  function setNom(n){
    const v = String(n || '').trim();
    if(v === nom) return;
    nom = v; diag.nom = v; cache.clear();
    for(const p of vivantes){ if(!p.isConnected){ vivantes.delete(p); continue; }
      const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu');
      neuves.push(p); }
    planifier();
  }

  /* ── les textes qui arrivent après : un seul observateur, amorti ─────── */
  function vider(){
    tmr = 0;
    const l = aFaire; aFaire = [];
    for(const n of l){ if(!n.isConnected || interdit(n)) continue; parcourir(n); }
    setNom(trouver());
  }
  function observer(){
    if(typeof MutationObserver !== 'function') return;
    new MutationObserver(list => {
      for(const m of list){
        if(m.type === 'childList'){ for(const n of m.addedNodes) if(n.nodeType === 1 || n.nodeType === 3) aFaire.push(n); }
        else if(m.target) aFaire.push(m.target);
      }
      if(aFaire.length && !tmr) tmr = setTimeout(vider, 60);
    }).observe(document.body, { childList:true, subtree:true, characterData:true });
  }
  function demarrer(){
    if(!document.body) return;
    parcourir(document.body);
    setNom(trouver());
    observer();
    document.fonts?.ready?.then(() => {                       /* mesuré avant la vraie police = faux */
      cache.clear();
      for(const p of vivantes){ const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu'); neuves.push(p); }
      planifier();
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer, { once:true }); else demarrer();
  const api = { scan:parcourir, setNom, nom:() => nom,
                etat:() => Object.assign({ vivantes:vivantes.size, tourne:!!raf }, diag) };
  window.__totehm_mot = api.etat;
  return api;
})();
/* ══ fin LE MOT TOTEHM ══ */
</script>
