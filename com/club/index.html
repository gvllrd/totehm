<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>THE FIGHER CLUB</title>
<!--
  ══ totehm.com/club · 15/09/2026 ════════════════════════════════════════
  Le Club vit SUR L'ORIGINE DU TOTEHM, et c'est la décision qui fait
  marcher tout le reste : même `localStorage`, donc MÊME SESSION. Un
  membre passe de son Totehm au Club et à ses gains sans se reconnecter.

  `figher.club` est un VANITY URL : l'adresse qu'on donne, qui redirige
  ici. On garde le nom de marque sans payer une quatrième session — il
  n'y a pas de SSO, et il n'y en aura pas avant que ça vaille le coup.

  Réglage du domaine, quand il sera acheté (Vercel → projet `com` →
  Settings → Domains → ajouter `figher.club` → Redirect to
  `totehm.com/club`, 308). Zéro ligne de code.

  ⚠️ LE PROJET S'APPELLE `com` ET SERT LE RÉSEAU SOCIAL depuis le swap du
  15/09. Le nom du projet Vercel ne dit plus ce qu'il sert : lire
  CLAUDE.md § « L'architecture technique » avant de toucher un domaine.
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Quantico:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fight:#E24B4A;--flow:#e48b31;--enrich:#fcbe21;--love:#639922;
  --express:#1D9E75;--focus:#378ADD;--celebrate:#7F77DD;
  --navy:#333366;--surface:rgba(255,255,255,.05);
  --ink:#fff;--ink-2:#b0b0b0;--ink-3:rgba(255,255,255,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#000;color:var(--ink-2);
  font-family:'Quantico',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* Mêmes coordonnées que partout : T à 30 px du haut sur 53, TOTEHM à
   30 px du bas sur 44. Une seule mesure pour tout le produit. */
#t{position:fixed;top:30px;left:50%;transform:translateX(-50%);line-height:0;
  background:none;border:none;padding:0;cursor:pointer;z-index:5}
#t svg{height:53px;width:auto;display:block}
#wm{position:fixed;bottom:30px;left:max(18px,6vw);line-height:0;
  background:none;border:none;padding:0;cursor:pointer;z-index:5}
#wm svg{height:44px;width:auto;display:block}

#w{max-width:560px;margin:0 auto;padding:124px 20px 120px;
  display:flex;flex-direction:column;align-items:center;gap:30px}
h1{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:900;
  font-size:clamp(30px,8vw,58px);color:var(--ink);letter-spacing:-.03em;
  text-align:center;line-height:.95}
.say{font-size:15px;color:var(--ink-2);text-align:center;max-width:32ch;
  line-height:1.65}
.lbl{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.8;text-align:center}

/* LES SEPT INTENTIONS — le Radar classera par elles. Elles ne filtrent
   rien ici : elles disent ce que le Club classe. Aucune bordure, la
   surface fait le cadre. */
.ints{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:430px}
.i{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 13px;background:var(--surface)}
.i b{width:11px;height:11px;display:block}
.i span{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.5)}

.portes{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.btn{background:rgba(255,255,255,.09);border:none;cursor:pointer;
  font-family:'Quantico',sans-serif;font-size:14px;color:var(--ink);
  padding:13px 16px;text-align:center;transition:background .15s ease;
  text-decoration:none;display:block;-webkit-tap-highlight-color:transparent}
.btn:hover{background:rgba(255,255,255,.15)}
.btn.g{background:none;color:var(--ink-3);font-size:13px}
.btn.g:hover{color:var(--ink)}
</style>
</head>
<body>

<button id="t" type="button" aria-label="Back to my Totehm"><svg viewBox="0 0 68 68" role="img" aria-label="T"><rect x="0" y="0" width="68" height="10" fill="#fff"/><rect x="29" y="0" width="10" height="67" fill="#fff"/><rect x="21" y="63" width="27" height="5" fill="#fff"/></svg></button>

<div id="w">
  <h1>THE FIGHER CLUB</h1>
  <p class="say">Everything out there that matches what you are becoming —
    ranked by the seven intentions.</p>

  <div class="ints">
    <div class="i"><b style="background:var(--fight)"></b><span>fight</span></div>
    <div class="i"><b style="background:var(--flow)"></b><span>flow</span></div>
    <div class="i"><b style="background:var(--enrich)"></b><span>enrich</span></div>
    <div class="i"><b style="background:var(--love)"></b><span>love</span></div>
    <div class="i"><b style="background:var(--express)"></b><span>express</span></div>
    <div class="i"><b style="background:var(--focus)"></b><span>focus</span></div>
    <div class="i"><b style="background:var(--celebrate)"></b><span>celebrate</span></div>
  </div>

  <div class="portes">
    <a class="btn" href="/map">Open the radar</a>
    <a class="btn" href="/club/creator">My creator space</a>
    <a class="btn g" href="https://www.higher.boutique" target="_blank" rel="noopener">The boutique</a>
  </div>

  <p class="lbl">the club opens from your totehm — that is where your session lives</p>
</div>

<button id="wm" type="button" aria-label="Back to my Totehm"><svg viewBox="0 0 84 39" role="img" aria-label="TOTEHM"><text x="42" y="26" text-anchor="middle" font-family="Quantico, sans-serif" font-size="14" letter-spacing="1.4" fill="#fff">TOTEHM</text></svg></button>

<script>
/* Le T et le TOTEHM ramènent au Totehm DÉPLOYÉ — `#in` lui dit de
   s'ouvrir sans rejouer le dépliage. Même contrat que les jumeaux. */
const rentre = () => { location.href = '/totehm#in'; };
document.getElementById('t').onclick = rentre;
document.getElementById('wm').onclick = rentre;
</script>
</body>
</html>
