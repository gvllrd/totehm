<!--
  ══ totehm.com/auth — L'AUTORITÉ D'IDENTITÉ · 30/09/2026 ════════════════
  MASTER BRIEF §6 : « TOTEHM.COM devient la source d'identité de
  l'écosystème. » Un satellite (totehm.space, figher.club, higher.boutique)
  ne demande plus l'email lui-même : il envoie le navigateur ICI, avec le
  DÉFI PKCE de son `verifier`, un `state` et un chemin de retour.

      1 · ici, une session totehm.com existe → on frappe un code LIÉ au défi
          et au domaine (`sso-mint`), on renvoie le navigateur chez lui,
          code dans le FRAGMENT (jamais un en-tête Referer, jamais un log) ;
      2 · pas de session → email → code à 6 chiffres, UNE fois (c'est ici
          que naît la session centrale), puis 1 ;
      3 · `prompt=none` et pas de session → retour immédiat avec
          `sso_error=login_required` : l'aller-retour silencieux ne montre
          jamais rien.

  ⚠️ LA DESTINATION N'EST JAMAIS UNE URL REÇUE. `client` est un NOM
  (space · club · boutique) traduit par une table fixe ; `return` doit être
  un CHEMIN de ce domaine (« /console », « /#create » refusé : pas de
  fragment, pas de « // », pas de schéma). Tout le reste : la page le dit,
  et ne redirige nulle part — une porte d'autorisation qui suivrait
  n'importe quel lien serait un redirecteur ouvert.

  ⚠️ CETTE PAGE NE SE LAISSE PAS ENCADRER (`X-Frame-Options: SAMEORIGIN`,
  com/vercel.json) : un site qui l'encadrerait ferait cliquer le membre à
  son insu.
-->

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(SB_URL, SB_ANON);
/* ══ LE CODE À SIX CHIFFRES — copié de tools/otp_signin.js dans chaque page (jamais importé) ══
   Wah (14/11) : « encore des problèmes de connexion : je suis quelques fois obligé de rentrer DEUX FOIS
   l'email et le code pour accéder. Bug à vérifier et corriger sur toutes les plateformes. »

   DEUX CAUSES, mesurées dans le code de toutes les pages de connexion :

   1 · L'EMAIL NE VIVAIT QU'EN MÉMOIRE (`let mail = ''`). On demande son code, on QUITTE la page pour aller
       le lire dans sa boîte, le téléphone décharge l'onglet (iOS le fait sans prévenir), on revient : la
       page est rechargée, `mail` est vide, `verifyOtp({email:'', token})` échoue — « wrong code » sur un
       code juste. Il fallait tout refaire. Le mail en vol est donc RETENU ici (30 min, la durée d'un code),
       et une page qui redémarre retrouve l'étape du code au lieu de la perdre.

   2 · DEUX VÉRIFICATIONS POUR UNE SAISIE. Le remplissage automatique d'un code (iOS, Android, un collage)
       lève PLUSIEURS `input` d'affilée. Le premier appel consomme le code — il est à usage unique —, le
       second reçoit « invalid token » et la page affichait « wrong code » ET vidait le champ, juste après
       une connexion RÉUSSIE. Un seul essai à la fois (`enCours`), et le code qui a MARCHÉ est retenu : le
       rejouer rend `{ok:true, deja:true}`, jamais une erreur.

   Ce bloc ne connaît ni la page ni son balisage : il rend un verdict, la page écrit les mots.
     TOTEHM_OTP.envoyer(sb, email)        → null, ou l'erreur (le mail est retenu si c'est parti)
     TOTEHM_OTP.verifier(sb, code, email) → {ok} · {ok, deja} · {why:'short'|'busy'|'email'|'expired'|'wrong'}
     TOTEHM_OTP.attendu()                 → l'email d'un code en vol (ou '') — pour reprendre l'étape du code
     TOTEHM_OTP.chiffres(v)               → les 6 chiffres d'une saisie (un collage « 123 456 » compris)
     TOTEHM_OTP.oublier()                 → on repart de l'email
   `localStorage` peut lever (navigation privée, site data bloqué) : tout est en try/catch et la page
   fonctionne sans — on retombe simplement sur le comportement d'avant. Un email n'est pas un secret de
   session : il n'ouvre rien sans le code, qui n'est jamais retenu. */
window.TOTEHM_OTP = (() => {
  const CLE = 'totehm_otp_v1', VIE = 30 * 60e3;
  let enCours = false, reussi = '';
  const chiffres = v => String(v == null ? '' : v).replace(/\D/g, '').slice(0, 6);
  function retenir(m){ try{ localStorage.setItem(CLE, JSON.stringify({ m:String(m || ''), t:Date.now() })); }catch(_){} }
  function attendu(){
    try{
      const o = JSON.parse(localStorage.getItem(CLE) || 'null');
      if(o && o.m && Date.now() - (+o.t || 0) < VIE) return String(o.m);
    }catch(_){}
    return '';
  }
  /* `oublier` efface le mail RETENU : on repart de l'email. Le verdict d'un code qui a marché (`reussi`)
     ne s'efface qu'à l'envoi d'un nouveau code — sinon un second `input` le rejouerait en erreur. */
  function oublier(){ try{ localStorage.removeItem(CLE); }catch(_){} }
  async function envoyer(sb, email, options){
    const m = String(email || '').trim();
    const { error } = await sb.auth.signInWithOtp({ email:m, options:Object.assign({ shouldCreateUser:true }, options || {}) });
    if(!error){ reussi = ''; retenir(m); }
    return error || null;
  }
  async function verifier(sb, token, email){
    const t = chiffres(token);
    if(t.length !== 6) return { why:'short' };
    if(t === reussi) return { ok:true, deja:true };      /* le même code rejoué par un second `input` */
    if(enCours) return { why:'busy' };
    const m = String(email || '').trim() || attendu();
    if(!m) return { why:'email' };
    enCours = true;
    try{
      const { error } = await sb.auth.verifyOtp({ email:m, token:t, type:'email' });
      if(error){
        const msg = String(error.message || '');
        return { why:/expir/i.test(msg) ? 'expired' : 'wrong', error };
      }
      reussi = t; oublier();
      return { ok:true, email:m };
    }finally{ enCours = false; }
  }
  return { envoyer, verifier, attendu, oublier, chiffres, occupe:() => enCours };
})();
/* ══ fin LE CODE À SIX CHIFFRES ══ */
const $ = id => document.getElementById(id);
const BUILD='2026-10-05-spaces-boxes';

/* ⚠️ LA TABLE FIXE — un nom, une origine, et rien d'autre ne passe. */
const CLIENTS = {
  space:    { origin:'https://www.totehm.space',    name:'TOTEHM.SPACE' },
  club:     { origin:'https://www.figher.club',     name:'FIGHER.CLUB' },
  boutique: { origin:'https://www.higher.boutique', name:'HIGHER.BOUTIQUE' },
};
const P = new URLSearchParams(location.search);
const client = P.get('client') || '', challenge = P.get('challenge') || '', state = P.get('state') || '';
const ret = P.get('return') || '/', silent = P.get('prompt') === 'none';
const C = CLIENTS[client];
const ok = !!C && /^[A-Za-z0-9_-]{43}$/.test(challenge) && /^[A-Za-z0-9_-]{16,64}$/.test(state)
        && /^\/(?![\/\\])[^\s#\\]*$/.test(ret) && ret.length <= 300;
let STEP = 'boot';
window.__totehm_auth = () => ({ build: BUILD, client: C ? client : null, valid: ok, silent, step: STEP });

/* Chez lui, avec ce que l'on a à lui dire — dans le FRAGMENT. */
const home = extra => { STEP = 'leaving'; location.replace(C.origin + ret + '#' + extra + '&state=' + state); };

async function issue(){
  STEP = 'minting';
  $('note').className = 'note'; $('note').textContent = 'opening ' + C.name.toLowerCase() + '…';
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ ask(); return; }
  try{
    const r = await fetch(SB_URL + '/functions/v1/sso-mint', { method:'POST',
      headers:{ 'authorization':'Bearer ' + session.access_token, 'apikey':SB_ANON, 'content-type':'application/json' },
      body: JSON.stringify({ target: client, challenge }) });
    const j = await r.json().catch(() => ({}));
    if(r.ok && j.code){ home('sso=' + j.code); return; }
    console.error('[auth] mint', r.status, j.error);
  }catch(e){ console.error('[auth]', e && e.message || e); }
  $('note').className = 'note no'; $('note').textContent = 'the door did not open — try again';
  $('back').classList.remove('hide');
}

function ask(){
  STEP = 'email';
  $('h').textContent = 'CONNECT WITH MY TOTEHM';
  $('f-mail').classList.remove('hide'); $('back').classList.remove('hide');
  $('note').textContent = '';
  setTimeout(() => $('email').focus(), 60);
}

let mail = '';
/* 14/11 (Wah : « je suis quelques fois obligé de rentrer deux fois l'email et le code ») — ici comme
   partout, `tools/otp_signin.js` retient l'email en vol (un onglet rechargé reprend à l'étape du code)
   et n'autorise QU'UN essai à la fois (le remplissage automatique lève plusieurs `input`, et le code est
   à usage unique : le deuxième appel criait « wrong code » après une connexion réussie). */
function etapeCode(v){
  mail = v; STEP = 'code';
  $('f-mail').classList.add('hide'); $('f-code').classList.remove('hide');
  setTimeout(() => $('code').focus(), 60);
}
$('f-mail').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('email').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ $('note').className = 'note no'; $('note').textContent = 'invalid email'; return; }
  $('note').className = 'note'; $('note').textContent = 'sending…';
  if(await TOTEHM_OTP.envoyer(sb, v)){ $('note').className = 'note no'; $('note').textContent = 'try again in a minute'; return; }
  etapeCode(v);
  $('note').className = 'note ok'; $('note').textContent = 'code sent to ' + v;
});
$('f-code').addEventListener('submit', e => e.preventDefault());
$('code').addEventListener('input', async () => {
  const c = $('code'), t = TOTEHM_OTP.chiffres(c.value);
  if(t !== c.value) c.value = t;
  if(t.length !== 6) return;
  $('note').className = 'note'; $('note').textContent = 'verifying…';
  const r = await TOTEHM_OTP.verifier(sb, t, mail);
  if(r.why === 'busy' || r.why === 'short') return;
  if(!r.ok){
    $('note').className = 'note no';
    $('note').textContent = r.why === 'expired' ? 'code expired — ask for a new one'
      : r.why === 'email' ? 'enter your email again' : 'wrong code';
    c.value = '';
    if(r.why === 'email'){ STEP = 'mail'; $('f-code').classList.add('hide'); $('f-mail').classList.remove('hide'); }
    return;
  }
  $('f-code').classList.add('hide');
  issue();
});
$('back').onclick = e => { e.preventDefault(); home('sso_error=cancelled'); };

if(!ok){
  STEP = 'invalid';
  $('h').textContent = 'Invalid request';
  $('to').innerHTML = 'This sign-in link is not valid. <a class="lnk" href="/totehm">Open my TOTEHM</a>';
}else{
  $('to').innerHTML = 'to continue to <b>' + C.name + '</b>';
  const { data:{ session } } = await sb.auth.getSession();
  if(session) issue();
  else if(silent) home('sso_error=login_required');
  else ask();
}
