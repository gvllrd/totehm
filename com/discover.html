.bf{position:absolute;left:0;top:0}

.b-back{
  width:180px;height:180px;transform:rotateY(180deg) translateZ(25px);

.b-logo{

function initPaper(){
  const scene=document.querySelector('.box-scene'), box=document.querySelector('.box');
  if(!scene||!box)return;
  let rX=8,rY=18,vX=0,vY=0,idT=0,grab=false,sX=0,sY=0,dX=0,dY=0,hX=null,hY=null,ts0=null;
  function ixY(t){return{x:Math.sin(t*.6)*6+Math.cos(t*1.1)*3,y:Math.cos(t*.4)*14+Math.sin(t*.9)*6};}
  function tick(ts){
    if(!ts0)ts0=ts; const dt=Math.min((ts-ts0)/1000,.05); ts0=ts;
    if(!grab){idT+=dt*.3;const g=ixY(idT),tx=hX!==null?hX:g.x,ty=hY!==null?hY:g.y,k=hX!==null?10:6,d=5;

    box.style.transform=`rotateX(${rX.toFixed(2)}deg) rotateY(${rY.toFixed(2)}deg)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  scene.addEventListener('mousemove',e=>{if(grab)return;const r=scene.getBoundingClientRect();hX=-(e.clientY-r.top-r.height/2)/(r.height/2)*15;hY=(e.clientX-r.left-r.width/2)/(r.width/2)*20;});

  const gm=(cx,cy)=>{if(!grab)return;rX=Math.max(-80,Math.min(80,dX-(cy-sY)*.5));rY=dY+(cx-sX)*.7;};
  const ge=()=>{if(!grab)return;grab=false;vX=0;vY=0;scene.style.cursor='grab';};
  scene.addEventListener('mousedown',e=>{gs(e.clientX,e.clientY);e.preventDefault();});

  window.addEventListener('mouseup',ge);

  scene.addEventListener('touchend',ge,{passive:true});
}

const CHAR_MS=48;
function wrapChars(html,ci){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  function walk(n){
    if(n.nodeType===3){
      const txt=n.textContent; if(!txt)return n;
      const f=document.createDocumentFragment();
      for(let i=0;i<txt.length;i++){const c=txt[i];
        if(c===' '||c==='\t'||c==='\n'){f.appendChild(document.createTextNode(c));ci.v+=.8;}
        else{const s=document.createElement('span');s.className='read-char';s.textContent=c;
          s.style.animationDelay=(ci.v*CHAR_MS/1000).toFixed(3)+'s';ci.v++;f.appendChild(s);}
      }return f;
    }else if(n.nodeType===1){
      if(n.classList.contains('higher-inline')||n.tagName==='BUTTON'){ci.v+=n.classList.contains('higher-inline')?8:n.textContent.length;return n;}
      const cl=n.cloneNode(false); n.childNodes.forEach(ch=>cl.appendChild(walk(ch))); return cl;
    }return n;
  }
  const f=document.createDocumentFragment();
  tmp.childNodes.forEach(ch=>f.appendChild(walk(ch))); return f;
}

function buildDisc(sl){
  const b=document.createElement('div'); b.className='disc-block';
  if(sl.img){const i=document.createElement('img');i.className='disc-img';i.src=IMGS+sl.img;i.alt='';i.loading='eager';b.appendChild(i);}
  const ci={v:0};
  sl.parts.forEach(p=>{
    if(p.t==='cta'){
      const btn=document.createElement('button'); btn.className='btn-start'; btn.style.marginTop='10px';
      btn.setAttribute('aria-label','Get Higher');
      btn.innerHTML='<span class="get-text">Get</span><span class="higher-svg"><svg viewBox="0 0 600 200"><use href="#higher-slogan"></use></svg></span>';
      btn.onclick=closeDiscover;
      b.appendChild(btn);
    }else{
      const d=document.createElement('div'); d.className='t-qp'+(p.t==='c'?' t-coral':'');
      d.appendChild(wrapChars((p.x||'').replace(/\n/g,'<br>'),ci)); b.appendChild(d);
    }
  });
  return b;
}

let hintGone=false;
function hideHint(){if(!hintGone){hintGone=true;discHint.classList.add('gone');}}

function discShowSlide(i,instant){
  discStage.querySelectorAll('.disc-block').forEach((b,idx)=>{
    if(idx===i){if(instant)b.classList.add('instant');b.classList.add('active');
      requestAnimationFrame(()=>{b.classList.add('show');if(instant)requestAnimationFrame(()=>b.classList.remove('instant'));});}
    else{b.classList.remove('show');setTimeout(()=>b.classList.remove('active'),instant?0:DFADE);}
  });
  discCur=i; discProg.style.width=((i+1)/DSLIDES.length*100)+'%';
}
function discGoTo(i){
  if(discLock||i<0||i>=DSLIDES.length||i===discCur)return;
  discLock=true; discShowSlide(i,false); setTimeout(()=>discLock=false,DFADE);
}
function discNext(){discGoTo(discCur+1);}
function discPrev(){if(discCur===0){closeDiscover();return;}discGoTo(discCur-1);}
function discReset(){
  discStage.innerHTML=''; hintGone=false; discHint.classList.remove('gone');
  discProg.style.width='0%';
  DSLIDES.forEach(s=>discStage.appendChild(buildDisc(s)));
  discCur=0; discLock=false; discShowSlide(0,true);
}

let dlLock=false;
discover.addEventListener('wheel',e=>{
  if(!discOpen||dlLock||Math.abs(e.deltaY)<25)return;
  dlLock=true; setTimeout(()=>dlLock=false,220);
  hideHint(); e.deltaY>0?discNext():discPrev();
},{passive:true});
let dY=0;
discover.addEventListener('touchstart',e=>{dY=e.changedTouches[0].screenY;},{passive:true});
discover.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].screenY-dY;
  if(Math.abs(dy)<35)return; hideHint(); dy<0?discNext():discPrev();
},{passive:true});

/* ─── AUTH EVENTS ─── */
document.addEventListener('click',async ev=>{
  if(ev.target.closest('#btn-buy')){
    const{data:{session}}=await sb.auth.getSession();
    if(session?.user?.email){toStripe();return;}
    goAuth(1); setTimeout(()=>document.getElementById('in-email')?.focus(),50); return;
  }
  if(ev.target.closest('#btn-send')){
    const email=document.getElementById('in-email')?.value.trim().toLowerCase()||'';
    const err=document.getElementById('err-mail');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){if(err)err.textContent='Check the address.';return;}
    const btn=ev.target.closest('#btn-send');
    if(err)err.textContent=''; btn.disabled=true; btn.textContent='Sending...';
    const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    btn.disabled=false; btn.textContent='Send code';
    if(error){if(err)err.textContent='Could not send. Try again.';return;}
    goAuth(2); setTimeout(()=>document.getElementById('in-otp')?.focus(),50); return;
  }
  if(ev.target.closest('#btn-verify')){
    const email=document.getElementById('in-email')?.value.trim().toLowerCase()||'';
    const token=document.getElementById('in-otp')?.value.trim()||'';
    const err=document.getElementById('err-code');
    if(token.length!==6){if(err)err.textContent='Six digits.';return;}
    const btn=ev.target.closest('#btn-verify');
    if(err)err.textContent=''; btn.disabled=true; btn.textContent='Checking...';
    const{error}=await sb.auth.verifyOtp({email,token,type:'email'});
    btn.disabled=false; btn.textContent='Enter';
    if(error){if(err)err.textContent='Wrong or expired code.';return;}
    if(await hasAccess()){(window.top||window).location.replace(METHOD);return;}
    toStripe(); return;
  }
  if(ev.target.closest('#btn-back-sell')){goAuth(0);return;}
  if(ev.target.closest('#btn-back-mail')){goAuth(1);return;}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='in-email'&&e.key==='Enter')document.getElementById('btn-send')?.click();
  if(e.target.id==='in-otp'&&e.key==='Enter')document.getElementById('btn-verify')?.click();
});

/* ─── INIT ─── */
buildAuth();
showAuth(0,true);
initPaper();
