async function cloudLoad(){
  if(!me)return;
  const {data,error}=await sb.from('totehms').select('*').eq('user_id',me.id);
  if(error||!data||!data.length)return;
  const habits=[];const seen={};
  /* ⚠️ `o` EST TRANSPORTÉ, PAS DÉDUIT. Il porte l'objectif que sert cette
     habitude, et il est écrit par `habit_set_trip()` côté serveur. Le
     reconstruire en `{t,f,i}` le jetait — et comme `cloudSave` réécrit
     `steps` EN ENTIER, la liaison disparaissait à la frappe suivante.
     Même piège que `totehms.bot` le 03/09 : un snapshot qui écrase tout
     doit transporter tout ce qu'il écrase. */
  /* ⚠️ `is` EST TRANSPORTÉ AUSSI · 09/09/2026 — même piège que `o`, et il
     coûtait les SEPT INTENTIONS : `cloudSave` écrit `state.habits` en
     entier, donc la liste partait bien, mais la reconstruction ici ne
     gardait que `i`. Résultat, une habitude à trois intentions revenait
     du nuage avec une seule, sans un mot.
     `t0` est le texte QUE LE SERVEUR VIENT DE DONNER : c'est ici, et
     nulle part ailleurs, qu'il se pose — le serveur est la référence. */
  data.forEach(r=>{(Array.isArray(r.steps)?r.steps:[]).forEach(s=>{const k=norm(s.t);if(s.t&&!seen[k]){seen[k]=1;
    const li=Array.isArray(s.is)?s.is.filter(z=>INT_BY_ID[z]):[];
    habits.push({t:s.t, t0:s.t, f:FREQ_BY_ID[s.f]?s.f:null,
      i:INT_BY_ID[s.i]?s.i:(li[0]||null), is:li, o:s.o||null});}});});
  /* L'ORDRE DU MEMBRE EST UNE DONNÉE. `state` est reconstruit de zéro
     ici : sans ce report, l'ordre choisi à la main était oublié au
     premier chargement depuis le nuage. L'ordre lui-même voyage dans
     `steps` — c'est l'ordre du tableau ; seul le DRAPEAU se perdait. */
  const ordonne = !!(state && state.ord);
  state={habits, vis:data.some(r=>r.totehm_visibility==='members')?'members':'private'};
  if(ordonne)state.ord=true;
  if(data[0].bot!=null)profile.bot=!!data[0].bot;
  try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(KEYP,JSON.stringify(profile));}catch(e){}
}
/* ══ LE TOTEHM D'UN AUTRE ══
   Trois requêtes, aucune écriture. `totehms` a déjà sa policy « members
   read » ; `wisdom` et `objectives` en ont reçu une le 24/08, restreinte à
   `authenticated` et adossée à la MÊME visibilité — un seul interrupteur
   pour les trois volets, celui que le membre connaît déjà.
   ÉTANCHÉITÉ PROUVÉE EN BASE le 24/08 : un membre ne voit pas les leçons
   d'un Totehm privé, un anonyme n'en voit aucune. */
async function loadRO(){
  /* ⚠️ UN SEUL APPEL, ET IL RAMÈNE LES CINQ LISTES. Avant, on lisait
     `totehms.steps` à la main et on s'arrêtait là : quatre vues sur cinq
     restaient vides chez la personne qu'on regarde. `totehm_of` rend la
     même forme que `my_trips` — c'est le même Totehm, vu du dehors. */
  const {data,error}=await sb.rpc('totehm_of',{p_pseudo:RO});
  if(error){ console.error('[totehm] totehm_of:',error.message);
             roFail('this Totehm could not be read'); return false; }
  if(!data||!data.ok){
    roFail(data&&data.why==='nobody'  ? 'no Totehm by that name'
         : data&&data.why==='signin'  ? 'sign in to read a Totehm'
         :                              'this Totehm is private');
    return false; }

  const habits=[];const seen={};
  (Array.isArray(data.steps)?data.steps:[]).forEach(x=>{
    const k=norm(x.t); if(!x.t||seen[k])return; seen[k]=1;
    /* `is` EST TRANSPORTÉ. Sans lui, une habitude à trois intentions
       n'en montrait qu'une et le trait de gauche mentait — c'est ce
       trait qui porte la couleur héritée des objectifs et des
       répulsions, donc le mensonge se propageait à trois vues. */
    const li=Array.isArray(x.is)?x.is.filter(z=>INT_BY_ID[z]):[];
    habits.push({t:x.t, t0:x.t, f:FREQ_BY_ID[x.f]?x.f:null,
      i:INT_BY_ID[x.i]?x.i:(li[0]||null), is:li, o:x.o||null});});
  state={habits, vis:'members'};

  TRIPS=(data.trips||[]).map(t=>Object.assign({},t,{
    is:Array.isArray(t.is)?t.is:[], vs:(t.visions||[]).map(String)}));
  OBJ={}; const oj=data.objs||{};
  Object.keys(oj).forEach(k=>{ OBJ[k]=(oj[k]||[]).map(String); });
  REPS=(data.reps||[]).map(r=>({id:r.id, text:r.text||'', obstacle:r.obstacle||'',
    hs:(r.hs||[]).slice(), ws:(r.ws||[]).map(String), is:Array.isArray(r.is)?r.is:[]}));
  TEACH=(data.wisdom||[]).map(w=>({id:String(w.id), t:w.text||'', t0:w.text||'',
    is:Array.isArray(w.is)?w.is:[], os:(w.os||[]).map(String)}));
  VIS=(data.visions||[]).map(v=>({id:String(v.id), t:v.text||'', t0:v.text||'',
    is:Array.isArray(v.is)?v.is:[], os:(v.os||[]).map(String)}));
  /* ⚠️ `tripsLoaded` À VRAI, ET C'EST ESSENTIEL. C'est ce drapeau qui
     empêche `loadTrips()` de partir chercher l'arbre DE CELUI QUI
     REGARDE et de l'afficher dans le Totehm d'un autre. Sans lui, on
     voyait ses propres objectifs chez quelqu'un d'autre. */
  tripsLoaded=true;

  document.body.classList.add('ro');
  $('ro-who').textContent=data.pseudo||RO;
  renderHabits();
  return true;
}

function applyFreq(id){
  if(fpTarget==null||!FREQ_BY_ID[id]){closeFreqPanel();return;}
  if(fpTarget==='filter'){
    filterF=id; saveFilter();
    $('fp-skip').textContent='any intention';
    showFpStage('int');
    return;
  }
  if(fpTarget==='new'){
    pendingF=id;
    closeFreqPanel();
    /* Nouveau flow peek : au lieu de cascader vers la stage intention
       dans le même panneau (ancien wizard), on rouvre la fenêtre d'aperçu
       si l'intention manque encore. Sinon on crée l'habit. */
    if(!pendingI){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(!state.habits[fpTarget]){closeFreqPanel();return;}
  const prevF=state.habits[fpTarget].f;
  state.habits[fpTarget].f=id;save();
  if(prevF&&prevF!==id)logTotehmEvent('freq_changed',state.habits[fpTarget].t,{from:prevF,to:id});
  if(!state.habits[fpTarget].i){showFpStage('int');renderHabits();return;}
  closeFreqPanel();renderHabits();
}
/* étape 2 : l'intention colore le T et se pose à côté de la fréquence */
function applyIntent(id){
  if(fpTarget==='new'){
    pendingI=id;
    closeFreqPanel();
    /* Si la fréquence manque encore, rouvre le peek pour la définir.
       Sinon crée l'habit (renderHabits gère la conversion pending → state). */
    if(!pendingF){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(fpTarget==='filter'){filterI=id;closeFreqPanel();updateFilterBadge();renderHabits();return;}
  if(state.habits[fpTarget]){const prevI=state.habits[fpTarget].i;state.habits[fpTarget].i=id;save();if(prevI!==id)logTotehmEvent('intention_changed',state.habits[fpTarget].t,{from:prevI||null,to:id||null});}
  closeFreqPanel();renderHabits();
}

/* ══ LES MESURES DU RAIL : DONNÉES, PLUS DÉDUITES ══
   book.html et next_objective.html recalculaient `--rl` et `--rw` depuis
   `100vw` avec un facteur dérivé (.0821 = .072 / .8768). Deux formules pour
   une même mesure, c'est un endroit où l'écart finit toujours par s'installer :
   il suffit d'une barre de défilement, d'un arrondi, ou d'une retouche d'un
   seul côté. Le parent envoie désormais ses valeurs calculées. Elles ne sont
   plus égales par arithmétique — elles sont identiques par construction. */
/* ══ `pushMetrics()` A DISPARU · 05/09/2026 ═══════════════════════════
   Elle poussait la valeur RÉSOLUE de `--rl` aux deux iframes, parce
   qu'une propriété personnalisée est SUBSTITUÉE et pas calculée : l'iframe
   recevait le jeton `max(38px,calc(min(92vh,78vw,640px) * .072))` et le
   résolvait contre SA fenêtre — donc faux.
   Dans un seul document, le rail est le même pour tout le monde. Le
   problème n'est pas résolu : il n'existe plus. */
/* « une zone est ouverte » = on n'est pas sur les habitudes. */
function hOpen(){return view!=='habits';}
/* ══ LES TROIS VUES — UN SEUL MOTEUR · 06/09/2026 ═════════════════════
   `view` vaut 'habits' | 'objectives' | 'repulsions'.

   LE PAPIER NE CHANGE PAS : il est navy dans les trois vues. Ce sont les
   BOÎTES qui portent la couleur — navy, bleu clair, rouge-violet. Le
   Totehm ne se repeint pas, il se déplie : ce qui se déplie, ce sont ses
   pièces, et une pièce a une couleur.

   OUVRIR UNE BOÎTE MONTRE LE TRIP ENTIER, dans ses trois couleurs, ordonné
   par la vue d'où l'on vient : la pièce qu'on touche passe en premier,
   c'est elle qu'on est venu voir. On ne change JAMAIS de vue en éditant.

   IL N'Y A PLUS DE [Add a Trip]. Un seul bouton par vue, qui crée la pièce
   de CETTE vue, vide, et ouvre le triplet dessus. Les deux autres pièces
   sont OFFERTES — reprendre une existante (lookup) ou en écrire une neuve
   — jamais imposées : une habitude sans objectif reste une habitude, et
   forcer les trois empêcherait d'écrire. */
let view='habits';
/* L'ordre AFFICHÉ des trois carrés : c'est lui que suit le doigt et lui
   que suivent les flèches. Une seule liste, sinon les deux divergent. */
/* ══ LA CROIX · 16/09/2026 ═══════════════════════════════════════════
   `VIEW_ORDER` decrivait une RANGEE. Il y a maintenant deux axes, et ils
   ne disent pas la meme chose : l'horizontale est le TEMPS, la verticale
   est la PROFONDEUR. Une seule table les porte, et tout ce qui navigue —
   le doigt, le trackpad, les fleches, les carres — la lit. Deux tables
   finiraient par dire deux choses differentes. */
/* ⚠️ L'AXE DU TEMPS EST ACCESSIBLE DES CINQ VUES · 19/09/2026.
   Depuis les objectifs ou les répulsions, gauche et droite ne menaient
   nulle part : il fallait remonter aux habitudes d'abord. Or la sagesse
   et la vision ne sont pas « à côté des habitudes », elles sont à côté
   du PRÉSENT tout entier — objectifs et répulsions compris. Deux gestes
   pour un déplacement d'un cran, c'était une marche inventée. */
const CROIX={
  wisdom:     {d:'habits'},
  habits:     {g:'wisdom', d:'visions', h:'objectives', b:'repulsions'},
  visions:    {g:'habits'},
  objectives: {g:'wisdom', d:'visions', b:'habits'},
  repulsions: {g:'wisdom', d:'visions', h:'habits'},
};
const voisin=d=>(CROIX[view]||{})[d]||null;
/* Le nom et la glose de chaque vue : une seule table, lue par le titre
   ET par les quatre curseurs. Deux tables finiraient par se contredire. */
/* ⚠️ LE SOUS-TITRE DIT CE QUE LA VUE EST, PAS OÙ ELLE SE SITUE
   · 22/09/2026. C'était « past / present / future » — trois mots qui
   nommaient l'axe, que le contrôleur montre déjà. Wah veut « le
   sous-titre qui lui est attribué » : ce qu'on vient FAIRE là.
   Et les cinq se répondent, dans la grammaire du produit — ce qui tire
   vers le haut, ce qui fait dérailler (voir « une répulsion est une
   mauvaise habitude »). */
const NOM_VUE={
  wisdom:    ['my wisdom',    'why I hold these repulsions',               'past experience'],
  repulsions:['my repulsions','what triggers my habits',                   'trigger present'],
  habits:    ['my habits',    'what I execute to achieve my objectives',   'strategic present'],
  objectives:['my objectives','what I will achieve',                       'future present'],
  visions:   ['my vision',    'why I hold these objectives',               'dreamed future'],
};
/* La direction du DERNIER voyage : c'est elle qui décide de quel côté le
   titre pivote. Null au chargement — on n'arrive de nulle part. */
let dernierSens=null;
function versVoisin(d){ const v=voisin(d); if(!v)return; dernierSens=d; setView(v); }
/* Les cinq listes. `state.habits` vit en local (elle est dans `steps`),
   les quatre autres viennent du serveur en UN appel — `my_trips`. */
let TRIPS=[], REPS=[], TEACH=[], VIS=[], tripsLoaded=false;
/* ══ LE SPOT · 19/09/2026 ════════════════════════════════════════════
   Texte d'habitude → lieu. Une habitude a un ENDROIT où on la fait :
   « le parc en bas », « la salle de Benfica ». Pas une adresse — un
   ancrage.
   ⚠️ INDEXÉ PAR LE TEXTE SERVEUR (`srv(x)`), comme les objectifs et les
   répulsions. Indexé par le texte affiché, le lieu disparaîtrait à
   chaque lettre tapée dans le titre — on a mis trois lots à éteindre ce
   bug-là sur les autres liens. */
let SPOT={};
const spotDe=x=>{const k=srv(x); return (k&&SPOT[k])||'';};
/* ══ LE SON D'UNE INTENTION · 20/09/2026 ═════════════════════════════
   Wah : « un type de musique par intention, un texte ouvert et un lien
   URL ». `SONS` est indexé par identifiant d'intention, pas par
   habitude : une intention a UN son, partout. Deux habitudes en `focus`
   entendent la même chose — c'est le propre d'une intention. */
let SONS={};
const sonDe=i=>SONS[i]||{kind:'',url:''};

/* DEUX ÉTATS, ET PAS SIX. Ce qui est OUVERT, et si on est en train de
   classer. Le choix en cours (`pk`) vit avec le rendu, plus haut — il y
   en avait cinq, chacun oublié à un endroit différent : c'est comme ça
   qu'une boîte gardait un menu ouvert d'une autre. */
/* ══ QUELLE VERSION TOURNE ? · 22/09/2026 ═══════════════════════════
   ⚠️ C'EST LA VRAIE LEÇON DE QUATRE LOTS PERDUS. « Je ne peux pas
   ajouter de répulsion » a été signalé quatre fois. Trois fois j'ai
   trouvé un bug réel, je l'ai corrigé, je l'ai testé, il est parti en
   production — et le signalement est revenu à l'identique.

   La quatrième fois, j'ai rejoué le geste exact sur les DONNÉES RÉELLES
   du compte, relevées en base : tout passait. Le code livré marche.
   Restait une seule question, et je ne pouvais pas y répondre :
   **est-ce que la page ouverte est bien celle qu'on a livrée ?**

   Il n'y avait aucun moyen de le savoir. Un onglet mobile gardé trois
   jours, un cache, un lot pas appliqué : tout ça ressemble exactement
   à « le bug n'est pas corrigé », et ça coûte un lot entier à chaque
   fois.

   Cette ligne coûte quatre caractères et répond en trois secondes. */
const BUILD='2026-09-23';
let open=null, ordering=false;

/* ── L'IDENTITÉ D'UNE HABITUDE ───────────────────────────────────────
   Une habitude vit dans `state.habits`, un tableau sans identifiant. On
   lui en donne un À L'AFFICHAGE : il ne sert qu'à désigner la ligne qu'on
   édite pendant cette session. Rien ne s'y rattache en base — une
   répulsion pointe une habitude par son TEXTE, parce que `steps` est du
   texte. C'est pour ça que renommer appelle `habit_rename_links`. */
let HSEQ=0;
/* `t0` EST LE TEXTE QUE LE SERVEUR CONNAÎT · 09/09/2026.
   Les liens sont du TEXTE en base (`steps` est du texte). Tant que `t`
   était la seule vérité, taper une lettre dans un titre changeait la clé
   de tous ses liens INSTANTANÉMENT côté écran, alors que la base ne
   l'apprenait que 700 ms plus tard : les objectifs et les répulsions
   disparaissaient de la boîte à chaque frappe, puis revenaient.
   Pire, `habit_rename_links` partait avec « le texte d'il y a une
   lettre » comme ancien nom — donc les liens s'orphelinaient VRAIMENT en
   base. `t0` sépare les deux : `t` est ce qu'on lit, `t0` est ce que le
   serveur croit. La migration en mémoire est immédiate, l'appel réseau
   reste différé, et il part avec le bon ancien nom. */
function habIds(){ (state.habits||[]).forEach(x=>{
  if(!x.id)x.id='h'+(++HSEQ);
  if(x.t0===undefined)x.t0=x.t; }); }
const habOf  =id=>(state.habits||[]).find(x=>x.id===id)||null;
/* `r.hs` porte des textes SERVEUR : on cherche d'abord par `t0`, et on
   retombe sur `t` pour ce qui n'a pas encore de texte serveur. */
const habByT =t =>(state.habits||[]).find(x=>(x.t0!==undefined?x.t0:x.t)===t)
              ||(state.habits||[]).find(x=>x.t===t)||null;
const tripOf =id=>TRIPS.find(t=>String(t.id)===String(id))||null;
const repOf  =id=>REPS.find(r=>String(r.id)===String(id))||null;
const teachOf=id=>TEACH.find(w=>String(w.id)===String(id))||null;
const visOf  =id=>VIS.find(v=>String(v.id)===String(id))||null;
/* UN SEUL POINT D'ENTREE POUR LES CINQ. Tout ce qui est generique — les
   intentions, le renommage, la suppression — passe par ici. Cinq `if`
   recopies a cinq endroits, c'est cinq endroits ou en oublier un. */
const objetDe=(k,id)=> k==='h'?habOf(id) : k==='t'?tripOf(id) : k==='r'?repOf(id)
                     : k==='w'?teachOf(id) : k==='v'?visOf(id) : null;
/* ══ LES LIENS CROISES · 16/09/2026 ══════════════════════════════════
   Un objectif sert une VISION. Une repulsion s'eclaire d'une LECON.
   Les deux tables existaient depuis le 15 ; rien ne pouvait les remplir.
   On tient les DEUX cotes en memoire (`t.vs` et `v.os`) : sinon poser un
   lien depuis l'objectif ne se verrait pas dans la vision avant un
   rechargement, et l'ecran mentirait le temps d'un aller-retour. */
const visionsOfTrip =t=>(t&&t.vs||[]).map(visOf).filter(Boolean);
const tripsOfVision =v=>(v&&v.os||[]).map(tripOf).filter(Boolean);
const teachOfRep    =r=>(r&&r.ws||[]).map(teachOf).filter(Boolean);
const repsOfTeach   =w=>REPS.filter(r=>(r.ws||[]).includes(String(w.id)));
/* `hs` porte des TEXTES d'habitudes — c'est ce que rend le serveur. */
const repsOfHab=id=>{const x=habOf(id); const k=x?(x.t0!==undefined?x.t0:x.t):'';
  return k?REPS.filter(r=>(r.hs||[]).includes(k)):[];};
const habsOfRep=r=>(r.hs||[]).map(habByT).filter(Boolean);
/* ══ UNE HABITUDE SERT PLUSIEURS OBJECTIFS · 07/09/2026 ═══════════════
   `OBJ` fait le pont : texte d'habitude → liste d'identifiants
   d'objectifs, telle que le serveur la rend. `steps.o` reste le PREMIER
   lien — celui que le bot lit déjà — mais il ne décide plus seul. */
let OBJ={};
/* ⚠️ `OBJ` EST INDEXÉ PAR LE TEXTE DU SERVEUR (`t0`), jamais par ce
   qu'on est en train de taper — sinon les objectifs d'une habitude
   s'évanouissent à chaque lettre. Voir `t0` dans `habIds()`. */
const objIdsOf  =x=>{const k=x?(x.t0!==undefined?x.t0:x.t):''; 
  return (k&&OBJ[k])?OBJ[k]:(x&&x.o?[String(x.o)]:[]);};
const tripsOfHab=x=>objIdsOf(x).map(tripOf).filter(Boolean);
const habsOfTrip=t=>(state.habits||[]).filter(x=>objIdsOf(x).includes(String(t.id)));
/* Le premier lien, celui qui voyage dans `steps` : on le tient à jour à
   chaque attache ou détache, sinon le bot lirait un objectif effacé. */
function posePremier(x){ const l=objIdsOf(x); x.o = l.length?l[0]:null; save(); }

/* ── LE PAPIER, LES ONGLETS, LE LOGO ─────────────────────────────────
   Le wordmark vit HORS de #stage : c'est <body> qui porte la vue pour lui.
   Une seule expression pose toutes les classes du corps — `className=`
   écrase TOUT, et le mode classement y perdait sa classe à chaque rendu. */
function paintZone(){
  const st=$('stage'); if(!st)return;
  st.classList.toggle('v-h',view==='habits');
  st.classList.toggle('v-o',view==='objectives');
  st.classList.toggle('v-r',view==='repulsions');
  st.classList.toggle('v-w',view==='wisdom');
  st.classList.toggle('v-v',view==='visions');
  /* L'état du logo suit le SUJET, pas la vue : un objectif s'écrit aussi
     depuis la vue habitudes, et c'est encore un objectif. */
  const oLive = view==='objectives' || (open&&open.kind==='t');
  document.body.classList.toggle('v-habits',view==='habits');
  document.body.classList.toggle('v-objectives',view==='objectives');
  document.body.classList.toggle('v-repulsions',view==='repulsions');
  /* Ces deux-la changent le PAPIER : voir la feuille de style. */
  document.body.classList.toggle('v-wisdom',view==='wisdom');
  document.body.classList.toggle('v-visions',view==='visions');
  document.body.classList.toggle('o-live',!!oLive);
  document.body.classList.toggle('ordering',ordering);
  /* ── LE TITRE ET LES QUATRE CURSEURS ──────────────────────────────
     Tout se peint ici, à chaque rendu : un curseur qui reste affiché
     alors que sa vue n'a plus de voisin est un bouton mort. */
  const nv=$('vnow');
  if(nv){
    /* ⚠️ PLUS DE GLOSE SOUS LE NOM. « past » / « present » / « future »
       étaient écrits parce que rien ne les montrait ; le carré les
       montre maintenant — par sa couleur pour l'époque, par la dalle
       allumée pour la couche. Les garder, ce serait dire deux fois. */
    const nom=NOM_VUE[view]||['','',''];
    nv.querySelector('b').textContent=nom[0];
    nv.querySelector('i').textContent=nom[1]||'';
    const sp=nv.querySelector('span');
    if(sp) sp.textContent=nom[2]||'';
    /* ⚠️ UNE ANIMATION SE REJOUE À CHAQUE REDESSIN si on se contente de
       poser la classe. On la retire, on force un reflow, on la remet —
       c'est le seul moyen de la rejouer À LA DEMANDE et jamais sinon.
       Sans ça, cliquer dans une boîte faisait pivoter le titre. */
    nv.className='';
    if(dernierSens){ void nv.offsetWidth; nv.classList.add('f-'+dernierSens); dernierSens=null; }
  }
  /* ── LE JOYSTICK ──────────────────────────────────────────────────
     Le carré porte l'axe du TEMPS (sa couleur), la pile porte l'axe de
     la PROFONDEUR (sa position). Tout se peint ici, à chaque rendu. */
  const jy=$('joy');
  if(jy){
    jy.className='sink-el v-'+view;
    /* ⚠️ LE ROND ALLUMÉ EST CELUI DE LA VUE, et les deux autres ronds
       de son AXE sont à mi-chemin. C'est ce qui montre où l'on peut
       aller en plus de là où l'on est. */
    /* ⚠️ L'AXE NE SE RECOPIE PAS, IL SE DÉDUIT DE `CROIX` · 19/09/2026.
       Il y avait ici une seconde table écrite à la main qui disait la
       même chose que la croix — et qui a cessé de la dire à la minute
       où la croix s'est élargie : depuis les objectifs on pouvait
       partir à gauche, mais les ronds de la sagesse et de la vision
       restaient éteints. Deux tables qui doivent s'accorder finissent
       toujours par ne plus s'accorder. Une seule, maintenant : le pad
       allume ce vers quoi on peut réellement aller. */
    /* ⚠️ TROIS RONDS POUR TROIS ÉPOQUES, PAS CINQ POUR CINQ VUES
       · 20/09/2026. Le rond allumé est celui de l'ÉPOQUE où l'on se
       trouve. Les objectifs et les répulsions sont le présent au même
       titre que les habitudes : ils allument le navy. Ce qui les
       distingue est écrit en toutes lettres à gauche, et montré par les
       chevrons haut et bas. */
    /* ⚠️ DEUX AXES, DEUX LANGAGES, ET AUCUN NE RÉPÈTE L'AUTRE.
       La TUILE porte l'époque (le swipe horizontal la repeint) ; les
       trois RONDS portent la couche (le swipe vertical allume l'un
       d'eux). C'est ce que Wah appelle « la logique de défilement reste
       la même » : on n'a pas changé le geste, on a remis chaque
       information sur son axe. */
    /* ⚠️ LA TUILE PORTE LA COULEUR DE LA VUE — LES 3, TOUJOURS
       · 22/09/2026. « Je t'ai déjà demandé 100 fois à ce que dans le
       curseur ce soit TOUJOURS les 3 couleurs. Dans la vue WISDOM c'est
       total rouge-violet, dans la vue Habit c'est le bleu navy avec le
       point bleu clair pour accéder aux objectifs et le point rouge en
       ce qui concerne les répulsions, et quand c'est la vue Objective
       le curseur devient bleu clair. »

       J'avais mis l'ÉPOQUE sur la tuile (passé/présent/futur). C'est un
       quatrième langage, et il n'y a que trois couleurs dans la marque.
       La tuile dit maintenant LA VUE, dans sa propre couleur :

         habitudes            navy
         objectifs · visions  bleu clair
         répulsions · sagesse rouge-violet

       ⚠️ ET LE ROND DE LA VUE COURANTE S'EFFACE. C'est la conséquence
       directe, et c'est ce que Wah décrit sans le nommer : il cite le
       point bleu clair et le point rouge, jamais un point navy au
       milieu. La tuile EST la vue ; un rond qui la répète est un rond
       de trop — et navy sur navy est invisible, mesuré deux fois.
       Ce qui reste allumé, ce sont les DESTINATIONS : où je peux aller
       depuis ici, chacune dans sa couleur pleine. */
    const TEINTE={habits:'--navy', objectives:'--blue', repulsions:'--rep',
                  wisdom:'--rep',  visions:'--blue'};
    /* ⚠️ UNE SEULE VARIABLE, ET C'EST LE FOND. Il y avait une tuile
       sombre PLUS un anneau de couleur : deux objets pour dire une
       seule chose, et l'anneau se lisait comme une bordure. */
    jy.style.setProperty('--joy-vue', 'var('+(TEINTE[view]||'--navy')+')');

    /* La couche où l'on se trouve. Sur la sagesse et la vision il n'y en
       a pas : l'axe vertical n'existe pas là-bas. */
    const COUCHE={objectives:'o', habits:'h', repulsions:'r'};
    const ici=COUCHE[view]||null;
    ['o','h','r'].forEach(k=>{
      const e=jy.querySelector('#joy-stack .'+k); if(!e)return;
      /* `.ici` = la vue courante : le rond s'efface, la tuile le dit.
         `.mort` = pas de voisin de ce côté (sagesse, vision). */
      e.className = k + (k===ici ? ' ici' : '');
    });
    const bx=$('joy-box');
    if(bx) bx.className = ici ? '' : 'hors';
  }
  /* ⚠️ ON N'EN CACHE AUCUN. Un curseur sans voisin garde sa case et
     s'éteint (`.mort`) : c'est lui qui fait le CADRE autour du carré, et
     un cadre à trois côtés n'est pas un cadre. Le cacher retirait sa
     case de la grille et tout le contrôleur se déplaçait. */
  [['cur-g','g'],['cur-d','d'],['cur-h','h'],['cur-b','b']].forEach(([id,d])=>{
    const b=$(id); if(!b)return;
    const cible=(CROIX[view]||{})[d]||null;
    b.hidden=false;
    b.className='cur ' + (cible ? 'to-'+cible : 'mort');
    b.setAttribute('aria-label', cible ? 'Go to '+(NOM_VUE[cible]||[''])[0] : '');
    b.setAttribute('aria-hidden', cible ? 'false' : 'true');
    b.disabled = !cible;
  });
  /* `#vname` n'existe plus : c'est `aria-selected` sur chaque colonne
     qui allume le bon intitulé, et il est déjà posé plus bas. */
}
/* Changer de vue ne charge rien et ne quitte rien : c'est la même page,
   la même session, la même mémoire. C'est tout l'intérêt de la fusion. */
function setView(v){
  if(busy)return;
  if(v===view)return;
  /* ══ CHANGER DE VUE NE DEMANDE PLUS DE FERMER · 09/09/2026 ══════════
     Ici on refusait tant qu'une boîte était ouverte, « pour ne pas perdre
     la saisie ». C'était vrai quand la saisie attendait un bouton ; ce ne
     l'est plus : tout s'enregistre en écrivant. Il reste juste à POUSSER
     ce qui dort dans la minuterie, puis la boîte se referme d'elle-même.
     Zéro friction : on regarde ailleurs, on ne range pas d'abord. */
  if(open){ pousse(); open=null; pk=null; }
  /* Les objectifs et les répulsions sont des données du serveur : sans
     session il n'y a rien à montrer, et l'écran vide ne dirait pas
     pourquoi. */
  /* ⚠️ EN LECTURE, LES CINQ VUES SONT OUVERTES. Les données sont déjà
     là — `loadRO` les a toutes ramenées en un appel. Demander une
     session ici aurait bloqué quatre vues sur cinq chez quelqu'un dont
     on regarde justement le Totehm. */
  if(v!=='habits'&&!me&&!RO){
    $('member-window').classList.add('show');
    if(typeof memberPaint==='function')memberPaint();
    return;
  }
  /* ⚠️ LE FILTRE SE REFERME EN QUITTANT LES HABITUDES. Laissé ouvert,
     il serait resté à l'écran dans une vue où ses deux critères ne
     veulent rien dire — et il aurait continué de filtrer en silence. */
  if(v!=='habits')filtreOuvert=false;
  view=v; renderZone();
  /* ⚠️ L'ARBRE EST NÉCESSAIRE DANS LES TROIS VUES · 09/09/2026.
     Il ne se chargeait QUE hors de la vue habitudes — vrai avant la
     réécriture, quand une habitude n'affichait pas ses liens. Depuis, la
     boîte habitude montre ses objectifs et ses répulsions : mesuré, elle
     les affichait VIDES tant qu'on n'était pas passé par une autre vue.
     C'était ça, « les objectifs et les répulsions ne s'affichent pas ». */
  loadTrips();
}
/* Les deux portes du bas mènent DEHORS depuis le 17/09 ; ces deux
   fonctions ne servent plus qu'à Échap, qui ramène aux habitudes. */
function showBook(on){ setView(on?'wisdom':'habits');  if(on)save(); }
function showNext(on){ setView(on?'visions':'habits'); if(on)save(); }
function renderView(){ return renderZone(); }

/* L'arbre entier en UN appel : objectifs, leurs habitudes, les répulsions
   de chaque habitude. Chargé à la première ouverture d'une des deux vues,
   pas au démarrage — le Totehm doit s'ouvrir sans attendre le réseau. */
async function loadTrips(force){
  /* ⚠️ EN LECTURE, ON NE CHARGE JAMAIS SON PROPRE ARBRE. `my_trips()`
     rend l'arbre DU DEMANDEUR : appelée ici, elle remplaçait les
     objectifs de la personne qu'on regarde par les siens. Le verrou est
     à l'entrée de la fonction, pas chez ses quinze appelants. */
  if(RO)return;
  if(!me)return;
  if(tripsLoaded&&!force)return;
  try{
    /* ⚠️ ON NE LIT JAMAIS L'ARBRE PENDANT QU'ON ÉCRIT DEDANS. Sans cette
       ligne, `my_trips` doublait les écritures parties et le serveur
       renvoyait l'état d'AVANT — un objectif supprimé revenait, un lien
       posé disparaissait. Voir `EN_VOL`. */
    await calme();
    const {data,error}=await sb.rpc('my_trips');
    /* Une erreur de RPC se JOURNALISE, toujours : sans ce log, une liste
       vide ne dit pas si le membre n'a rien posé ou si l'appel casse. */
    if(error)throw error;
    if(!data||!data.signed_in)return;
    TRIPS=(data.trips||[]).map(t=>Object.assign({},t,{
      is:Array.isArray(t.is)?t.is:[], vs:(t.visions||[]).map(String)}));
    /* ⚠️ `OBJ` VIENT MAINTENANT DU SERVEUR, ET IL ARRIVE VRAIMENT.
       On lisait `h.objectives` sur chaque habitude — une clé que
       `my_trips` n'a JAMAIS rendue. `OBJ` restait donc vide et une
       habitude ne montrait que l'objectif porté par `steps.o`, un seul,
       alors que `objective_habits` en portait plusieurs. Les liens
       étaient écrits en base et invisibles à l'écran.
       `data.objs` est la table texte-d'habitude → identifiants. */
    OBJ={};
    const oj=data.objs||{};
    Object.keys(oj).forEach(k=>{ OBJ[k]=(oj[k]||[]).map(String); });
    /* UNE RÉPULSION, UNE LIGNE. Le serveur la rend maintenant À PLAT,
       avec TOUTES ses habitudes — la colonne historique ET la table de
       liens réunies. Avant, elle n'arrivait que nichée sous l'habitude de
       sa colonne `habit_text` : un lien posé par `repulsion_link` était
       écrit en base et invisible ici. */
    REPS=(data.reps||[]).map(r=>({id:r.id, text:r.text||'', obstacle:r.obstacle||'',
      hs:(r.hs||[]).slice(), ws:(r.ws||[]).map(String),
      is:Array.isArray(r.is)?r.is:[]}));
    TEACH=(data.wisdom||[]).map(w=>({id:String(w.id), t:w.text||'', t0:w.text||'',
      is:Array.isArray(w.is)?w.is:[], os:(w.os||[]).map(String)}));
    VIS=(data.visions||[]).map(v=>({id:String(v.id), t:v.text||'', t0:v.text||'',
      is:Array.isArray(v.is)?v.is:[], os:(v.os||[]).map(String)}));
    tripsLoaded=true;
    /* Les spots voyagent à part : une table, une lecture, et `my_trips`
       reste la fonction de l'arbre. */
    try{
      const {data:sp}=await sb.from('habit_spots').select('habit_text,place').eq('user_id',me.id);
      SPOT={}; (sp||[]).forEach(r=>{SPOT[r.habit_text]=r.place;});
    }catch(_){}
    /* Les sons voyagent avec les spots : deux petites lectures en
       parallèle de l'arbre, et `my_trips` reste la fonction de l'arbre.
       Un échec ici ne doit jamais empêcher le Totehm de s'afficher. */
    try{
      const {data:so}=await sb.rpc('intention_sounds');
      SONS=so||{};
    }catch(_){ SONS={}; }
    renderZone();
  }catch(e){
    console.error('[totehm] my_trips:',e&&e.message||e);
  }
}

/* `days_left` vient du SERVEUR : un client qui compare des dates compare
   aussi son horloge, et celle d'un téléphone ment plus souvent qu'on ne
   croit. `fmtDue` ne calcule rien, elle met en mots. */
function fmtDue(d){
  if(d==null)return 'no deadline';
  if(d<0)  return Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' overdue';
  if(d===0)return 'today';
  if(d===1)return 'tomorrow';
  if(d<31) return d+' days left';
  const m=Math.round(d/30);
  return m+' month'+(m===1?'':'s')+' left';
}
/* Le <input type="date"> veut AAAA-MM-JJ, le serveur rend un timestamp. */
const dateIn=t=>t?String(t).slice(0,10):'';

/* ══ LES ÉCRITURES ═══════════════════════════════════════════════════
   Optimistes : on pose la valeur en mémoire, on dessine, et on envoie.
   Recharger l'arbre à chaque frappe fermerait le panneau sous les doigts.
   L'arbre est rafraîchi À LA FERMETURE, une fois, et pas avant. */
let wDirty=false, wTimer=null;
/* ══ LES ÉCRITURES EN VOL · 09/09/2026 ══════════════════════════════
   ⚠️ C'EST LA CAUSE DE « JE SUPPRIME UN OBJECTIF ET IL REVIENT ».

   `apres()` envoyait sans jamais attendre. Supprimer faisait donc :
     1. on retire l'objectif de la liste (immédiat, à l'écran)
     2. on envoie `trip_close` (parti, pas arrivé)
     3. `fermer()` recharge l'arbre — et `my_trips` répond AVANT que
        `trip_close` ait été commité.
   Le serveur renvoyait donc l'objectif encore actif, et il réapparaissait
   sous les yeux. Rien n'était cassé : c'était une COURSE, et elle se
   gagnait presque toujours du mauvais côté.

   `EN_VOL` tient les écritures parties et pas encore revenues. Aucune
   lecture de l'arbre ne démarre tant qu'il n'est pas vide. Ça vaut pour
   TOUTES les écritures — attacher, détacher, renommer, supprimer — donc
   la même course ne peut plus se reproduire ailleurs. */
const EN_VOL=new Set();
function apres(p){ /* une erreur de RPC se journalise, toujours */
  const q=Promise.resolve(p)
    .then(({error}={})=>{ if(error)console.error('[totehm] rpc:',error.message); })
    .catch(e=>console.error('[totehm] rpc:',e&&e.message||e))
    .finally(()=>EN_VOL.delete(q));
  EN_VOL.add(q); return q; }
/* On attend ce qui est parti, et ce qui dort encore dans une minuterie.
   Deux tours : une écriture poussée peut en déclencher une autre. */
async function calme(){
  /* ⚠️ TROIS TOURS, PLUS DEUX · 21/09/2026. Une frappe qui attend son
     baptême se résout en LANÇANT l'écriture : elle remplit donc `EN_VOL`
     APRÈS qu'on l'a vidé. Deux tours suffisaient quand une écriture
     poussée en déclenchait une autre ; il en faut un de plus maintenant
     qu'une attente précède l'écriture. Pousser · attendre l'attente ·
     attendre l'écriture qu'elle a lancée. */
  for(let i=0;i<3;i++){
    pousse();
    if(!EN_VOL.size)break;
    await Promise.allSettled([...EN_VOL]);
  }
}
/* ⚠️ UNE MINUTERIE PAR CHAMP · 09/09/2026. Il y en avait UNE SEULE pour
   tout le Totehm : écrire dans une habitude puis dans un objectif
   ANNULAIT l'écriture de l'habitude — `clearTimeout` jetait la fonction
   en attente sans jamais l'exécuter. Chaque champ a maintenant sa clé
   (`h:h3`, `t:obj-1`…) ; ouvrir un autre champ POUSSE le précédent au
   lieu de le perdre. */
const wSlots=new Map();
function differe(cle,fn){
  if(typeof cle==='function'){ fn=cle; cle='_'; }
  const old=wSlots.get(cle); if(old)clearTimeout(old.t);
  wSlots.set(cle,{fn,t:setTimeout(()=>{wSlots.delete(cle);fn();},700)});
}
/* ══ RIEN NE SE JETTE PARCE QUE LE SERVEUR EST LENT · 21/09/2026 ═════
   ⚠️ C'EST LA CAUSE DE « je ne peux pas encore rajouter de répulsion ».

   Une boîte neuve s'ouvre avec un identifiant provisoire et le serveur
   répond 300 à 600 ms plus tard. La frappe, elle, part à 700 ms. Les
   cinq écritures avaient donc cette ligne : `if(estProvisoire(id))
   return;` — et c'était un ABANDON. Si la minuterie tombait pendant que
   la ligne était encore provisoire, le texte n'était jamais envoyé, et
   RIEN ne le reprogrammait. On tapait « Doom scrolling », on fermait,
   l'arbre se rechargeait depuis le serveur, et la répulsion revenait
   vide. Créée, mais muette.

   ⚠️ ET MON CORRECTIF DU 20/09 A RENDU LE BUG SYSTÉMATIQUE. Avant, au
   téléphone, la boîte neuve n'avait pas le curseur : on ne pouvait pas
   taper dans les 700 premières millisecondes, donc la minuterie tombait
   toujours APRÈS la réponse du serveur. En posant le curseur tout de
   suite, j'ai mis toutes les frappes pile dans la fenêtre où elles
   étaient jetées. *Un correctif qui découvre un bug dormant n'est pas la
   cause du bug — mais c'est lui qui doit le réparer.*

   On ne jette plus : on REPROGRAMME. La frappe attend le baptême aussi
   longtemps qu'il faut, et part dès que la ligne a un vrai identifiant. */
function quandNomme(o, envoie){
  if(!estProvisoire(o.id)) return envoie();
  /* ⚠️ L'ATTENTE COMPTE COMME UNE ÉCRITURE EN VOL, SINON ON N'A RIEN
     RÉPARÉ. `fermer()` pousse les minuteries puis recharge l'arbre, et
     `calme()` n'attend que ce qui est dans `EN_VOL`. Une frappe qui
     attend son baptême n'y serait pas : le rechargement partirait
     AVANT elle et écraserait le texte avec le vide du serveur — le même
     bug, déplacé de deux cents millisecondes.
     On met donc la PROMESSE de l'attente dans `EN_VOL` tout de suite. */
  let fini;
  const q = new Promise(r=>{ fini = r; });
  EN_VOL.add(q);
  const termine = v => { EN_VOL.delete(q); fini(); return v; };
  let essais = 0;
  const attends = () => {
    if(!estProvisoire(o.id)) return termine(envoie());
    /* ⚠️ ON ABANDONNE AU BOUT DE 25 ESSAIS (3 s) ET ON LE DIT. Une
       attente muette et infinie est exactement ce qu'on vient de
       corriger : si le serveur n'a jamais créé la ligne, le texte est
       perdu de toute façon — autant que le membre le sache. */
    if(++essais > 25){ dis('not saved — check your connection'); return termine(); }
    setTimeout(attends, 120);
  };
  setTimeout(attends, 120);
  return q;
}
/* RIEN NE SE PERD QUAND ON QUITTE UNE BOÎTE. La saisie part avec 700 ms
   de retard pour ne pas écrire à chaque lettre ; si on part avant, il faut
   la POUSSER — sinon les derniers mots restent dans une minuterie que
   personne n'attend. `pousse()` sans argument vide TOUT. */
function pousse(cle){
  const go=(k,v)=>{ clearTimeout(v.t); wSlots.delete(k); v.fn(); };
  if(cle!==undefined){ const v=wSlots.get(cle); if(v)go(cle,v); return; }
  [...wSlots.entries()].forEach(([k,v])=>go(k,v));
}

/* ══ LA ZONE — UNE SEULE BOÎTE, PARTOUT LA MÊME · 08/09/2026 ══════════
   Réécriture complète de la couche d'affichage. Ce qui existait avant
   fabriquait DEUX objets — la boîte, et le « bloc » d'une pièce liée —
   avec deux paddings, deux graisses, deux grammaires. D'où « rien n'est
   fluide, rien n'est harmonieux ».

   IL N'Y A PLUS QU'UNE BOÎTE, et elle contient TROIS choses :
     1. son TITRE, toujours modifiable sur place ;
     2. sa LIGNE D'UNITÉ — ce qui la qualifie, et qui se touche ;
     3. ses MINI-BOÎTES — ce qui lui est lié, à la couleur de ce que
        c'est. C'est le format de la boîte répulsion, généralisé : une
        habitude montre ses objectifs en bleu clair et ses répulsions en
        rouge-violet, un objectif montre ses habitudes en navy.

   LES TROIS VUES SONT LA MÊME LISTE, lue par un bout différent. On
   travaille pleinement dans chacune ; seul le storytelling change. */

/* ── LES INTENTIONS SONT PLUSIEURS ───────────────────────────────────
   Une habitude peut en porter plusieurs. `is` est la liste, `i` reste la
   PREMIÈRE — c'est elle que le serveur et le bot lisent (`steps.i`), et
   la tenir à jour évite de toucher à la base. */
const intIds=x=>!x?[]:(Array.isArray(x.is)&&x.is.length?x.is:(x.i?[x.i]:[]));
/* ══ LES 7 INTENTIONS SE RATTACHENT AUX 5 OBJETS · 16/09/2026 ════════
   Elles ne vivaient que sur les habitudes. Une intention sur un
   objectif, une répulsion, une vision ou une leçon dit la même chose —
   à quoi ça sert dans une vie — et c'est le filtre du produit entier.
   L'habitude s'écrit dans `steps` (donc `save()`), les quatre autres ont
   une ligne en base (donc `intentions_set`). Un seul verbe côté serveur
   pour les quatre : quatre fonctions finiraient par diverger. */
/* ⚠️ UNE INTENTION S'ÉCRIT DANS `steps`, ET NULLE PART AILLEURS.
   Elle appelait `intentions_set` pour les quatre objets serveur ; ces
   objets n'en portent plus. La fonction SQL reste en base — la retirer
   demanderait une migration pour supprimer du code que personne
   n'appelle, et elle resservira si un jour une vision doit se qualifier
   seule. */
function intToggle(x,id){
  const l=intIds(x).slice(), k=l.indexOf(id);
  if(k<0)l.push(id); else l.splice(k,1);
  x.is=l; x.i=l.length?l[0]:null; save();
}
const intCols=x=>intIds(x).map(intColor);
/* ══ UN OBJET SERVEUR N'A PAS D'INTENTION — IL EN HÉRITE · 17/09/2026 ═
   ⚠️ J'avais posé les sept intentions sur les CINQ objets. C'est faux.
   Une intention qualifie un GESTE RÉPÉTÉ — pourquoi on le refait. Un
   objectif est une destination, une répulsion est ce qu'on arrête, une
   vision est ce qu'on voit venir : aucun des trois ne se répète, donc
   aucun des trois n'a d'intention propre.
   Ce qu'ils ont, c'est la SOMME de celles de leurs habitudes. Le trait
   de gauche d'un objectif lié à trois habitudes de trois intentions
   différentes est donc tricolore — et il dit quelque chose de vrai :
   « cet objectif tire sur ces trois registres de ma vie ».
   Les colonnes `i`/`is` restent en base sur les quatre tables : elles ne
   gênent personne, et les y remettre coûterait une migration pour rien.
   Ce qui compte, c'est que l'ÉCRAN ne les propose plus. */
const colsHeritees = habs => {
  const vu = new Set();
  habs.forEach(x => intIds(x).forEach(i => vu.add(i)));
  /* L'ordre des sept est celui de `INTS`, jamais celui de la rencontre :
     deux objectifs aux mêmes intentions doivent donner le même trait. */
  return INTS.filter(z => vu.has(z.id)).map(z => z.color);
};

/* ── LES PIÈCES LIÉES, DANS LES DEUX SENS ──────────────────────────
   ⚠️ ON LIT PAR `t0`, LE TEXTE QUE LE SERVEUR CONNAÎT. Les tables de
   liens portent du texte ; tant qu'on cherchait avec `t` — ce qui est
   affiché, donc ce qu'on est en train de taper — les objectifs et les
   répulsions d'une habitude DISPARAISSAIENT à la première lettre tapée
   dans son titre, pour revenir 700 ms plus tard. `t0` ne bouge que
   lorsque le serveur a pris le renommage : la boîte ne clignote plus. */
const srv=x=>x?(x.t0!==undefined?x.t0:x.t):'';
const repsOfHabX=x=>{const k=srv(x); return k?REPS.filter(r=>(r.hs||[]).includes(k)):[];};

/* ══ LE RAIL — UNE CHAÎNE DE TRAITS ══════════════════════════════════
   Le bord gauche d'une boîte habitude porte SES intentions, une par
   segment, de haut en bas. Sept intentions, sept traits : le spectre
   d'une vie, lisible avant d'avoir lu un mot.
   Les autres boîtes n'en portent pas — une couleur d'intention sur un
   objectif ou une répulsion ne voudrait rien dire. */
const tickHTML=cols=>'<span class="tick">'
  +(cols&&cols.length?cols.map(c=>'<i style="background:'+c+'"></i>').join(''):'')
  +'</span>';

/* ══ LA MINI-BOÎTE ═══════════════════════════════════════════════════
   Une pièce liée, vue depuis une autre. Elle porte la couleur de CE
   QU'ELLE EST, jamais celle de la boîte qui l'accueille : une habitude
   reste navy même posée dans une répulsion. */
/* ⚠️ UNE MINI-BOÎTE EST UNE PORTE · 19/09/2026. Elle montrait un lien et
   ne faisait rien : on lisait « Ship the Higher Map » dans une habitude
   et il fallait aller le rechercher à la main dans la vue objectifs.
   `data-go` porte le genre et l'identifiant ; le clic bascule sur la vue
   native de l'objet et l'ouvre. Ce n'est pas un raccourci — c'est la
   structure qui devient parcourable. */
const mini=(kind,id,txt,attr)=>'<button type="button" class="mini m-'+kind+'"'
  +(id!=null?' data-go="'+kind+':'+esc(String(id))+'"':'')+' '+(attr||'')+'>'
  +esc(txt||'untitled')+'</button>';
/* ⚠️ DEUX BOUTONS NE S'IMBRIQUENT PAS. La croix de détachement est un
   bouton ; le corps de la mini-boîte en devient un aussi. Un `<button>`
   dans un `<button>` est du HTML invalide et le navigateur le défait en
   silence — deux frères dans un `<span>`, et chacun garde son clic. */
const miniDel=(kind,id,txt,data)=>'<span class="mini m-'+kind+' mini-w">'
  +'<button type="button" class="mini-t"'
  +(id!=null?' data-go="'+kind+':'+esc(String(id))+'"':'')+'>'+esc(txt||'untitled')+'</button>'
  +'<button type="button" class="mini-x" '+data+' aria-label="Unlink">&times;</button></span>';
/* ══ LE MOT RACONTE LE LIEN ══════════════════════════════════════════
   WHY au-dessus des objectifs d'une habitude, HOW au-dessus des
   habitudes d'un objectif, PROTECTS au-dessus de celles d'une répulsion.
   Trois mots, et la liste devient une phrase. Un groupe vide ne s'écrit
   pas : un titre sans rien dessous n'est pas du storytelling, c'est un
   trou nommé. */
/* ⚠️ LES OPTIONS VIVENT DANS LE PROLONGEMENT DU [close] · 22/09/2026.
   Le troisième paramètre est le lookup ouvert par le bouton de CE
   groupe-là. Il s'écrivait avant dans `bas`, tout en bas de la boîte :
   on appuyait sur « + habit » dans INSTEAD et le champ « a new habit »
   apparaissait sous LEARNED, deux rangées plus bas, parfois sous
   [Delete]. Le bouton disait « close » ICI et ce qu'il avait ouvert
   était LÀ-BAS — donc on ne faisait pas le lien entre les deux.
   Il est maintenant le DERNIER ENFANT du groupe qui l'a ouvert :
   mini-boîtes, bouton [close], puis les options, dans la même colonne. */
const groupe=(mot,contenu,sous)=>contenu
  ? '<span class="mg"><span class="mg-l">'+mot+'</span>'
    +'<span class="minis">'+contenu+'</span>'+(sous||'')+'</span>' : '';

/* ══ LA BOÎTE ════════════════════════════════════════════════════════
   `o.kind` h|t|r · `o.titre` · `o.unit` (HTML) · `o.minis` (HTML)
   · `o.ouverte` · `o.extra` (un choix ouvert : intentions, rythme, lien) */
/* ⚠️ L'INVITATION EST DANS LA LANGUE DE L'OBJET, PAS « Enter text ».
   Une répulsion n'est pas un titre : c'est ce qu'on fait À LA PLACE.
   Le mot juste fait la moitié du travail de la boîte. */
const INVITE={
  h:'what do I do',
  t:'what am I after',
  r:'what I do instead',
  w:'what I learned',
  v:'what I see'};
function boiteHTML(o){
  /* ⚠️ EN LECTURE, UNE BOÎTE OUVERTE RESTE UNE BOÎTE : elle montre ses
     liens, elle ne se modifie pas. Le titre cesse d'être éditable, et
     [Delete] disparaît — un bouton qui ne marche pas est pire qu'un
     bouton absent. */
  if(RO) o=Object.assign({},o,{tue:null});
  /* ⚠️ UNE BOÎTE NEUVE N'AVAIT AUCUN ENDROIT OÙ ÉCRIRE · 20/09/2026.
     Signalé sur [+ Add a Repulsion], mais c'était TOUTES les vues : les
     cinq objets naissent sans texte (création optimiste), et un
     `contenteditable` vide se réduit à un trait de 10 px sans un mot
     dedans. On appuyait sur « ajouter », une boîte s'ouvrait avec
     « instead / + habit / learned / + teaching / Delete » — et rien où
     poser le curseur. La boîte existait, l'invitation non.
     Chaque genre dit donc ce qu'il attend, dans sa propre langue, et le
     champ vide garde une largeur de cible. */
  const nom = (o.ouverte&&!RO)
    ? '<span class="v-name" contenteditable="plaintext-only" spellcheck="false"'
      +' data-say="'+esc(INVITE[o.kind]||'name it')+'"'
      +' data-edit="'+o.kind+':'+esc(String(o.id))+'">'+esc(o.titre)+'</span>'
    : '<span class="v-name">'+esc(o.titre||'untitled')+'</span>';
  return '<span class="v-col"'+(o.ouverte?'':' data-open="'+o.kind+':'+esc(String(o.id))+'" role="button" tabindex="0"')+'>'
    + nom
    + (o.unit ?'<span class="v-sub">'+o.unit+'</span>':'')
    /* LE CHOIX SE POSE AU-DESSUS DE CE QU'IL CONCERNE. Régler l'intention
       ou le rythme, c'est régler L'HABITUDE : le choix s'ouvre sous sa
       ligne, avant ses objectifs et ses répulsions. Un lookup, lui,
       concerne les liens : il s'ouvre après eux. */
    + (o.haut||'')
    + (o.minis?'<span class="minis">'+o.minis+'</span>':'')
    + (o.bas||'')
    /* [Delete] EST LE DERNIER ENFANT DE LA COLONNE. Posé à côté de la
       boîte il flottait à droite et mangeait la largeur — sur un
       téléphone, la moitié de la ligne pour la commande la plus grave.
       Ici il est en bas, pleine largeur, et une saisie qui s'allonge le
       repousse sans jamais le croiser. */
    + (o.ouverte&&o.tue?'<button type="button" class="btn g" data-kill="'+o.kind+':'
        +esc(String(o.id))+'">'+o.tue+'</button>':'')
    + (o.ouverte?'<button type="button" class="w-x" data-x="1" aria-label="Close">&times;</button>':'')
    +'</span>';
}
/* ══ LE CLASSEMENT SE FAIT À DEUX FLÈCHES · 09/09/2026 ═══════════════
   Le glissement au doigt ne marchait pas au téléphone, et un classement
   qui rate une fois sur deux est pire que pas de classement : on ne sait
   plus si on a bougé quelque chose.
   Deux flèches encadrent le rang : ↑ monte d'un cran, ↓ descend d'un
   cran. C'est tout. Ça marche au doigt, à la souris, au clavier, et ça
   ne demande rien à personne — ni de viser, ni de tenir, ni d'attendre.
   Effet de bord, et c'est un gain : plus rien ne capture le geste, donc
   ON PEUT OUVRIR ET ÉDITER UNE BOÎTE EN MODE CLASSEMENT, exactement
   comme en mode normal. Les deux modes ne s'excluent plus. */
const rangHTML=(rank,id,prem,dern)=>'<span class="rk">'
  +'<button type="button" class="rk-a" data-mv="up:'+esc(String(id))+'"'
  +(prem?' disabled':'')+' aria-label="Move up">'
  +'<svg viewBox="0 0 16 10" aria-hidden="true"><path d="M2 8 L8 2 L14 8"/></svg></button>'
  +'<span class="rk-n">'+rank+'</span>'
  +'<button type="button" class="rk-a" data-mv="down:'+esc(String(id))+'"'
  +(dern?' disabled':'')+' aria-label="Move down">'
  +'<svg viewBox="0 0 16 10" aria-hidden="true"><path d="M2 2 L8 8 L14 2"/></svg></button>'
  +'</span>';
/* ⚠️ EN LECTURE, LA LIGNE [+ Add a …] NE S'ÉCRIT PAS DU TOUT · 17/09/2026.
   Le CSS la masquait déjà (`body.ro .habit.add`), mais masquer n'est pas
   retirer : le bouton restait dans le document, atteignable au clavier et
   par un script. Le verrou est ici, à l'endroit qui dessine — pas chez les
   cinq appelants, dont le sixième oublierait. */
const ligne=(inner,cls,cols,rank,id,prem,dern)=> (RO&&cls==='add') ? '' :
  '<div class="habit timed '+(cls||'')+'"'
  +(id?' data-row="'+esc(String(id))+'"':'')+'>'
  + tickHTML(cols)
  + (ordering&&rank?rangHTML(rank,id,prem,dern):'')
  +'<span class="h-body">'+inner+'</span></div>';

/* ══ CE QUI EST OUVERT, ET CE QU'ON EST EN TRAIN DE CHOISIR ══════════
   UN SEUL choix à la fois : deux menus ouverts, c'est un menu de trop.
   `pk` vaut null, ou {q:'int'|'freq'|'lien'|'neuf', k:'h'|'t'|'r', id}. */
let pk=null;
/* La vue du rendu précédent : c'est elle qui dit si l'on vient de changer
   de vue, donc s'il faut jouer le fondu. Elle vivait dans l'ancienne zone
   et a disparu avec elle — sans elle, `renderZone` levait à la première
   ligne et l'écran restait vide. */
let lastView=null;
const pkOn=(q,k,id)=>!!pk&&pk.q===q&&pk.k===k&&String(pk.id)===String(id);
function pkSet(q,k,id){ pk = pkOn(q,k,id) ? null : {q,k,id:String(id)}; renderZone(); }

/* ══ LE RYTHME — ON L'ÉCRIT DANS SA LANGUE ═══════════════════════════
   `deduceFreq()` lit « tous les matins », « every morning », « jeden
   Morgen », « ogni mattina » et rend l'un des 33 rythmes. C'est ce qui
   permet d'écrire au lieu de chercher dans une liste — et ça marche dans
   toutes les langues sans un appel de modèle, donc sans facture.
   La liste reste dessous : on écrit OU on choisit, jamais l'un sans
   l'autre. */
function freqPicker(x){
  const devine = pk&&pk.q==='freq'&&pk.devine ? pk.devine : null;
  return '<span class="pkw">'
    +'<input class="in fq" data-fqin="'+esc(String(x.id))+'" autocomplete="off"'
    +' placeholder="write it in your language" value="'+esc(pk&&pk.txt||'')+'">'
    +(devine?'<button type="button" class="fq-hit" data-fq="'+esc(String(x.id))+'|'+devine+'">'
      +esc(flabel(devine))+'</button>':'')
    +'<span class="pk-list">'
    + FREQS.map(f=>'<button type="button" class="pk-o'+(x.f===f.id?' on':'')
        +'" data-fq="'+esc(String(x.id))+'|'+f.id+'">'+esc(f.label)+'</button>').join('')
    +'</span></span>';
}

/* ══ LE CHAMP DU SPOT ════════════════════════════════════════════════
   Un champ, rien d'autre. Pas de carte, pas d'autocomplétion, pas
   d'autorisation de géolocalisation à demander : on écrit l'endroit
   comme on le dit. Le point GPS viendra du TotehmBot, quand il y aura un
   TotehmBot — et il se posera sur la même ligne en base.
   Vider le champ détache le lieu : c'est le seul moyen de quitter un
   endroit sans supprimer l'habitude. */
const spotPicker=x=>'<span class="pkw">'
  +'<input class="in nw" data-spot="'+esc(String(x.id))+'" autocomplete="off"'
  +' maxlength="120" placeholder="where I do it" value="'+esc(spotDe(x))+'">'
  +'<span class="pk-say">the park downstairs · my kitchen · the gym on 5th</span>'
  +'</span>';

/* LES SEPT INTENTIONS — plusieurs à la fois. Pas de surlignage : la tuile
   prend un fondu de sa couleur, et se remplit quand elle est choisie. */
/* ⚠️ LE SON SE RÈGLE LÀ OÙ ON CHOISIT L'INTENTION, ET IL APPARTIENT À
   L'INTENTION · 20/09/2026. Il ne s'affiche que pour les intentions
   ALLUMÉES : sept blocs de deux champs, ce serait un formulaire posé
   sur une boîte. Et comme le son est global à l'intention, la ligne le
   DIT — sinon on croit régler la musique de cette habitude-là et on
   change celle de toutes les autres sans le savoir. */
const sonLigne=z=>{const so=sonDe(z.id);
  return '<span class="snd" style="--ic:'+z.color+'">'
    +'<span class="snd-n">'+esc(z.name)+'</span>'
    +'<input class="in snd-k" data-son="k|'+z.id+'" autocomplete="off" maxlength="80"'
    +' placeholder="kind of sound" value="'+esc(so.kind||'')+'">'
    +'<input class="in snd-u" data-son="u|'+z.id+'" autocomplete="off" inputmode="url"'
    +' placeholder="link (optional)" value="'+esc(so.url||'')+'">'
    +'</span>';};
const intPicker=(x,kind)=>{const l=intIds(x); const kk=kind||'h';
  const choisies=INTS.filter(z=>l.includes(z.id));
  return '<span class="pkw"><span class="ints">'+INTS.map(z=>
    '<button type="button" class="int'+(l.includes(z.id)?' on':'')+'" data-int="'
    +kk+'|'+esc(String(x.id))+'|'+z.id+'" aria-pressed="'+l.includes(z.id)+'" style="--ic:'+z.color+'">'
    +'<span class="int-n">'+esc(z.name)+'</span>'
    +'<span class="int-p">'+esc(z.pillar)+'</span></button>').join('')+'</span>'
    +(choisies.length
      ? '<span class="snds">'+choisies.map(sonLigne).join('')
        +'<span class="pk-say">the sound belongs to the intention — everywhere I use it</span></span>'
      : '')
    +'</span>';};

/* LE LOOKUP — reprendre ce qui existe, ou écrire du neuf. On ne réécrit
   jamais ce qui est déjà là : les pièces déjà liées ne sont pas
   reproposées. */
/* `col` : la couleur de CE QU'ON VA POSER. Écrire un objectif se fait
   dans du bleu clair, une répulsion dans du rouge-violet, une habitude
   dans du navy — on voit ce qu'on fabrique avant de l'avoir fabriqué.
   Et les propositions RESPIRENT, comme le T : elles appellent le doigt
   sans crier. */
function lienPicker(k,id,dejaIds,liste,ph,col){
  const c=col||'h';
  return '<span class="pkw k-'+c+'">'
    +'<input class="in nw k-'+c+'" data-nw="'+k+':'+esc(String(id))+'" autocomplete="off" placeholder="'+esc(ph)+'">'
    +'<span class="pk-list">'
    + liste.filter(z=>!dejaIds.includes(String(z.id)))
        .map(z=>'<button type="button" class="pk-o vit k-'+c+'" data-lien="'+k+':'+esc(String(id))
          +'|'+esc(String(z.id))+'">'+esc(z.txt||'untitled')+'</button>').join('')
    +'</span></span>';
}
const plus=(q,k,id,mot)=>'<button type="button" class="dash'+(pkOn(q,k,id)?' on':'')+'"'
  +' data-pk="'+q+':'+k+':'+esc(String(id))+'">'+(pkOn(q,k,id)?'close':'+ '+mot)+'</button>';

/* ══ LE FILTRE EST UNE BOÎTE · 15/09/2026 ════════════════════════════
   ⚠️ « TOUT CE QUI CONCERNE LE TOTEHM RESTE DANS LE TOTEHM. »

   Le filtre s'ouvrait en fenêtre plein écran, sur un voile noir : on
   QUITTAIT le Totehm pour régler le Totehm, et une fois dedans il n'y
   avait plus un repère — ni rail, ni couleur, ni boîte.

   Il est maintenant une BOÎTE, la première de la liste, dans la même
   grammaire que toutes les autres : un titre, une ligne d'unité qui se
   touche, et les mêmes sélecteurs d'intention et de rythme qui
   s'ouvrent DEDANS. Rien de neuf à apprendre — c'est la boîte qu'on
   connaît, qui filtre au lieu de raconter. */
let filtreOuvert=false;
const fpkOn=q=>!!pk&&pk.q===q&&pk.k==='f';

function boiteFiltre(){
  const ai = filterI&&INT_BY_ID[filterI];
  const unit =
    '<button type="button" class="v-b" data-pk="fint:f:0" style="color:'
      +(ai?intColor(filterI):'rgba(255,255,255,.62)')+'">'
      +esc(ai?intName(filterI):'any intention')+'</button>'
   +'<button type="button" class="v-b" data-pk="ffreq:f:0">'
      +esc(filterF?flabel(filterF):'any rhythm')+' \u25be</button>';

  let haut='';
  if(fpkOn('fint'))
    haut='<span class="pkw"><span class="ints">'+INTS.map(z=>
      '<button type="button" class="int'+(filterI===z.id?' on':'')+'" data-fint="'+z.id+'"'
      +' aria-pressed="'+(filterI===z.id)+'" style="--ic:'+z.color+'">'
      +'<span class="int-n">'+esc(z.name)+'</span>'
      +'<span class="int-p">'+esc(z.pillar)+'</span></button>').join('')+'</span></span>';
  if(fpkOn('ffreq'))
    haut='<span class="pkw"><span class="pk-list">'+FREQS.map(f=>
      '<button type="button" class="pk-o'+(filterF===f.id?' on':'')+'" data-ffq="'+f.id+'">'
      +esc(f.label)+'</button>').join('')+'</span></span>';

  /* On ne propose d'effacer que s'il y a quelque chose à effacer : un
     bouton gris permanent apprend à ne plus le voir. */
  const bas = (filterF||filterI)
    ? '<button type="button" class="btn g" data-fclear="1">show everything</button>' : '';

  return '<div class="habit timed filtre"><span class="tick"></span>'
    +'<span class="h-body"><span class="v-col">'
    +'<span class="v-name">filter</span>'
    +'<span class="v-sub">'+unit+'</span>'
    + haut + bas
    +'<button type="button" class="w-x" data-fx="1" aria-label="Close the filter">&times;</button>'
    +'</span></span></div>';
}

/* ══ DIRE UNE PHRASE ═════════════════════════════════════════════════
   `dis('…')` pose un mot sous la croix, trois secondes. `dis()` l'efface.
   ⚠️ ELLE NE DIT JAMAIS UN DETAIL TECHNIQUE. « objective not saved » se
   comprend ; « PGRST204 » ne se comprend pas, et un message qu'on ne
   comprend pas fait peur sans aider. Le detail va dans la console. */
let ditT=null;
function dis(mot){
  const e=$('dit'); if(!e)return;
  clearTimeout(ditT);
  if(!mot){ e.classList.remove('on'); return; }
  e.textContent=mot; e.classList.add('on');
  ditT=setTimeout(()=>e.classList.remove('on'),3000);
}

/* ══ LES TROIS VUES ══════════════════════════════════════════════════ */
/* Combien de boîtes dans la vue en cours : c'est ce qui dit à la
   dernière ligne que sa flèche ↓ n'a nulle part où aller. */
let NB=0;
function renderZone(){
  habIds();
  const box=$('habits'); if(!box)return;
  const sc=$('fv-inner'); const keep = sc?sc.scrollTop:null;
  const change = lastView!==null && lastView!==view; lastView=view;
  paintZone();

  let h='';
  if(view==='habits'){
    if(!state.ord)sortHabits();
    const list=(state.habits||[]).filter(x=>{
      if(filterF && x.f!==filterF) return false;
      if(filterI && !intIds(x).includes(filterI)) return false;
      return true;});
    NB=list.length; h=list.map((x,k)=>vueHabitude(x,k)).join('');
    if(!list.length)h+='<div class="void">'+((state.habits||[]).length
      ?'nothing matches this filter':'no habit yet')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="h">+ <b>Add a Habit</b></button>','add');
  }else if(view==='objectives'){
    NB=TRIPS.length; h=TRIPS.map((t,k)=>vueObjectif(t,k)).join('');
    if(!TRIPS.length)h+='<div class="void">'+(tripsLoaded?'no objective yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="t">+ <b>Add an Objective</b></button>','add');
  }else if(view==='repulsions'){
    NB=REPS.length; h=REPS.map((r,k)=>vueRepulsion(r,k)).join('');
    if(!REPS.length)h+='<div class="void">'+(tripsLoaded?'no repulsion yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="r">+ <b>Add a Repulsion</b></button>','add');
  }else if(view==='wisdom'){
    NB=TEACH.length; h=TEACH.map((w,k)=>vueTeaching(w,k)).join('');
    if(!TEACH.length)h+='<div class="void">'+(tripsLoaded?'no teaching yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="w">+ <b>Add a Teaching</b></button>','add');
  }else{
    NB=VIS.length; h=VIS.map((v,k)=>vueVision(v,k)).join('');
    if(!VIS.length)h+='<div class="void">'+(tripsLoaded?'no vision yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="v">+ <b>Add a Vision</b></button>','add');
  }

  /* La bande « order by importance » a quitté le `innerHTML` : elle
     défilait avec les boîtes. Elle est fixe, sous les trois carrés. */
  box.innerHTML=(filtreOuvert?boiteFiltre():'')+h;
  if(change){ box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
  if(keep!=null&&sc)sc.scrollTop=keep;
  peintTraits();
  window.__totehm_zone={version:BUILD, vue:view, session:!!me, arbre_charge:tripsLoaded,
    habitudes:(state.habits||[]).length, objectifs:TRIPS.length, repulsions:REPS.length,
    lecons:TEACH.length, visions:VIS.length,
    filtre:{rythme:!!filterF, intention:!!filterI},
    boite_ouverte:open?open.kind:null, choix:pk?pk.q:null,
    classement:ordering, ordre_du_membre:!!state.ord};
  /* ⚠️ LE RECHARGEMENT DE L'ARBRE EST ATTEIGNABLE DEPUIS UN TEST
     · 22/09/2026. « Je ne peux pas ajouter de répulsion », quatre fois,
     avec mes tests au vert : ils vérifiaient que la mini-boîte
     APPARAÎT. Or le bug de Wah, c'est qu'elle ne SURVIT pas — l'écran
     fait le geste, le serveur n'en sait rien, et le rechargement remet
     l'ancien état. Le seul test qui prouve quelque chose relit donc
     l'arbre depuis le serveur, et c'est cette ligne qui le permet.
     Elle n'expose aucune donnée : juste le verbe. */
  window.__rechargeArbre = () => loadTrips(true);
  /* ══ UN SEUL VERBE DE DIAGNOSTIC · 22/09/2026 ═════════════════════
     Règle du projet : « bug signalé → UN bloc à coller dans la console
     qui renvoie tout d'un coup. Une boucle, pas trois. » Encore
     fallait-il que ce bloc puisse interroger le serveur : il n'y avait
     aucun moyen de le faire depuis la console sans exposer le client
     Supabase, ce qu'on ne fait pas.
     `__totehmDiag()` fait l'aller-retour et rend un objet. Il ne rend
     que des COMPTEURS et des BOOLÉENS — jamais le texte du membre,
     jamais une clé — exactement comme `__totehm_zone` depuis le 06/09.
     La première ligne est celle qui compte : la VERSION. */
  window.__totehmDiag = async () => {
    const d = Object.assign({}, window.__totehm_zone, {
      VERSION: BUILD,
      url: location.href,
      ecran: innerWidth + 'x' + innerHeight,
      boutonAdd: !!document.querySelector('#habits [data-add]'),
      paysage: document.body.classList.contains('paysage')});
    try{
      const {data,error}=await sb.rpc('my_trips');
      d.serveur = error ? ('ERREUR · '+error.message)
        : {reps:(data.reps||[]).length, wisdom:(data.wisdom||[]).length,
           visions:(data.visions||[]).length, trips:(data.trips||[]).length,
           signed_in:!!data.signed_in};
    }catch(e){ d.serveur='PAS JOIGNABLE · '+(e&&e.message||e); }
    try{
      const {data,error}=await sb.rpc('repulsion_create',{p_text:'ZZ DIAG '+Date.now()});
      d.creationTest = error ? ('REFUSEE · '+error.message) : ('OK · id '+data);
      if(!error) await sb.rpc('repulsion_retire',{p_id:data});
    }catch(e){ d.creationTest='LEVEE · '+(e&&e.message||e); }
    return d;
  };
  cable(box);
}

/* ── UNE HABITUDE ────────────────────────────────────────────────────
   Elle montre SES objectifs (bleu clair) et SES répulsions (rouge-violet).
   C'est le format de la boîte répulsion, dans l'autre sens. */
function vueHabitude(x,k){
  const ouverte = !!open && open.kind==='h' && String(open.id)===String(x.id);
  const ts=tripsOfHab(x), rs=repsOfHabX(x), l=intIds(x);
  /* CE QUI MANQUE RESPIRE. Une habitude sans intention ni rythme n'est pas
     encore une habitude : les deux réglages pulsent comme le T tant qu'ils
     sont vides, et s'arrêtent dès qu'ils sont posés. */
  /* ══ LE SPOT · 19/09/2026 ═══════════════════════════════════════════
     Où je le fais. Troisième réglage de l'habitude, dans la même
     grammaire que les deux autres : un bouton quand la boîte est
     ouverte, un mot quand elle est fermée. Il ne respire pas comme
     l'intention et le rythme — une habitude sans lieu reste une
     habitude ; une habitude sans intention n'en est pas encore une. */
  const lieu = spotDe(x);
  const unit = ouverte
    ? intBouton(x,'h')
      +'<button type="button" class="v-b'+(x.f?'':' vit')+'" data-pk="freq:h:'+esc(String(x.id))+'">'
      +esc(x.f?flabel(x.f):'set time frequency')+' ▾</button>'
      +'<button type="button" class="v-b" data-pk="spot:h:'+esc(String(x.id))+'">'
      +esc(lieu||'where')+'</button>'
    : intMots(x)
      +'<span class="v-frq'+(x.f?'':' vit')+'">'+esc(x.f?flabel(x.f):'set time frequency')+'</span>'
      +(lieu?'<span class="v-frq">'+esc(lieu)+'</span>':'');
  /* WHY au-dessus des objectifs, PROTECTED BY au-dessus des répulsions :
     la boîte raconte, elle ne liste pas. */
  const gO = ouverte
    ? ts.map(t=>miniDel('o',t.id,t.text,'data-unlink="o:'+esc(String(x.id))+'|'+esc(String(t.id))+'"')).join('')
      + plus('lien','o',x.id,'objective')
    : ts.map(t=>mini('o',t.id,t.text)).join('');
  const gR = ouverte
    ? rs.map(r=>miniDel('r',r.id,r.text,'data-unlink="r:'+esc(String(x.id))+'|'+esc(String(r.id))+'"')).join('')
      + plus('lien','r',x.id,'repulsion')
    : rs.map(r=>mini('r',r.id,r.text)).join('');
  /* ⚠️ « TRIGGER », PAS « PROTECTED BY » · 09/09/2026. Une répulsion
     n'est pas un garde du corps : c'est une MAUVAISE HABITUDE — celle
     qu'on fait à la place. Vue depuis l'habitude, elle est donc ce qui
     la DÉCLENCHE, pas ce qui la protège. Le mot juste change le sens de
     toute la boîte : WHY monte vers l'objectif, TRIGGER descend vers ce
     qui fait dérailler. */
  /* Chaque lookup rejoint SON groupe — voir `groupe()`. */
  const pkO = (ouverte&&pkOn('lien','o',x.id)) ? lienPicker('o',x.id,
      ts.map(t=>String(t.id)), TRIPS.map(t=>({id:t.id,txt:t.text})), 'a new objective','o') : '';
  const pkR = (ouverte&&pkOn('lien','r',x.id)) ? lienPicker('r',x.id,
      rs.map(r=>String(r.id)), REPS.map(r=>({id:r.id,txt:r.text})), 'a new repulsion','r') : '';
  const minis = groupe('why',gO,pkO) + groupe('trigger',gR,pkR);
  let haut='', bas='';
  if(ouverte&&pkOn('int','h',x.id))  haut=intPicker(x,'h');
  if(ouverte&&pkOn('freq','h',x.id)) haut=freqPicker(x);
  if(ouverte&&pkOn('spot','h',x.id)) haut=spotPicker(x);
  return ligne(boiteHTML({kind:'h',id:x.id,titre:x.t,unit,minis,ouverte,haut,bas,tue:'Delete habit'}),
    ouverte?'open':'', intCols(x), k+1, x.id, k===0, k===NB-1);
}

/* ── UN OBJECTIF ─────────────────────────────────────────────────────
   Il montre SES habitudes en navy. La deadline se pose ET se retire. */
function vueObjectif(t,k){
  const ouverte = !!open && open.kind==='t' && String(open.id)===String(t.id);
  const hs=habsOfTrip(t), late=t.days_left!=null&&t.days_left<0;
  /* PLUS DE COMPTEUR. « 3 habits » ne raconte rien — HOW suivi des trois
     habitudes raconte tout. La deadline reste : elle, elle périme. */
  const vs=visionsOfTrip(t);
  const unit = ouverte
    ? '<input class="in date" type="date" data-date="'+esc(String(t.id))+'" value="'+esc(dateIn(t.target_at))+'">'
      +(t.target_at?'<button type="button" class="v-b" data-nodate="'+esc(String(t.id))+'">no deadline</button>':'')
    : '<span class="v-frq'+(late?' late':'')+'">'+esc(fmtDue(t.days_left))+'</span>';
  /* HOW descend vers les habitudes, TOWARDS monte vers la vision : un
     objectif est le milieu d'une phrase, pas une liste. */
  const pkH = (ouverte&&pkOn('lien','h',t.id)) ? lienPicker('h',t.id,
      hs.map(x=>String(x.id)),
      (state.habits||[]).map(x=>({id:x.id,txt:x.t})), 'a new habit','h') : '';
  const pkV = (ouverte&&pkOn('lien','ov',t.id)) ? lienPicker('ov',t.id,
      vs.map(v=>String(v.id)),
      VIS.map(v=>({id:v.id,txt:v.t})), 'a new vision','v') : '';
  const minis = groupe('how', ouverte
    ? hs.map(x=>miniDel('h',x.id,x.t,'data-unlink="ho:'+esc(String(t.id))+'|'+esc(String(x.id))+'"')).join('')
      + plus('lien','h',t.id,'habit')
    : hs.map(x=>mini('h',x.id,x.t)).join(''), pkH)
   + groupe('towards', ouverte
    ? vs.map(v=>miniDel('v',v.id,v.t,'data-unlink="ov:'+esc(String(t.id))+'|'+esc(String(v.id))+'"')).join('')
      + plus('lien','ov',t.id,'vision')
    : vs.map(v=>mini('v',v.id,v.t)).join(''), pkV);
  let haut='', bas='';
  return ligne(boiteHTML({kind:'t',id:t.id,titre:t.text,unit,minis,ouverte,haut,bas,tue:'Delete objective'}),
    ouverte?'open':'', colsHeritees(hs), k+1, t.id, k===0, k===NB-1);
}

/* ── UNE RÉPULSION ───────────────────────────────────────────────────
   Elle montre les habitudes qu'elle protège, en navy. */
function vueRepulsion(r,k){
  const ouverte = !!open && open.kind==='r' && String(open.id)===String(r.id);
  const hs=habsOfRep(r);
  /* UN SEUL MOT, ET IL RACONTE OÙ L'ON EN EST. Il y en avait deux :
     « protects » sur la ligne d'unité ET au-dessus des mini-boîtes — la
     même chose dite deux fois n'est pas du storytelling, c'est du bruit.
     Une répulsion n'a pas d'unité : elle n'existe que par ce qu'elle
     remplace. Donc pas de ligne d'unité.
     ⚠️ « INSTEAD », PAS « PROTECTS » · 09/09/2026. Une répulsion est une
     MAUVAISE HABITUDE. Ce qu'elle porte, ce ne sont pas des habitudes
     qu'elle protégerait — ce sont celles à faire À LA PLACE. Le mot dit
     l'échange, et c'est tout le produit : on ne supprime pas une
     habitude, on en met une autre à sa place.
     L'invitation, elle, ne vit plus ici : elle a rejoint le bas de la
     boîte, sous CLOSE, là où l'on choisit. */
  const ws=teachOfRep(r);
  const unit = '';
  const mot = 'instead';
  /* ⚠️ L'INVITATION SUIT SON BOUTON · 22/09/2026. Elle vivait sous
     CLOSE ; CLOSE a changé de place, elle aussi — elle ouvre maintenant
     le lookup du groupe INSTEAD, juste sous le bouton qui l'a demandé. */
  const pkHR = (ouverte&&pkOn('lien','hr',r.id))
    ? '<span class="pk-say">write a new one or pick an existing one</span>'
      + lienPicker('hr',r.id, hs.map(x=>String(x.id)),
        (state.habits||[]).map(x=>({id:x.id,txt:x.t})), 'a new habit','h') : '';
  const pkRW = (ouverte&&pkOn('lien','rw',r.id))
    ? lienPicker('rw',r.id, ws.map(w=>String(w.id)),
        TEACH.map(w=>({id:w.id,txt:w.t})), 'a new teaching','w') : '';
  const minis = groupe(mot, ouverte
    ? hs.map(x=>miniDel('h',x.id,x.t,'data-unlink="hr:'+esc(String(r.id))+'|'+esc(String(x.id))+'"')).join('')
      + plus('lien','hr',r.id,'habit')
    : hs.map(x=>mini('h',x.id,x.t)).join(''), pkHR)
   /* LEARNED : ce qu'on a compris de cette mauvaise habitude. C'est le
      seul pont entre le present qu'on tue et le passe qu'on garde. */
   + groupe('learned', ouverte
    ? ws.map(w=>miniDel('w',w.id,w.t,'data-unlink="rw:'+esc(String(r.id))+'|'+esc(String(w.id))+'"')).join('')
      + plus('lien','rw',r.id,'teaching')
    : ws.map(w=>mini('w',w.id,w.t)).join(''), pkRW);
  /* ⚠️ L'INVITATION EST SOUS *CLOSE*, PAS AU-DESSUS · 09/09/2026. Elle
     servait de titre au groupe : posée là, elle parlait de la répulsion
     — alors qu'elle parle des HABITUDES qu'on va choisir. Sous le
     lookup ouvert, juste au-dessus de la liste, elle dit ce que le
     doigt s'apprête à faire. */
  let haut='', bas='';
  return ligne(boiteHTML({kind:'r',id:r.id,titre:r.text,unit,minis,ouverte,haut,bas,tue:'Delete repulsion'}),
    ouverte?'open':'', colsHeritees(hs), k+1, r.id, k===0, k===NB-1);
}

/* ── LES DEUX RÉGLAGES D'INTENTION ───────────────────────────────────
   Le bouton quand la boîte est ouverte, les mots quand elle est fermée.
   ⚠️ SEULE L'HABITUDE S'EN SERT DEPUIS LE 17/09. Les quatre autres
   objets HÉRITENT (voir `colsHeritees`). Le paramètre `kind` reste pour
   que la signature ne mente pas, mais il vaut toujours 'h'. */
function intBouton(x,kind){ const l=intIds(x);
  return '<button type="button" class="v-b'+(l.length?'':' vit')+'" data-pk="int:'+kind+':'+esc(String(x.id))+'">'
    +(l.length?l.map(i=>'<b style="color:'+intColor(i)+'">'+esc(intName(i))+'</b>').join(' · ')
              :'set intention')+'</button>'; }
function intMots(x){ const l=intIds(x);
  return l.length?l.map(i=>'<span class="v-int" style="color:'+intColor(i)+'">'+esc(intName(i))+'</span>').join('')
                 :'<span class="v-pil vit">set intention</span>'; }
