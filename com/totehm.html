/* ══ LA COULEUR INTENTIONNELLE NE S'ÉTEINT PLUS · 09/09/2026 ═════════
   Il y a eu deux dégradés successifs — par le rang, puis par le champ de
   vision — et les deux avaient le même défaut : ils transformaient une
   couleur de marque en gris. Une intention à 16 % d'opacité ne dit plus
   quelle intention c'est ; elle dit seulement « pas celle-là ». Or c'est
   la seule information que le trait porte.
   `peintTraits()`, `DEGRADE`, `--tk` et l'écouteur de défilement qui les
   servait sont supprimés. Pleine valeur, dans les trois vues, en mode
   classement comme en lecture. */
function peintTraits(){}

/* ══ ALLER VOIR UN OBJET CHEZ LUI · 19/09/2026 ═══════════════════════
   On touche une mini-boîte : on bascule sur la vue native de l'objet et
   on l'ouvre. ⚠️ `setView` referme ce qui est ouvert et redessine — il
   faut donc ouvrir APRÈS, pas avant, sinon la boîte se referme
   aussitôt. Le `requestAnimationFrame` laisse le rendu de la nouvelle
   vue se poser avant qu'`ouvrir` n'aille y chercher sa ligne. */
/* ⚠️ DEUX ALPHABETS DANS LE MÊME FICHIER, ET C'EST LA CAUSE DU BUG
   · 20/09/2026. Une mini-boîte d'objectif est construite avec la lettre
   `o` (c'est la classe CSS `.m-o` et le `data-unlink="o:…"`), mais une
   boîte OUVERTE d'objectif porte `open.kind === 't'`. Deux lettres pour
   la même chose, écrites à six mois d'intervalle.
   `VUE_DE` avait été écrite avec l'alphabet des boîtes (`t`) alors que
   `data-go` porte celui des minis (`o`) : `VUE_DE['o']` valait
   `undefined`, la fonction sortait en silence, et le clic ne faisait
   RIEN. Les quatre autres lettres coïncidaient — voilà pourquoi seul
   l'objectif était mort.
   La table dit maintenant les DEUX : où aller, et sous quel nom la
   boîte s'ouvre là-bas. Traduire explicitement coûte une colonne ;
   supposer que deux alphabets coïncident coûte un bouton mort. */
const PORTE={
  h:{vue:'habits',     ouvre:'h'},
  o:{vue:'objectives', ouvre:'t'},   /* ⚠️ o -> t, la seule traduction */
  t:{vue:'objectives', ouvre:'t'},   /* on accepte les deux à l'entrée */
  r:{vue:'repulsions', ouvre:'r'},
  w:{vue:'wisdom',     ouvre:'w'},
  v:{vue:'visions',    ouvre:'v'}};
function vaVers(kind,id){
  const d=PORTE[kind];
  /* Un genre inconnu ne doit pas mourir en silence : c'est exactement
     comme ça que le bug a tenu une semaine. */
  if(!d){ console.warn('[totehm] mini-boite de genre inconnu:',kind); return; }
  if(d.vue!==view){ dernierSens=null; setView(d.vue); }
  requestAnimationFrame(()=>ouvrir(d.ouvre,id));
}

/* ══ OUVRIR, FERMER ══════════════════════════════════════════════════ */
/* ⚠️ NAÎTRE ET OUVRIR NE SONT PAS LE MÊME GESTE · 20/09/2026.
   Le curseur ne se posait que si `innerWidth > 700` — pour ne pas faire
   surgir le clavier chaque fois qu'on ouvre une boîte pour la LIRE.
   Bonne règle, mauvaise portée : elle s'appliquait aussi à une boîte
   qui vient de NAÎTRE. Au téléphone on appuyait sur « + Add a
   Repulsion », une boîte vide s'ouvrait, et rien ne se passait — pas de
   clavier, pas de curseur, pas un mot pour dire quoi faire.
   On vient d'appuyer sur « ajouter » : le clavier est exactement ce
   qu'on attend. `neuve` le dit, et seule la création le passe. */
function ouvrir(kind,id,neuve){
  open={kind,id:String(id)}; pk=null; renderZone();
  const b=$('habits').querySelector('.habit.open');
  if(!b)return;
  /* MESURÉ : `scrollIntoView` ne bougeait le cadre que de 2 px — dans un
     document dont le corps ne défile pas, il ne trouve pas #fv-inner de
     façon fiable. On lui dit lequel, et de combien. */
  requestAnimationFrame(()=>{const sc=$('fv-inner'); if(!sc)return;
    sc.scrollTop=sc.scrollTop+b.getBoundingClientRect().top-sc.getBoundingClientRect().top-6;});
  const f=b.querySelector('.v-name[contenteditable]');
  if(f&&(neuve||window.innerWidth>700))f.focus();
}
function fermer(){
  /* Il n'y a plus de brouillon de répulsion : elle naît en base comme les
     quatre autres objets. Voir `creer()`. */
  /* ⚠️ POUSSER AVANT DE RECHARGER · 09/09/2026. L'arbre revient du
     serveur ; si la dernière frappe dort encore dans sa minuterie, le
     serveur répond avec l'ANCIEN texte et l'écran perd ce qu'on venait
     d'écrire. On vide les minuteries d'abord — toujours. */
  pousse();
  open=null; pk=null; renderZone();
  /* L'arbre se recharge ICI, une fois : pendant l'édition il fermerait la
     boîte sous les doigts, après il remet la vérité du serveur. */
  if(wDirty){wDirty=false;loadTrips(true);}
}

/* ══ CRÉER — un bouton par vue, la pièce de CETTE vue ═════════════════ */
/* ══ CRÉER · 17/09/2026 ══════════════════════════════════════════════
   DEUX CHANGEMENTS, ET LES DEUX VIENNENT DE CE QUE WAH A SENTI.

   1. ⚠️ LA BOÎTE NAÎT EN BAS, SOUS LE DOIGT. Elle naissait en tête de
      liste (`unshift`) : on appuie sur [+ Add a Vision], qui est en bas,
      et la boîte s'ouvre tout en haut — l'écran saute, on perd où on en
      était, et sur une liste de vingt on ne voit même pas qu'il s'est
      passé quelque chose. Elle naît maintenant À LA FIN, exactement là
      où le doigt vient d'appuyer.

   2. ⚠️ PLUS D'ATTENTE. On appelait le serveur et on n'ouvrait la boîte
      qu'à sa réponse : 300 à 600 ms de rien sur un vrai réseau — le
      « il y a de la latence » signalé sur [Add a Vision]. Tout le reste
      du fichier est OPTIMISTE (on pose, on dessine, on envoie) ; la
      création était la seule exception, sans raison.
      La boîte s'ouvre donc TOUT DE SUITE avec un identifiant provisoire
      (`tmp-…`), et l'identifiant réel le remplace quand le serveur
      répond. Si le serveur refuse, la ligne provisoire disparaît et on
      le DIT — une boîte fantôme qu'on croit enregistrée est le pire des
      états.

   ⚠️ CE QUI REND LE PROVISOIRE SÛR : tant que l'identifiant commence par
   `tmp-`, aucune écriture réseau ne part pour cet objet (`estProvisoire`
   garde `differe`, `attache` et `tue`). Sans ce verrou on enverrait un
   `vision_rename` sur un identifiant qui n'existe pas encore. */
let TSEQ=0;
/* ══ ⛔ LE SÉPARATEUR ÉTAIT DANS L'IDENTIFIANT · 21/09/2026 ══════════
   VOILÀ la cause de « je ne peux pas encore rajouter de répulsion », et
   ce n'était ni la minuterie ni le serveur.

   Tout le fichier encode une cible en `genre:identifiant` et la relit
   par `split(':')` — `data-edit`, `data-open`, `data-go`, `data-pk`,
   `data-kill`. L'identifiant provisoire s'écrivait `tmp:1`. Une boîte
   neuve portait donc `data-edit="r:tmp:1"`, et le lecteur en tirait
   `p[1] === 'tmp'`. `repOf('tmp')` ne trouve rien, la fonction sortait
   sur `if(!r)return;` — **CHAQUE FRAPPE ÉTAIT JETÉE**, sans un mot, tant
   que le serveur n'avait pas renvoyé le vrai identifiant.

   Mesuré : à 900 ms de latence, on tape « ZZTEST », le texte s'affiche,
   et il disparaît au redessin qui suit le baptême — parce qu'il n'avait
   jamais atteint la mémoire. Sur mon faux serveur à 80 ms la fenêtre
   durait le temps d'une lettre : le bug était invisible en test. C'est
   la TROISIÈME fois qu'un faux serveur trop gentil cache une panne —
   après la course de septembre et la contrainte de `wisdom`.

   ⚠️ UN IDENTIFIANT NE CONTIENT JAMAIS LE CARACTÈRE QUI SÉPARE LES
   CHAMPS. `tmp-1` au lieu de `tmp:1`, et les cinq lecteurs retrouvent
   leur cible. La règle vaut pour tout ce qu'on encodera dans un
   `data-*` : le séparateur appartient au format, jamais à la valeur. */
const estProvisoire = id => String(id).startsWith('tmp-');

/* Le serveur a répondu : on remplace l'identifiant provisoire PARTOUT —
   dans la liste, dans la boîte ouverte, et dans le choix en cours. */
function baptise(liste, tmp, vrai){
  const o = liste.find(z=>String(z.id)===tmp); if(!o)return null;
  o.id = String(vrai);
  if(open && String(open.id)===tmp) open.id = String(vrai);
  if(pk   && String(pk.id)===tmp)   pk.id   = String(vrai);
  return o;
}
/* ⚠️ LE BAPTÊME ARRIVE PENDANT QU'ON ÉCRIT, ET IL VOLAIT LE CURSEUR
   · 20/09/2026. La boîte naît avec un identifiant provisoire et prend le
   curseur ; 300 à 600 ms plus tard le serveur répond, `renderZone()`
   reconstruit la ligne, et le champ qui avait le curseur n'existe plus.
   Au téléphone le clavier retombait tout seul une demi-seconde après
   s'être ouvert — on croyait que l'application avait planté.
   On repose donc le curseur APRÈS le redessin, et seulement si le champ
   est encore vide : quelqu'un qui a déjà tapé a peut-être cliqué
   ailleurs entre-temps, et lui reprendre le curseur serait pire. */
function rendCurseur(){
  requestAnimationFrame(()=>{
    const f=document.querySelector('#habits .habit.open .v-name[contenteditable]');
    if(!f || f.textContent.trim()!=='') return;
    if(document.activeElement===f) return;
    /* On ne rappelle le clavier que si le doigt n'est pas ailleurs : si
       l'utilisateur a ouvert un choix ou touché un autre champ, on le
       laisse tranquille. */
    const a=document.activeElement;
    if(a && a!==document.body && !a.classList.contains('v-name')) return;
    f.focus();
  });
}
/* Le serveur a refusé : la ligne provisoire n'a jamais existé. */
function annule(liste, tmp, mot){
  const i = liste.findIndex(z=>String(z.id)===tmp);
  if(i>=0) liste.splice(i,1);
  if(open && String(open.id)===tmp){ open=null; pk=null; }
  dis(mot);
  renderZone();
}

async function creer(kind){
  /* ⚠️ TROISIÈME VERROU. `save()` et `cloudSave()` bloquent déjà l'écriture
     locale et nuage, mais `creer` parle DIRECTEMENT au serveur : sans
     cette ligne, on aurait créé un objectif chez soi en regardant le
     Totehm d'un autre. La boîte [+ Add] est masquée en CSS — masquer
     n'est pas interdire. */
  if(RO)return;
  if(kind==='h'){
    const x={id:'h'+(++HSEQ), t:'', t0:'', f:null, i:null, is:[], o:null};
    state.habits.push(x); state.ord=true; save(); ouvrir('h',x.id,true); return;}
  if(!me){$('member-window').classList.add('show');
          if(typeof memberPaint==='function')memberPaint();return;}

  const tmp = 'tmp-'+(++TSEQ);   /* ⚠️ JAMAIS de « : » — voir `estProvisoire` */

  if(kind==='t'){
    TRIPS.push({id:tmp,text:'',target_at:null,days_left:null,habits:[],is:[],vs:[]});
    wDirty=true; ouvrir('t',tmp,true);
    const {data,error}=await sb.rpc('objective_create',{p_text:'',p_target:null});
    if(error||!data){console.error('[totehm] objective_create:',error&&error.message);
      return annule(TRIPS,tmp,'objective not saved — try again');}
    baptise(TRIPS,tmp,data); renderZone(); rendCurseur(); return;}

  if(kind==='r'){
    REPS.push({id:tmp,text:'',obstacle:'',hs:[],ws:[],is:[]});
    wDirty=true; ouvrir('r',tmp,true);
    const {data,error}=await sb.rpc('repulsion_create',{p_text:''});
    if(error||!data){console.error('[totehm] repulsion_create:',error&&error.message);
      return annule(REPS,tmp,'repulsion not saved — try again');}
    baptise(REPS,tmp,data); renderZone(); rendCurseur(); return;}

  if(kind==='w'){
    TEACH.push({id:tmp,t:'',t0:'',is:[],os:[]});
    wDirty=true; ouvrir('w',tmp,true);
    const {data,error}=await sb.rpc('teaching_create',{p_text:''});
    if(error||!data){console.error('[totehm] teaching_create:',error&&error.message);
      return annule(TEACH,tmp,'teaching not saved — try again');}
    baptise(TEACH,tmp,data); renderZone(); rendCurseur(); return;}

  if(kind==='v'){
    VIS.push({id:tmp,t:'',t0:'',is:[],os:[]});
    wDirty=true; ouvrir('v',tmp,true);
    const {data,error}=await sb.rpc('vision_create',{p_text:''});
    if(error||!data){console.error('[totehm] vision_create:',error&&error.message);
      return annule(VIS,tmp,'vision not saved — try again');}
    baptise(VIS,tmp,data); renderZone(); rendCurseur(); return;}
}

/* ══ ATTACHER, DÉTACHER ══════════════════════════════════════════════
   Une seule fonction connaît les règles, et il n'y en a que trois :
     une habitude sert PLUSIEURS objectifs ;
     une répulsion protège PLUSIEURS habitudes ;
     détacher n'efface jamais — on retire le lien, pas la pensée. */
/* ⚠️ ON PARLE AU SERVEUR DANS SA LANGUE : `srv(x)` — le texte qu'il a.
   Poser un lien avec le texte affiché pendant qu'un renommage dort dans
   une minuterie créait un lien vers une habitude qui n'existe pas. */
function attache(quoi,srcId,cibleId){
  if(RO)return;                      /* même raison que dans `creer` */
  /* ⚠️ ON NE LIE PAS CE QUI N'EXISTE PAS ENCORE. Une seconde après la
     création, l'objet a son vrai identifiant ; d'ici là, un lien partirait
     vers `tmp-3` et le serveur répondrait « not yours ». */
  if(estProvisoire(srcId)||estProvisoire(cibleId)){
    dis('one second — still saving'); return; }
  if(quoi==='o'){ const x=habOf(srcId), t=tripOf(cibleId), k=srv(x); if(!x||!k||!t)return;
    OBJ[k]=(OBJ[k]||[]).concat([String(t.id)]); posePremier(x);
    apres(sb.rpc('objective_link',{p_obj:t.id,p_habit:k})); }
  else if(quoi==='h'){ const t=tripOf(srcId), x=habOf(cibleId), k=srv(x); if(!t||!x||!k)return;
    OBJ[k]=(OBJ[k]||[]).concat([String(t.id)]); posePremier(x);
    apres(sb.rpc('objective_link',{p_obj:t.id,p_habit:k})); }
  else if(quoi==='r'){ const x=habOf(srcId), r=repOf(cibleId), k=srv(x); if(!x||!k||!r)return;
    if(!(r.hs||[]).includes(k)){r.hs.push(k);
      apres(sb.rpc('repulsion_link',{p_id:r.id,p_habit:k}));} }
  else if(quoi==='hr'){ const r=repOf(srcId), x=habOf(cibleId), k=srv(x); if(!r||!x||!k)return;
    if(!(r.hs||[]).includes(k)){r.hs.push(k);
      apres(sb.rpc('repulsion_link',{p_id:r.id,p_habit:k}));} }
  /* ══ LES DEUX LIENS CROISÉS · 16/09/2026 ═══════════════════════════
     ⚠️ ON TIENT LES DEUX CÔTÉS EN MÉMOIRE. `t.vs` et `v.os` décrivent le
     MÊME lien, vu de chaque bout. N'en écrire qu'un ferait qu'un lien
     posé depuis l'objectif serait invisible depuis la vision jusqu'au
     rechargement suivant — l'écran mentirait le temps d'un aller-retour,
     et c'est exactement la classe de bug qu'on vient de passer trois
     lots à éteindre. */
  else if(quoi==='ov'||quoi==='vo'){
    const t = quoi==='ov' ? tripOf(srcId) : tripOf(cibleId);
    const v = quoi==='ov' ? visOf(cibleId) : visOf(srcId);
    if(!t||!v)return;
    if(!(t.vs||[]).includes(String(v.id)))(t.vs=t.vs||[]).push(String(v.id));
    if(!(v.os||[]).includes(String(t.id)))(v.os=v.os||[]).push(String(t.id));
    apres(sb.rpc('objective_vision_link',{p_obj:t.id,p_vision:v.id})); }
  else { /* 'rw' | 'wr' */
    const r = quoi==='rw' ? repOf(srcId) : repOf(cibleId);
    const w = quoi==='rw' ? teachOf(cibleId) : teachOf(srcId);
    if(!r||!w)return;
    if(!(r.ws||[]).includes(String(w.id)))(r.ws=r.ws||[]).push(String(w.id));
    apres(sb.rpc('repulsion_teaching_link',{p_rep:Number(r.id),p_teaching:w.id})); }
  wDirty=true;
}
function detache(quoi,aId,bId){
  if(RO)return;                      /* même raison que dans `creer` */
  if(quoi==='o'){ const x=habOf(aId), k=srv(x); if(!x||!k)return;
    OBJ[k]=(OBJ[k]||[]).filter(o=>o!==String(bId)); posePremier(x);
    apres(sb.rpc('objective_unlink',{p_obj:bId,p_habit:k})); }
  else if(quoi==='ho'){ const x=habOf(bId), k=srv(x); if(!x||!k)return;
    OBJ[k]=(OBJ[k]||[]).filter(o=>o!==String(aId)); posePremier(x);
    apres(sb.rpc('objective_unlink',{p_obj:aId,p_habit:k})); }
  else if(quoi==='r'){ const x=habOf(aId), r=repOf(bId), k=srv(x); if(!x||!k||!r)return;
    r.hs=(r.hs||[]).filter(t=>t!==k);
    apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:k})); }
  else if(quoi==='hr'){ const r=repOf(aId), x=habOf(bId), k=srv(x); if(!r||!x||!k)return;
    r.hs=(r.hs||[]).filter(t=>t!==k);
    apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:k})); }
  else if(quoi==='ov'||quoi==='vo'){
    const t = quoi==='ov' ? tripOf(aId) : tripOf(bId);
    const v = quoi==='ov' ? visOf(bId)  : visOf(aId);
    if(!t||!v)return;
    t.vs=(t.vs||[]).filter(z=>z!==String(v.id));
    v.os=(v.os||[]).filter(z=>z!==String(t.id));
    apres(sb.rpc('objective_vision_unlink',{p_obj:t.id,p_vision:v.id})); }
  else { /* 'rw' | 'wr' */
    const r = quoi==='rw' ? repOf(aId) : repOf(bId);
    const w = quoi==='rw' ? teachOf(bId) : teachOf(aId);
    if(!r||!w)return;
    r.ws=(r.ws||[]).filter(z=>z!==String(w.id));
    apres(sb.rpc('repulsion_teaching_unlink',{p_rep:Number(r.id),p_teaching:w.id})); }
  wDirty=true;
}
/* Écrire du neuf ET l'attacher, d'un seul geste. */
async function neufEtAttache(quoi,srcId,txt){
  if(quoi==='o'||quoi==='vo'){
    const {data,error}=await sb.rpc('objective_create',{p_text:txt,p_target:null});
    if(error){console.error('[totehm] objective_create:',error.message);return;}
    TRIPS.unshift({id:String(data),text:txt,target_at:null,days_left:null,habits:[],is:[],vs:[]});
    attache(quoi,srcId,String(data));}
  else if(quoi==='r'||quoi==='wr'){
    /* ⚠️ `repulsion_set` NE SERT PLUS À CRÉER : elle lève sur un texte
       vide et retire l'ancienne répulsion du même obstacle. Ici le texte
       n'est pas vide, mais la seconde règle mordrait quand même. */
    const {data,error}=await sb.rpc('repulsion_create',{p_text:txt});
    if(error){console.error('[totehm] repulsion_create:',error.message);return;}
    REPS.unshift({id:String(data),text:txt,obstacle:'',hs:[],ws:[],is:[]});
    attache(quoi,srcId,String(data));}
  else if(quoi==='ov'){
    const {data,error}=await sb.rpc('vision_create',{p_text:txt});
    if(error){console.error('[totehm] vision_create:',error.message);return;}
    VIS.unshift({id:String(data),t:txt,t0:txt,is:[],os:[]});
    attache('ov',srcId,String(data));}
  else if(quoi==='rw'){
    const {data,error}=await sb.rpc('teaching_create',{p_text:txt});
    if(error){console.error('[totehm] teaching_create:',error.message);return;}
    TEACH.unshift({id:String(data),t:txt,t0:txt,is:[],os:[]});
    attache('rw',srcId,String(data));}
  else{ /* 'h' depuis un objectif, 'hr' depuis une répulsion */
    const x={id:'h'+(++HSEQ), t:txt, t0:txt, f:null, i:null, is:[], o:null};
    state.habits.unshift(x); state.ord=true; save();
    attache(quoi,srcId,x.id);}
  pk=null; renderZone();
  return;
}

/* ══ LE CÂBLAGE — un seul, posé sur la liste entière ═════════════════
   Délégation : la liste est redessinée à chaque geste, et rattacher
   trente écouteurs à chaque rendu, c'est trente fuites en puissance. */
let cableFait=false;
function cable(box){
  if(cableFait)return; cableFait=true;

  box.addEventListener('click',async e=>{
    /* ⚠️ TOUT `data-*` TRAITÉ PLUS BAS DOIT ÊTRE NOMMÉ ICI. La délégation
       ne voit que ce que ce sélecteur attrape : `data-mv` manquait, donc
       les deux flèches de classement ne faisaient rien du tout — le code
       qui les traite existait et n'était jamais atteint. */
    const el=e.target.closest('[data-fint],[data-ffq],[data-fclear],[data-fx],'
      +'[data-open],[data-add],[data-x],[data-pk],[data-int],[data-mv],[data-go],'
      +'[data-fq],[data-lien],[data-unlink],[data-nodate],[data-kill]');
    if(!el)return;
    const d=el.dataset;

    /* ⚠️ ON PEUT OUVRIR UNE BOÎTE EN MODE CLASSEMENT · 09/09/2026.
       Les deux gestes se disputaient le même doigt tant que classer était
       un glissement ; avec deux flèches, il n'y a plus de conflit. */
    if(d.mv){ const p=d.mv.split(':'); bouge(p[0],p[1]); return; }
    /* Le filtre passe AVANT tout : ses boutons vivent dans une boîte,
       et le sélecteur remonterait sinon sur un `[data-pk]` voisin. */
    if(d.fx!==undefined){ e.stopPropagation(); filtreOuvert=false; pk=null; renderZone(); return; }
    if(d.fint!==undefined){ e.stopPropagation();
      filterI = (filterI===d.fint) ? null : d.fint;
      saveFilter(); pk=null; renderZone(); return; }
    if(d.ffq!==undefined){ e.stopPropagation();
      filterF = (filterF===d.ffq) ? null : d.ffq;
      saveFilter(); pk=null; renderZone(); return; }
    if(d.fclear!==undefined){ e.stopPropagation();
      filterF=null; filterI=null; saveFilter(); pk=null; renderZone(); return; }
    /* ⚠️ `data-go` PASSE AVANT `data-open` : une mini-boîte vit DANS une
       boîte ouverte, et le `closest` remonterait sinon sur elle. */
    if(d.go){ e.stopPropagation(); const p=d.go.split(':'); vaVers(p[0],p[1]); return; }
    if(d.open){ const p=d.open.split(':'); ouvrir(p[0],p[1]); return; }
    if(d.add){ creer(d.add); return; }
    if(d.x!==undefined){ e.stopPropagation(); fermer(); return; }
    if(d.pk){ e.stopPropagation(); const p=d.pk.split(':'); pkSet(p[0],p[1],p[2]); return; }

    e.stopPropagation();
    /* `data-int` vaut « h|<id>|<intention> ». Le genre est toujours 'h'
       depuis le 17/09 ; il reste dans la chaîne pour que le sélecteur et
       le dispatch se lisent pareil. */
    if(d.int){ const p=d.int.split('|');
      const x=habOf(p.length>2?p[1]:p[0]); if(x)intToggle(x,p[p.length-1]);
      renderZone(); return; }
    if(d.fq){ const p=d.fq.split('|'); const x=habOf(p[0]);
      if(x){x.f=p[1];save();} pk=null; renderZone(); return; }
    if(d.lien){ const p=d.lien.split('|'), q=p[0].split(':');
      attache(q[0],q[1],p[1]); pk=null; renderZone(); return; }
    if(d.unlink){ const p=d.unlink.split('|'), q=p[0].split(':');
      detache(q[0],q[1],p[1]); renderZone(); return; }
    if(d.nodate){ const t=tripOf(d.nodate); if(t){t.target_at=null;t.days_left=null;
      apres(sb.rpc('objective_set_target',{p_obj:t.id,p_target:null})); wDirty=true;}
      renderZone(); return; }
    if(d.kill){ const p=d.kill.split(':'); tue(p[0],p[1]); return; }
  });

  /* Le clavier ouvre ce que le doigt ouvre. */
  box.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('[data-open]');
    if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();
      const p=el.dataset.open.split(':'); ouvrir(p[0],p[1]);}
  });

  /* ══ LA SAISIE — TOUT S'ENREGISTRE EN ÉCRIVANT ═════════════════════
     Aucun bouton [Done] nulle part : ce qu'on écrit est posé. */
  box.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.edit){
      /* ⚠️ ON APLATIT, MÊME CE QUI VIENT D'UN COLLER. `beforeinput`
         arrête les retours à la ligne TAPÉS ; un texte collé depuis une
         note en apporte quand même, et une habitude sur deux lignes
         casse le lien par texte (`steps` est du texte). Une boîte porte
         UNE ligne — ici, partout, sans exception. */
      const p=t.dataset.edit.split(':'), v=t.textContent.replace(/[\r\n]+/g,' ');
      /* ⚠️ CE QU'ON TAPE SE VOIT TOUT DE SUITE, CE QUI PART EST DIFFÉRÉ.
         Deux choses distinctes, et elles étaient confondues : la mise à
         jour EN MÉMOIRE attendait 700 ms comme l'appel réseau, donc la
         boîte se vidait de ses liens le temps de la frappe. Maintenant
         la mémoire suit la lettre, et seul le réseau attend. */
      if(p[0]==='h'){ const x=habOf(p[1]); if(!x)return;
        x.t=v; save();
        /* Renommer ne doit pas orpheliner ce qui s'y rattache. `t0` est
           l'ancien nom VRAI — celui que la base a — et pas « le texte
           d'il y a une lettre », qui partait avant et cassait les liens
           pour de bon. La clé de minuterie est celle de CETTE habitude :
           écrire ailleurs ne l'annule plus, ça la pousse. */
        differe('h:'+x.id,()=>{ save();
          const ancien=x.t0;
          if(me&&ancien&&ancien!==x.t){
            REPS.forEach(r=>{const i=(r.hs||[]).indexOf(ancien); if(i>=0)r.hs[i]=x.t;});
            if(OBJ[ancien]){OBJ[x.t]=OBJ[ancien]; delete OBJ[ancien];}
            apres(sb.rpc('habit_rename_links',{p_old:ancien,p_new:x.t}));}
          x.t0=x.t; }); }
      /* ⚠️ RIEN NE PART TANT QUE L'OBJET EST PROVISOIRE. Le texte
         s'écrit en mémoire ; la minuterie est posée sur l'identifiant
         COURANT, qui sera le vrai quand elle se déclenchera (`baptise`
         l'a remplacé entre-temps). Envoyer un `rename` sur un `tmp-`
         ferait une erreur serveur et perdrait la frappe. */
      else if(p[0]==='t'){ const z=tripOf(p[1]); if(!z)return; z.text=v; wDirty=true;
        differe('t:'+z.id,()=>quandNomme(z,()=>
          apres(sb.rpc('objective_rename',{p_obj:z.id,p_text:z.text})))); }
      else if(p[0]==='r'){ const r=repOf(p[1]); if(!r)return; r.text=v; wDirty=true;
        /* ⚠️ `repulsion_rename`, PAS `repulsion_set`. `repulsion_set`
           RETIRE l'ancienne répulsion du même obstacle avant d'insérer :
           utilisée à chaque frappe, elle empilait une ligne morte par
           lettre tapée. */
        differe('r:'+r.id,()=>quandNomme(r,()=>
          apres(sb.rpc('repulsion_rename',{p_id:Number(r.id), p_text:r.text})))); }
      else if(p[0]==='w'){ const w=teachOf(p[1]); if(!w)return; w.t=v; wDirty=true;
        differe('w:'+w.id,()=>quandNomme(w,()=>
          apres(sb.rpc('teaching_rename',{p_id:w.id,p_text:w.t})))); }
      else { const z=visOf(p[1]); if(!z)return; z.t=v; wDirty=true;
        differe('v:'+z.id,()=>quandNomme(z,()=>
          apres(sb.rpc('vision_rename',{p_id:z.id,p_text:z.t})))); }
      return;
    }
    /* Le rythme écrit dans sa langue : on devine à la frappe, sans réseau. */
    if(t.dataset.fqin && pk){
      pk.txt=t.value;
      const g=(typeof deduceFreq==='function')?deduceFreq(t.value):null;
      const av=pk.devine; pk.devine = (g&&FREQ_BY_ID[g])?g:null;
      if(av!==pk.devine){ const cur=t.selectionStart; renderZone();
        const n=$('habits').querySelector('[data-fqin]');
        if(n){n.focus(); try{n.setSelectionRange(cur,cur);}catch(_){}} }
    }
  });
  box.addEventListener('change',e=>{
    if(e.target.dataset.date){ const t=tripOf(e.target.dataset.date); if(!t)return;
      const v=e.target.value; t.target_at = v ? v+'T00:00:00Z' : null;
      apres(sb.rpc('objective_set_target',{p_obj:t.id,p_target:t.target_at}));
      wDirty=true; }
  });
  /* ⚠️ PERSONNE N'APPUIE SUR ENTRÉE DANS LE DEUXIÈME CHAMP. On tape le
     type, on colle le lien, on referme — et sans ceci les deux saisies
     partaient à la poubelle. `focusout` remonte (contrairement à
     `blur`), donc un seul écouteur sur la boîte suffit. */
  box.addEventListener('focusout',e=>{
    if(e.target&&e.target.dataset&&e.target.dataset.son) ecritSon(e.target);
  });
  /* ══ ⛔ ENTRÉE ENREGISTRE. PARTOUT. · 22/09/2026 ══════════════════
     Wah : « dès que je pousse Entrée ça doit enregistrer sur mobile
     comme sur ordinateur, pas de retour de ligne dans toutes les box au
     passage. »

     ⚠️ C'EST LA CAUSE DES TROIS « IMPOSSIBLE D'AJOUTER UNE RÉPULSION ».
     Le titre d'une boîte est un `contenteditable` : **Entrée y insérait
     un saut de ligne**, et il n'y avait AUCUN cas pour `data-edit` dans
     ce gestionnaire. On tapait le nom d'une répulsion, on appuyait sur
     Entrée, la boîte gagnait un `\n` invisible et rien ne partait — dans
     la vue répulsions, depuis une habitude, et depuis une leçon. Trois
     symptômes, un seul geste.

     ⚠️ ET `keydown` NE SUFFIT PAS AU TÉLÉPHONE. Beaucoup de claviers
     virtuels (Android surtout) n'envoient PAS de `keydown` exploitable :
     ils envoient `keyCode 229` pendant la composition, ou rien du tout,
     et le saut de ligne arrive quand même par `beforeinput`. C'est
     précisément pour ça que « ça marche sur ordinateur et pas sur
     mobile ». On écoute donc les DEUX :
       · `keydown`     — le chemin de l'ordinateur et d'iOS
       · `beforeinput` — `insertLineBreak` / `insertParagraph`, le seul
                         signal fiable sur un clavier virtuel
     Le second est le filet : même si le premier ne part jamais, aucun
     retour à la ligne n'entre dans une boîte.

     ⚠️ ET ON NE VOLE JAMAIS UNE COMPOSITION. `e.isComposing` veut dire
     que le clavier propose encore un mot (accents, prédiction, langues
     à IME) : cette Entrée-là VALIDE LE MOT, elle ne valide pas la
     boîte. La confondre casserait la saisie de tout l'Est asiatique. */
  const valide = t => {
    if(!t || !t.dataset) return false;
    /* ⚠️ LE LIEU PART AU SERVEUR AVEC LE TEXTE QUE LE SERVEUR CONNAÎT
       (`srv`), jamais avec ce qu'on est en train de taper dans le titre. */
    if(t.dataset.spot!==undefined){
      const x=habOf(t.dataset.spot); if(!x)return true;
      const v=t.value.trim(), k=srv(x); if(!k)return true;
      if(v)SPOT[k]=v; else delete SPOT[k];
      apres(sb.rpc('habit_spot_set',{p_habit:k,p_place:v}));
      pk=null; renderZone(); return true; }
    /* ⚠️ ENTRÉE NE REFERME PAS LE CHOIX ICI. Sur le lieu, Entrée veut
       dire « c'est posé, referme » — un seul champ. Le son en a DEUX :
       refermer après le premier obligerait à rouvrir pour coller le
       lien. On enregistre et on laisse ouvert. */
    if(t.dataset.son){ ecritSon(t); return true; }
    if(t.dataset.nw){
      const v=t.value.trim();
      /* Un champ vide n'est pas une erreur : on referme, c'est tout. */
      if(!v){ pk=null; renderZone(); return true; }
      const q=t.dataset.nw.split(':'); neufEtAttache(q[0],q[1],v); return true; }
    if(t.dataset.fqin){
      if(pk&&pk.devine){ const x=habOf(pk.id); if(x){x.f=pk.devine;save();} pk=null; renderZone(); }
      return true; }
    /* ⚠️ LE TITRE D'UNE BOÎTE — le cas qui manquait. Entrée POUSSE
       l'écriture différée (sinon elle dort 700 ms de plus) et rend le
       clavier : au téléphone, « j'ai fini d'écrire » et « referme le
       clavier » sont le même geste. La boîte reste ouverte — on vient
       peut-être y attacher quelque chose. */
    if(t.dataset.edit){
      /* `data-edit` vaut déjà `genre:identifiant` — c'est EXACTEMENT la
         clé de minuterie posée par le gestionnaire de saisie. Les deux
         ne peuvent pas diverger parce qu'elles sont la même chaîne. */
      pousse(t.dataset.edit);
      if(t.blur)t.blur();
      return true; }
    return false;
  };

  box.addEventListener('keydown',e=>{
    if(e.key!=='Enter' || e.isComposing || e.keyCode===229) return;
    if(valide(e.target)) e.preventDefault();
  });
  /* Le filet du téléphone. `insertLineBreak` arrive même quand aucun
     `keydown` exploitable n'est parti. */
  box.addEventListener('beforeinput',e=>{
    if(e.inputType!=='insertLineBreak' && e.inputType!=='insertParagraph') return;
    e.preventDefault();          /* aucun retour à la ligne, jamais */
    valide(e.target);
  });
}

/* ══ ÉCRIRE LE SON · 20/09/2026 ══════════════════════════════════════
   ⚠️ LES DEUX CHAMPS PARTENT ENSEMBLE. La fonction en base remplace la
   ligne active de l'intention : envoyer le type seul effacerait le lien
   posé trois secondes plus tôt. On relit donc les deux champs de la
   ligne au moment d'envoyer, jamais celui qu'on vient de quitter tout
   seul.
   ⚠️ ET ON REDESSINE PAS. `renderZone()` reconstruit les champs, donc
   vole le curseur au milieu d'une saisie. On met `SONS` à jour en
   mémoire et on laisse le DOM tranquille. */
function ecritSon(t){
  const i=(t.dataset.son||'').split('|')[1]; if(!i)return;
  const bloc=t.closest('.snd'); if(!bloc)return;
  const k=(bloc.querySelector('[data-son^="k|"]')||{}).value||'';
  const u=(bloc.querySelector('[data-son^="u|"]')||{}).value||'';
  const kind=k.trim(), url=u.trim();
  if(kind||url) SONS[i]={kind,url}; else delete SONS[i];
  apres(sb.rpc('intention_sound_set',
        {p_intention:i, p_kind:kind, p_url:url||null})
    .then(r=>{
      /* Une URL refusée par le serveur doit se voir : sinon on croit
         l'avoir posée et elle n'existe nulle part. */
      if(r&&r.error&&/bad_url/.test(r.error.message||'')){
        const c=bloc.querySelector('[data-son^="u|"]');
        if(c){c.classList.add('faux'); c.placeholder='needs to start with http';}
      }
    }));
}

/* SUPPRIMER — ici, et nulle part ailleurs. */
function tue(kind,id){
  if(RO)return;                      /* même raison que dans `creer` */
  if(kind==='h'){ const x=habOf(id); if(!x)return;
    /* ⚠️ ON DÉTRUIT AVEC LE TEXTE DU SERVEUR. Avec le texte affiché, une
       habitude renommée puis supprimée laissait ses liens en base — et
       `my_trips` la faisait REVENIR au rechargement suivant. C'était ça,
       « les suppressions ne fonctionnent pas ». Et on annule d'abord la
       minuterie de renommage : sinon elle ressuscite le lien après. */
    const k=srv(x);
    pousse('h:'+x.id); wSlots.delete('h:'+x.id);
    logTotehmEvent('habit_removed',x.t,{f:x.f,i:x.i});
    state.habits=state.habits.filter(z=>String(z.id)!==String(id));
    REPS.forEach(r=>{const i=(r.hs||[]).indexOf(k);
      if(i>=0){r.hs.splice(i,1); if(me)apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:k}));}});
    if(k&&OBJ[k]){OBJ[k].forEach(o=>apres(sb.rpc('objective_unlink',{p_obj:o,p_habit:k})));
      delete OBJ[k];}
    save(); }
  else if(kind==='t'){ pousse('t:'+id); wSlots.delete('t:'+id);
    TRIPS=TRIPS.filter(t=>String(t.id)!==String(id));
    (state.habits||[]).forEach(x=>{ const k=srv(x); if(k&&OBJ[k]){
      OBJ[k]=OBJ[k].filter(o=>o!==String(id)); posePremier(x);} });
    if(!estProvisoire(id))apres(sb.rpc('objective_close',{p_obj:id,p_outcome:'dropped'})); }
  else if(kind==='r'){ pousse('r:'+id); wSlots.delete('r:'+id);
    REPS=REPS.filter(z=>String(z.id)!==String(id));
    if(!estProvisoire(id))apres(sb.rpc('repulsion_retire',{p_id:Number(id)})); }
  else if(kind==='w'){ pousse('w:'+id); wSlots.delete('w:'+id);
    TEACH=TEACH.filter(z=>String(z.id)!==String(id));
    /* Une leçon supprimée ne doit pas rester accrochée aux répulsions
       qu'elle éclairait : la table de liens tombe avec la ligne côté
       serveur, on fait la même chose en mémoire. */
    REPS.forEach(r=>{r.ws=(r.ws||[]).filter(z=>z!==String(id));});
    if(!estProvisoire(id))apres(sb.rpc('teaching_delete',{p_id:String(id)})); }
  else if(kind==='v'){ pousse('v:'+id); wSlots.delete('v:'+id);
    VIS=VIS.filter(z=>String(z.id)!==String(id));
    TRIPS.forEach(t=>{t.vs=(t.vs||[]).filter(z=>z!==String(id));});
    if(!estProvisoire(id))apres(sb.rpc('vision_delete',{p_id:String(id)})); }
  wDirty=true; fermer();
}

/* ══ LE CLASSEMENT PAR IMPORTANCE ════════════════════════════════════
   Un seul chemin pour le doigt et la souris — Pointer Events. On coupe le
   natif (`touch-action:none` en CSS) parce que le geste porte une fonction
   produit : sans ça le navigateur avale le glissement vertical et le
   classement se perd une fois sur deux.
   L'ordre n'est pas cosmétique. Il descend jusqu'au bot, et jusqu'à la
   carte : `places_matching_habits` départage deux lieux à classement égal
   par `matched_rank`, c'est-à-dire par CET ordre-là. */
/* FIRST, LAST, INVERT, PLAY — les quatre temps d'un déplacement qui
   ressemble à un déplacement. Sans lui, la liste se retrouve rangée mais
   personne n'a vu la carte bouger. */
function glisse(redessine){
  const box=$('habits'); if(!box){redessine();return;}
  const avant=new Map();
  box.querySelectorAll('.habit[data-row]').forEach(el=>
    avant.set(el.dataset.row, el.getBoundingClientRect().top));
  redessine();
  const bouge=[];
  box.querySelectorAll('.habit[data-row]').forEach(el=>{
    const y0=avant.get(el.dataset.row); if(y0==null)return;
    const d=y0-el.getBoundingClientRect().top;
    if(Math.abs(d)<1)return;
    el.style.transition='none'; el.style.transform='translateY('+d+'px)';
    bouge.push(el);
  });
  if(!bouge.length)return;
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    bouge.forEach(el=>{
      el.style.transition='transform .34s cubic-bezier(.22,.61,.36,1)';
      el.style.transform='';
      /* On nettoie : un style en ligne oublié reprendrait la main sur le
         rendu suivant, et la carte resterait figée. */
      setTimeout(()=>{el.style.transition='';el.style.transform='';},380);
    });
  });});
}
const listeDe=v=>v==='habits'?(state.habits||[]):v==='objectives'?TRIPS
  :v==='repulsions'?REPS:v==='wisdom'?TEACH:VIS;
function poseListe(v,arr){
  if(v==='habits'){state.habits=arr;state.ord=true;save();}
  else if(v==='objectives')TRIPS=arr;
  else if(v==='repulsions')REPS=arr;
  else if(v==='wisdom')TEACH=arr; else VIS=arr;}

if($('ordbtn'))$('ordbtn').addEventListener('click',()=>{
  ordering=!ordering;
  /* Classer et écrire sont deux gestes : une boîte ouverte au milieu d'un
     classement n'a pas de rang. */
  if(ordering&&open)open=null;
  renderZone();});

/* ══ CLASSER, C'EST UN CLIC · 09/09/2026 ════════════════════════════
   ⚠️ LE GLISSEMENT EST SUPPRIMÉ. Il a eu droit à deux tentatives — la
   saisie immédiate, puis l'appui long avec défilement aux bords — et il
   ne marchait toujours pas au doigt. Un classement qui rate une fois sur
   deux est PIRE que pas de classement : on ne sait plus si on a bougé
   quelque chose, donc on recommence, donc on casse son propre ordre.

   Deux flèches encadrent le rang, et c'est tout. Un clic, un cran. Ça
   marche au doigt, à la souris et au clavier ; rien à viser, rien à
   tenir, rien à attendre. Et comme plus aucun geste n'est capturé, on
   peut ouvrir et éditer une boîte EN MODE CLASSEMENT — les deux modes ne
   s'excluent plus.

   `glisse()` (FLIP) reste : le mouvement doit se VOIR, sinon un clic sur
   une flèche ne se distingue pas d'un rafraîchissement. */
function bouge(sens,id){
  const arr=listeDe(view).slice();
  const i=arr.findIndex(o=>String(o.id)===String(id));
  if(i<0)return;
  const j = sens==='up' ? i-1 : i+1;
  if(j<0||j>=arr.length)return;
  const m=arr[i]; arr[i]=arr[j]; arr[j]=m;
  poseListe(view,arr);
  glisse(renderZone);
}
/* Poser une ligne À une position, pas d'un cran : c'est ce que fait le
   glissement du chiffre. Une seule fonction pour les deux gestes. */
function place(id,cible){
  const arr=listeDe(view).slice();
  const i=arr.findIndex(o=>String(o.id)===String(id));
  const j=arr.findIndex(o=>String(o.id)===String(cible));
  if(i<0||j<0||i===j)return false;
  const m=arr.splice(i,1)[0]; arr.splice(j,0,m);
  poseListe(view,arr); return true;
}

/* ══ LE CHIFFRE SE SAISIT ET GLISSE LE LONG DU RAIL · 13/09/2026 ══════
   Les deux chevrons montent d'un cran : juste, et long dès qu'il faut
   remonter une habitude de dix places. Le NOMBRE est l'accroche — le
   rail est sa piste.

   ⚠️ POURQUOI L'ACCROCHE EST UN POINT ET PAS LA BOÎTE. Un appui long sur
   la boîte entière confisque le doigt : plus moyen de défiler ni
   d'ouvrir sans se battre avec le mode. En n'armant QUE le chiffre —
   trente pixels dans le rail, loin du texte — tout le reste de l'écran
   garde son comportement normal. On classe et on écrit dans le même
   mode, sans jamais choisir.

   `touch-action:none` est posé sur le CHIFFRE seul (CSS) : le natif est
   coupé là où le geste porte une fonction produit, et nulle part
   ailleurs. */
(function(){
  const box=$('habits'); if(!box)return;
  const BORD=68, VMAX=16;
  let id=null, ligneEl=null, cible=null, y0=0, yNow=0, raf=null, pid=null;

  const rowAt=y=>{
    const el=document.elementFromPoint(
      (ligneEl?ligneEl.getBoundingClientRect().left:0)+24, y);
    return el&&el.closest?el.closest('.habit[data-row]'):null;
  };
  function suit(){
    if(!ligneEl)return;
    ligneEl.style.transform='translateY('+(yNow-y0)+'px)';
    const over=rowAt(yNow);
    if(cible&&cible!==over)cible.classList.remove('rk-to');
    cible = (over&&over!==ligneEl) ? over : null;
    if(cible)cible.classList.add('rk-to');
  }
  /* La liste défile sous la ligne qu'on tient : sans ça, emmener une
     habitude du bas vers le haut reste impossible sur un téléphone. */
  function roule(){
    raf=null; if(!ligneEl)return;
    const sc=$('fv-inner');
    if(sc){ const r=sc.getBoundingClientRect(); let v=0;
      if(yNow<r.top+BORD)        v=-VMAX*Math.min(1,(r.top+BORD-yNow)/BORD);
      else if(yNow>r.bottom-BORD)v= VMAX*Math.min(1,(yNow-(r.bottom-BORD))/BORD);
      if(v){ sc.scrollTop+=v; suit(); } }
    raf=requestAnimationFrame(roule);
  }
  function lache(){
    if(raf){cancelAnimationFrame(raf);raf=null;}
    if(!ligneEl)return;
    const vise=cible?cible.dataset.row:null;

/* [Get Higher with my Totehm] est un <a> vers totehm.com. Il n'y a plus
   d'écouteur, plus de classe `liftoff`, plus d'overlay #stoner : la méthode
   Stoner a son domaine, ce fichier n'a pas à l'héberger. */

function scrollEdges(){
  const sc=$('fv-inner');
  return {top:sc.scrollTop<=1, bottom:sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1};
}
/* ══ ARRIVER AU BOUT NE FAIT RIEN · 17/09/2026 ══════════════════════
   ⚠️ C'EST LA CORRECTION DE « je change de vue à mon insu ».

   Descendre au bout de la liste, c'est ce qu'on fait pour atteindre
   [+ Add a …]. Le geste normal et le geste de navigation étaient donc le
   MÊME GESTE, à l'élan près. Monter le seuil n'y change rien : on se
   trompe juste un peu plus fort.

   Ce compteur note QUAND la liste a touché son bord. Tout ce qui arrive
   dans les 420 ms suivantes appartient au geste qui nous a amenés là :
   ça défile, ça ne navigue pas. Il faut s'arrêter, puis repartir.
   Deux gestes au lieu d'un geste plus long. */
const REPOS=420;
let bordDepuis=0, bordQuel='';
(function(){
  const sc=$('fv-inner'); if(!sc)return;
  sc.addEventListener('scroll',()=>{
    const b=scrollEdges();
    const q = b.bottom?'b' : b.top?'h' : '';
    if(q!==bordQuel){ bordQuel=q; bordDepuis = q?Date.now():0; }
  },{passive:true});
})();
/* Vrai seulement si la liste est au bord DEPUIS assez longtemps pour que
   l'élan qui l'y a menée soit retombé. Une liste qui tient dans l'écran
   n'a pas d'élan : elle est au repos par construction. */
function bordCalme(sens){
  const b=scrollEdges();
  if(!(sens==='b'?b.bottom:b.top))return false;
  const sc=$('fv-inner');
  if(sc.scrollHeight<=sc.clientHeight+2)return true;
  return bordDepuis>0 && (Date.now()-bordDepuis)>REPOS;
}
/* Molette désactivée pour la navigation : évite les débats inversion naturelle/classique.
   La nav se fait par : (1) tap sur le wordmark / #sn-home  (2) swipe. */
let y0=0,axis=null,t0el=null,x0=0,bordAuDepart={h:false,b:false};
/* ⚠️ ON NOTE SI LE DOIGT A COMMENCÉ AU BORD. Un doigt qui part du milieu
   de la liste et finit au bord est en train de DÉFILER ; il ne navigue
   pas, même s'il termine sa course en butée. */
window.addEventListener('touchstart',(e)=>{x0=e.changedTouches[0].screenX;y0=e.changedTouches[0].screenY;

  bordAuDepart = {h:bordCalme('h'), b:bordCalme('b')};},{passive:true});
window.addEventListener('touchmove',(e)=>{if(axis)return;const dx=e.changedTouches[0].screenX-x0,dy=e.changedTouches[0].screenY-y0;if(Math.abs(dx)>8||Math.abs(dy)>8)axis=Math.abs(dx)>Math.abs(dy)?'h':'v';},{passive:true});
window.addEventListener('touchend',(e)=>{
  if(fpOpen())return;
  /* On ne bloque QUE ce qui capture vraiment le geste : les fenêtres
     modales, les champs de saisie, et les vrais contrôles interactifs
     (input/textarea/select). `button` avait été mis là pour blinder,
     mais toute la vue courante est faite de boutons — la ligne d'unité,
     le T, la croix. Il barrait le balayage horizontal sur mobile
     partout où il y avait quelque chose à lire. Résultat : le swipe
     latéral vers Objectives / Repulsions ne partait presque jamais.
     Le T (h-T), la croix (h-x) et les tiroirs (v-meta) sont exclus par
     leur propre onclick — pas besoin d'un guard global. */
  /* `[contenteditable]` : le nom d'une boîte ouverte s'écrit dedans, pas
     dans un <input>. Sans lui, un doigt qui glisse en corrigeant un mot
     partait changer de vue. */
  /* ⚠️ `#joy` EN TÊTE DE LISTE · 22/09 ter — ET C'EST LA CAUSE DE
     « quand je vais à gauche ça reste dans HABIT ».
     Le manche de la manette et ce balayage lisaient LE MÊME GESTE, et
     ils ne le lisent pas dans le même sens :
       · la manette suit le DOIGT   — tirer à gauche = aller à gauche ;
       · le balayage suit le CONTENU — glisser à gauche montre ce qui
         est à DROITE (règle du 15/09, et elle est juste).
     Au-delà de 32 px de traction, les deux partaient. Depuis les
     habitudes : la manette allait sur la sagesse, puis le balayage
     lisait « à droite » et la sagesse renvoie sur les habitudes. **On
     revenait à son point de départ**, exactement ce que Wah décrit — et
     symétriquement à droite, par la vision.
     Un geste né sur un contrôle appartient à ce contrôle. */
  if(t0el&&t0el.closest&&t0el.closest('#joy,#freq-panel,#habit-peek,#filter-modal,#member-window,input,textarea,select,[contenteditable]'))return;
  const _ae=document.activeElement;
  if(_ae&&(_ae.tagName==='TEXTAREA'||_ae.tagName==='INPUT'))return;
  if(document.body.classList.contains('gate'))return;   /* l'atterrissage défile librement */
  /* ══ LE BALAYAGE MARCHE DANS LES TROIS VUES · 07/09/2026 ═════════════
     Ici vivait `if(hOpen())return;`. `hOpen()` veut dire « la vue n'est
     pas habitudes » — une garde d'AVANT les trois vues, quand quitter les
     habitudes voulait dire ouvrir un autre fichier. Résultat mesuré : on
     ne pouvait balayer QUE depuis les habitudes ; arrivé sur objectifs ou
     répulsions, le doigt ne répondait plus et il fallait viser un carré
     de 17 px.
     Ce qu'il faut vraiment bloquer, c'est une BOÎTE OUVERTE — et c'est
     déjà `setView` qui s'en charge : une vue qui bouge sous les doigts

  const dy=e.changedTouches[0].screenY-y0;const TH=32;

    if(Math.abs(dx)<TH)return;

       est à droite. L'axe horizontal est le TEMPS — sagesse, habitudes,
       vision. On ne change pas de fichier, on ne recharge rien. */
    versVoisin(dx<0?'d':'g');
    return;
  }
  /* ══ LE VERTICAL SE PREND AU BOUT DE LA LISTE · 16/09/2026 ═════════
     ⚠️ CE N'EST PAS UN BALAYAGE LIBRE, ET C'EST TOUTE LA DIFFÉRENCE.
     Un geste vertical libre entrerait en concurrence avec le défilement
     de la liste — c'est exactement ce qui avait « buggé le filtre » et
     fait retirer le vertical la première fois.
     Ici il ne se déclenche QUE lorsque la liste ne peut plus défiler :
     arrivé en bas, continuer vers le bas descend sur les répulsions ;
     en haut, tirer vers le bas remonte sur les objectifs. C'est le
     geste d'un OS — on tombe dans l'écran suivant, on ne le vise pas. */
  /* 110 px, et le doigt devait DÉJÀ être au bord quand il s'est posé.
     Trois conditions au lieu d'une : la liste en butée, la butée
     ancienne, et une traction franche. */
  if(Math.abs(dy)<110)return;
  if(dy<0 && bordAuDepart.b && bordCalme('b'))      versVoisin('b');
  else if(dy>0 && bordAuDepart.h && bordCalme('h')) versVoisin('h');
},{passive:true});
/* ══ LE TRACKPAD FAIT CE QUE FAIT LE POUCE · 09/09/2026 ══════════════
   La molette VERTICALE ne pilote toujours rien — c'est la règle qui a
   réglé « le filtre manque de fluidité », et elle tient. Mais un trackpad
   glisse aussi HORIZONTALEMENT, et ce geste-là n'est en concurrence avec
   rien : la liste ne défile pas en X.
   Deux verrous pour ne pas déclencher sur un scroll un peu oblique :
   l'horizontale doit dominer nettement (1,6×), et il faut ACCUMULER
   jusqu'à un seuil — un trackpad envoie trente petits événements pour un
   seul geste, et sans accumulateur on traverserait les trois vues d'un
   coup. Le compteur se vide après 220 ms d'immobilité : deux gestes
   séparés ne s'additionnent pas. */
(function(){
  let acc=0, t=0, accV=0, tV=0, froid=0, neuf=false;
  /* ══ LE VERTICAL À LA MOLETTE, AU BORD SEULEMENT · 16/09/2026 ═══════
     Même règle qu'au doigt : tant que la liste peut défiler, la molette
     la fait défiler et rien d'autre. Au bord, et au bord seulement, elle
     fait passer à la vue d'à côté.
     `froid` est un délai de garde : une molette à inertie envoie des
     événements pendant une seconde après le geste, et sans lui on
     traverserait deux vues d'un coup. */
  addEventListener('wheel',e=>{
    if(document.body.classList.contains('gate'))return;
    /* Même raison qu'au doigt : le pavé a sa propre molette. */
    if(e.target&&e.target.closest&&e.target.closest('#joy'))return;
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)*1.6){
      if(navBlocked())return;
      if(Date.now()<froid){accV=0;return;}
      const versLeBas=e.deltaY>0;
      /* ⚠️ `bordCalme` ET PAS `scrollEdges` : il faut que la liste soit
         en butée depuis un instant, pas seulement à l'instant même. */
      /* ⚠️ L'HORLOGE SE MET À JOUR À CHAQUE ÉVÉNEMENT, AVANT TOUT TEST.
         Je ne la touchais qu'APRÈS le contrôle du bord : tant qu'on
         défilait au milieu, `tV` restait figé, et au moment où la liste
         arrivait en butée l'écart calculé valait toute la durée du
         défilement — donc « nouveau geste », donc navigation. C'était le
         bug, dans le correctif du bug. Un compteur de silence qui ne
         compte que quand on l'écoute ne mesure rien. */
      const nowV=Date.now(); const ecart=nowV-tV; tV=nowV;
      if(!bordCalme(versLeBas?'b':'h')){accV=0;neuf=false;return;}
      /* ⚠️ ET SURTOUT : IL FAUT QUE LA MOLETTE SE SOIT ARRÊTÉE.
         Un trackpad à inertie envoie des événements pendant une seconde
         et demie après que le doigt a quitté la surface — bien au-delà
         de n'importe quel délai de garde. Tant qu'on lit la SOMME, une
         lancée un peu franche finit toujours par dépasser le seuil.
         Ce qui distingue un geste d'un autre, ce n'est pas la force :
         c'est le TROU. Des événements d'inertie arrivent toutes les 16
         ms ; un trou de 200 ms veut dire que la main est repartie.
         C'est la seule mesure qui sépare « je descends ma liste » de
         « je veux la vue d'à côté ». */
      if(ecart>200){ accV=0; neuf=true; }
      if(!neuf)return;
      accV+=e.deltaY;
      /* 260 px accumulés : une traction délibérée, pas une fin de course. */
      if(Math.abs(accV)<260)return;
      const cible=versLeBas?'b':'h';
      accV=0; neuf=false; froid=Date.now()+900;
      versVoisin(cible);
      return;
    }
    if(Math.abs(e.deltaX) < Math.abs(e.deltaY)*1.6) return;
    const now=Date.now(); if(now-t>220)acc=0; t=now;
    acc+=e.deltaX;
    /* 70 px partait sur un défilement un peu oblique. 130 : il faut
       vouloir aller à côté. */
    if(Math.abs(acc)<130)return;
    /* ⚠️ LE SENS ÉTAIT INVERSÉ · 15/09/2026. Sur un trackpad, un
       `deltaX` POSITIF veut dire « je pousse le contenu vers la
       gauche », donc « montre-moi ce qui est à DROITE ». J'avais lu le
       delta comme un déplacement de doigt et non comme un déplacement
       de contenu — c'est l'erreur classique, et elle se voit tout de
       suite quand on l'a dans les mains.
       Le balayage tactile, lui, était déjà dans le bon sens : il lit un
       déplacement de DOIGT. Les deux gestes ne se lisent pas pareil. */
    const d = acc>0 ? 'g' : 'd';
    acc=0;
    versVoisin(d);
  },{passive:true});
})();
/* La molette VERTICALE ne pilote rien : la liste défile normalement. Le
   filtre passe par le T, le repli par la croix. */

/* Chevrons latéraux : mêmes cibles que le swipe horizontal.
   Ils passent sous Book et Next (z-index) : on ouvre par eux, on referme par
   le T de la page ouverte, les flèches du clavier ou Échap. */
function navBlocked(){
  return busy||fpOpen()
    ||$('member-window').classList.contains('show')
    ||false
    ||!$('habit-peek').classList.contains('hide')
    ||!$('filter-modal').classList.contains('hide');
}
/* `navLeft`/`navRight` restent : ce sont le balayage et les flèches du
   clavier, pas les carrés. Un carré ne se lit pas comme « précédent » —
   il désigne une couche, et on y va directement. */
const navLeft =()=>{ if(navBlocked())return; versVoisin('g'); };
const navRight=()=>{ if(navBlocked())return; versVoisin('d'); };

/* ══ LA MANETTE — ON TIRE LE MANCHE · 22/09/2026 ════════════════════
   « C'est un joystick : les scroll doivent aussi fonctionner DANS la
   partie curseur. Il y a les flèches, le joystick intérieur (ce que tu
   dois rajouter) et enfin ce que l'on a déjà et qui est bien. »

   Trois moyens, donc, et ils mènent tous à `versVoisin` — la table
   `CROIX`, une seule, comme le doigt et le clavier. Une deuxième table
   finirait par dire autre chose (déjà vu le 19/09 avec `AXE`).

   1. LES CHEVRONS  — ils existent, ils ne bougent pas.
   2. LE MANCHE     — on l'attrape et on le tire. Il suit le doigt, borné
                      à un rayon ; au relâcher, s'il a dépassé le seuil
                      dans une direction OÙ L'ON PEUT ALLER, on y va ;
                      sinon il revient au centre. C'est le geste d'une
                      vraie manette : on sent la butée, on voit la
                      destination s'allumer avant de lâcher.
   3. LA MOLETTE     — sur le pavé, elle navigue directement, sans la
                      condition « au bord de la liste ». Cette condition
                      existe parce que sur la LISTE le geste de
                      navigation et le geste de défilement sont le même
                      (règle du 17/09) ; sur le pavé il n'y a rien à
                      faire défiler, donc rien à départager.

   ⚠️ POINTER EVENTS, ET `touch-action:none` SUR LE SOCLE. Règle du
   projet : dès qu'un geste porte une fonction produit, on coupe le
   natif et on conduit à la main, avec le MÊME code pour le doigt et la
   souris. Sans `touch-action:none`, le navigateur avale le glissement
   avant nous et on ne reçoit qu'un `pointercancel`. */
(function manette(){
  const jy=$('joy'), bx=$('joy-box'), st=$('joy-stack');
  if(!jy||!bx||!st) return;          /* absent des jumeaux : on sort */

  const RAYON=15;                    /* jusqu'où le manche se laisse tirer */
  const SEUIL=9;                     /* au-delà, on part                   */
  let id=null, x0=0, y0=0, dx=0, dy=0;

  const pose=(a,b)=>{ st.style.setProperty('--mx',a.toFixed(1)+'px');
                      st.style.setProperty('--my',b.toFixed(1)+'px'); };
  /* ⚠️ `#joy` est repeint à chaque rendu par `jy.className='sink-el v-'+view` :
     on ne peut donc pas poser l'état du geste dans `className`. On
     ajoute et on retire, jamais on n'écrase. */
  const vise=v=>{ ['g','d','h','b'].forEach(k=>jy.classList.toggle('vers-'+k, k===v)); };
  const centre=()=>{ pose(0,0); jy.classList.remove('tenu');
                     bx.classList.remove('tenu'); vise(null); };

  /* La direction que le geste désigne — et seulement si elle MÈNE
     quelque part. Tirer vers la sagesse depuis la sagesse ne doit ni
     allumer, ni naviguer. */
  const sens=()=>{
    if(Math.max(Math.abs(dx),Math.abs(dy))<SEUIL) return null;
    const d = Math.abs(dx)>Math.abs(dy) ? (dx<0?'g':'d') : (dy<0?'h':'b');
    return voisin(d) ? d : null;
  };

  bx.addEventListener('pointerdown',e=>{
    if(navBlocked())return;
    id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=dy=0;
    jy.classList.add('tenu'); bx.classList.add('tenu');
    try{ bx.setPointerCapture(id); }catch(_){}
  });

  bx.addEventListener('pointermove',e=>{
    if(id===null||e.pointerId!==id)return;
    /* Borné au rayon : un manche ne sort pas de son socle. */
    const ax=e.clientX-x0, ay=e.clientY-y0;
    const d=Math.hypot(ax,ay), k=d>RAYON ? RAYON/d : 1;
    dx=ax*k; dy=ay*k; pose(dx,dy);
    vise(sens());
  });

  const lache=e=>{
    if(id===null||(e&&e.pointerId!==id))return;
    const v=sens();
    try{ bx.releasePointerCapture(id); }catch(_){}
    id=null; centre();
    if(v) versVoisin(v);
  };
  bx.addEventListener('pointerup',lache);
  bx.addEventListener('pointercancel',()=>{ id=null; centre(); });

  /* ⚠️ LA MOLETTE SUR LE PAVÉ NE PASSE PAS PAR `bordCalme`. Sur la
     liste, il faut distinguer « je défile » de « je change de vue » —
     c'est le même geste. Ici il n'y a pas de liste : le seul sens
     possible d'une molette sur une manette, c'est de la bouger.
     Un délai de garde suffit à ne pas traverser deux vues d'un coup. */
  let froid=0;
  jy.addEventListener('wheel',e=>{
    if(navBlocked())return;
    if(Date.now()<froid)return;
    const d = Math.abs(e.deltaX)>Math.abs(e.deltaY)
      ? (e.deltaX>0?'d':'g')          /* trackpad : contenu, pas doigt */
      : (e.deltaY>0?'b':'h');
    if(!voisin(d))return;
    froid=Date.now()+520;
    versVoisin(d);
  },{passive:true});
})();

/* Deux besoins, deux fonctions. La météo se contente d'une position d'hier ;

   ancienne (`totehm_map_pos_v1`, écrite sans horodatage par une version

const POS_TTL=15*60*1000;
function cachedPos(){
  for(const k of ['totehm_geo_v2','totehm_map_pos_v1']){
    try{
      const c=JSON.parse(localStorage.getItem(k)||'null');
      if(c&&isFinite(c.lat)&&isFinite(c.lng))return c;
    }catch(e){}
  }
  return null;
}
function freshPos(){
  try{
    const c=JSON.parse(localStorage.getItem('totehm_geo_v2')||'null');
    if(c&&isFinite(c.lat)&&isFinite(c.lng)&&c.t&&Date.now()-c.t<POS_TTL)return c;
  }catch(e){}

}

   monde, la page comprise. Le navigateur répond alors :

     code 1 — « Geolocation has been disabled in this document by
                permissions policy. »

   …instantanément, sans jamais montrer de prompt. Et `permissions.query`
   répond quand même « granted » : rien dans l'API ne dit que c'est la
   plateforme qui a tranché. AUCUN JavaScript ne peut revenir dessus.
   Cinq lots de correctifs ont été écrits dans la mauvaise couche.

   Corrigé dans `space/vercel.json` : `geolocation=(self)`.
   Ce diagnostic reste pour que la prochaine régression se lise en une
   seconde au lieu de cinq vagues. */
function geoDiag(e){
  if(!e||e.code!==1)return;
  if(!/permissions policy|feature policy|disabled in this document/i.test(e.message||''))return;
  console.warn('[totehm] La géolocalisation est coupée par un EN-TÊTE, pas par '
    +'l\'utilisateur. Vérifier space/vercel.json : Permissions-Policy doit dire '
    +'geolocation=(self), jamais geolocation=(). Message du navigateur : '+e.message);
}
function storePos(pos){
  const p={lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5),
           acc:Math.round(pos.coords.accuracy||0),t:Date.now()};
  try{localStorage.setItem('totehm_geo_v2',JSON.stringify(p));}catch(e){}
  return p;
}

const INT_DOT = i => '<span class="sr-dot" style="background:'+intColor(i)+'"></span>';

async function runSearch(q, noteEl){
  noteEl.classList.remove('hide');

    return;

    noteEl.className='note dim';

       personne ne l'a partagé. Jamais « privé » par défaut. */
    noteEl.textContent='no shared Totehm by that name';

      '<button class="sr-row" type="button" data-pseudo="'+esc(r.pseudo)+'">'

    +   '<span class="sr-ints">'

  }else{

/* ══ TOTEHMBOT ══════════════════════════════════════════════════════
   Le membre pose un spot depuis Telegram : /spot, sept boutons, une
   position native. Aucun geocodage, donc aucune API payante.

   La liaison passe par un code a usage unique, valable 10 minutes, cree
   par new_bot_link_code() et lu par bot-reply au /start. Le compte n'est
   JAMAIS transmis par le message : le bot le retrouve en base.

   telegram_id n'est ni lisible ni ecrivable par le membre (GRANT par
   colonne) — sans quoi n'importe qui pouvait s'attribuer le Telegram
   d'un autre et recevoir ses questions a sa place. D'ou bot_linked(),
   qui ne rend qu'un booleen sur SA ligne. */

async function paintTelegram(sub){
  const box=$('tg-block'); if(!box) return;
  const live = sub && ['active','trialing','past_due'].includes(sub.status);
  /* Pas d'abonnement = /spot repondrait « reserve aux membres du Club ».
     On ne montre pas une porte qui se ferme. */
  box.classList.toggle('hide', !(me && live));
  if(!(me && live)) return;
  /* `bot_state()` rend TROIS choses en un appel : lié, actif, en attente.
     `bot_linked()` n'en rendait qu'une — et le membre voyait « connected »
     sur un bot qui n'avait pas le droit de parler. */
  let st=null;
  try{ const {data}=await sb.rpc('bot_state'); st=data||null; }catch(_){ st=null; }
  tgLinked=!!(st&&st.linked);
  botOn=!!(st&&st.on);
  const b=$('tg-btn'), n=$('tg-note');
  b.classList.toggle('claimed', tgLinked);
  b.textContent = tgLinked ? 'TotehmBot connected' : 'Connect TotehmBot';
  const t=$('tg-toggle');
  if(t){
    t.classList.toggle('hide', !tgLinked);
    t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  }
  if(n) n.textContent = !tgLinked ? ''
    : (botOn ? 'send /tonight for what is on around you · /spot to post a place'
             : 'paused — /tonight and /spot still work');
}
let botOn=false;
/* Le membre coupe et rallume depuis la page. Le bot en fait autant avec
   /pause et /reprendre : deux portes, un seul interrupteur en base. */
if($('tg-toggle')) $('tg-toggle').onclick=async()=>{
  const next=!botOn;
  const {error}=await sb.rpc('set_bot',{p_on:next});
  if(error)return;
  botOn=next;
  const t=$('tg-toggle');
  t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  const n=$('tg-note');
  if(n) n.textContent = botOn
    ? 'send /tonight for what is on around you · /spot to post a place'
    : 'paused — /tonight and /spot still work';
};

$('tg-btn').onclick=async()=>{
  const n=$('tg-note');
  if(tgLinked){ window.open('https://t.me/'+TG_BOT,'_blank','noopener'); return; }
  n.className='note dim'; n.textContent='opening telegram…';
  /* La fenetre s'ouvre AVANT l'await : ouverte apres, elle n'est plus
     rattachee au clic et Safari la bloque. On la remplit ensuite. */
  const w=window.open('','_blank');
  const {data,error}=await sb.rpc('new_bot_link_code');
  if(error||!data){
    if(w)w.close();
    n.className='note no'; n.textContent='try again in a minute';
    return;
  }
  const url='https://t.me/'+TG_BOT+'?start='+encodeURIComponent(data);
  if(w){ w.opener=null; w.location=url; } else { location.href=url; }
  n.className='note dim'; n.textContent='say /start in telegram, then come back';
  /* Le code vit 10 min. On represente l'etat au retour d'onglet. */
  setTimeout(()=>{ loadSubscription().then(paintTelegram); }, 4000);
};

/* ══════════════════════════════════════════════════════════════════════════
   LANDING GATE — déconstruction vectorielle, ET SON EXACT CONTRAIRE
   Le JS ne fait QUE mesurer (une fois) où l'UI se trouve réellement, et
   écrit le résultat dans des variables CSS. Toute l'animation est ensuite
   jouée par les transitions CSS sur transform / opacity : netteté absolue.

   LE REPLI. Le gate n'est PLUS détruit après l'entrée (`gate.remove()`) :
   il fallait pouvoir le rejouer à l'envers. Il reste dans le document,
   masqué par `body:not(.gate) #gate{display:none}` — coût : zéro repaint,
   zéro écouteur actif. `fold()` remet body.gate ET body.entered dans la
   même frame (les pièces restent donc où elles sont), force un reflow,
   puis retire `entered` : les quatre calques repartent vers le logo, l'UI
   de l'app s'efface. Aller et retour sont le même geste, à l'envers.
   ══════════════════════════════════════════════════════════════════════════ */
(()=>{
  const gate=$('gate'); if(!gate) return;
  const root=document.documentElement, body=document.body;

  /* Couples calque-du-logo -> élément d'UI d'arrivée */
  const PAIRS=[
    {v:'--tf-t',    from:'gl-t',    to:'ui-t',  uniform:true },
    {v:'--tf-wm',   from:'gl-wm',   to:'ui-wm', uniform:true },
    {v:'--tf-rail', from:'gl-rail', to:'rail',  uniform:false},
    /* Desktop seulement : sur mobile #stage n'a ni largeur ni hauteur, la
       boucle passe son tour et le calque garde son scale(60) plein écran. */
    {v:'--tf-bg',   from:'gl-bg',   to:'stage', uniform:false}
  ];

  /* Chaque calque du logo a un viewBox serré : son rectangle DOM EST le
     rectangle du dessin. Le mapping se réduit donc à un rect -> rect. */
  function measure(){
    for(const p of PAIRS){
      const a=$(p.from), b=$(p.to);
      if(!a||!b) continue;
      const f=a.getBoundingClientRect(), t=b.getBoundingClientRect();
      /* Cible sans boîte — sur mobile #stage n'a que des enfants `fixed`,
         donc une hauteur nulle. On EFFACE la variable au lieu de garder
         l'ancienne : une valeur mesurée en desktop puis rejouée en portrait
         après rotation replierait le fond sur un carré qui n'existe plus. */
      if(!f.width||!f.height||!t.width||!t.height){
        root.style.removeProperty(p.v);
        /* Et on ramène l'échelle de repli à ce qu'il FAUT pour couvrir
           l'écran. `scale(60)` sur 110 px, c'est 6 600 px de carré dans un
           conteneur qui défile : la cause du bug mobile. Il suffit de sortir
           les perforations du champ — au-delà, on ne fait que fabriquer du
           débordement. Le 1,8 est la marge qui les met dehors dans tous les
           sens, y compris quand le logo n'est pas centré verticalement. */
        if(p.v==='--tf-bg'&&f.width){
          const need=Math.ceil(Math.max(window.innerWidth,window.innerHeight)/f.width*1.8);
          root.style.setProperty('--gate-bg-scale',String(Math.max(8,Math.min(60,need))));
        }
        continue;
      }
      const dx=(t.left+t.right)/2-(f.left+f.right)/2;
      const dy=(t.top+t.bottom)/2-(f.top+f.bottom)/2;
      const sx=t.width/f.width, sy=t.height/f.height;
      const s=p.uniform
        ? 'scale('+sx.toFixed(5)+')'
        : 'scale('+sx.toFixed(5)+','+sy.toFixed(5)+')';
      root.style.setProperty(p.v,'translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) '+s);
    }
  }

  const DUR=1050, REVEAL=520;
  let open=false, moving=false, timer=null;

  /* ══ LE TÉLÉPHONE COUCHÉ REPLIE LE TOTEHM · 22/09/2026 ═════════════
     « Retourner son téléphone a la même action que appuyer sur la croix.
     Évidemment pas possible d'ouvrir le Totehm en mode paysage. »

     ⚠️ TROIS CONDITIONS, ET IL LES FAUT TOUTES. `(orientation:landscape)`
     seul est vrai sur TOUS les ordinateurs : la règle aurait interdit le
     Totehm à tout le monde sauf aux téléphones debout. On exige donc en
     plus une hauteur de téléphone couché (≤ 540 px) ET un pointeur
     GROSSIER — un doigt. Une fenêtre de navigateur écrasée sur un
     ordinateur garde sa souris, donc garde son Totehm.

     Et le verrou vit ICI, dans `enter()`, pas seulement en CSS : masquer
     le bouton n'empêche ni le clavier, ni la porte du TotehmBot, ni un
     `#in` dans l'URL d'ouvrir le Totehm à l'horizontale. */
  const PAYSAGE = window.matchMedia(
    '(orientation:landscape) and (max-height:540px) and (pointer:coarse)');
  function surRotation(){
    body.classList.toggle('paysage', PAYSAGE.matches);
    /* Coucher le téléphone = appuyer sur la croix. Exactement le même
       geste, donc exactement la même fonction. */
    if(PAYSAGE.matches && open && !moving) fold();
  }
  surRotation();
  if(PAYSAGE.addEventListener) PAYSAGE.addEventListener('change',surRotation);
  else if(PAYSAGE.addListener) PAYSAGE.addListener(surRotation);
  /* ⚠️ `matchMedia` SUFFIT RAREMENT SUR IOS. La barre d'adresse change
     la hauteur sans changer l'orientation, et l'ordre des événements
     varie d'une version à l'autre. Les trois écoutes coûtent un test de
     booléen ; `fold()` sort tout de suite si rien n'est ouvert. */
  window.addEventListener('orientationchange',surRotation);
  window.addEventListener('resize',surRotation);

  function enter(then){
    if(open||moving) return;
    if(PAYSAGE.matches) return;     /* couché, on n'ouvre pas */
    moving=true;
    gate.classList.remove('no-anim');
    gate.scrollTop=0;                /* on mesure toujours depuis le haut */
    measure();                       /* dernière mesure juste avant le départ */
    void gate.offsetWidth;           /* reflow : garantit le point de départ  */
    body.classList.add('entered');

    clearTimeout(timer);
    timer=setTimeout(()=>{
      gate.classList.add('gate-off');
      timer=setTimeout(()=>{
        body.classList.remove('gate','entered');
        open=true; moving=false;
        if(then) then();
      },340);
    },DUR+REVEAL+120);
  }

  /* ══ LE REPLI — le déploiement, exactement à l'envers ══

     L'ORDRE DES OPÉRATIONS EST LE CŒUR DU PROBLÈME, ET C'ÉTAIT LE BUG.
     `measure()` lit `getBoundingClientRect()`, qui renvoie le rectangle
     APRÈS transformation. En posant `.entered` AVANT de mesurer, on
     mesurait des calques déjà déplacés : `--tf-bg` était alors recalculé
     depuis la position d'arrivée au lieu de la position de départ, et
     l'échelle du fond se composait avec elle-même. À chaque repli le carré
     navy partait à une taille différente — le « conflit de ratio ».

     Donc : on affiche le gate AU REPOS, on mesure là, et seulement ensuite
     on pose l'état d'arrivée — sans rien animer (`no-anim`), sinon on
     verrait le saut avant de voir le retour.

     `#gate-world` et `#conn-bar` reviennent par le même chemin : ils
     n'ont pas de style inline, seulement la règle `body.gate.entered`.
     Retirer `entered` leur rend `opacity:1` et `pointer-events:auto`. */
  function fold(){
    if(!open||moving) return;
    moving=true;
    clearTimeout(timer);

    gate.classList.add('no-anim');        /* 1. rien ne bouge              */
    gate.classList.remove('gate-off');
    body.classList.add('gate','folding'); /* 2. le gate au repos, opaque,  */
                                          /*    et il NE DÉFILE PAS        */
    gate.scrollTop=0;                     /*    on mesure toujours du haut */
    void gate.offsetWidth;
    measure();                            /* 3. rect NON transformé        */
    body.classList.add('entered');        /* 4. saut à la position d'UI    */
    void gate.offsetWidth;
    gate.classList.remove('no-anim');     /* 5. transitions rendues        */
    void gate.offsetWidth;
    body.classList.remove('entered');     /* 6. et le repli part           */

    open=false;
    timer=setTimeout(()=>{
      body.classList.remove('folding');   /* le défilement redevient normal */
      moving=false;
    },DUR+120);
  }

  /* Le reste du script replie par ici. */
  foldToGate=fold;

  /* ══ LE SECOND VERROU ══
     `overflow:hidden` empêche l'utilisateur de faire défiler, PAS le
     navigateur : un `scrollTop` programmatique, une mise au point sur un
     champ ou un reste d'inertie passent quand même — mesuré, le bouton du
     bas se faisait chasser hors de l'écran. Alors pendant l'animation on
     réépingle le défilement à zéro à chaque tentative. Piloté par
     l'événement, jamais en boucle : zéro coût au repos. */
  gate.addEventListener('scroll',()=>{
    if(gate.scrollTop&&(body.classList.contains('entered')||body.classList.contains('folding')))
      gate.scrollTop=0;
  },{passive:true});

  /* État 1 (la classe est déjà posée sur <body> dans le HTML : zéro flash)

     ⚠️ SAUF QU'ON REVIENT PEUT-ÊTRE DU CLUB. `/club` et
     `/club/creator` renvoient sur `totehm.html#in` : le Totehm doit
     s'ouvrir DÉJÀ DÉPLOYÉ. Il faut le décider ICI et pas plus haut dans
     le module — c'est cette ligne qui repose la classe, et elle
     s'exécute APRÈS. Mesuré : le drapeau était retiré, puis remis deux
     lignes plus loin, et l'atterrissage reprenait l'écran. */
  /* ⚠️ UN TOTEHM QU'ON VIENT LIRE S'OUVRE DÉJÀ DÉPLIÉ · 17/09/2026.
     On arrive ici depuis un résultat de recherche, pour REGARDER celui
     de quelqu'un d'autre : il n'y a rien à déplier, et l'atterrissage
     demandait « ouvre MON Totehm » par-dessus celui qu'on venait voir.
     Mesuré : le gate gardait l'écran et interceptait tous les clics. */
  /* ⚠️ `#in:<vue>` OUVRE LE TOTEHM *SUR* UNE VUE · 19/09/2026. Le bouton
     [Complete my Totehm] du tiroir envoie là où il manque quelque chose :
     sans cette forme, il aurait fallu déplier puis naviguer, et le membre
     aurait perdu de vue ce qu'il était venu faire. */
  const m5 = /^#in(?::([a-z]+))?$/.exec(location.hash||'');
  const dedans = !!m5 || !!RO;
  if(m5 && m5[1] && typeof setView==='function'){
    setTimeout(()=>{ try{ setView(m5[1]); }catch(_){} }, 80); }
  /* ⚠️ IL FAUT LA RETIRER, PAS SEULEMENT NE PAS LA POSER. La classe est
     écrite dans le HTML (`<body class="gate">`) pour éviter le flash au
     chargement : ne pas la rajouter ici ne l'enlève pas. Mesuré —
     l'atterrissage gardait l'écran et interceptait tous les clics. */
  if(dedans){ body.classList.remove('gate');
              /* ⚠️ ON GARDE `?ro=` : il désigne le Totehm qu'on lit. Le
                 nettoyage ne vise que le `#in`, qui a fait son office. */
              history.replaceState(null,'',location.pathname+(RO?location.search:''));
    /* ⚠️ ET LA CROIX DOIT POUVOIR REPLIER · 15/09/2026. `fold()` commence
       par `if(!open||moving) return;` — `open` est l'état LOCAL de ce
       module, et il n'était jamais posé quand on arrivait déjà déplié
       depuis un jumeau. Résultat : la croix ne faisait RIEN, une fois sur
       deux, et seulement en revenant de wisdom ou de vision. Ce n'était
       pas « parfois » : c'était systématique sur ce chemin-là.
       On arrive dedans, donc le Totehm est OUVERT : on le dit. */
    open=true;
    /* ⚠️ ET SI ON ARRIVE COUCHÉ · 22/09/2026. `surRotation()` a déjà
       tourné plus haut, quand `open` valait encore false : elle n'avait
       rien à replier. On la rejoue maintenant que l'état est posé —
       sinon un `#in` ouvert en paysage restait ouvert en paysage. */
    surRotation(); }
  else { body.classList.add('gate'); }

  /* Pendant l'état 1, aucun geste ne doit atteindre l'app en dessous — mais
     l'atterrissage a ses propres champs et sa propre vidéo : un geste NÉ
     dans le gate lui appartient. Sans cette exception, la touche Entrée
     n'atteignait jamais le champ de recherche, capturée au niveau window. */
  const swallow=e=>{
    if(!body.classList.contains('gate')) return;
    const t=e.target;
    if(t&&t.closest&&t.closest('#gate,#member-window')) return;
    e.stopPropagation();
  };
  ['touchstart','touchmove','touchend','wheel','keydown'].forEach(t=>
    window.addEventListener(t,swallow,{capture:true,passive:true}));
  requestAnimationFrame(()=>requestAnimationFrame(measure));
  window.addEventListener('resize',()=>{ if(!open) measure(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!open) measure(); });

  /* ⚠️ ON NE SUPPOSE JAMAIS LE NŒUD. Ces deux boutons vivent dans
     `#gate`, et `#gate` n'existe pas dans les jumeaux (wisdom, vision) :
     un `.onclick` sur `null` lève À L'ÉVALUATION et emporte TOUT le
     module — la page s'affiche vide, sans un mot. Deux `if` coûtent
     moins cher qu'un écran blanc. */
  const ge=$('gate-enter'), ast=$('gate-asteroid');
  /* ⚠️ #gate-open A DISPARU · 24/09/2026 avec l'astéroïde. Le geste est
     unique désormais : un tap sur l'astéroïde. */
  /* ⚠️ LE DÉPLOIEMENT DOIT ÊTRE ATTEIGNABLE DE L'EXTÉRIEUR · 22/09/2026.
     `enter()` vit dans ce module et n'en sortait pas. Or la porte
     [My Higher Self] doit pouvoir DÉPLIER le Totehm sur la première vue
     vide quand le Totehm est incomplet. On expose donc UNE fonction, pas
     le module : elle ne fait rien si le Totehm est déjà ouvert, et elle
     prend la suite en argument — aucun appelant n'a à connaître la durée
     de l'animation. */
  window.__totehmDeplie = then => { if(body.classList.contains('gate')) enter(then);
                                    else if(then) then(); };
  if(ge) ge.onclick=e=>{ e.stopPropagation(); enter(); };
  /* L'astéroïde entier est cliquable — le tap fonctionne peu importe la
     face visible au moment du geste. */
  if(ast){
    ast.onclick=()=>enter();
    ast.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();} };
  }

  /* ══ MOTION SENSOR · 24/09/2026 ════════════════════════════════════
     La carte tourne toute seule (CSS keyframes), le motion sensor
     AJOUTE une inclinaison subtile (±14°) qui répond au mouvement du
     téléphone. iOS 13+ exige une permission via geste utilisateur — on
     la demande au premier tap sur l'écran, silencieusement. Refus =
     pas de tilt, la rotation CSS continue seule. Desktop : parallax
     souris comme repli. */
  const card=$('gate-card');
  if(card){
    const setTilt=(x,y)=>{
      card.style.setProperty('--tilt-x',(x||0).toFixed(1)+'deg');
      card.style.setProperty('--tilt-y',(y||0).toFixed(1)+'deg');
    };
    const clamp=(v,m)=>Math.max(-m,Math.min(m,v||0));
    const wireOrient=()=>{
      window.addEventListener('deviceorientation',e=>{
        setTilt(clamp((e.beta||0)-45,14), clamp(e.gamma||0,14));
      },{passive:true});
    };
    const askOrient=async()=>{
      if(typeof DeviceOrientationEvent!=='undefined'
         && typeof DeviceOrientationEvent.requestPermission==='function'){
        try{ const s=await DeviceOrientationEvent.requestPermission();
             if(s==='granted') wireOrient();
        }catch(_){}
      }else if('DeviceOrientationEvent' in window){ wireOrient(); }
    };
    /* Permission au premier geste — capture avant que enter() ne parte,
       même si le tap va déplier : le membre revient sur l'atterrissage
       par la croix et le tilt est déjà en place. */
    document.addEventListener('touchstart',askOrient,{once:true,passive:true});
    /* Desktop : parallax souris — un mouvement de repli quand l'appareil
       n'a pas de gyroscope. */
    if(matchMedia('(hover:hover)').matches){
      document.addEventListener('mousemove',e=>{
        const w=innerWidth,h=innerHeight;
        setTilt(clamp((e.clientY/h-.5)*-20,10), clamp((e.clientX/w-.5)*20,10));
      },{passive:true});
    }
  }

  /* ── Search a Totehm : un bouton, la boîte n'arrive qu'au clic ── */
  const gsb=$('gate-search-btn'), gsi=$('gate-search-input'), gsn=$('gate-search-note');
  if(gsb&&gsi) gsb.onclick=()=>{
    gsb.classList.add('hide');
    gsi.classList.remove('hide');
    if(gsn) gsn.classList.remove('hide');
    setTimeout(()=>{try{gsi.focus();}catch(e){}},100);
  };
  if(gsi) gsi.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ gsi.classList.add('hide'); if(gsn)gsn.classList.add('hide');
                          gsb.classList.remove('hide'); return; }
    if(e.key!=='Enter')return;
    const v=gsi.value.trim();
    if(v.length<2){ if(gsn){gsn.classList.remove('hide');gsn.textContent='two letters, minimum';} return; }
    /* L'atterrissage cherche SANS se déployer : on ne fait pas entrer
       quelqu'un dans son Totehm pour lui montrer une liste de noms. */
    runSearch(v, gsn);
  });

  /* SUPPRIMÉ (17/09/2026) — le module `#ctx-down` / `#ctx-up` /
     `#gate-context` et l'IntersectionObserver de `#ctx-vid`. Le
     deuxième écran « Think same but opposite » est parti ; il n'y a
     plus rien à faire descendre ni de vidéo à charger. */
})();

/* ══ LOUPE SUPPRIMÉE · 07/09/2026 ══════════════════════════════════════
   La mise en avant de la première ligne (agrandissement + 3D) a été
   retirée : elle troublait la lecture au lieu de la guider. La liste
   se lit d'un coup d'œil, aucune ligne n'a besoin d'être « en avant »
   par défaut. */
</script>
</body>
</html>
