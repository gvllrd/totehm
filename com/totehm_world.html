<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOTEHM — my world</title>
<!--
  ══ LA PORTE DE LA CARTE · 09/09/2026 ═══════════════════════════════════
  `[Open my Totehm world]` a quitté l'atterrissage de `totehm.html` : le
  bouton du bas dit maintenant « Think same but opposite » et descend d'un
  écran, il ne part plus sur un autre document.

  Or c'était la SEULE porte vers `map.html`. La retirer sans rien mettre à
  la place laissait la Higher Map — le produit — sans entrée. Ce fichier
  est cette entrée, sortie de `totehm.html` pour être retravaillée à part.

  Il ne fait qu'une chose et il la fait avec les mesures du produit : le T
  en haut, le TOTEHM en bas, la porte au milieu. Pas de session, pas de
  réseau, pas de `createClient` : rien à charger, rien à attendre.
-->
<style>
:root{--paper:#2b2b57;--navy:#333366}
html,body{height:100%;margin:0;background:#000;color:#b0b0b0;
  font-family:'Quantico',system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased}
#w{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;padding:24px}
/* Mêmes coordonnées que partout ailleurs : T à 30px du haut sur 53px,
   TOTEHM à 30px du bas sur 50px. Trois fichiers, une seule mesure. */
#t{position:fixed;top:30px;left:50%;transform:translateX(-50%);line-height:0}
#t svg{height:53px;width:auto;display:block}
#wm{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);line-height:0;
  background:none;border:none;padding:0;cursor:pointer}
#wm svg{height:50px;width:auto;display:block}
#say{font-size:clamp(18px,4vw,26px);color:#fff;text-align:center;margin:0;
  line-height:1.3;max-width:22ch}
#go{background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;
  color:#b0b0b0;padding:8px 4px;transition:color .15s ease}
#go:hover{color:#fff}
#hint{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.34);margin:0}
</style>

<div id="w">
  <div id="t"><svg viewBox="0 0 68 68" role="img" aria-label="T"><rect x="0" y="0" width="68" height="10" fill="#fff"/><rect x="29" y="0" width="10" height="67" fill="#fff"/><rect x="21" y="63" width="27" height="5" fill="#fff"/></svg></div>
  <p id="say">Everything out there that matches what you are becoming.</p>
  <button id="go" type="button">Open my Totehm world</button>
  <p id="hint">the higher map</p>
  <button id="wm" type="button" aria-label="Back to my Totehm"><svg viewBox="0 0 84 39" role="img" aria-label="TOTEHM"><text x="42" y="27" text-anchor="middle" font-family="Quantico, sans-serif" font-size="15" letter-spacing="1.5" fill="#fff">TOTEHM</text></svg></button>
</div>

<script>
/* Le T et le TOTEHM ramènent au Totehm — jamais ailleurs. Même règle que
   dans book.html et next_objective.html. */
document.getElementById('go').onclick = () => { location.href = 'map.html'; };
document.getElementById('wm').onclick = () => { location.href = 'totehm.html'; };
document.getElementById('t').onclick  = () => { location.href = 'totehm.html'; };
</script>
