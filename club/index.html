    /* la vidéo chez Bunny : cinq qualités, le CDN le plus proche, elle démarre tout de suite ; refusée → `moments` */
    if(!m.photo && await VID.dispo()){
      try{ return await VID.envoyer(m.blob, m.secs, p => note2('sending… ' + p + ' %')); }
      catch(e){ console.error('[bunny upload]', e && e.message || e); }
    }
    const ext = m.photo ? 'jpg' : m.type.includes('mp4') ? 'mp4' : m.type.includes('quicktime') ? 'mov' : 'webm';
    const path = me.id + '/' + crypto.randomUUID() + '.' + ext;
    const { error } = await sb.storage.from('moments').upload(path, m.blob, { contentType:m.photo ? 'image/jpeg' : (m.type || 'video/' + ext), upsert:false });
    if(error){ console.error('[moments upload]', error.message); return ''; }
    return path;
  }
  /* ── LE LIEU : UN SEUL POINT, d'où qu'il vienne. La ville vient TOUJOURS de `cities.json`, jamais du
     géocodeur : c'est le vocabulaire du filtre et du radar. ── */
  function poser(ll, src, nom){
    const s = ++seqPos;
    N.pt = { lat:ll.lat, lng:ll.lng }; N.ptSrc = src; N.ptNom = nom || ''; N.ptVille = ''; N.posErr = false; N.posBusy = false;
    villeDe(ll.lat, ll.lng).then(v => { if(s === seqPos){ N.ptVille = v || ''; peindre(); } });
    peindre();
  }
  function localiser(){
    const s = ++seqPos; N.posErr = false; N.posBusy = true;
    if(!navigator.geolocation){ N.posBusy = false; N.posErr = true; return; }
    navigator.geolocation.getCurrentPosition(q => {
      if(s !== seqPos) return;
      POS = { lat:q.coords.latitude, lng:q.coords.longitude };
      poser(POS, 'ici', '');
    }, () => { if(s !== seqPos) return; N.posBusy = false; N.posErr = true; peindre(); },
      { enableHighAccuracy:true, timeout:9000, maximumAge:120000 });
  }
  /* ── L'ADRESSE → UN POINT ── Nominatim (OpenStreetMap). UNE requête par GESTE, jamais à la frappe
     (leur règle, et la nôtre : rien de systématique) ; chaque réponse est gardée. Injoignable, le refus se VOIT. */
  const ADR = new Map();
  async function chercherAdresse(){
    const q = N.adr.trim();
    if(q.length < 3){ N.adrErr = 'write the address first'; return peindre(); }
    if(N.adrBusy) return;
    const s = ++N.adrSeq, k = q.toLowerCase();
    N.adrBusy = true; N.adrErr = ''; N.hits = []; N.hit = -1; peindre();
    let l = ADR.get(k);
    if(!l){
      try{
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' + encodeURIComponent(q),
          { headers:{ Accept:'application/json' }, referrerPolicy:'strict-origin-when-cross-origin' });
        if(!r.ok) throw new Error('http ' + r.status);
        const d = await r.json();
        l = (Array.isArray(d) ? d : []).map(x => ({ lat:+x.lat, lng:+x.lon, nom:String(x.display_name || '').slice(0, 160) }))
          .filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng) && x.lat >= -90 && x.lat <= 90 && x.lng >= -180 && x.lng <= 180);
        ADR.set(k, l); if(ADR.size > 40) ADR.delete(ADR.keys().next().value);
      }catch(e){
        console.error('[adresse]', e && e.message || e);
        if(s === N.adrSeq){ N.adrBusy = false; N.adrErr = 'addresses are unreachable · use here'; peindre(); }
        return;
      }
    }
    if(s !== N.adrSeq) return;
    diag.adresses++;
    N.adrBusy = false; N.hits = l; N.adrErr = l.length ? '' : 'no place with this address';
    peindre();
  }
  /* ── LA PEINTURE ── */
  const chip = (a, mot, on, sous) => '<button type="button" class="sfc ns-c' + (on ? ' is-on' : '') + '" ' + a + ' aria-pressed="' + !!on + '">'
    + esc(mot) + (sous ? '<small>' + esc(sous) + '</small>' : '') + '</button>';
  const grp = (mot, corps) => '<div class="sfg"><div class="sfl">' + esc(mot) + '</div><div class="sfr">' + corps + '</div></div>';
  const tag = t => '<span class="ns-tag">' + esc(t) + '</span>';
  const note = t => '<p class="ns-def ns-note-g">' + esc(t) + '</p>';
  function habitHTML(){
    const box = boxHabit;
    if(N.h) return '<div class="sfg"><div class="sfl">my habit</div><div class="sfbx"><div class="sfb is-on" role="button" tabindex="0"'
      + ' data-ns="reh" aria-label="Change the Habit">' + box(N.h) + '</div></div></div>';
    const hs = HABITS || [];
    return '<div class="sfg"><div class="sfl">which habit?</div><div class="sfbx">' + (hs.length
      ? hs.map(x => '<div class="sfb" role="button" tabindex="0" data-ns="h" data-v="' + esc(x.name) + '">' + box(x) + '</div>').join('')
      : '<p class="note">' + (HABITS ? 'write a Habit in my TOTEHM first' : 'reading my TOTEHM…') + '</p>') + '</div></div>';
  }
  function medHTML(oblig){
    const m = N.media;
    if(m) return '<div class="sfg"><div class="sfl">' + (m.photo ? 'photo' : 'video') + '</div><div class="ns-m">'
      + (m.photo ? '<img alt="" src="' + esc(m.url) + '">' : '<video src="' + esc(m.url) + '" muted loop playsinline autoplay></video>')
      + '</div><div class="sfr">' + chip('data-ns="nomedia"', 'change', false) + '</div></div>';
    return grp('a photo or a video · ' + (oblig ? (RULES.clip_seconds || 33) + ' s at most' : 'optional'),
      chip('data-ns="cam"', 'take it now', false, 'camera') + chip('data-ns="file"', 'from my files', false));
  }
  const quandHTML = () => grp('when', chip('data-ns="quand" data-v="now"', 'now', N.quand === 'now', 'I am here')
    + chip('data-ns="quand" data-v="later"', 'later', N.quand === 'later', 'I will be here'));
  const dateHTML = () => grp('the day and the hour',
    '<input class="sfc ns-in" type="date" aria-label="Date" data-nsi="date" value="' + esc(N.date) + '">'
    + '<input class="sfc ns-in" type="time" aria-label="Time" data-nsi="time" value="' + esc(N.time) + '">'
    + (dateOk() ? '' : tag('a future date · ' + (RULES.horizon_days || 90) + ' days at most')));
  function adresseHTML(){
    let h = '<div class="sfg"><div class="sfl">the address</div><div class="ns-adr">'
      + '<input class="sfc ns-in ns-adrin" type="text" maxlength="160" autocomplete="off" enterkeyhint="search"'
      + ' placeholder="street, number, city" aria-label="The address" data-nsi="adr" value="' + esc(N.adr) + '">'
      + '<button type="button" class="sfc" data-ns="find"' + (N.adrBusy ? ' disabled' : '') + '>' + (N.adrBusy ? 'reading…' : 'read it') + '</button></div>';
    if(N.adrErr) h += '<p class="note">' + esc(N.adrErr) + '</p>';
    if(N.hits.length) h += '<div class="ns-hits">' + N.hits.map((x, i) => '<button type="button" class="ns-hit' + (N.hit === i ? ' is-on' : '')
      + '" data-ns="hit" data-v="' + i + '">' + esc(x.nom) + '</button>').join('') + '</div>';
    return h + '</div>';
  }
  function ouHTML(){
    const now = N.quand === 'now';
    let c = now ? '<span class="sfc ns-c is-on">here<small>my position</small></span>'
      : chip('data-ns="ou" data-v="ici"', 'here', N.ou === 'ici', 'my position')
        + chip('data-ns="ou" data-v="ailleurs"', 'elsewhere', N.ou === 'ailleurs', 'an address');
    if(N.pt) c += tag(N.ptVille || N.ptNom.split(',')[0].trim() || 'the exact point');
    else if(N.ou === 'ici' || now) c += N.posErr ? tag('allow my location') + chip('data-ns="retry"', 'try again', false) : tag('finding my place…');
    let h = grp('where', c);
    if(N.ou === 'ailleurs') h += adresseHTML();
    if(N.pt && !now) h += '<div class="sfg"><input class="sfc ns-in ns-place" type="text" maxlength="120" autocomplete="off"'
      + ' placeholder="the place · optional" aria-label="The place" data-nsi="place" value="' + esc(N.place) + '"></div>';
    return h;
  }
  /* publié d'ici : FIGHER CLUB, d'office — montré, jamais demandé */
  const quiHTML = () => grp('who sees it', '<span class="sfc ns-c is-on" aria-disabled="true">figher club<small>every TOTEHM</small></span>');
  const ensHTML = () => grp('together', chip('data-ns="mode" data-v="silent"', 'silent', N.mode === 'silent', 'nobody disturb me')
    + chip('data-ns="mode" data-v="social"', 'social', N.mode === 'social', 'we can talk'));
  const durHTML = () => grp('duration', DURS.map(d => chip('data-ns="dur" data-v="' + d + '"', dureeTxt(d), N.dur === d)).join('')
    + '<input class="sfc ns-in ns-min" type="number" inputmode="numeric" min="' + (RULES.duration_min || 5) + '" max="' + (RULES.duration_max || 720)
    + '" placeholder="min" aria-label="Duration in minutes" data-nsi="dur" value="' + (N.dur && !DURS.includes(N.dur) ? N.dur : '') + '">');
  const motHTML = () => '<div class="sfg"><div class="sfl">a word · optional</div><textarea class="sfc ns-in ns-mot" maxlength="400" rows="2"'
    + ' placeholder="A word" aria-label="A word" data-nsi="mot">' + esc(N.mot) + '</textarea></div>';
  const envoiHTML = mot => '<div class="sfg"><button type="button" class="ns-go" data-ns="go"' + (N.occupe ? ' disabled' : '') + '>' + mot + '</button>'
    + '<p class="note ns-note" role="status" aria-live="polite">' + esc(N.note) + '</p></div>';
  function peindre(){
    const p = pan(); if(!p || p.hidden) return;
    let h = '<p class="sfl">+ spot</p><p class="ns-def ns-what">' + esc(DEF) + '</p>' + habitHTML();
    if(N.h){
      h += quandHTML();
      const plan = N.quand === 'later';
      if(plan) h += dateHTML();
      if(N.quand && (!plan || dateOk())){
        h += ouHTML();
        if(N.pt){
          h += quiHTML() + ensHTML();
          if(N.mode){
            if(!plan) h += medHTML(true);
            if(plan || N.media){
              h += durHTML();
              if(N.dur){
                h += motHTML();
                if(plan) h += medHTML(false);
                h += envoiHTML(plan ? 'I WILL BE HERE' : 'I AM HERE');
              }
            }
          }
        }
      }
    }
    h += '<div class="sfg"><div class="sfr sfa"><span></span><button type="button" class="sfc" data-ns="close">CLOSE</button></div></div>';
    p.innerHTML = h;
  }
  function note2(t){ N.note = t || ''; const n = pan() && pan().querySelector('.ns-note'); if(n) n.textContent = N.note; }
  /* ── LA PUBLICATION ── Le point est TOUJOURS exact (`p_location:'on'`), donc `p_mode` est toujours rempli. */
  async function publier(){
    if(N.occupe || !me || !N.h || !N.pt || !N.mode) return;
    const plan = N.quand === 'later', uid = me.id;
    N.occupe = true; note2(plan ? 'announcing…' : 'sending…');
    const go = pan() && pan().querySelector('.ns-go'); if(go) go.disabled = true;
    const fin = t => { N.occupe = false; diag.refus++; note2(t); const g = pan() && pan().querySelector('.ns-go'); if(g) g.disabled = false; };
    if(!plan && !N.path){ N.path = await envoyerMedia(N.media); if(uid !== (me && me.id)) return; if(!N.path) return fin('not sent · try again'); }
    const commun = { p_habit:N.h.name, p_duration_min:N.dur, p_lat:N.pt.lat, p_lng:N.pt.lng, p_city:N.ptVille || null,
      p_comment:N.mot.trim() || null, p_mode:N.mode, p_location:'on', p_audience:'figher' };
    const corps = plan
      ? Object.assign({}, commun, { p_starts_at:new Date(N.date + 'T' + N.time).toISOString(),
          p_place:(N.place.trim() || N.ptNom.split(',')[0].trim() || N.ptVille || 'the planned place').slice(0, 120) })
      : Object.assign({}, commun, { p_video:N.path });
    const fn = plan ? 'spot_schedule_audience' : 'spot_create_audience';
    const { data, error } = await sb.rpc(fn, corps);
    if(uid !== (me && me.id)) return;
    if(error){ console.error('[' + fn + ']', error.message); return fin('not saved · try again'); }
    if(!data || !data.ok) return fin(POURQUOI[data && data.why] || 'not saved · try again');
    const id = data.id;
    let pasMedia = false;
    if(plan && N.media){
      const path = await envoyerMedia(N.media);
      const r = path ? await sb.rpc('spot_video_attach', { p_spot:id, p_video:path }) : { error:null, data:null };
      if(r.error) console.error('[spot_video_attach]', r.error.message);
      pasMedia = !path || !!r.error || !(r.data && r.data.ok);
    }
    const b = await sb.rpc('spot_box_set', { p_spot:id, p_hide:{ objectives:[], repulsions:[], freq:false } });
    if(b.error) console.error('[spot_box_set]', b.error.message);
    if(uid !== (me && me.id)) return;
    diag.publies++; N.occupe = false;
    fermer();
    CLUBSP.montrer(plan ? 'future' : 'now');
    dire(pasMedia ? 'announced · the media did not go' : '');
  }
  function ouvrir(x){
    const p = pan(); if(!p) return;
    if(!me) return ssoLogin(false);
    neuf(); lireRegles(); VID.dispo();
    p.hidden = false; document.body.classList.add('is-nspot'); diag.ouverts++;
    mesHabits().then(() => {
      if(x && !N.h) N.h = (HABITS || []).find(h => String(h.name || '').trim() === String(x).trim()) || null;
      peindre();
    });
    peindre(); p.scrollTop = 0;
  }
  function fermer(){
    const p = pan(); if(!p) return;
    document.body.classList.remove('is-nspot');
    p.hidden = true; p.innerHTML = ''; neuf(); radarOn();
  }
  function oublierLieu(){ seqPos++; N.adrSeq++; N.pt = null; N.ptSrc = ''; N.ptVille = ''; N.ptNom = ''; N.posErr = false;
    N.posBusy = false; N.adrBusy = false; N.hits = []; N.hit = -1; N.adrErr = ''; N.place = ''; }
  /* le fichier : UN SEUL input, `capture` posé au geste (« take it now » ouvre la caméra du téléphone) */
  function fichier(camera){
    const f = $('ns-file');
    if(camera) f.setAttribute('capture', 'environment'); else f.removeAttribute('capture');
    f.value = ''; f.click();
  }
  $('ns-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if(f) prendre(f); });
  {
    const p = pan();
    p.addEventListener('click', e => {
      const t = e.target.closest('[data-ns]'); if(!t) return;
      const c = t.dataset.ns, v = t.dataset.v;
      if(c === 'close') return fermer();
      if(c === 'go') return void publier();
      if(N.occupe) return;
      if(c === 'h') N.h = (HABITS || []).find(h => String(h.name) === String(v)) || null;
      else if(c === 'reh') N.h = null;
      else if(c === 'quand'){ if(N.quand === v) return; N.quand = v; N.mode = ''; oublierLieu();
        if(v === 'now'){ N.ou = 'ici'; localiser(); } else N.ou = ''; }
      else if(c === 'ou'){ if(N.ou === v) return; N.ou = v; oublierLieu(); if(v === 'ici') localiser(); }
      else if(c === 'retry') localiser();
      else if(c === 'find') return void chercherAdresse();
      else if(c === 'hit'){ const x = N.hits[+v]; if(!x) return; N.hit = +v; return poser(x, 'adresse', x.nom); }
      else if(c === 'cam') return fichier(true);
      else if(c === 'file') return fichier(false);
      else if(c === 'nomedia'){ lacher(); }
      else if(c === 'mode') N.mode = v;
      else if(c === 'dur') N.dur = +v || 0;
      else return;
      peindre();
    });
    p.addEventListener('keydown', e => { const t = e.target.closest && e.target.closest('.sfb[data-ns]');
      if(t && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); t.click(); } });
    p.addEventListener('input', e => { const f = e.target.closest('[data-nsi]'); if(!f) return;
      const k = f.dataset.nsi;
      if(k === 'mot') N.mot = f.value; else if(k === 'place') N.place = f.value;
      else if(k === 'adr'){ N.adr = f.value; N.adrErr = ''; } });
    p.addEventListener('keydown', e => { const f = e.target.closest && e.target.closest('[data-nsi="adr"]');
      if(f && e.key === 'Enter'){ e.preventDefault(); chercherAdresse(); } });
    p.addEventListener('change', e => { const f = e.target.closest('[data-nsi]'); if(!f || N.occupe) return; const k = f.dataset.nsi;
      if(k === 'date') N.date = f.value; else if(k === 'time') N.time = f.value;
      else if(k === 'dur'){ const n = Math.round(+f.value); N.dur = n >= (RULES.duration_min || 5) && n <= (RULES.duration_max || 720) ? n : 0; }
      else return;
      peindre(); });
  }
  { const b = $('rdr-plus'); if(b) b.addEventListener('click', e => { if(e.target.closest('[data-nspot]')) ouvrir(); }); }
  return { ouvrir, fermer, ouvert:()=>!$('rdr-new').hidden,
    etat:()=>Object.assign({ ouvert:!$('rdr-new').hidden, habit:!!N.h, quand:N.quand, media:!!N.media, aud:N.aud,
      ou:N.ou, mode:N.mode, pt:!!N.pt, ptSrc:N.ptSrc, hits:N.hits.length, dur:N.dur }, diag) };
})();

/* ══ LE COIN MEMBRE — CONNECT WITH MY TOTEHM seul ; connecté, le NOM seul, qui ramène à COM.
   Il n'y a PAS de bouton SORTIR ici : sortir de totehm.com sort de partout (le numéro de sortie). ══ */
function paintMember(){
  $('member').classList.toggle('is-in', !!me);
  $('member-txt').textContent = me ? (PSEUDO || 'MY TOTEHM') : 'CONNECT WITH MY TOTEHM';
  $('member').setAttribute('aria-label', me ? 'My TOTEHM' : 'Connect with my TOTEHM');
  $('terms').classList.toggle('hide', !!me);
  const pl = $('rdr-plus'); if(pl) pl.hidden = !me;
}
$('member').onclick = () => me ? ssoVersDomaine(sb, 'com', COM + '/totehm#in') : ssoLogin(false);
$('club-logo').addEventListener('click', e => { if(!me) return; e.preventDefault(); ssoVersDomaine(sb, 'com', COM + '/totehm'); });

/* ══ LES TROIS MODES ══ */
function peindreMode(){
  const m = MODE.get();
  for(const k of MODES){ document.body.classList.toggle('rdr-' + k, m === k); $('v-' + k).classList.toggle('is-on', m === k); }
  $('rdr-mode').querySelectorAll('[data-rmode]').forEach(b => { const on = b.dataset.rmode === m;
    b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on)); });
  if(m !== 'shorts') SHORTS.arreter();
  if(m === 'grid') GRID.peindre(); else if(m === 'shorts') SHORTS.peindre(); else { radarOn(); LISTE.peindre(); }
  document.body.classList.toggle('is-scrolled', m === 'radar' && $('v-radar').scrollTop > 40);
}
$('rdr-mode').addEventListener('click', e => { const b = e.target.closest('[data-rmode]'); if(b) MODE.set(b.dataset.rmode); });
MODE.sur(() => peindreMode());
CLUBSP.sur(() => {
  /* rien près de moi : le Club entier, et le filtre le dit (une seule fois) */
  if(CLUBSP.elargi && SF.ou === 'near' && !SF.touche){ SF.ou = ''; dire('nothing near me yet · the whole club'); }
  situer(); GRID.maj(); SHORTS.maj(); peindreBarre(); if(sfOuvert()) sfPaint();
});

/* ══ LE DÉMARRAGE ══ */
window.__totehm_club = () => ({ build:BUILD, mode:MODE.get(), signed_in:!!me, located:!!POS, detail:!!DETAIL,
  filtre:sfOuvert(), filtres:sfCount(), habits:(HABITS || []).length, akin:!!SF.akin, exact:SF.exact, ou:SF.ou || 'world',
  logo:!!$('club-logo'), liste:LISTE.etat(), shorts:SHORTS.etat(), scrolled:document.body.classList.contains('is-scrolled'),
  radar:{ cx:Math.round(RAD.cx), cy:Math.round(RAD.cy), radius:Math.round(RAD.rpx), heading:Math.round(norm360(RAD.head)),
          points:RAD.pts.length, lieux:RAD.lieux.length, portee:Math.round(RAD.range) },
  grille:GRID.etat(), club:CLUBSP.etat(), prise:NSPOT.etat() });

/* `boot` lit la session et le Club UNE fois ; le premier événement de session (INITIAL_SESSION) n'en relance pas
   une seconde lecture (mesuré : une lecture du Club entier partait pour rien avant celle « près de moi »). */
let DEMARRE = false;
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session?.user || null;
  if(me){
    const { data, error } = await sb.from('profiles').select('pseudo').eq('id', me.id).maybeSingle();
    if(error) console.error('[profiles]', error.message);
    PSEUDO = data?.pseudo || null;
    mesHabits();
  }
  paintMember(); peindreMode(); peindreBarre();
  /* Wah : « il faut demander directement la localisation à l'utilisateur, pour le placer et lui montrer ce qui est
     pertinent autour de lui ». Demandée À L'ARRIVÉE ; donnée vite → le Club PRÈS DE MOI d'abord ; tardive → le Club
     entier tout de suite, puis près de moi dès qu'elle arrive — sauf si le membre a touché au filtre entre-temps. */
  const ici = me ? position() : Promise.resolve(false);
  const vite = await Promise.race([ici, new Promise(r => setTimeout(() => r(null), 1500))]);
  DEMARRE = true;
  if(vite === true){ SF.ou = 'near'; await CLUBSP.regler(sfOpts(), true); }
  else{
    await CLUBSP.lire();
    ici.then(ok => { if(!ok || SF.touche) return; SF.ou = 'near'; RAD.headTo = 0; CLUBSP.regler(sfOpts(), true); });
  }
  /* Un lien partagé (`?spot=…`) ouvre CE spot, quels que soient les filtres. */
  const p = new URLSearchParams(location.search);
  if(p.get('spot')){
    const { data, error } = await sb.rpc('spot_get', { p_id:p.get('spot') });
    if(error) console.error('[spot_get]', error.message);
    else if(data?.ok && data.spot){
      if(data.spot.format === 'space') return ssoVersDomaine(sb, 'space', 'https://www.totehm.space/?spot=' + encodeURIComponent(p.get('spot')), true);
      ouvrirDetail(data.spot);
    }
  }
}
sb.auth.onAuthStateChange((ev, s) => {
  if(!DEMARRE) return;
  const id = s?.user?.id || null;
  if(id === (me ? me.id : null)) return;
  me = s?.user || null; PSEUDO = null; HABITS = null; VID.oublier();
  paintMember(); CLUBSP.lire();
  if(me) sb.from('profiles').select('pseudo').eq('id', me.id).maybeSingle().then(({data}) => { PSEUDO = data?.pseudo || null; paintMember(); });
});
document.addEventListener('visibilitychange', () => { if(document.hidden){ SHORTS.pause(); return; } CLUBSP.ouvrir(); radarOn(); SHORTS.reprendre(); });
boot();
</script>
<script>
/* ══ LA NOMENCLATURE DU VERSO — copié de tools/totehm_name.js dans chaque page (jamais importé) ══
   Le NOM d'un TOTEHM prend TOUT le carré de son verso. Sur une ligne il rapetissait jusqu'à 5,5 px
   (mesuré : 4,1 px au coin membre pour 24 lettres) ; posé sur la trame des 12 trous il reste 2 à 2,5 fois
   plus grand. La règle, la même partout :

     1 – 5 lettres  → une ligne, centrée (en grille elles seraient PLUS PETITES : mesuré × 0,63)
     6 – 16         → 4 colonnes, 2 à 4 lignes
     17 – 25        → 5 colonnes, 4 à 5 lignes
     26 +           → 25 lettres, la suite en ·

   Lecture gauche → droite, haut → bas : le nom se LIT toujours. La dernière ligne est centrée. Le décalage
   de chaque lettre (±8 % de sa case) et les points des cases vides viennent du nom LUI-MÊME : même nom,
   même dessin, sur les quatre domaines — c'est l'empreinte du membre, jamais du hasard.
   Quantico n'a pas de chasse fixe : on MESURE (un étalon caché), jamais on ne devine.
   Les lettres sont dessinées à 24 px et mises à l'échelle : une position et une taille s'animent ensemble,
   en `transform` seul, donc sans reflow — c'est ce qui permet au nom de se reformer en UNE ligne sans coupure. */
window.TOTEHM_NOM = (() => {
  const BASE = 24, PAD = .09, MAX = 25;
  let etalon = null, cache = Object.create(null);

  function mesurer(txt){
    if (!txt) return 0;
    if (cache[txt] != null) return cache[txt];
    if (!etalon){
      etalon = document.createElement('span');
      etalon.setAttribute('aria-hidden', 'true');
      etalon.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden;'
        + "font:400 " + BASE + "px 'Quantico',sans-serif;letter-spacing:.04em";
      document.body.appendChild(etalon);
    }
    etalon.textContent = txt;
    return (cache[txt] = etalon.getBoundingClientRect().width);
  }
  /* les polices arrivent après la première peinture : tout ce qui a été mesuré avant est faux */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { cache = Object.create(null); });

  function plan(nom){
    const tout = Array.from((nom || '').trim());
    if (!tout.length) return null;
    const L = tout.slice(0, MAX);
    if (tout.length > MAX) L[MAX - 1] = '·';
    const N = L.length;
    if (N <= 5) return { L, N, C:N, R:1, cells:L.map((c, i) => ({ c, col:i, row:0 })) };
    const C = Math.min(5, Math.max(4, Math.ceil(Math.sqrt(N))));
    const R = Math.ceil(N / C), reste = N - (R - 1) * C, dec = (C - reste) / 2, cells = [];
    for (let i = 0; i < N; i++){
      const row = Math.floor(i / C);
      cells.push({ c:L[i], col:(i % C) + (row === R - 1 ? dec : 0), row });
    }
    return { L, N, C, R, cells };
  }
  /* FNV-1a sur le nom : stable d'un domaine à l'autre, d'une session à l'autre */
  function bruit(nom, i){
    let h = 2166136261; const s = nom + '|' + i;
    for (let k = 0; k < s.length; k++){ h ^= s.charCodeAt(k); h = (h * 16777619) >>> 0; }
    return ((h % 1000) / 1000) - .5;
  }

  /* Peint le nom dans `hote` (un carré de `S` px, positionné). Rend la taille de lettre obtenue. */
  function poser(hote, nom, S, opt){
    const o = opt || {}, p = plan(nom);
    hote.textContent = '';
    hote.removeAttribute('data-nom');
    if (!p || !S) return 0;
    const pad = S * PAD, inner = S - 2 * pad, k = BASE / 100;
    let px, place;
    if (p.R === 1){
      px = Math.min(S * .34, inner / (mesurer(p.L.join('')) / BASE));
      let x = (S - mesurer(p.L.join('')) * px / BASE) / 2;
      place = (c) => { const r = [x, S / 2 - px * .36]; x += mesurer(c) * px / BASE; return r; };
    } else {
      const cw = inner / p.C, ch = inner / p.R;
      let large = 0; for (const c of p.L) large = Math.max(large, mesurer(c));
      px = Math.min(cw * .94 / (large / BASE), ch * .94);
      place = (c, i) => {
        const k2 = p.cells[i];
        const cx = pad + (k2.col + .5) * cw + bruit(nom, i) * cw * .16;
        const cy = pad + (k2.row + .5) * ch + bruit(nom, i + 99) * ch * .16;
        return [cx - mesurer(c) * px / BASE / 2, cy - px * .36];
      };
    }
    const e = px / BASE;
    p.L.forEach((c, i) => {
      const [x, y] = place(c, i);
      const el = document.createElement('span');
      el.className = 'tn-l'; el.textContent = c;
      el.dataset.gx = x.toFixed(2); el.dataset.gy = y.toFixed(2); el.dataset.gs = e.toFixed(4);
      el.style.transform = 'translate(' + el.dataset.gx + 'px,' + el.dataset.gy + 'px) scale(' + el.dataset.gs + ')';
      hote.appendChild(el);
    });
    /* les cases vides : la trame se voit, comme les trous d'une carte perforée */
    if (p.R > 1 && o.vides !== false){
      const cw = inner / p.C, ch = inner / p.R, pris = {};
      p.cells.forEach(k2 => { pris[k2.row + ':' + Math.round(k2.col * 2)] = 1; });
      for (let r = 0; r < p.R; r++) for (let c = 0; c < p.C; c++){
        if (pris[r + ':' + (c * 2)] || pris[r + ':' + (c * 2 + 1)]) continue;
        const d = document.createElement('i');
        d.className = 'tn-v';
        d.style.left = (pad + (c + .5) * cw).toFixed(2) + 'px';
        d.style.top = (pad + (r + .5) * ch).toFixed(2) + 'px';
        hote.appendChild(d);
      }
    }
    hote.setAttribute('data-nom', nom);
    return px;
  }

  /* LE RETOUR À LA LIGNE — les MÊMES lettres glissent de leur case vers `cibles` (une position par lettre,
     en px dans le repère de l'hôte) : aucune n'apparaît, aucune ne disparaît. Sans cibles, elles rentrent
     dans leur case. C'est ce qui fait du nom reformé une TRANSFORMATION et non un autre écran. */
  function ligner(hote, cibles){
    const lts = hote.querySelectorAll('.tn-l');
    hote.classList.toggle('is-ligne', !!cibles);
    lts.forEach((el, i) => {
      const t = cibles && cibles[i];
      el.style.transform = t
        ? 'translate(' + t.x.toFixed(2) + 'px,' + t.y.toFixed(2) + 'px) scale(' + (t.s).toFixed(4) + ')'
        : 'translate(' + el.dataset.gx + 'px,' + el.dataset.gy + 'px) scale(' + el.dataset.gs + ')';
    });
  }
  return { poser, ligner, plan, mesurer, BASE };
})();
/* ══ LE COIN MEMBRE — copié de tools/member_corner.js dans chaque page (jamais importé) ══
   Connecté, le coin membre EST le TOTEHM : une seule pièce de papier qui tourne, recto le logo plein,
   verso le nom (Wah : « ce totehm recto-verso en une pièce qui tourne »). Le nom prend tout le carré du
   verso, par `tools/totehm_name.js` — ce bloc exige donc que la nomenclature soit copiée AVANT lui.
   La page ne change pas : elle pose `is-in` et écrit le nom dans `#member-txt`, comme avant.
   Elle tourne LENTEMENT (un tour en ~24 s), plus vite de profil que de face : une feuille qui pivote,
   pas un carrousel. Elle s'arrête quand l'onglet est caché ; mouvement réduit = la pièce est posée sur
   son verso, le nom lisible. Une seule boucle pour toute la page. */
(() => {
  const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
  const R = Math.PI / 180, W0 = 22;                 /* 22°/s de face : le tour moyen fait ~24 s */
  const LUM = (() => { const x = -.35, y = -.55, z = 1, n = Math.hypot(x, y, z); return [x / n, y / n, z / n]; })();
  const vivantes = [];
  let raf = 0, last = 0;

  function boucle(now){
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - (last || now)) / 1000)); last = now;
    for (const p of vivantes){
      const s = Math.sin(p.th * R), nat = W0 * (.34 + .66 * s * s);
      p.om += (nat - p.om) * (1 - Math.exp(-dt / 1.6));
      p.th += p.om * dt;
      if (p.th > 3600) p.th %= 360;
      peindre(p);
    }
    if (vivantes.length && !document.hidden) raf = requestAnimationFrame(boucle);
  }
  function relancer(){ if (!raf && vivantes.length && !document.hidden && !RM.matches){ last = 0; raf = requestAnimationFrame(boucle); } }
  document.addEventListener('visibilitychange', relancer);

  function peindre(p){
    p.card.style.transform = 'rotateY(' + p.th.toFixed(2) + 'deg)';
    /* la normale de la face, passée par la rotation : elle dit ce que chaque côté prend de lumière */
    const d = (Math.sin(p.th * R) * LUM[0] + Math.cos(p.th * R) * LUM[2]) / LUM[2];
    eclairer(p.lr, d); eclairer(p.lb, -d);
  }
  /* la formule du papier d'origine : la face qui se détourne s'ASSOMBRIT, celle qui se tourne vers la
     lumière prend un souffle (jamais une ombre portée — BRAND : aucune ombre) */
  function eclairer(el, f){
    if (!el || f <= 0) return;
    if (f < 1){ el.style.background = '#000'; el.style.opacity = Math.min(.5, (1 - f) * .6).toFixed(3); }
    else      { el.style.background = '#fff'; el.style.opacity = Math.min(.06, (f - 1) * .3).toFixed(3); }
  }

  /* ⚠️ Le nom se lit SANS la pièce : elle vit dans le bouton, et ses lettres feraient un nom qui se
     recopie lui-même. Les pages qui n'ont pas de `#member-txt` écrivent le nom à même le bouton. */
  const nomDe = el => {
    const t = el.querySelector('#member-txt');
    if (t) return (t.textContent || '').trim();
    let s = '';
    for (const n of el.childNodes) if (n.nodeType === 3) s += n.nodeValue;   /* le nom écrit à même le bouton */
    if ((s = s.trim())) return s;
    const d = el.querySelector(':scope > span:not(.mcp)');
    return d ? (d.textContent || '').trim() : '';
  };

  function batir(el){
    let card = el.querySelector('.mcp');
    if (card) return card;
    card = document.createElement('span'); card.className = 'mcp'; card.setAttribute('aria-hidden', 'true');
    const r = document.createElement('span'); r.className = 'mcp-f mcp-r';
    const b = document.createElement('span'); b.className = 'mcp-f mcp-b';
    const lr = document.createElement('i'); lr.className = 'mcp-l';
    const lb = document.createElement('i'); lb.className = 'mcp-l';
    r.appendChild(lr); b.appendChild(lb);
    card.appendChild(r); card.appendChild(b);
    el.appendChild(card);
    return card;
  }

  function fit(el){
    const dedans = el.classList.contains('is-in');
    const p = el.__mcp;
    if (!dedans){
      if (p){ const i = vivantes.indexOf(p); if (i >= 0) vivantes.splice(i, 1); p.card.remove(); el.__mcp = null; }
      return;
    }
    const nom = nomDe(el), S = el.clientWidth;
    if (!S || !window.TOTEHM_NOM) return;
    const card = batir(el);
    const dos = card.querySelector('.mcp-b');
    if (dos.getAttribute('data-nom') !== nom) window.TOTEHM_NOM.poser(dos, nom, S);
    if (nom) el.setAttribute('aria-label', nom + ' — my TOTEHM on totehm.com');
    if (!el.__mcp){
      /* elle commence sur son VERSO : le nom d'abord, le logo ensuite */
      el.__mcp = { card, th:180, om:0, lr:card.querySelector('.mcp-r .mcp-l'), lb:card.querySelector('.mcp-b .mcp-l') };
      if (RM.matches){ peindre(el.__mcp); return; }
      vivantes.push(el.__mcp); relancer();
    } else if (el.__mcp.card !== card){
      /* ⚠️ la page qui réécrit le nom par `textContent` EFFACE la pièce : `batir` en refait une, et le
         moteur doit suivre la nouvelle, sinon il peint un nœud détaché et la pièce reste immobile. */
      el.__mcp.card = card;
      el.__mcp.lr = card.querySelector('.mcp-r .mcp-l');
      el.__mcp.lb = card.querySelector('.mcp-b .mcp-l');
      peindre(el.__mcp); relancer();
    }
  }

  const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(list => list.forEach(e => fit(e.target))) : null;
  const watch = el => {
    if (el.__mc) return; el.__mc = 1; fit(el); if (ro) ro.observe(el);
    new MutationObserver(() => fit(el)).observe(el, { childList:true, characterData:true, subtree:true, attributes:true, attributeFilter:['class'] });
  };
  const start = () => {
    document.querySelectorAll('.mc').forEach(watch);
    document.fonts?.ready?.then(() => document.querySelectorAll('.mc').forEach(el => {
      const d = el.querySelector('.mcp-b'); if (d) d.removeAttribute('data-nom');   /* mesuré avec la vraie police */
      fit(el);
    }));
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once:true }); else start();
})();
</script>
