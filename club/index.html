<!--
  ══ figher.club — SQUELETTE · 15/09/2026 ════════════════════════════════
  Demandé par le COO : centraliser le Radar, l'accès Boutique et
  l'abonnement sur un quatrième domaine.

  ⚠️ LIS `CLAUDE.md` § « LE QUATRIÈME DOMAINE » AVANT D'ALLER PLUS LOIN.
  Ce fichier est un SQUELETTE, volontairement inerte : il ne lit aucune
  session, n'appelle aucune RPC, ne montre aucun prix. La raison est
  écrite noir sur blanc dans CLAUDE.md et elle tient en une ligne :

      quatre domaines = quatre localStorage = quatre sessions,
      et IL N'Y A PAS DE SSO.

  Un membre qui se connecte sur totehm.space arrive ici DÉCONNECTÉ.
  Brancher le Radar, la facturation et la boutique derrière une porte
  qui redemande l'e-mail à chaque saut, c'est le produit qui a l'air
  cassé — pas une fois, à chaque visite.

  Tant que le pont de session n'est pas construit
  (`auth.admin.generateLink` → `token_hash` à usage unique, jamais un
  jeton de session dans une URL), ce fichier reste une VITRINE : il dit
  ce qu'est le Club et il renvoie vers totehm.space pour y entrer.

  Root Directory Vercel = `club`. Le dossier est prêt, le domaine peut
  être posé dessus le jour où il est acheté, sans rien recâbler.
-->

*{box-sizing:border-box;margin:0;padding:0}

#t svg{height:53px;width:auto;display:block}
h1{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:900;

.ints{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:430px}

.door:hover{color:#fff}
.note{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;
  max-width:36ch;line-height:1.9}
</style>
