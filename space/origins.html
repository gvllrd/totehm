<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

/* ── DECK ── */
#deck { position: fixed; inset: 0; overflow: hidden; }
.slide {
  position: absolute; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  will-change: transform;
  transition: transform .62s cubic-bezier(.65,0,.35,1);
}

/* ── INTRO ── */

  max-width: min(560px, 82vw);
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: clamp(11px, 1.55vw, 15px);
  line-height: 2.1;
  letter-spacing: .04em;
  color: #fff;
}
.intro-text .sub { color: #a0a0a0; margin-top: 2em; display: block; }

.card-scene {
  perspective: 1000px; cursor: grab;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  display: inline-block; line-height: 0;
}
.card-scene.grabbing { cursor: grabbing; }
.card {
  position: relative; transform-style: preserve-3d;
  will-change: transform; display: inline-block; line-height: 0;
}
.card-front { display: block; backface-visibility: hidden; overflow: hidden; line-height: 0; }
.card-front video {
  display: block;
  max-width: min(62vw, 460px); max-height: 58vh;
  width: auto; height: auto;
  pointer-events: none; user-select: none;
}
.card-back {
  position: absolute; inset: 0;
  backface-visibility: hidden; transform: rotateY(180deg); background: #fff;
}

.gl{margin-top:22px;width:min(62vw,460px);opacity:0;transition:opacity .5s ease}
.gl.in{opacity:1}
.gl-a{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;color:#8a8a8a;text-transform:uppercase;margin-bottom:3px}
.gl-t{font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,3vw,28px);letter-spacing:.06em;color:#fff;line-height:1;margin-bottom:3px}
.gl-m{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;color:#8a8a8a;text-transform:uppercase;margin-bottom:11px}
.gl-d{width:100%;height:1px;background:#222;margin-bottom:9px}
.gl-r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.gl-p{font-family:'Space Mono',monospace;font-size:13px;color:#fbd5ca;letter-spacing:.04em}
.gl-e{font-family:'Space Mono',monospace;font-size:9px;color:#8a8a8a;letter-spacing:.1em;text-transform:uppercase}
.gl-btn{font-family:'Quantico',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a9a9a;background:none;border:none;padding:9px 0;cursor:pointer;width:100%;text-align:left;transition:color .15s}
.gl-btn:hover{color:#fff}
.gl-btn:disabled{color:#333;cursor:default}
.gl-btn.loading{color:#333;pointer-events:none}

/* ── COUNTER ── */
#counter {
  position: fixed; top: 20px; right: 20px;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: #9a9a9a; pointer-events: none;
}

/* ── NAV ── */
.nav {
  position: fixed; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;

#nav-up   { top: 28px; }

.chevron.down { transform: rotate(45deg); }
.chevron.up   { transform: rotate(-135deg); }

/* ══ LE PONT SSO — LE BLOC À COPIER · 17/09/2026 ══════════════════════
   Quatre domaines, quatre `localStorage`, quatre sessions. Le compte est
   unique — l'email est l'identité universelle — mais la session ne l'est
   pas et ne peut pas l'être : un navigateur ne partage rien entre deux
   origines. On ne le contourne pas, on le TRAVERSE.

   ⚠️ CE BLOC SE COPIE, IL NE S'IMPORTE PAS. Règle du projet : produits
   indépendants = fichiers indépendants. Un `<script src>` partagé ferait
   qu'une panne sur un domaine éteindrait les quatre.

   OÙ LE POSER : dans le module ES de chaque page qui a un `sb`
   (`createClient`), juste après sa création. La partie ARRIVÉE doit
   s'exécuter AVANT toute lecture de session.

   CE QUI VOYAGE DANS L'URL N'EST PAS UN JETON DE SESSION. C'est un code
   d'autorisation : soixante secondes, un seul usage, un seul domaine
   cible, stocké haché côté serveur, et il n'ouvre rien par lui-même —
   il faut l'échanger. La règle « jamais un jeton de session dans une
   URL » vise un jeton qui vit des heures et ouvre tout ; ce n'est pas
   ce qui passe ici.
   ═══════════════════════════════════════════════════════════════════ */

const SSO_FN = 'https://abujjbkbbiumxrokozph.supabase.co/functions/v1/';

/* ── ARRIVÉE ────────────────────────────────────────────────────────
   ⚠️ LE CODE SORT DE L'URL AVANT TOUT AUTRE GESTE. Un code laissé dans
   la barre d'adresse se retrouve dans un signet, un partage, un
   historique — et même brûlé, il n'a rien à y faire.
   On renvoie une promesse : la page doit l'attendre avant de décider si
   quelqu'un est connecté, sinon elle affiche « déconnecté » une demi-
   seconde et le membre voit un clignotement de porte fermée. */
async function ssoArrivee(sb){
  const m = /[#&?]sso=([a-f0-9]{64})/.exec(location.hash) ||
            /[#&?]sso=([a-f0-9]{64})/.exec(location.search);
  if(!m) return false;
  const code = m[1];
  history.replaceState(null, '', location.pathname + location.search.replace(/[?&]sso=[a-f0-9]{64}/, ''));
  try{
    const r = await fetch(SSO_FN + 'sso-redeem', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ code })
    });
    if(!r.ok){ console.error('[sso] redeem', r.status); return false; }
    const { token_hash, email } = await r.json();
    if(!token_hash) return false;
    /* `verifyOtp` ouvre une session NORMALE dans ce `localStorage` :
       avec son refresh token, sa déconnexion, sa durée de vie. On ne
       fabrique aucun jeton à la main. */
    const { error } = await sb.auth.verifyOtp({ type:'email', token_hash, email });
    if(error){ console.error('[sso] verify', error.message); return false; }
    return true;
  }catch(e){ console.error('[sso]', e && e.message || e); return false; }
}

/* ── DÉPART ─────────────────────────────────────────────────────────
   `cible` est un NOM DE PRODUIT — 'com' | 'space' | 'boutique' | 'club' —
   jamais une URL. Le serveur seul sait à quelle origine chaque nom
   correspond : une page qui choisirait librement sa destination
   laisserait n'importe quel site demander un code pour lui-même.

   ⚠️ SI LE PONT ÉCHOUE, ON PART QUAND MÊME. Le membre arrivera
   déconnecté et se connectera par email — c'est dégradé, ce n'est pas
   cassé. Bloquer la porte parce que le pont tousse serait pire que le
   problème qu'on résout. */
async function ssoVersDomaine(sb, cible, url){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const r = await fetch(SSO_FN + 'sso-mint', {
        method:'POST',
        headers:{ 'authorization':'Bearer '+session.access_token,
                  'content-type':'application/json' },
        body: JSON.stringify({ target: cible })
      });
      if(r.ok){
        const { code } = await r.json();
        if(code){ location.href = url + (url.includes('#') ? '&' : '#') + 'sso=' + code; return; }
      } else console.error('[sso] mint', r.status);
    }
  }catch(e){ console.error('[sso]', e && e.message || e); }
  location.href = url;
}

/* ── LE DÉMARRAGE — ET POURQUOI IL EST BLOQUANT ─────────────────────
   `await` au NIVEAU DU MODULE : tout ce qui suit dans le fichier attend.
   C'est voulu, et c'est la seule forme qui marche partout sans recâbler
   sept pages différentes. Chacune a son propre démarrage ; leur demander
   à toutes d'appeler la bonne fonction au bon moment, c'est sept
   occasions de se tromper — et la première oubliée donnerait un membre
   qui arrive déconnecté sans que rien ne le signale.
   Ici, quand la page lit sa session, la session est déjà là.

   ⚠️ ET ÇA NE BLOQUE JAMAIS PLUS DE 2,5 SECONDES. Si le pont ne répond
   pas, on continue SANS session : le membre se connectera par email.
   Dégradé, pas cassé. Une page qui ne s'affiche pas parce qu'un pont
   tousse serait bien pire que le problème qu'on résout.
   Et quand il n'y a pas de code dans l'URL — le cas de loin le plus
   fréquent — `ssoArrivee` rend `false` immédiatement, sans un octet de
   réseau. */
await Promise.race([
  ssoArrivee(sb),
  new Promise(r => setTimeout(() => r(false), 2500)),
]);


const BASE  = SB_URL + '/storage/v1/object/public/wah/';
const FILES = [

];

const TOTAL  = VCOUNT + 1; // slide 0 = intro, slides 1‒27 = videos

const deck      = document.getElementById('deck');

const navDownEl    = document.getElementById('nav-down');

let cur = 0;

/* ── INTRO SLIDE (index 0) ── */

// Artwork acquire
async function acquireArtwork(artworkId, btn){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.href='/get_higher.html?return=origins.html'; return; }
  btn.classList.add('loading'); btn.textContent='loading…';
  try{
    const r = await fetch(ART_FN,{method:'POST',
      headers:{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({artwork_id:artworkId})});
    const j = await r.json();
    if(r.status===402){ location.href=j.redirect||'/get_higher.html'; return; }
    if(r.status===409){ btn.textContent='Unavailable'; btn.disabled=true; return; }
    if(j.url){ location.href=j.url; return; }
    // Sinon (typiquement 502 stripe) : ne pas laisser retomber en silence,
    // sinon le membre pense que le clic n'a rien fait.
    console.error('artwork checkout:', r.status, j);
    btn.classList.remove('loading'); btn.textContent='checkout error — retry';
    setTimeout(()=>{ btn.textContent='Acquire →'; }, 4000);
  }catch(e){
    console.error('artwork checkout:', e);
    btn.classList.remove('loading'); btn.textContent='network error — retry';
    setTimeout(()=>{ btn.textContent='Acquire →'; }, 4000);
  }
}

// Populate labels when artworks loaded

/* ── POSITIONING ── */
function positionSlides(animated){
  Array.from(deck.children).forEach((s,i)=>{
    s.style.transition = animated ? '' : 'none';
    s.style.transform  = `translateY(${(i - cur) * 100}%)`;
  });
}

/* ── VIDEO OPS ── */
const loaded = new Array(VCOUNT).fill(false);
const vi = si => si - 1; // slide index → video index (-1 on intro slide)
function loadVid(i){ if(i < 0 || i >= VCOUNT || loaded[i]) return; loaded[i] = true; videos[i].src = BASE + FILES[i]; videos[i].load(); }
function playVid(i){
  if(i < 0 || i >= VCOUNT) return;
  loadVid(i);
  videos[i].play().catch(()=>{ videos[i].addEventListener('canplay', ()=>videos[i].play().catch(()=>{}), {once:true}); });
}
function pauseVid(i){ if(i >= 0 && i < VCOUNT) videos[i].pause(); }
function preload(si){ [vi(si)-1, vi(si), vi(si)+1].forEach(loadVid); }

/* ── TILT CONTROLLER ── */
function makeTilt(sceneEl, cardEl){
  let rX=3, rY=8, vX=0, vY=0, idleT=0, hX=null, hY=null;
  let lastTs=null, active=false, raf=null;
  let grabbed=false, gx=0, gy=0, gRX=0, gRY=0, gt=0;
  const idle = t => ({ x: Math.sin(t*.5)*4 + Math.cos(t*.9)*2, y: Math.cos(t*.35)*10 + Math.sin(t*.8)*4 });
  function tick(ts){
    if(!active) return;
    if(!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, .05); lastTs = ts;
    if(!grabbed){
      idleT += dt * .25;
      const g = idle(idleT), tx = hX !== null ? hX : g.x, ty = hY !== null ? hY : g.y, k = hX !== null ? 8 : 4;
      vX += ((tx - rX)*k - vX*3.5)*dt; vY += ((ty - rY)*k - vY*3.5)*dt;
      rX += vX*dt; rY += vY*dt;
    }
    cardEl.style.transform = `rotateX(${rX.toFixed(2)}deg) rotateY(${rY.toFixed(2)}deg)`;
    raf = requestAnimationFrame(tick);
  }
  sceneEl.addEventListener('mousemove', e=>{
    if(grabbed) return;
    const r = sceneEl.getBoundingClientRect();
    hX = -((e.clientY - r.top  - r.height/2) / (r.height/2)) * 12;
    hY =  ((e.clientX - r.left - r.width/2 ) / (r.width /2)) * 18;
  });
  sceneEl.addEventListener('mouseleave', ()=>{ hX = null; hY = null; });
  function onDown(cx,cy,ts){ grabbed=true; gx=cx; gy=cy; gRX=rX; gRY=rY; gt=ts; sceneEl.classList.add('grabbing'); }
  function onMove(cx,cy){ if(!grabbed) return; rX=gRX-(cy-gy)*.45; rY=gRY+(cx-gx)*.6; cardEl.style.transform=`rotateX(${rX.toFixed(2)}deg) rotateY(${rY.toFixed(2)}deg)`; }
  function onUp(cx,ts){
    if(!grabbed) return;
    const res = {dx: cx-gx, dt: Math.max(1,ts-gt)};
    grabbed = false;
    const aY = Math.abs(rY%360);
    if(!(aY > 90 && aY < 270)) rY = Math.round(rY/360)*360;
    vX = 0; vY = 0;
    sceneEl.classList.remove('grabbing');
    return res;
  }
  return {
    start(){ if(active) return; active=true; lastTs=null; raf=requestAnimationFrame(tick); },
    stop(){
      active=false; grabbed=false;
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      rX=3; rY=8; vX=0; vY=0;
      cardEl.style.transform='rotateX(3deg) rotateY(8deg)';
      sceneEl.classList.remove('grabbing');
    },
    onDown, onMove, onUp
  };
}
const tilts = [];
for(let i = 0; i < VCOUNT; i++)
  tilts.push(makeTilt(document.getElementById(`scene${i}`), document.getElementById(`card${i}`)));

/* ── NAVIGATION ── */
function updateUI(){
  const v = vi(cur);
  counterEl.textContent = cur === 0 ? '' : `${v+1} / ${VCOUNT}`;
  navDownEl.classList.toggle('hidden', cur === TOTAL - 1);
  navDownLabel.textContent = cur === 0 ? 'begin the story' : 'next chapter';
  navUpEl.classList.toggle('hidden', cur === 0);
}

function goTo(n){
  n = Math.max(0, Math.min(TOTAL-1, n));
  if(n === cur) return;
  const pv = vi(cur), nv = vi(n);
  pauseVid(pv);
  if(cur > 0) tilts[pv].stop();
  cur = n;
  positionSlides(true);
  preload(cur);
  if(cur > 0) tilts[nv].start();
  setTimeout(()=>{ if(cur === n && cur > 0) playVid(nv); }, 650);
  updateUI();
}

navDownEl.addEventListener('click', ()=>goTo(cur + 1));
navUpEl.addEventListener('click',   ()=>goTo(cur - 1));

/* ── POINTER (tilt on card + swipe to navigate) ── */
(()=>{
  let pid=null, y0=0, x0=0, t0=0, inTilt=false;
  const H = ()=>window.innerHeight||1;
  const curScene = ()=>cur > 0 ? document.getElementById(`scene${vi(cur)}`) : null;

  document.addEventListener('pointerdown', e=>{
    if(pid !== null) return;
    pid=e.pointerId; x0=e.clientX; y0=e.clientY; t0=e.timeStamp;
    inTilt = !!curScene()?.contains(e.target);
    if(inTilt) tilts[vi(cur)].onDown(e.clientX, e.clientY, e.timeStamp);
  });
  document.addEventListener('pointermove', e=>{
    if(pid === null || e.pointerId !== pid) return;
    if(inTilt && cur > 0) tilts[vi(cur)].onMove(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', e=>{
    if(pid === null || e.pointerId !== pid) return;
    const dy=e.clientY-y0, dx=e.clientX-x0, dt=Math.max(1,e.timeStamp-t0);
    if(inTilt && cur > 0) tilts[vi(cur)].onUp(e.clientX, e.timeStamp);
    pid=null; inTilt=false;
    if(Math.abs(dy) > Math.abs(dx)){
      if(Math.abs(dy)/dt > 0.35 || Math.abs(dy) > H()*.22) goTo(cur + (dy < 0 ? 1 : -1));
    }
  });
  document.addEventListener('pointercancel', ()=>{
    if(pid !== null){ if(inTilt && cur > 0) tilts[vi(cur)].onUp(x0, t0); pid=null; inTilt=false; }
  });

  let acc=0, wlock=0;
  document.addEventListener('wheel', e=>{
    e.preventDefault();
    if(Date.now() < wlock){ acc=0; return; }
    acc += e.deltaY;
    if(Math.abs(acc) < H() * .12) return;
    const dir = acc > 0 ? 1 : -1; acc=0; wlock=Date.now()+500;
    goTo(cur + dir);
  }, {passive:false});
})();

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight') goTo(cur+1);
  if(e.key==='ArrowUp' ||e.key==='ArrowLeft' ) goTo(cur-1);
});
window.addEventListener('resize', ()=>positionSlides(false));

/* ── INIT ── */
positionSlides(false);
preload(0);
updateUI();
</script>
