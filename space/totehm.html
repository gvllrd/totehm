window.addEventListener('keydown',(e)=>{
  if(fpOpen()){if(e.key==='Escape')closeFreqPanel();return;}
  /* LE FIX CLAVIER. Une flèche dans un champ déplace le curseur, point.
     Les habitudes sont des <textarea> : ne tester que INPUT laissait la
     flèche gauche changer de page en pleine écriture. */
  if(isTyping(e))return;
  if(document.body.classList.contains('gate'))return;
  if($('member-window').classList.contains('show')){if(e.key==='Escape')$('member-window').classList.remove('show');return;}
  if(e.key==='Escape'){
    /* Les modales se ferment par leurs propres écouteurs : on ne replie
       le Totehm que si l'écran est nu. */
    if(!$('filter-modal').classList.contains('hide')||!$('habit-peek').classList.contains('hide'))return;
    if(false)return;
    if(hOpen()){showBook(false);showNext(false);return;}
    foldToGate();return;
  }
  if(e.key==='ArrowDown'){e.preventDefault();if(!hOpen())foldToGate();}
  else if(e.key==='ArrowUp'){e.preventDefault();if(!hOpen())openFilterModal();}
  else if(e.key==='ArrowLeft'){e.preventDefault();if($('book').classList.contains('show'))showBook(false);else if(!hOpen())showNext(true);}
  else if(e.key==='ArrowRight'){e.preventDefault();if($('nextobj').classList.contains('show'))showNext(false);else if(!hOpen())showBook(true);}
});
/* Le passé et le futur parlent au présent */
window.addEventListener('message',e=>{
  if(!e.data)return;
  /* Contrat de navigation, identique pour book.html et next_objective.html :
     le T du haut ramène au rail des Habits, le TOTEHM du bas aux Paramètres.
     Toujours — quel que soit l'étage d'où la zone a été ouverte. */
  /* Le T du haut ET le TOTEHM du bas ramènent au Totehm. Bascule sèche :
     aucun setTimeout, aucun fondu — la couleur change d'une seule frame. */
  if(e.data.type==='totehm-close-book'||e.data.type==='totehm-close-next'
     ||e.data.type==='totehm-goto-settings'){
    closeWeightPick();
    showBook(false);showNext(false);
  }
  else if(e.data.type==='totehm-add-habit'&&e.data.habit&&e.data.habit.t){
    const h=e.data.habit;
    state.habits.push({t:String(h.t).slice(0,80),f:h.f||null,i:h.i||null});
    logTotehmEvent('habit_added',h.t,{f:h.f||null,i:h.i||null,source:'next_objective'});
    save();renderHabits();
  }
  /* ══ LA FENÊTRE DE LECTURE, OUVERTE PAR LE PARENT ══
     Une iframe ne peut pas noircir l'écran au-delà de son propre cadre : sur
     desktop elle est enfermée dans le carré. Alors ce n'est pas elle qui
     ouvre la fenêtre — c'est nous, avec CELLE du Totehm, celle qui couvre
     vraiment tout. « Exactement comme totehm.html » : c'est littéralement
     la fenêtre de totehm.html. */
  else if(e.data.type==='totehm-read-peek'&&e.data.habit){
    openReadPeek(e.data.habit);
  }
  /* Même raison, autre forme : My Wisdom ouvre SA fenêtre de poids, mais
     c'est nous qui noircissons — son 100vh s'arrête au cadre. */
  /* My Wisdom demande le poids d'une leçon : c'est nous qui l'affichons,
     puis nous le lui renvoyons. L'iframe ne quitte jamais son cadre. */
  else if(e.data.type==='totehm-pick-intention'){ openWeightPick(e.data.value||null); }
  /* Une iframe qui vient de démarrer réclame les mesures du rail. */
  else if(e.data.type==='totehm-need-metrics'){
    pushMetrics();
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   LA LOCALISATION — POURQUOI ELLE NE MARCHAIT PAS SUR .space
   ══════════════════════════════════════════════════════════════════════════
   MESURÉ LE 23/08/2026 (w4.mjs, cas A) : sur un navigateur neuf, la page
   d'atterrissage appelait `getCurrentPosition` ZÉRO fois. Le code portait
   même le commentaire « JAMAIS de prompt ici » : la météo n'acceptait
   qu'une permission DÉJÀ accordée. Comme rien ne la demandait jamais, elle
   ne l'était jamais. La boucle était fermée sur elle-même.

   On la demande maintenant — une fois, sur un geste, au seul endroit où
   elle veut dire quelque chose : [Open my Totehm World]. Un prompt lâché au
   chargement, sans contexte, c'est le refus définitif garanti ; le même
   prompt sur le bouton qui dit « mon monde » se comprend tout seul.

   La position est écrite dans `totehm_geo_v2`, la clé que map.html relit :
   même origine (www.totehm.space), même localStorage. Une demande GPS pour
   les deux écrans, et la carte s'ouvre déjà localisée.
   ══════════════════════════════════════════════════════════════════════════ */
/* Deux besoins, deux fonctions. La météo se contente d'une position d'hier ;
   décider s'il faut DEMANDER exige une position fraîche, sinon une entrée
   ancienne (`totehm_map_pos_v1`, écrite sans horodatage par une version
   précédente) bloque le prompt pour toujours. */
const POS_TTL=15*60*1000;
function cachedPos(){
  for(const k of ['totehm_geo_v2','totehm_map_pos_v1']){
    try{
      const c=JSON.parse(localStorage.getItem(k)||'null');
      if(c&&isFinite(c.lat)&&isFinite(c.lng))return c;
    }catch(e){}
  }
  return null;
}
function freshPos(){
  try{
    const c=JSON.parse(localStorage.getItem('totehm_geo_v2')||'null');
    if(c&&isFinite(c.lat)&&isFinite(c.lng)&&c.t&&Date.now()-c.t<POS_TTL)return c;
  }catch(e){}
  return null;
}
/* ══ CE QUI A COÛTÉ CINQ VAGUES ══
   MESURÉ LE 23/08/2026 sur le DÉPLOYÉ, pas sur le fichier : Vercel servait
   `Permissions-Policy: geolocation=(), microphone=(), camera=()` sur tout
   totehm.space. Une liste VIDE désactive la géolocalisation pour tout le
   monde, la page comprise. Le navigateur répond alors :

     code 1 — « Geolocation has been disabled in this document by
                permissions policy. »

   …instantanément, sans jamais montrer de prompt. Et `permissions.query`
   répond quand même « granted » : rien dans l'API ne dit que c'est la
   plateforme qui a tranché. AUCUN JavaScript ne peut revenir dessus.
   Cinq lots de correctifs ont été écrits dans la mauvaise couche.

   Corrigé dans `space/vercel.json` : `geolocation=(self)`.
   Ce diagnostic reste pour que la prochaine régression se lise en une
   seconde au lieu de cinq vagues. */
function geoDiag(e){
  if(!e||e.code!==1)return;
  if(!/permissions policy|feature policy|disabled in this document/i.test(e.message||''))return;
  console.warn('[totehm] La géolocalisation est coupée par un EN-TÊTE, pas par '
    +'l\'utilisateur. Vérifier space/vercel.json : Permissions-Policy doit dire '
    +'geolocation=(self), jamais geolocation=(). Message du navigateur : '+e.message);
}
function storePos(pos){
  const p={lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5),
           acc:Math.round(pos.coords.accuracy||0),t:Date.now()};
  try{localStorage.setItem('totehm_geo_v2',JSON.stringify(p));}catch(e){}
  return p;
}

/* SEARCH A TOTEHM : Enter -> full-screen read-only (le pattern Decode) */
async function openTotehmView(q){
  const note=$('search-note');
  note.className='note dim';note.textContent='searching\u2026';
  let name=null, habits=null, pid=null;
  if(!me){
    const ql=q.toLowerCase();
    const u=NETWORK.find(x=>x.who.toLowerCase()===ql)||NETWORK.find(x=>x.who.toLowerCase().indexOf(ql)!==-1);
    if(!u){note.className='note no';note.textContent='no Totehm by that name';return;}
    name=u.who;habits=(u.vis==='members')?u.habits:null;
  }else{
    let {data:ps}=await sb.from('profiles').select('id,pseudo').ilike('pseudo',q).limit(1);
    let p=(ps&&ps[0])||null;
    if(!p){const {data:ps2}=await sb.from('profiles').select('id,pseudo').ilike('pseudo','%'+q+'%').limit(1);p=(ps2&&ps2[0])||null;}
    if(!p){note.className='note no';note.textContent='no Totehm by that name';return;}
    name=p.pseudo; pid=p.id;
    const {data:rows}=await sb.from('totehms').select('steps,totehm_visibility').eq('user_id',p.id).eq('totehm_visibility','members');
    if(rows&&rows.length){
      habits=[];rows.forEach(r=>{(Array.isArray(r.steps)?r.steps:[]).forEach(s=>{if(s&&s.t)habits.push(s);});});
      if(!habits.length)habits=null;
    }
  }
  note.textContent='';
  if(!habits){ note.className='note dim'; note.textContent='this Totehm is private'; return; }
  $('member-window').classList.remove('show');
  /* On ne montre plus une liste : on OUVRE son Totehm, les trois volets. */
  location.href='totehm.html?ro='+encodeURIComponent(name);
}

/* ══ L'OFFRE UNIQUE — HIGHER CLUB ═══════════════════════════════════════════
   Un seul palier remplace Seed / Plant / Tree : essai 7 jours, puis un tarif
   unique qui inclut la Higher Map et le Totehm Cloth.

   ⚠️ SEUL ENDROIT À ÉDITER pour ton tarif réel. `price` / `priceAlt` sont des
   marques-places (je n'ai pas accès à ton Stripe) : j'ai repris le tarif Plant,

   NOM : le brief disait « Figher Club ». Je l'ai lu « Higher Club » — cohérent
   avec la marque HIGHER omniprésente (asset #higher-word, « Get Higher »…).
   Pour revenir en arrière : change simplement CLUB.name ci-dessous. */
const CLUB={
  key:'higher',
  name:'Higher Club',
  trial:'7-day free trial',

  priceAlt:'€70 / year',
  /* Le palier se vendait en un paragraphe et trois puces. Le nom, l'essai et
     le prix suffisent : qui est déjà dans son Totehm n'a pas besoin qu'on lui
     explique ce qu'il y trouve. Pour rétablir l'argumentaire, il suffit de
     remplir `why` et `perks` — paintSubscription() les affiche dès qu'ils
     ne sont pas vides. */

};

/* Lit l'abonnement de l'utilisateur. Rien n'est écrit depuis le client :
   c'est le webhook du fournisseur de paiement qui fait foi. */
/* Deux chemins, deux objets en base, aucun email côté client :
   ma propre accréditation vient de stoner_access, protégée par une policy
   « ma ligne » ; celle d'autrui vient de la vue higher_badges, qui n'expose
   que l'id et le pseudo. */
let myHigher=false;
const HI_SVG='<span class="hi-badge" title="Higher"><svg viewBox="0 0 600 200" aria-label="Higher" role="img"><use href="#higher-badge"></use></svg></span>';
/* Un seul endroit pose la classe, un seul endroit la retire : le drapeau et
   l'affichage ne peuvent pas diverger. */
function paintHigher(){
  document.body.classList.toggle('higher',!!myHigher);
  /* Le générateur porte le même tag : on lui dit, il ne redemande pas. */
  ['book-frame','nextobj-frame'].forEach(id=>{
    const f=$(id);
    if(f&&f.contentWindow){try{f.contentWindow.postMessage({type:'totehm-higher',on:!!myHigher},'*');}catch(e){}}
  });
}
async function loadHigher(){
  myHigher=false; paintHigher();
  if(!me)return;
  try{
    /* ══ DEUX CONDITIONS, PAS UNE ══
       Le badge disait « j'ai fait la méthode Stoner ». Il doit dire
       « je suis membre actif ET j'ai fait la méthode » — c'est l'engagement
       complet dans l'écosystème qu'il valorise, pas un achat isolé sur .com.
       La RLS de `stoner_access` restreint déjà la lecture à sa propre ligne
       (lower(email) = lower(auth.jwt()->>'email')) : le front ne peut pas
       lire celle d'un autre, et ne décide de rien tout seul. */
    const [{data:st},{data:sub}]=await Promise.all([
      sb.from('stoner_access').select('granted_at').limit(1),
      sb.from('subscriptions').select('status').eq('user_id',me.id)
        .in('status',['active','trialing']).limit(1)
    ]);
    myHigher=!!(st&&st.length&&st[0].granted_at) && !!(sub&&sub.length);
  }catch(_){ myHigher=false; /* illisible = pas de badge, jamais d'erreur */ }
  paintHigher();
}
async function isHigher(profileId){
  if(!me||!profileId)return false;
  try{
    const {data}=await sb.from('higher_badges').select('id').eq('id',profileId).limit(1);
    return !!(data&&data.length);
  }catch(_){ return false; }
}
async function loadSubscription(){
  if(!me) return null;
  try{
    const {data}=await sb.from('subscriptions')
      .select('tier,status,current_period_end,cancel_at_period_end')
      .eq('user_id',me.id).maybeSingle();
    return data||null;
  }catch(e){ return null; }
}

function paintSubscription(sub){
  const box=$('mw-sub'); if(!box) return;
  const live=sub && ['active','trialing','past_due'].includes(sub.status);
  if(live){
    /* Un seul palier : quel que soit le `tier` en base (y compris d'anciens
       seed/plant/tree), c'est le Higher Club. */
    const end=sub.current_period_end?new Date(sub.current_period_end):null;
    const when=end?end.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
    const meta=sub.cancel_at_period_end
      ? (when?'ends '+when:'ending')
      : (sub.status==='trialing'?(when?'trial ends '+when:'trial')
        :(sub.status==='past_due'?'payment failed':(when?'renews '+when:'active')));
    box.innerHTML='<div class="s-lab">Your membership</div>'
      +'<div class="s-tier">'+esc(CLUB.name)+'</div>'
      +'<div class="s-meta">'+esc(meta)+'</div>'
      +(CLUB.perks.length?'<ul class="s-perks">'+CLUB.perks.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')
      +'<button class="s-act" id="mw-sub-change">Manage membership</button>';

  }else{

      +'<div class="s-plan s-club">'
      +'<span class="p-top"><span class="p-name">'+esc(CLUB.name)+'</span>'
      +'<span class="p-price">'+esc(CLUB.trial)
      +'<span class="p-alt">then '+esc(CLUB.price)+' \u00b7 '+esc(CLUB.priceAlt)+'</span></span></span>'
      +(CLUB.why?'<span class="p-why">'+esc(CLUB.why)+'</span>':'')
      +(CLUB.perks.length?'<ul class="s-perks">'+CLUB.perks.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')
      +'<button class="s-act" id="mw-club">Start '+esc(CLUB.trial)+'</button>'

      /* Point d'accroche de subscription-checkout. La redirection devra viser
         window.top : lancee depuis une iframe, Stripe est annule en silence. */
      btn.blur();
    };
  }
}
/* ══ TOTEHMBOT ══════════════════════════════════════════════════════
   Le membre pose un spot depuis Telegram : /spot, sept boutons, une
   position native. Aucun geocodage, donc aucune API payante.

   La liaison passe par un code a usage unique, valable 10 minutes, cree
   par new_bot_link_code() et lu par bot-reply au /start. Le compte n'est
   JAMAIS transmis par le message : le bot le retrouve en base.

   telegram_id n'est ni lisible ni ecrivable par le membre (GRANT par
   colonne) — sans quoi n'importe qui pouvait s'attribuer le Telegram
   d'un autre et recevoir ses questions a sa place. D'ou bot_linked(),
   qui ne rend qu'un booleen sur SA ligne. */

async function paintTelegram(sub){
  const box=$('tg-block'); if(!box) return;
  const live = sub && ['active','trialing','past_due'].includes(sub.status);
  /* Pas d'abonnement = /spot repondrait « reserve aux membres du Club ».
     On ne montre pas une porte qui se ferme. */
  box.classList.toggle('hide', !(me && live));
  if(!(me && live)) return;
  try{ const {data}=await sb.rpc('bot_linked'); tgLinked=!!data; }
  catch(_){ tgLinked=false; }
  const b=$('tg-btn'), n=$('tg-note');
  b.classList.toggle('claimed', tgLinked);
  b.textContent = tgLinked ? 'TotehmBot connected' : 'Connect TotehmBot';
  if(n) n.textContent = tgLinked ? 'send /spot to post a place' : '';
}

$('tg-btn').onclick=async()=>{
  const n=$('tg-note');
  if(tgLinked){ window.open('https://t.me/'+TG_BOT,'_blank','noopener'); return; }
  n.className='note dim'; n.textContent='opening telegram…';
  /* La fenetre s'ouvre AVANT l'await : ouverte apres, elle n'est plus
     rattachee au clic et Safari la bloque. On la remplit ensuite. */
  const w=window.open('','_blank');
  const {data,error}=await sb.rpc('new_bot_link_code');
  if(error||!data){
    if(w)w.close();
    n.className='note no'; n.textContent='try again in a minute';
    return;
  }
  const url='https://t.me/'+TG_BOT+'?start='+encodeURIComponent(data);
  if(w){ w.opener=null; w.location=url; } else { location.href=url; }
  n.className='note dim'; n.textContent='say /start in telegram, then come back';
  /* Le code vit 10 min. On represente l'etat au retour d'onglet. */
  setTimeout(()=>{ loadSubscription().then(paintTelegram); }, 4000);
};

/* ══════════════════════════════════════════════════════════════════════════
   LANDING GATE — déconstruction vectorielle, ET SON EXACT CONTRAIRE
   Le JS ne fait QUE mesurer (une fois) où l'UI se trouve réellement, et
   écrit le résultat dans des variables CSS. Toute l'animation est ensuite
   jouée par les transitions CSS sur transform / opacity : netteté absolue.

   LE REPLI. Le gate n'est PLUS détruit après l'entrée (`gate.remove()`) :
   il fallait pouvoir le rejouer à l'envers. Il reste dans le document,
   masqué par `body:not(.gate) #gate{display:none}` — coût : zéro repaint,
   zéro écouteur actif. `fold()` remet body.gate ET body.entered dans la
   même frame (les pièces restent donc où elles sont), force un reflow,
   puis retire `entered` : les quatre calques repartent vers le logo, l'UI
   de l'app s'efface. Aller et retour sont le même geste, à l'envers.
   ══════════════════════════════════════════════════════════════════════════ */
(()=>{
  const gate=$('gate'); if(!gate) return;
  const root=document.documentElement, body=document.body;

  /* Couples calque-du-logo -> élément d'UI d'arrivée */
  const PAIRS=[
    {v:'--tf-t',    from:'gl-t',    to:'ui-t',  uniform:true },
    {v:'--tf-wm',   from:'gl-wm',   to:'ui-wm', uniform:true },
    {v:'--tf-rail', from:'gl-rail', to:'rail',  uniform:false},
    /* Desktop seulement : sur mobile #stage n'a ni largeur ni hauteur, la
       boucle passe son tour et le calque garde son scale(60) plein écran. */
    {v:'--tf-bg',   from:'gl-bg',   to:'stage', uniform:false}
  ];

  /* Chaque calque du logo a un viewBox serré : son rectangle DOM EST le
     rectangle du dessin. Le mapping se réduit donc à un rect -> rect. */
  function measure(){
    for(const p of PAIRS){
      const a=$(p.from), b=$(p.to);
      if(!a||!b) continue;
      const f=a.getBoundingClientRect(), t=b.getBoundingClientRect();
      /* Cible sans boîte — sur mobile #stage n'a que des enfants `fixed`,
         donc une hauteur nulle. On EFFACE la variable au lieu de garder
         l'ancienne : une valeur mesurée en desktop puis rejouée en portrait
         après rotation replierait le fond sur un carré qui n'existe plus. */
      if(!f.width||!f.height||!t.width||!t.height){
        root.style.removeProperty(p.v);
        /* Et on ramène l'échelle de repli à ce qu'il FAUT pour couvrir
           l'écran. `scale(60)` sur 110 px, c'est 6 600 px de carré dans un
           conteneur qui défile : la cause du bug mobile. Il suffit de sortir
           les perforations du champ — au-delà, on ne fait que fabriquer du
           débordement. Le 1,8 est la marge qui les met dehors dans tous les
           sens, y compris quand le logo n'est pas centré verticalement. */
        if(p.v==='--tf-bg'&&f.width){
          const need=Math.ceil(Math.max(window.innerWidth,window.innerHeight)/f.width*1.8);
          root.style.setProperty('--gate-bg-scale',String(Math.max(8,Math.min(60,need))));
        }
        continue;
      }
      const dx=(t.left+t.right)/2-(f.left+f.right)/2;
      const dy=(t.top+t.bottom)/2-(f.top+f.bottom)/2;
      const sx=t.width/f.width, sy=t.height/f.height;
      const s=p.uniform
        ? 'scale('+sx.toFixed(5)+')'
        : 'scale('+sx.toFixed(5)+','+sy.toFixed(5)+')';
      root.style.setProperty(p.v,'translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) '+s);
    }
  }

  const DUR=1050, REVEAL=520;
  let open=false, moving=false, timer=null;

  function enter(then){
    if(open||moving) return;
    moving=true;
    gate.classList.remove('no-anim');
    gate.scrollTop=0;                /* on mesure toujours depuis le haut */
    measure();                       /* dernière mesure juste avant le départ */
    void gate.offsetWidth;           /* reflow : garantit le point de départ  */
    body.classList.add('entered');

    clearTimeout(timer);
    timer=setTimeout(()=>{
      gate.classList.add('gate-off');
      timer=setTimeout(()=>{
        body.classList.remove('gate','entered');
        open=true; moving=false;
        if(then) then();
      },340);
    },DUR+REVEAL+120);
  }

  /* ══ LE REPLI — le déploiement, exactement à l'envers ══

     L'ORDRE DES OPÉRATIONS EST LE CŒUR DU PROBLÈME, ET C'ÉTAIT LE BUG.
     `measure()` lit `getBoundingClientRect()`, qui renvoie le rectangle
     APRÈS transformation. En posant `.entered` AVANT de mesurer, on
     mesurait des calques déjà déplacés : `--tf-bg` était alors recalculé
     depuis la position d'arrivée au lieu de la position de départ, et
     l'échelle du fond se composait avec elle-même. À chaque repli le carré
     navy partait à une taille différente — le « conflit de ratio ».

     Donc : on affiche le gate AU REPOS, on mesure là, et seulement ensuite
     on pose l'état d'arrivée — sans rien animer (`no-anim`), sinon on
     verrait le saut avant de voir le retour.

     `#gate-world` et `#conn-bar` reviennent par le même chemin : ils
     n'ont pas de style inline, seulement la règle `body.gate.entered`.
     Retirer `entered` leur rend `opacity:1` et `pointer-events:auto`. */
  function fold(){
    if(!open||moving) return;
    moving=true;
    clearTimeout(timer);

    gate.classList.add('no-anim');        /* 1. rien ne bouge              */
    gate.classList.remove('gate-off');
    body.classList.add('gate','folding'); /* 2. le gate au repos, opaque,  */
                                          /*    et il NE DÉFILE PAS        */
    gate.scrollTop=0;                     /*    on mesure toujours du haut */
    void gate.offsetWidth;
    measure();                            /* 3. rect NON transformé        */
    body.classList.add('entered');        /* 4. saut à la position d'UI    */
    void gate.offsetWidth;
    gate.classList.remove('no-anim');     /* 5. transitions rendues        */
    void gate.offsetWidth;
    body.classList.remove('entered');     /* 6. et le repli part           */

    open=false;
    timer=setTimeout(()=>{
      body.classList.remove('folding');   /* le défilement redevient normal */
      moving=false;
      /* Le gate se rejoue : la boucle du radar s'était arrêtée en entrant. */
      if(window.__gateRadarStart)window.__gateRadarStart();
    },DUR+120);
  }

  /* Le reste du script replie par ici. */
  foldToGate=fold;

  /* ══ LE SECOND VERROU ══
     `overflow:hidden` empêche l'utilisateur de faire défiler, PAS le
     navigateur : un `scrollTop` programmatique, une mise au point sur un
     champ ou un reste d'inertie passent quand même — mesuré, le bouton du
     bas se faisait chasser hors de l'écran. Alors pendant l'animation on
     réépingle le défilement à zéro à chaque tentative. Piloté par
     l'événement, jamais en boucle : zéro coût au repos. */
  gate.addEventListener('scroll',()=>{
    if(gate.scrollTop&&(body.classList.contains('entered')||body.classList.contains('folding')))
      gate.scrollTop=0;
  },{passive:true});

  /* État 1 (la classe est déjà posée sur <body> dans le HTML : zéro flash) */
  body.classList.add('gate');

  /* Pendant l'état 1, aucun geste ne doit atteindre l'app en dessous — mais
     l'atterrissage a ses propres champs et sa propre vidéo : un geste NÉ
     dans le gate lui appartient. Sans cette exception, la touche Entrée
     n'atteignait jamais le champ de recherche, capturée au niveau window. */
  const swallow=e=>{
    if(!body.classList.contains('gate')) return;
    const t=e.target;
    if(t&&t.closest&&t.closest('#gate')) return;
    e.stopPropagation();
  };
  ['touchstart','touchmove','touchend','wheel','keydown'].forEach(t=>
    window.addEventListener(t,swallow,{capture:true,passive:true}));
  requestAnimationFrame(()=>requestAnimationFrame(measure));
  window.addEventListener('resize',()=>{ if(!open) measure(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!open) measure(); });

  /* Le clic sur le logo = la déconstruction */
  $('gate-enter').onclick=()=>enter();

  /* [Open my Totehm] : strictement le même geste que le clic sur le logo */
  $('gate-open').onclick=()=>enter();

  /* ── Search a Totehm : un bouton, la boîte n'arrive qu'au clic ── */
  const gsb=$('gate-search-btn'), gsi=$('gate-search-input'), gsn=$('gate-search-note');
  if(gsb&&gsi) gsb.onclick=()=>{
    gsb.classList.add('hide');
    gsi.classList.remove('hide');
    if(gsn) gsn.classList.remove('hide');
    setTimeout(()=>{try{gsi.focus();}catch(e){}},100);
  };
  if(gsi) gsi.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ gsi.classList.add('hide'); if(gsn)gsn.classList.add('hide');
                          gsb.classList.remove('hide'); return; }
    if(e.key!=='Enter')return;
    const v=gsi.value.trim();
    if(v.length<2){ if(gsn){gsn.classList.remove('hide');gsn.textContent='2 characters min';} return; }
    enter(()=>openTotehmView(v));
  });

  /* ══ LE RADAR DE FOND ══
     Le même dessin que map.html — grille, trois cercles de portée, balayage
     en vingt secteurs dégressifs. Copié, jamais partagé.
     Aucun appel réseau, aucune donnée : c'est une forme, pas une carte. La
     boucle s'arrête dès que le Totehm est déployé ou l'onglet caché. */
  (function gateRadar(){
    const cv=$('gate-radar'); if(!cv||!cv.getContext)return;
    const wrap=$('radar-wrap');
    const X=cv.getContext('2d');
    let W=0,H=0,dpr=1,t=0,raf=0;
    function size(){
      dpr=Math.min(2,window.devicePixelRatio||1);
      W=wrap.clientWidth;H=wrap.clientHeight;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    }
    function frame(){
      raf=0;
      if(!body.classList.contains('gate')||document.hidden)return;
      /* On remesure dès que le cadre a bougé. Une mesure prise une seule
         fois, avant que la mise en page ne soit posée, donnait un tampon de
         dessin à l'échelle d'un cadre qui n'existait plus : le rond partait
         se dessiner hors de l'écran. */
      if(wrap.clientWidth!==W||wrap.clientHeight!==H)size();
      if(!W||!H)return;
      const cx=W/2, cy=H/2;
      /* « Le plus grand possible sans déborder » : le rayon est la moitié du
         plus PETIT côté, moins un cheveu pour que le trait extérieur ne soit
         pas coupé. Le rond est donc toujours entier, sur mobile comme sur
         desktop, quelle que soit la place que lui laisse le reste. */
      const rpx=Math.max(10,Math.min(W,H)/2-2);
      X.setTransform(dpr,0,0,dpr,0,0);
      X.clearRect(0,0,W,H);
      t+=1/60;

      /* Pas de quadrillé. Le fond de .space est un noir plein — une grille
         par-dessus faisait « application », et .space n'en est pas une. */
      X.strokeStyle='rgba(255,255,255,.17)';X.lineWidth=1;
      for(let k=1;k<=3;k++){X.beginPath();X.arc(cx,cy,rpx*k/3,0,Math.PI*2);X.stroke();}

      const head=t*Math.PI/3;
      for(let i=0;i<20;i++){
        X.beginPath();X.moveTo(cx,cy);
        X.arc(cx,cy,rpx,head-i*0.035-0.035,head-i*0.035);X.closePath();
        X.fillStyle='#ffffff';X.globalAlpha=0.055*(1-i/20);X.fill();
      }
      X.globalAlpha=1;
      /* Le point central : toi. Sans lui le rond n'est qu'un cercle. */
      X.beginPath();X.arc(cx,cy,2.5,0,Math.PI*2);
      X.fillStyle='rgba(255,255,255,.75)';X.fill();
      raf=requestAnimationFrame(frame);
    }
    const start=()=>{ if(!raf&&body.classList.contains('gate')&&!document.hidden){size();raf=requestAnimationFrame(frame);} };
    let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{size();start();},160);});
    document.addEventListener('visibilitychange',start);
    if('ResizeObserver' in window){ new ResizeObserver(()=>{size();start();}).observe(wrap); }
    window.__gateRadarStart=start;
    start();
  })();

  /* ══ NAVIGATION VERS LA HIGHER MAP ══
     Clic sur #ctx-down (« Open my Totehm world ») ou swipe-haut sur le gate
     → map.html. La sélection d'intention se fait sur map.html, qui a son
     propre sélecteur. Pas d'étape intermédiaire ici. */
  {
    const ctxDown=$('ctx-down');
    if(ctxDown) ctxDown.addEventListener('click',()=>{ window.location.href='map.html'; });
    let _gsY=0;
    gate.addEventListener('touchstart',e=>{ _gsY=e.touches[0].clientY; },{passive:true});
    gate.addEventListener('touchend',e=>{
      if(entered||folding)return;
      if(_gsY-e.changedTouches[0].clientY>50) window.location.href='map.html';
    },{passive:true});
  }
})();
</script>
</body>
</html>
