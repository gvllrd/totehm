/* ══════════════════════════════════════════════════════════════════════════
   LANDING GATE — le logo TOTEHM recomposé (4 SVG vectoriels superposés)
   puis DÉCONSTRUIT au clic vers l'UI de l'app. Transitions CSS pures.
   Taille / placement calés sur stoner.html (#stage + #vid-wrap + bouton).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --gate-size:110px;            /* taille du logo assemblé — IDENTIQUE mobile et desktop */
  --gate-top:8vh;
  --gate-gap:3vh;               /* écart logo -> bouton */
  --gate-btn-gap:24px;          /* = margin-top de #btn-slogan (stoner.html) */
  --gate-dur:1.05s;             /* durée de la déconstruction */
  --gate-ease:cubic-bezier(.62,.02,.24,1);
  --gate-bg-scale:60;           /* zoom du fond perforé */
  --gate-bg-fade:1;             /* opacité finale du fond (0.3 pour filigrane) */
  --gate-reveal:.52s;           /* retard avant l'apparition de l'UI */
}

/* Pendant que le repli remet les calques à leur place d'arrivée, RIEN ne
   doit s'animer : sinon on voit le saut avant de voir le retour. */
#gate.no-anim,#gate.no-anim *{transition:none!important;animation:none!important}

/* ── L'écran d'atterrissage ── */
/* ══ LE BUG MOBILE, ET SA CAUSE EXACTE ══
   L'atterrissage défile (`overflow-y:auto`) depuis qu'il porte la Terre.
   Or `#gl-bg` monte à scale(60) pendant l'animation — sur mobile, faute de
   `--tf-bg` mesurable, c'est la valeur de repli. 110 px × 60 = 6 600 px de
   carré à l'intérieur d'un conteneur qui défile : MESURÉ, la hauteur de
   défilement du gate passait de 844 px à 2 525 px pendant le geste. Le
   navigateur ajustait alors la position de défilement et les boutons du bas
   sortaient de l'écran. C'était ça, « des boutons qui disparaissent ».

   Le correctif : PENDANT l'animation (déploiement comme repli), le gate ne
   défile pas. Les deux ne se produisent jamais en même temps — on ne
   parcourt pas la page pendant qu'elle se déplie. Au repos, les calques
   sont à scale(1) et le défilement redevient normal.
   Desktop n'a jamais eu le problème : `--tf-bg` y vaut ~scale(5,8), qui
   tient dans le carré. */
#gate{position:fixed;inset:0;z-index:200;background:#000;
  display:block;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  transition:opacity .32s ease}
#gate-hero{width:100%;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  position:relative;justify-content:space-between;
  padding:max(76px,13vh) 0 max(24px,env(safe-area-inset-bottom,0));overflow:hidden}
body.gate.entered #gate,body.gate.folding #gate{overflow:hidden;scroll-behavior:auto}
body:not(.gate) #gate{display:none}
#gate.gate-off{opacity:0;pointer-events:none}

/* ── Le carré du logo : taille fixe, aucune variation par viewport ── */
/* Rangée haute : logo 4-SVG + bouton côte à côte, centrés ensemble */
#gate-top-row{display:flex;flex-direction:column;align-items:center;
  gap:16px;flex-shrink:0}
#gate-logo{position:relative;flex-shrink:0;
  width:var(--gate-size);height:var(--gate-size)}

/* Chaque calque est cadré au plus juste sur son dessin (viewBox serré) :
   son rectangle DOM == le rectangle du glyphe -> le calcul FLIP est exact. */
#gate-logo .glayer{position:absolute;display:block;overflow:visible;
  transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden;
  transition:transform var(--gate-dur) var(--gate-ease),opacity var(--gate-dur) var(--gate-ease)}
#gl-bg  {left:0;      top:0;       width:100%;     height:100%;     z-index:1}
#gl-rail{left:9.200%; top:.100%;   width:7.650%;   height:99.799%;  z-index:2}
#gl-t   {left:35.501%;top:21.386%; width:29.700%;  height:29.870%;  z-index:3}
#gl-wm  {left:33.349%;top:54.268%; width:34.500%;  height:20.834%;  z-index:3}

/* La zone cliquable qui couvre le logo (cf. #logo-btn de stoner.html) */
#gate-enter{position:absolute;inset:0;z-index:9;background:none;border:none;padding:0;
  cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .25s ease}

/* Deux chemins des l'arrivee, le payant d'abord : la communaute d'un
   influenceur atterrit ici et doit voir le chemin Higher sans s'inscrire
   pour le decouvrir. get_higher.html accepte un visiteur sans session — il
   affiche le prix et ne demande le compte qu'au moment de payer. */
#gate-open{margin-top:0;transition:opacity .25s ease}
/* La phrase « By opening your Totehm… » sous le bouton faisait lire un
   contrat au moment d'entrer. Le lien reste — obligation — mais au coin,
   là où on le cherche quand on le cherche. */
#terms-corner{position:fixed;right:16px;top:14px;z-index:4;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#8a8a8a;text-decoration:none;
  padding:6px 2px;transition:color .15s ease,opacity .25s ease}
body.gate.entered #terms-corner{opacity:0;pointer-events:none}

/* ══ ÉTAT 2 — LA DÉCONSTRUCTION ══
   Les valeurs --tf-* sont mesurées une fois en JS (positions réelles de l'UI)
   puis écrites en variables CSS : l'animation elle-même reste 100% CSS. */
body.gate.entered #gl-bg  {transform:scale(var(--gate-bg-scale));opacity:var(--gate-bg-fade)}
body.gate.entered #gl-t   {transform:var(--tf-t,translateY(-40vh))}
body.gate.entered #gl-wm  {transform:var(--tf-wm,translateY(40vh))}
body.gate.entered #gl-rail{transform:var(--tf-rail,translateX(-30vw))}
body.gate.entered #gate-enter,
body.gate.entered #gate-open,
body.gate.entered #gate-bottom,
body.gate.entered #ctx-down,
body.gate.entered #conn-bar{opacity:0;pointer-events:none}

/* ══ L'UI de l'app : masquée pendant l'état 1, fondu entrant pendant l'état 2 ══ */
body.gate #rail,body.gate #bigT,body.gate #wordmark,
body.gate #floorview,body.gate #menu-arrow,
body.gate #filter-arrow,body.gate #fv-status,body.gate #fold-x,
body.gate #views,body.gate #vname,
body.gate #filter-badge{
  opacity:0;pointer-events:none;transition:opacity .55s ease}
body.gate.entered #rail,body.gate.entered #bigT,body.gate.entered #wordmark,
body.gate.entered #floorview,
body.gate.entered #menu-arrow,body.gate.entered #filter-arrow,
body.gate.entered #fv-status,body.gate.entered #fold-x,
body.gate.entered #views,body.gate.entered #vname,
body.gate.entered #filter-badge{
  opacity:1;pointer-events:auto;transition:opacity .55s ease var(--gate-reveal)}

/* Le rail de l'app reprend exactement le gris du logo (#626286) */
#rail{background:#626286}

@media(prefers-reduced-motion:reduce){
  #gate-logo .glayer{transition-duration:.01ms!important}
  body.gate #rail,body.gate #bigT,body.gate #wordmark,
  body.gate #floorview,body.gate #menu-arrow,
  body.gate #filter-arrow,body.gate #fv-status,body.gate #fold-x,
  body.gate #filter-badge{transition-duration:.01ms!important}
}
/* ── Gate: zone basse (Search + phrase) — margin-top:auto pousse vers le bas ── */
#gate-bottom{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;width:100%;flex-shrink:0;transition:opacity .25s ease}
#conn-bar{transition:color .15s,opacity .25s ease}
/* ── Gate: Search bar — style moteur de recherche ── */
/* Une box rectangulaire pleine, #626283 — pas la tuile perforée navy des
   boutons. `border-image:none` est obligatoire : sans lui la tuile héritée
   de .line-input reste peinte PAR-DESSUS le fond et rien ne change. */
#gate-search-input{width:min(320px,82vw);min-width:0;font-size:15px}
#gate-search-input,#search-input{background:#626283;border:6px solid #626283;
  border-image:none;color:#fff;caret-color:#fff}
#gate-search-input::placeholder,#search-input::placeholder{color:rgba(255,255,255,.55)}
/* ── Desktop : texte gris → blanc au survol ── */
@media(hover:hover){

  .set-note:hover,.bot-txt:hover,.acct-note:hover,.hp-lbl:hover,.hp-def:hover,.fp-int .df:hover,.mw-mail:hover,.mw-body:hover{color:#fff}
}
/* SUPPRIMÉ (29/08) — .sn-tile, les tuiles perforées qui portaient un chevron
   dans les boutons My Wisdom / My next objective du menu membre. */
/* ── Le T de la ligne d'ajout clignote : c'est l'invitation, il n'y a
      plus un mot pour la dire. Il ouvre temporalité puis intention. ── */
@keyframes t-pulse{0%,100%{opacity:1}50%{opacity:.18}}
.h-T.blink{animation:t-pulse 2.2s ease-in-out infinite}

/* ── LA CROIX DE REPLI ──
   Sur le flanc droit du Totehm, à mi-hauteur : le seul endroit libre de
   tout — le badge de filtre occupe le coin haut droit, les chevrons de
   navigation vivent HORS du carré. Elle rejoue le déploiement à l'envers
   et ramène à l'atterrissage. */
#fold-x{position:fixed;top:10px;right:10px;z-index:34;
  background:none;border:none;cursor:pointer;padding:10px;line-height:0;
  -webkit-tap-highlight-color:transparent}
#fold-x svg{width:20px;height:20px;color:rgba(255,255,255,.5);display:block;

@media(hover:hover){#fold-x:hover svg{color:#fff}}
#fold-x:active svg{color:#fff}

/* ── L'ATTERRISSAGE : la Terre et la porte du monde ──
   La vidéo n'est chargée QUE si elle entre dans le champ (IntersectionObserver).
   1,9 Mo servis à chaque visiteur qui ne descend jamais, c'est de l'egress
   payé pour rien. */
/* La Terre suit le bloc Search, elle ne se colle PAS au bas du cadre :
   `margin-top:auto` la plaquait en bas et ouvrait un trou noir de 350 px
   au milieu de l'atterrissage. Une marge franche, et la page se lit d'un
   trait — logo, portes, Terre. */
#ctx-down{margin-top:2.5vh;margin-bottom:calc(3vh + env(safe-area-inset-bottom,0));flex-shrink:0;
  background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;
  transition:opacity .25s ease}
.ctx-label{font-family:'Quantico',sans-serif;font-weight:400;font-size:14px;
  color:#b0b0b0;transition:color .15s ease}
.chev{width:22px;height:22px;color:#909090;transition:color .15s ease}
@media(hover:hover){#ctx-down:hover .ctx-label,#ctx-down:hover .chev{color:#fff}}
/* SUPPRIMÉ (29/08) — #ctx-up, le chevron vers le haut. Il avait déjà été
   annulé en vague 5B ; son bouton et son écouteur partent avec lui. Le
   retour se fait par le scroll, comme l'aller. */
@keyframes ctx-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.bob{animation:ctx-bob 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bob{animation:none}#gate{scroll-behavior:auto}}


/* ══ DESKTOP : le logo habité devient un carré ══════════════════════════════
   Ce bloc est EN FIN DE FEUILLE, pas au début : à spécificité égale c'est le
   dernier déclaré qui gagne. Placé en tête, `html,body{background:#000}` se
   faisait battre par le `html,body{background:var(--navy)}` des règles de
   base — la page restait navy et le carré navy devenait invisible.

   Le fond n'est pas un cadre : c'est le calque #gl-bg lui-même, le carré navy
   perforé du logo. Le noir, c'est la page derrière lui.

   La bordure transparente vaut exactement la profondeur des perforations
   (r = 13.86 / 224.88 = 6.16 % du côté). Comme #stage porte un transform, il
   est le bloc conteneur de tous ses descendants position:fixed, et ceux-ci se
   résolvent sur sa PADDING box : la bordure les écarte donc des trous d'un
   seul coup, sans toucher une ligne de positionnement existante.
   Un padding n'aurait rien fait : sans bordure, padding box == border box.

   La typo ne bouge pas — elle reste celle du mobile. Seul le rail suit le
   carré : les libellés de fréquence vivent à sa gauche et sortaient du cadre.
   ══════════════════════════════════════════════════════════════════════════ */
@media(min-width:700px){
  :root{
    /* 78vw et pas 94vw : il faut de la place de chaque côté pour les deux
       boîtes de navigation, sinon elles sortent de la fenêtre.
       Encombrement total = --stage * (1 + 2 * (.058 + .05)) = --stage * 1.216. */
    --stage:min(92vh,78vw,640px);
    --pad:calc(var(--stage) * .0616);   /* profondeur d'une perforation */
    --side:max(56px,calc(var(--stage) * .10));   /* carré élargi : chevron + intitulé */
    --side-gap:calc(var(--stage) * .085);         /* éloigné du Totehm */
    --rl:max(38px,calc(var(--stage) * .072));   /* dégage les T des perforations */
    --rw:max(16px,calc(var(--stage) * .034));   /* rail de saisie, pas rail de logo */
  }
  html,body{background:#000}
  #stage{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:var(--stage);height:var(--stage);
    border:var(--pad) solid transparent;
    background:var(--logo-navy) 0 0/100% 100% no-repeat border-box;
    overflow:hidden;z-index:10;
  }
  /* Le rail s'arrête au T en haut et au wordmark en bas, au lieu de courir
     d'un bord à l'autre : 30px, la même valeur que #bigT et #wordmark. */
  #rail{top:30px;bottom:30px}
  /* #ordbtn coiffe le rail à son sommet : top:30 = même origine que le
     rail lui-même. Le bouton est la finalité visible du rail. */
  #ordbtn{top:30px}
  /* Les carrés sont centrés sous le T dans les deux cas : le T est plus
     petit ici (46px), la rangée remonte d'autant. */
  #views{top:100px}
  #vname{top:124px}
  /* SUPPRIMÉ (05/09) — le papier ne change pas de couleur. Une seule
     tuile, la navy. Ce sont les BOÎTES qui portent les trois couleurs.
     Retour arrière : ces deux lignes reprenaient --logo-blue/--logo-rep,
     tous deux toujours définis en tête de feuille. */
  #stage.z-set{background-image:none}
  /* Le rail est à sa place du logo : il ne reste pas 190 px pour un libellé
     de fréquence. Comme sur mobile, il disparaît — la fréquence se lit en
     ouvrant le T, qui porte déjà fréquence et intention. */
  .habit .h-freq{display:none}

  /* Les iframes couvrent le carré : elles portent leur propre couleur.
     background:#000 reste en place — il est le rideau du fondu enchaîné. */

  /* Les quatre calques du logo convergent vers le mode saisie : le T vers
     #bigT, le wordmark vers #wordmark, le rail vers #rail — et le fond vers
     #stage lui-meme, au lieu du scale(60) qui noyait l'écran de navy. La
     valeur est mesurée en JS ; sur mobile #stage n'a pas de boîte, la mesure
     est ignorée et le scale(60) d'origine reprend la main. */
  body.gate.entered #gl-bg{transform:var(--tf-bg,scale(var(--gate-bg-scale)));opacity:1}

  /* SUPPRIMÉ (29/08) — les carrés perforés .side-nav, leur chevron et leur
     intitulé. Puis les curseurs .tnav qui les avaient remplacés (05/09).
     La navigation passe par les trois carrés #views, en haut à gauche,
     ordinateur et mobile — et il n'y a plus trois fichiers, il y en a un.
     Retour arrière : le bloc #views en tête de feuille. */
  /* ══ LE TOTEHM SE REPLIE ══
     Le repli ne passe plus par un étage : c'est le module GATE qui rejoue
     le déploiement à l'envers, sur les quatre pièces du logo —
     #gl-bg -> le fond navy de #stage, #gl-t -> #bigT,
     #gl-wm -> #wordmark, #gl-rail -> #rail. Même durée, même easing
     (--gate-dur, --gate-ease) : l'aller et le retour sont le même geste. */
  #fv-inner{scroll-snap-type:none}
  #habits{flex-shrink:0;height:auto}

  #settings-nav .sn-btn{font-size:14px}

  #sn-home{display:flex}
  #sn-home img{width:54px;height:auto}
  #sn-home:hover,#sn-home:active{border-image-source:none;color:#b0b0b0}
  /* Desktop : freq-panel reste ancré en haut aussi. Un utilisateur qui
     revient de mobile ne doit pas voir la carte sauter selon le device. */
  .fp-card{max-height:calc(100vh - 88px)}
}
























































































/* ══ MOBILE — COIN HAUT GAUCHE HARMONISÉ AVEC LA CROIX · 07/09/2026 ═════
   Sur mobile, #ordbtn (classer) prend la même géométrie que #fold-x — même
   top, même padding, même dimensions — pour créer un tout harmonieux avec
   la croix à droite. #conn-bar quitte le coin gauche (il y a maintenant
   l'icône classer) et se pose au-dessus du T, centré. Le T descend d'une
   ligne pour laisser la place.
   Le rail se colle au bord GAUCHE (var(--rl):0) : les boîtes d'habitudes
   récupèrent la largeur qu'occupait l'espace entre le bord et le rail.
   Le tick devient le bord gauche de la boîte : progression d'opacité
   dans la liste, couleur d'intention pleine en haut. */
@media(max-width:699px){
  /* LE RAIL EST LE LOGO — au téléphone il faut le VOIR. À 6 px sur un
     écran tenu à trente centimètres, ce n'est pas du minimalisme, c'est
     de l'invisible. `--rw` est le jeton unique : le rail, les traits du
     bouton de classement et la marge des boîtes s'y accrochent tous, donc
     un seul chiffre les épaissit ensemble. */
  /* LE RAIL EST LE LOGO — au téléphone il faut le VOIR, sans le laisser
     devenir une barre. 8 px : un cran au-dessus des 6 px d'origine, et
     l'icône s'y accroche par `--rw`, donc les deux restent taillés dans
     la même mesure. */
  :root{--rl:0px;--rw:8px;--band-t:150px}
  /* #ordbtn hérite du positionnement de base : centré sur le rail,
     tout en haut. Sur mobile le rail commence à left:0 : le bouton est
     centré sur --rw/2 = 3px. Un peu plus haut qu'en desktop puisqu'il
     n'y a pas de padding de #stage à respecter. */
  #ordbtn{top:4px}
  /* L'accès membre quitte le coin gauche (repris par #ordbtn) et se pose
     au-dessus du T, centré. `body:not(.gate)` : dans l'atterrissage,
     #conn-bar garde sa place d'origine — le logo composé du gate occupe
     déjà le centre. */
  body:not(.gate) #conn-bar{top:8px;left:50%;right:auto;transform:translateX(-50%);padding:6px 10px}
  #bigT{top:44px}
  #bigT svg{height:48px}
  #views{top:118px}
  #vname{top:142px}
  /* Rail fin et sourd — une trace, pas une bande. Il tient la colonne du
     regard sans peser. */
  #rail{background:rgba(255,255,255,.16)}
  .habit .h-body{margin-left:calc(var(--rw) + 4px)}
}

async function logTotehmEvent(kind, habitText, detail){
  const ev={kind, habit_text:habitText||null, detail:detail||{}, created_at:new Date().toISOString()};
  try{
    const raw=localStorage.getItem('totehm_events');
    const arr=raw?JSON.parse(raw):[];
    arr.push(ev);
    if(arr.length>500)arr.splice(0,arr.length-500); /* garde les 500 derniers en local */

  }catch(e){}
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      await sb.from('totehm_events').insert({user_id:session.user.id,kind,habit_text:habitText||null,detail:detail||{}});

}

/* détecte un mot-clé simple sur des tokens */
const hasKw=(n,arr)=>arr.some(k=>new RegExp('(^|\\s)'+k+'($|\\s)').test(n));
const hasPhr=(n,arr)=>arr.some(p=>n.indexOf(norm(p))!==-1);

/* deduceFreq : trouve TOUJOURS un ID (fallback = sometimes) */
function deduceFreq(raw){
  const original=String(raw||'').trim();
  let n=norm(raw);
  /* pas de tokens latins mais du texte non vide : fallback direct */
  if(!n){ return original.length ? 'sometimes' : null; }

  /* match exact sur un label */
  const exact=FREQS.find(f=>f.label===n);
  if(exact)return exact.id;

  /* phrases idiomatiques d'abord (avant tokenisation qui pourrait couper) */
  const PHRASE_TO_ID={weekend:'every_weekend',weekday:'every_weekday',afternoon:'every_afternoon',morning:'every_morning',evening:'every_evening',night:'every_night',birthday:'every_birthday',newyear:'every_newyear',sometimes:'sometimes',seasonal:'seasonal',every_1st_month:'every_1st_month',every_15th_month:'every_15th_month',daily:'daily',weekly:'weekly'};
  for(const k of Object.keys(PHRASES)){
    if(hasPhr(n,PHRASES[k]))return PHRASE_TO_ID[k]||k;
  }

  /* fragments de label (ex "twice week" -> "twice a week") */
  if(n.length>=4){
    const partial=FREQS.find(f=>{
      const fl=f.label;
      return fl.indexOf(n)!==-1 || (n.length>=fl.length-3 && n.indexOf(fl)!==-1);
    });
    if(partial)return partial.id;
  }

  /* nombres en lettres → chiffres */
  n=n.replace(/(^|\s)(deux|two|dos|due|zwei|twee)($|\s)/g,'$12$3')
     .replace(/(^|\s)(trois|three|tres|tre|drei|drie)($|\s)/g,'$13$3')
     .replace(/(^|\s)(quatre|four|cuatro|quattro|vier)($|\s)/g,'$14$3')
     .replace(/(^|\s)(cinq|five|cinco|cinque|funf)($|\s)/g,'$15$3')
     .replace(/(^|\s)(six|seis|sei|sechs|zes)($|\s)/g,'$16$3')
     .replace(/(^|\s)(sept|seven|siete|sette|sieben|zeven)($|\s)/g,'$17$3');

  let mult=false,num=null;
  if(/(^|\s)(twice|bihebdo|zweimal)($|\s)/.test(n)){mult=true;num=2;}
  if(/(^|\s)(thrice|dreimal)($|\s)/.test(n)){mult=true;num=3;}
  if(/(^|\s)(once|einmal|una vez|una volta|1 fois)($|\s)/.test(n)){num=num||1;}
  const nm=n.match(/(\d+)/);
  if(nm)num=parseInt(nm[1],10);
  if(/(?:^|\s)(x\d+|\d+x|times|fois|vezes|veces|vez|volte|volta|mal|keer|per|par|por|al|pro|nel|dans|dentro)(?:$|\s)/.test(n))mult=true;
  if(/(^|\s)(several|plusieurs|varias|varios|varie|mehrmals|meermaals|multiple|many|beaucoup)($|\s)/.test(n))mult=true;

  /* jours nommés */
  for(const d in DAYS){if(hasKw(n,DAYS[d]))return 'every_'+d;}

  /* dates spéciales */
  if(hasKw(n,LEX.birthday))return 'every_birthday';
  if(hasKw(n,LEX.newyear))return 'every_newyear';
  if(hasKw(n,LEX.season)){return 'seasonal';}

  /* fenêtres de journée */
  if(hasKw(n,LEX.afternoon))return 'every_afternoon';
  if(hasKw(n,LEX.morning))return 'every_morning';
  if(hasKw(n,LEX.evening))return 'every_evening';
  if(hasKw(n,LEX.night))return 'every_night';

  /* weekend / weekday */
  if(hasKw(n,LEX.weekend))return 'every_weekend';
  if(hasKw(n,LEX.weekday))return 'every_weekday';

  /* fortnight */
  if(hasKw(n,LEX.fortnight))return 'biweekly';

  /* random / sometimes (avant fenêtres génériques) */
  if(hasKw(n,LEX.random))return 'randomly';
  if(hasKw(n,LEX.sometimes))return 'sometimes';

  /* minute / heure */
  if(hasKw(n,LEX.minute))return 'every_minute';
  if(hasKw(n,LEX.hour))return 'hourly';

  /* jour */
  if(hasKw(n,LEX.day)){
    if(/(^|\s)(other|alterni|alternos|sur 2)($|\s)/.test(n))return 'every_other_day';
    if(num===2&&!mult)return 'every_other_day';
    if(mult&&num&&num>=2)return 'several_daily';
    if(/(^|\s)(several|plusieurs|varias|varios|varie|mehrmals|meermaals)($|\s)/.test(n))return 'several_daily';
    return 'daily';
  }

  /* semaine */
  if(hasKw(n,LEX.week)){
    if(num===2&&mult)return 'twice_week';
    if(num===2&&!mult)return 'biweekly';
    if(num&&num>=3&&!mult)return 'monthly';
    return 'weekly';
  }

  /* mois */
  if(hasKw(n,LEX.month)){
    if(num===2&&mult)return 'twice_month';
    if(num===1)return 'every_1st_month';
    if(num===15)return 'every_15th_month';
    if(num&&num>=5&&!mult)return 'semiannual';
    if(num&&num>=3&&!mult)return 'quarterly';
    return 'monthly';
  }

  /* trimestre / semestre / année */
  if(hasKw(n,LEX.quarter))return 'quarterly';
  if(hasKw(n,LEX.semi))return 'semiannual';
  if(hasKw(n,LEX.year)){
    if(num&&num>=2&&!mult)return 'sometimes';
    return 'yearly';
  }

  /* dernier fallback : GARANTI un résultat */
  return 'sometimes';
}

       envoyées : en la retirant, l'interrupteur cesse d'être un effet de
       bord de la saisie. Il vit dans `set_bot()`. */
    const {error}=await sb.from('totehms').upsert({

      steps:state.habits,

  data.forEach(r=>{(Array.isArray(r.steps)?r.steps:[]).forEach(s=>{const k=norm(s.t);if(s.t&&!seen[k]){seen[k]=1;habits.push({t:s.t,f:FREQ_BY_ID[s.f]?s.f:null,i:INT_BY_ID[s.i]?s.i:null,o:s.o||null});}});});

    .select('steps,totehm_visibility').eq('user_id',prof.id).eq('totehm_visibility','members');
  if(!rows||!rows.length){ roFail('this Totehm is private'); return false; }
  const habits=[];const seen={};
  rows.forEach(r=>{(Array.isArray(r.steps)?r.steps:[]).forEach(x=>{
    const k=norm(x.t); if(x.t&&!seen[k]){seen[k]=1;
      habits.push({t:x.t,f:FREQ_BY_ID[x.f]?x.f:null,i:INT_BY_ID[x.i]?x.i:null,o:x.o||null});}});});
  state={habits, vis:'members'};
  document.body.classList.add('ro');
  $('ro-who').textContent=prof.pseudo;
  if(await isHigher(prof.id))$('ro-who').insertAdjacentHTML('beforeend',HI_SVG);
  renderHabits();
  return true;
}

  document.body.classList.add('ro');

  renderHabits();
}

/* ══ COMPTE ══
   Deux gestes distincts, et rien ne les confond : effacer le Totehm ne touche
   pas a l'abonnement, resilier l'abonnement n'efface pas le Totehm.

   L'effacement passe par la RPC delete_my_totehm, en SECURITY DEFINER, qui
   prend son identite dans auth.uid() et jamais dans un parametre : meme en
   forgeant l'appel, on ne peut effacer que le sien. Elle conserve volontairement
   subscriptions, stoner_access et totehm_clothes.

   Confirmation a deux temps, sans popup : le bouton s'arme, se nomme, et se
   desarme seul au bout de 6 s. Un clic distrait ne peut pas suffire. */
let wipeArmed=0, mySub=null;
async function refreshSub(){
  mySub = me ? await loadSubscription() : null;
  acctPaint();
}
function acctPaint(){
  const box=$('acct'); if(!box)return;
  box.classList.toggle('hide',!me);
  if(!me)return;
  /* Le bouton de resiliation n'existe que s'il y a quelque chose a resilier. */
  const active = mySub && ['active','trialing','past_due'].includes(mySub.status);
  $('acct-cancel').classList.toggle('hide',!active);
}
function wipeReset(){
  clearTimeout(wipeArmed); wipeArmed=0;
  const b=$('acct-wipe');
  b.classList.remove('armed'); b.disabled=false;
  b.textContent='Delete my Totehm';
}
$('acct-wipe').onclick=async()=>{
  const b=$('acct-wipe');
  if(!wipeArmed){
    /* La confirmation tient dans le libellé du bouton : deux gestes, six
       secondes d'armement, et pas un paragraphe pour l'expliquer. */
    b.classList.add('armed');
    b.textContent='Tap again to erase';
    wipeArmed=setTimeout(wipeReset,6000);
    return;
  }
  clearTimeout(wipeArmed); wipeArmed=0;
  b.disabled=true; b.textContent='erasing\u2026';
  try{
    const {error}=await sb.rpc('delete_my_totehm');
    if(error)throw error;
    /* Le local doit suivre le serveur, sinon le prochain cloudSave
       reecrirait ce qu'on vient d'effacer. */
    state={habits:[],vis:'private'};
    profile={name:'',bot:false};
    myProfile=null; cloudMode=false; mySub=null;
    tgLinked=false; { const tb=$('tg-block'); if(tb)tb.classList.add('hide'); }
    try{localStorage.removeItem(KEY);localStorage.removeItem(KEYP);}catch(_){}
    renderHabits(); connPaint(); renderSettings();
    b.textContent='erased'; b.disabled=true;
  }catch(e){
    b.disabled=false; b.classList.remove('armed');
    b.textContent='could not erase — try again';
  }
};

function applyFreq(id){
  if(fpTarget==null||!FREQ_BY_ID[id]){closeFreqPanel();return;}
  if(fpTarget==='filter'){
    filterF=id; saveFilter();
    $('fp-skip').textContent='any intention';
    showFpStage('int');
    return;
  }
  if(fpTarget==='new'){
    pendingF=id;
    closeFreqPanel();
    /* Nouveau flow peek : au lieu de cascader vers la stage intention
       dans le même panneau (ancien wizard), on rouvre la fenêtre d'aperçu
       si l'intention manque encore. Sinon on crée l'habit. */
    if(!pendingI){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(!state.habits[fpTarget]){closeFreqPanel();return;}
  const prevF=state.habits[fpTarget].f;
  state.habits[fpTarget].f=id;save();
  if(prevF&&prevF!==id)logTotehmEvent('freq_changed',state.habits[fpTarget].t,{from:prevF,to:id});
  if(!state.habits[fpTarget].i){showFpStage('int');renderHabits();return;}
  closeFreqPanel();renderHabits();
}

function applyIntent(id){
  if(fpTarget==='new'){
    pendingI=id;
    closeFreqPanel();
    /* Si la fréquence manque encore, rouvre le peek pour la définir.
       Sinon crée l'habit (renderHabits gère la conversion pending → state). */
    if(!pendingF){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(fpTarget==='filter'){filterI=id;closeFreqPanel();updateFilterBadge();renderHabits();return;}
  if(state.habits[fpTarget]){const prevI=state.habits[fpTarget].i;state.habits[fpTarget].i=id;save();if(prevI!==id)logTotehmEvent('intention_changed',state.habits[fpTarget].t,{from:prevI||null,to:id||null});}
  closeFreqPanel();renderHabits();
}

/* ══ LES MESURES DU RAIL : DONNÉES, PLUS DÉDUITES ══
   book.html et next_objective.html recalculaient `--rl` et `--rw` depuis
   `100vw` avec un facteur dérivé (.0821 = .072 / .8768). Deux formules pour
   une même mesure, c'est un endroit où l'écart finit toujours par s'installer :
   il suffit d'une barre de défilement, d'un arrondi, ou d'une retouche d'un
   seul côté. Le parent envoie désormais ses valeurs calculées. Elles ne sont
   plus égales par arithmétique — elles sont identiques par construction. */
/* ══ `pushMetrics()` A DISPARU · 05/09/2026 ═══════════════════════════
   Elle poussait la valeur RÉSOLUE de `--rl` aux deux iframes, parce
   qu'une propriété personnalisée est SUBSTITUÉE et pas calculée : l'iframe
   recevait le jeton `max(38px,calc(min(92vh,78vw,640px) * .072))` et le
   résolvait contre SA fenêtre — donc faux.
   Dans un seul document, le rail est le même pour tout le monde. Le
   problème n'est pas résolu : il n'existe plus. */

/* ══ LES TROIS VUES — UN SEUL MOTEUR · 06/09/2026 ═════════════════════
   `view` vaut 'habits' | 'objectives' | 'repulsions'.

   LE PAPIER NE CHANGE PAS : il est navy dans les trois vues. Ce sont les
   BOÎTES qui portent la couleur — navy, bleu clair, rouge-violet. Le
   Totehm ne se repeint pas, il se déplie : ce qui se déplie, ce sont ses
   pièces, et une pièce a une couleur.

   OUVRIR UNE BOÎTE MONTRE LE TRIP ENTIER, dans ses trois couleurs, ordonné
   par la vue d'où l'on vient : la pièce qu'on touche passe en premier,
   c'est elle qu'on est venu voir. On ne change JAMAIS de vue en éditant.

   IL N'Y A PLUS DE [Add a Trip]. Un seul bouton par vue, qui crée la pièce
   de CETTE vue, vide, et ouvre le triplet dessus. Les deux autres pièces
   sont OFFERTES — reprendre une existante (lookup) ou en écrire une neuve
   — jamais imposées : une habitude sans objectif reste une habitude, et
   forcer les trois empêcherait d'écrire. */
let view='habits';
/* L'ordre AFFICHÉ des trois carrés : c'est lui que suit le doigt et lui
   que suivent les flèches. Une seule liste, sinon les deux divergent. */
const VIEW_ORDER=['repulsions','habits','objectives'];
let TRIPS=[], REPS=[], tripsLoaded=false;

/* DEUX ÉTATS, ET PAS SIX. Ce qui est OUVERT, et si on est en train de
   classer. Le choix en cours (`pk`) vit avec le rendu, plus haut — il y
   en avait cinq, chacun oublié à un endroit différent : c'est comme ça
   qu'une boîte gardait un menu ouvert d'une autre. */
let open=null, ordering=false;

/* ── L'IDENTITÉ D'UNE HABITUDE ───────────────────────────────────────
   Une habitude vit dans `state.habits`, un tableau sans identifiant. On
   lui en donne un À L'AFFICHAGE : il ne sert qu'à désigner la ligne qu'on
   édite pendant cette session. Rien ne s'y rattache en base — une
   répulsion pointe une habitude par son TEXTE, parce que `steps` est du
   texte. C'est pour ça que renommer appelle `habit_rename_links`. */
let HSEQ=0;
function habIds(){ (state.habits||[]).forEach(x=>{ if(!x.id)x.id='h'+(++HSEQ); }); }
const habOf  =id=>(state.habits||[]).find(x=>x.id===id)||null;
const habByT =t =>(state.habits||[]).find(x=>x.t===t)||null;
const tripOf =id=>TRIPS.find(t=>String(t.id)===String(id))||null;
const repOf  =id=>REPS.find(r=>String(r.id)===String(id))||null;
/* `hs` porte des TEXTES d'habitudes — c'est ce que rend le serveur. */
const repsOfHab=id=>{const x=habOf(id);
  return x?REPS.filter(r=>(r.hs||[]).includes(x.t)):[];};
const habsOfRep=r=>(r.hs||[]).map(habByT).filter(Boolean);
/* ══ UNE HABITUDE SERT PLUSIEURS OBJECTIFS · 07/09/2026 ═══════════════
   `OBJ` fait le pont : texte d'habitude → liste d'identifiants
   d'objectifs, telle que le serveur la rend. `steps.o` reste le PREMIER
   lien — celui que le bot lit déjà — mais il ne décide plus seul. */
let OBJ={};
const objIdsOf  =x=>(x&&x.t&&OBJ[x.t])?OBJ[x.t]:(x&&x.o?[String(x.o)]:[]);
const tripsOfHab=x=>objIdsOf(x).map(tripOf).filter(Boolean);
const habsOfTrip=t=>(state.habits||[]).filter(x=>objIdsOf(x).includes(String(t.id)));
/* Le premier lien, celui qui voyage dans `steps` : on le tient à jour à
   chaque attache ou détache, sinon le bot lirait un objectif effacé. */
function posePremier(x){ const l=objIdsOf(x); x.o = l.length?l[0]:null; save(); }

/* ── LE PAPIER, LES ONGLETS, LE LOGO ─────────────────────────────────
   Le wordmark vit HORS de #stage : c'est <body> qui porte la vue pour lui.
   Une seule expression pose toutes les classes du corps — `className=`
   écrase TOUT, et le mode classement y perdait sa classe à chaque rendu. */
function paintZone(){
  const st=$('stage'); if(!st)return;
  st.classList.toggle('v-h',view==='habits');
  st.classList.toggle('v-o',view==='objectives');
  st.classList.toggle('v-r',view==='repulsions');
  /* L'état du logo suit le SUJET, pas la vue : un objectif s'écrit aussi
     depuis la vue habitudes, et c'est encore un objectif. */
  const oLive = view==='objectives' || (open&&open.kind==='t');
  document.body.classList.toggle('v-habits',view==='habits');
  document.body.classList.toggle('v-objectives',view==='objectives');
  document.body.classList.toggle('v-repulsions',view==='repulsions');
  document.body.classList.toggle('o-live',!!oLive);
  document.body.classList.toggle('ordering',ordering);
  document.querySelectorAll('.vt').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.v===view ? 'true':'false');
  });
  const vn=$('vname'); if(vn)vn.textContent=view;
}
/* Changer de vue ne charge rien et ne quitte rien : c'est la même page,
   la même session, la même mémoire. C'est tout l'intérêt de la fusion. */
function setView(v){
  if(busy)return;
  if(v===view)return;
  /* ══ CHANGER DE VUE NE DEMANDE PLUS DE FERMER · 09/09/2026 ══════════
     Ici on refusait tant qu'une boîte était ouverte, « pour ne pas perdre
     la saisie ». C'était vrai quand la saisie attendait un bouton ; ce ne
     l'est plus : tout s'enregistre en écrivant. Il reste juste à POUSSER
     ce qui dort dans la minuterie, puis la boîte se referme d'elle-même.
     Zéro friction : on regarde ailleurs, on ne range pas d'abord. */
  if(open){ pousse(); open=null; pk=null;
    REPS=REPS.filter(z=>!z.brouillon); }
  /* Les objectifs et les répulsions sont des données du serveur : sans
     session il n'y a rien à montrer, et l'écran vide ne dirait pas
     pourquoi. */
  if(v!=='habits'&&!me){
    $('member-window').classList.add('show');
    if(typeof memberPaint==='function')memberPaint();
    return;
  }
  view=v; renderZone();
  if(v!=='habits')loadTrips();
}
function showBook(on){ setView(on?'repulsions':'habits'); if(on)save(); }
function showNext(on){ setView(on?'objectives':'habits');  if(on)save(); }
function renderView(){ return renderZone(); }

/* L'arbre entier en UN appel : objectifs, leurs habitudes, les répulsions
   de chaque habitude. Chargé à la première ouverture d'une des deux vues,
   pas au démarrage — le Totehm doit s'ouvrir sans attendre le réseau. */
async function loadTrips(force){
  if(!me)return;
  if(tripsLoaded&&!force)return;
  try{
    const {data,error}=await sb.rpc('my_trips');
    /* Une erreur de RPC se JOURNALISE, toujours : sans ce log, une liste
       vide ne dit pas si le membre n'a rien posé ou si l'appel casse. */
    if(error)throw error;
    if(!data||!data.signed_in)return;
    TRIPS=data.trips||[];
    /* Le serveur rend, sur CHAQUE habitude, la liste de ses objectifs.
       On la range par texte d'habitude : c'est la seule clé que `steps`
       et la base ont en commun. */
    OBJ={};
    (TRIPS.concat([{habits:data.loose||[]}])).forEach(t=>
      (t.habits||[]).forEach(h=>{
        if(h&&h.t&&Array.isArray(h.objectives))OBJ[h.t]=h.objectives.map(String);}));
    /* UNE RÉPULSION, UNE LIGNE — même si elle protège quatre habitudes.
       Le serveur la renvoie une fois par habitude protégée ; on déduplique
       sur son id, et `habits` porte la liste complète. Sans ça, la vue
       répulsions afficherait la même pensée quatre fois. */
    const vu={}; REPS=[];
    (TRIPS.concat([{habits:data.loose||[]}])).forEach(t=>
      (t.habits||[]).forEach(h=>(h.repulsions||[]).forEach(r=>{
        if(vu[r.id])return; vu[r.id]=1;
        REPS.push({id:r.id, text:r.repulsion, obstacle:r.obstacle||'',
                   hs:Array.isArray(r.habits)&&r.habits.length?r.habits.slice():[h.t]});})));
    tripsLoaded=true;
    renderZone();
  }catch(e){
    console.error('[totehm] my_trips:',e&&e.message||e);
  }
}

/* `days_left` vient du SERVEUR : un client qui compare des dates compare
   aussi son horloge, et celle d'un téléphone ment plus souvent qu'on ne
   croit. `fmtDue` ne calcule rien, elle met en mots. */
function fmtDue(d){
  if(d==null)return 'no deadline';
  if(d<0)  return Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' overdue';
  if(d===0)return 'today';
  if(d===1)return 'tomorrow';
  if(d<31) return d+' days left';
  const m=Math.round(d/30);
  return m+' month'+(m===1?'':'s')+' left';
}
/* Le <input type="date"> veut AAAA-MM-JJ, le serveur rend un timestamp. */
const dateIn=t=>t?String(t).slice(0,10):'';

/* ══ LES ÉCRITURES ═══════════════════════════════════════════════════
   Optimistes : on pose la valeur en mémoire, on dessine, et on envoie.
   Recharger l'arbre à chaque frappe fermerait le panneau sous les doigts.
   L'arbre est rafraîchi À LA FERMETURE, une fois, et pas avant. */
let wDirty=false, wTimer=null;
function apres(p){ /* une erreur de RPC se journalise, toujours */
  return Promise.resolve(p).then(({error}={})=>{ if(error)console.error('[totehm] rpc:',error.message); })
    .catch(e=>console.error('[totehm] rpc:',e&&e.message||e)); }
let wPend=null;
function differe(fn){ clearTimeout(wTimer); wPend=fn; wTimer=setTimeout(()=>{wPend=null;fn();},700); }
/* RIEN NE SE PERD QUAND ON QUITTE UNE BOÎTE. La saisie part avec 700 ms
   de retard pour ne pas écrire à chaque lettre ; si on part avant, il faut
   la POUSSER — sinon les derniers mots restent dans une minuterie que
   personne n'attend. */
function pousse(){ if(!wPend)return; clearTimeout(wTimer); const f=wPend; wPend=null; f(); }

/* ══ LA ZONE — UNE SEULE BOÎTE, PARTOUT LA MÊME · 08/09/2026 ══════════
   Réécriture complète de la couche d'affichage. Ce qui existait avant
   fabriquait DEUX objets — la boîte, et le « bloc » d'une pièce liée —
   avec deux paddings, deux graisses, deux grammaires. D'où « rien n'est
   fluide, rien n'est harmonieux ».

   IL N'Y A PLUS QU'UNE BOÎTE, et elle contient TROIS choses :
     1. son TITRE, toujours modifiable sur place ;
     2. sa LIGNE D'UNITÉ — ce qui la qualifie, et qui se touche ;
     3. ses MINI-BOÎTES — ce qui lui est lié, à la couleur de ce que
        c'est. C'est le format de la boîte répulsion, généralisé : une
        habitude montre ses objectifs en bleu clair et ses répulsions en
        rouge-violet, un objectif montre ses habitudes en navy.

   LES TROIS VUES SONT LA MÊME LISTE, lue par un bout différent. On
   travaille pleinement dans chacune ; seul le storytelling change. */

/* ── LES INTENTIONS SONT PLUSIEURS ───────────────────────────────────
   Une habitude peut en porter plusieurs. `is` est la liste, `i` reste la
   PREMIÈRE — c'est elle que le serveur et le bot lisent (`steps.i`), et
   la tenir à jour évite de toucher à la base. */
const intIds=x=>!x?[]:(Array.isArray(x.is)&&x.is.length?x.is:(x.i?[x.i]:[]));
function intToggle(x,id){
  const l=intIds(x).slice(), k=l.indexOf(id);
  if(k<0)l.push(id); else l.splice(k,1);
  x.is=l; x.i=l.length?l[0]:null; save();
}
const intCols=x=>intIds(x).map(intColor);

/* ── LES PIÈCES LIÉES, DANS LES DEUX SENS ────────────────────────── */
const repsOfHabX=x=>x&&x.t?REPS.filter(r=>(r.hs||[]).includes(x.t)):[];

/* ══ LE RAIL — UNE CHAÎNE DE TRAITS ══════════════════════════════════
   Le bord gauche d'une boîte habitude porte SES intentions, une par
   segment, de haut en bas. Sept intentions, sept traits : le spectre
   d'une vie, lisible avant d'avoir lu un mot.
   Les autres boîtes n'en portent pas — une couleur d'intention sur un
   objectif ou une répulsion ne voudrait rien dire. */
const tickHTML=cols=>'<span class="tick">'
  +(cols&&cols.length?cols.map(c=>'<i style="background:'+c+'"></i>').join(''):'')
  +'</span>';

/* ══ LA MINI-BOÎTE ═══════════════════════════════════════════════════
   Une pièce liée, vue depuis une autre. Elle porte la couleur de CE
   QU'ELLE EST, jamais celle de la boîte qui l'accueille : une habitude
   reste navy même posée dans une répulsion. */
const mini=(kind,txt,attr)=>'<span class="mini m-'+kind+'" '+(attr||'')+'>'
  +esc(txt||'untitled')+'</span>';
const miniDel=(kind,txt,data)=>'<span class="mini m-'+kind+'">'+esc(txt||'untitled')
  +'<button type="button" class="mini-x" '+data+' aria-label="Unlink">&times;</button></span>';
/* ══ LE MOT RACONTE LE LIEN ══════════════════════════════════════════
   WHY au-dessus des objectifs d'une habitude, HOW au-dessus des
   habitudes d'un objectif, PROTECTS au-dessus de celles d'une répulsion.
   Trois mots, et la liste devient une phrase. Un groupe vide ne s'écrit
   pas : un titre sans rien dessous n'est pas du storytelling, c'est un
   trou nommé. */
const groupe=(mot,contenu)=>contenu
  ? '<span class="mg"><span class="mg-l">'+mot+'</span>'
    +'<span class="minis">'+contenu+'</span></span>' : '';

/* ══ LA BOÎTE ════════════════════════════════════════════════════════
   `o.kind` h|t|r · `o.titre` · `o.unit` (HTML) · `o.minis` (HTML)
   · `o.ouverte` · `o.extra` (un choix ouvert : intentions, rythme, lien) */
function boiteHTML(o){
  const nom = o.ouverte
    ? '<span class="v-name" contenteditable="plaintext-only" spellcheck="false"'
      +' data-edit="'+o.kind+':'+esc(String(o.id))+'">'+esc(o.titre)+'</span>'
    : '<span class="v-name">'+esc(o.titre||'untitled')+'</span>';
  return '<span class="v-col"'+(o.ouverte?'':' data-open="'+o.kind+':'+esc(String(o.id))+'" role="button" tabindex="0"')+'>'
    + nom
    + (o.unit ?'<span class="v-sub">'+o.unit+'</span>':'')
    /* LE CHOIX SE POSE AU-DESSUS DE CE QU'IL CONCERNE. Régler l'intention
       ou le rythme, c'est régler L'HABITUDE : le choix s'ouvre sous sa
       ligne, avant ses objectifs et ses répulsions. Un lookup, lui,
       concerne les liens : il s'ouvre après eux. */
    + (o.haut||'')
    + (o.minis?'<span class="minis">'+o.minis+'</span>':'')
    + (o.bas||'')
    /* [Delete] EST LE DERNIER ENFANT DE LA COLONNE. Posé à côté de la
       boîte il flottait à droite et mangeait la largeur — sur un
       téléphone, la moitié de la ligne pour la commande la plus grave.
       Ici il est en bas, pleine largeur, et une saisie qui s'allonge le
       repousse sans jamais le croiser. */
    + (o.ouverte&&o.tue?'<button type="button" class="btn g" data-kill="'+o.kind+':'
        +esc(String(o.id))+'">'+o.tue+'</button>':'')
    + (o.ouverte?'<button type="button" class="w-x" data-x="1" aria-label="Close">&times;</button>':'')
    +'</span>';
}
const ligne=(inner,cls,cols,rank,id)=>'<div class="habit timed '+(cls||'')+'"'
  +(id?' data-row="'+esc(String(id))+'"':'')+'>'
  + tickHTML(cols)
  + (ordering&&rank?'<span class="rank">'+rank+'</span>':'')
  +'<span class="h-body">'+inner+'</span></div>';

/* ══ CE QUI EST OUVERT, ET CE QU'ON EST EN TRAIN DE CHOISIR ══════════
   UN SEUL choix à la fois : deux menus ouverts, c'est un menu de trop.
   `pk` vaut null, ou {q:'int'|'freq'|'lien'|'neuf', k:'h'|'t'|'r', id}. */
let pk=null;
/* La vue du rendu précédent : c'est elle qui dit si l'on vient de changer
   de vue, donc s'il faut jouer le fondu. Elle vivait dans l'ancienne zone
   et a disparu avec elle — sans elle, `renderZone` levait à la première
   ligne et l'écran restait vide. */
let lastView=null;
const pkOn=(q,k,id)=>!!pk&&pk.q===q&&pk.k===k&&String(pk.id)===String(id);
function pkSet(q,k,id){ pk = pkOn(q,k,id) ? null : {q,k,id:String(id)}; renderZone(); }

/* ══ LE RYTHME — ON L'ÉCRIT DANS SA LANGUE ═══════════════════════════
   `deduceFreq()` lit « tous les matins », « every morning », « jeden
   Morgen », « ogni mattina » et rend l'un des 33 rythmes. C'est ce qui
   permet d'écrire au lieu de chercher dans une liste — et ça marche dans
   toutes les langues sans un appel de modèle, donc sans facture.
   La liste reste dessous : on écrit OU on choisit, jamais l'un sans
   l'autre. */
function freqPicker(x){
  const devine = pk&&pk.q==='freq'&&pk.devine ? pk.devine : null;
  return '<span class="pkw">'
    +'<input class="in fq" data-fqin="'+esc(String(x.id))+'" autocomplete="off"'
    +' placeholder="write it in your language" value="'+esc(pk&&pk.txt||'')+'">'
    +(devine?'<button type="button" class="fq-hit" data-fq="'+esc(String(x.id))+'|'+devine+'">'
      +esc(flabel(devine))+'</button>':'')
    +'<span class="pk-list">'
    + FREQS.map(f=>'<button type="button" class="pk-o'+(x.f===f.id?' on':'')
        +'" data-fq="'+esc(String(x.id))+'|'+f.id+'">'+esc(f.label)+'</button>').join('')
    +'</span></span>';
}

/* LES SEPT INTENTIONS — plusieurs à la fois. Pas de surlignage : la tuile
   prend un fondu de sa couleur, et se remplit quand elle est choisie. */
const intPicker=x=>{const l=intIds(x);
  return '<span class="pkw"><span class="ints">'+INTS.map(z=>
    '<button type="button" class="int'+(l.includes(z.id)?' on':'')+'" data-int="'
    +esc(String(x.id))+'|'+z.id+'" aria-pressed="'+l.includes(z.id)+'" style="--ic:'+z.color+'">'
    +'<span class="int-n">'+esc(z.name)+'</span>'
    +'<span class="int-p">'+esc(z.pillar)+'</span></button>').join('')+'</span></span>';};

/* LE LOOKUP — reprendre ce qui existe, ou écrire du neuf. On ne réécrit
   jamais ce qui est déjà là : les pièces déjà liées ne sont pas
   reproposées. */
/* `col` : la couleur de CE QU'ON VA POSER. Écrire un objectif se fait
   dans du bleu clair, une répulsion dans du rouge-violet, une habitude
   dans du navy — on voit ce qu'on fabrique avant de l'avoir fabriqué.
   Et les propositions RESPIRENT, comme le T : elles appellent le doigt
   sans crier. */
function lienPicker(k,id,dejaIds,liste,ph,col){
  const c=col||'h';
  return '<span class="pkw k-'+c+'">'
    +'<input class="in nw k-'+c+'" data-nw="'+k+':'+esc(String(id))+'" autocomplete="off" placeholder="'+esc(ph)+'">'
    +'<span class="pk-list">'
    + liste.filter(z=>!dejaIds.includes(String(z.id)))
        .map(z=>'<button type="button" class="pk-o vit k-'+c+'" data-lien="'+k+':'+esc(String(id))
          +'|'+esc(String(z.id))+'">'+esc(z.txt||'untitled')+'</button>').join('')
    +'</span></span>';
}
const plus=(q,k,id,mot)=>'<button type="button" class="dash'+(pkOn(q,k,id)?' on':'')+'"'
  +' data-pk="'+q+':'+k+':'+esc(String(id))+'">'+(pkOn(q,k,id)?'close':'+ '+mot)+'</button>';

/* ══ LES TROIS VUES ══════════════════════════════════════════════════ */
function renderZone(){
  habIds();
  const box=$('habits'); if(!box)return;
  const sc=$('fv-inner'); const keep = sc?sc.scrollTop:null;
  const change = lastView!==null && lastView!==view; lastView=view;
  paintZone();

  let h='';
  if(view==='habits'){
    if(!state.ord)sortHabits();
    const list=(state.habits||[]).filter(x=>{
      if(filterF && x.f!==filterF) return false;
      if(filterI && !intIds(x).includes(filterI)) return false;
      return true;});
    h=list.map((x,k)=>vueHabitude(x,k)).join('');
    if(!list.length)h+='<div class="void">'+((state.habits||[]).length
      ?'nothing matches this filter':'no habit yet')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="h">+ <b>Add a Habit</b></button>','add');
  }else if(view==='objectives'){
    h=TRIPS.map((t,k)=>vueObjectif(t,k)).join('');
    if(!TRIPS.length)h+='<div class="void">'+(tripsLoaded?'no objective yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="t">+ <b>Add an Objective</b></button>','add');
  }else{
    h=REPS.map((r,k)=>vueRepulsion(r,k)).join('');
    if(!REPS.length)h+='<div class="void">'+(tripsLoaded?'no repulsion yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="r">+ <b>Add a Repulsion</b></button>','add');
  }

  box.innerHTML=(ordering
    ? '<div class="ordbar">order by importance — the bot follows this order</div>':'')+h;
  if(change){ box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
  if(keep!=null&&sc)sc.scrollTop=keep;
  peintTraits();
  window.__totehm_zone={vue:view, session:!!me, arbre_charge:tripsLoaded,
    habitudes:(state.habits||[]).length, objectifs:TRIPS.length, repulsions:REPS.length,
    filtre:{rythme:!!filterF, intention:!!filterI},
    boite_ouverte:open?open.kind:null, choix:pk?pk.q:null,
    classement:ordering, ordre_du_membre:!!state.ord};
  cable(box);
}

/* ── UNE HABITUDE ────────────────────────────────────────────────────
   Elle montre SES objectifs (bleu clair) et SES répulsions (rouge-violet).
   C'est le format de la boîte répulsion, dans l'autre sens. */
function vueHabitude(x,k){
  const ouverte = !!open && open.kind==='h' && String(open.id)===String(x.id);
  const ts=tripsOfHab(x), rs=repsOfHabX(x), l=intIds(x);
  /* CE QUI MANQUE RESPIRE. Une habitude sans intention ni rythme n'est pas
     encore une habitude : les deux réglages pulsent comme le T tant qu'ils
     sont vides, et s'arrêtent dès qu'ils sont posés. */
  const unit = ouverte
    ? '<button type="button" class="v-b'+(l.length?'':' vit')+'" data-pk="int:h:'+esc(String(x.id))+'">'
      +(l.length?l.map(i=>'<b style="color:'+intColor(i)+'">'+esc(intName(i))+'</b>').join(' · ')
                :'set intention')+'</button>'
      +'<button type="button" class="v-b'+(x.f?'':' vit')+'" data-pk="freq:h:'+esc(String(x.id))+'">'
      +esc(x.f?flabel(x.f):'set time frequency')+' ▾</button>'
    : (l.length?l.map(i=>'<span class="v-int" style="color:'+intColor(i)+'">'+esc(intName(i))+'</span>').join('')
               :'<span class="v-pil vit">set intention</span>')
      +'<span class="v-frq'+(x.f?'':' vit')+'">'+esc(x.f?flabel(x.f):'set time frequency')+'</span>';
  /* WHY au-dessus des objectifs, PROTECTED BY au-dessus des répulsions :
     la boîte raconte, elle ne liste pas. */
  const gO = ouverte
    ? ts.map(t=>miniDel('o',t.text,'data-unlink="o:'+esc(String(x.id))+'|'+esc(String(t.id))+'"')).join('')
      + plus('lien','o',x.id,'objective')
    : ts.map(t=>mini('o',t.text)).join('');
  const gR = ouverte
    ? rs.map(r=>miniDel('r',r.text,'data-unlink="r:'+esc(String(x.id))+'|'+esc(String(r.id))+'"')).join('')
      + plus('lien','r',x.id,'repulsion')
    : rs.map(r=>mini('r',r.text)).join('');
  const minis = groupe('why',gO) + groupe('protected by',gR);
  let haut='', bas='';
  if(ouverte&&pkOn('int','h',x.id))  haut=intPicker(x);
  if(ouverte&&pkOn('freq','h',x.id)) haut=freqPicker(x);
  if(ouverte&&pkOn('lien','o',x.id)) bas=lienPicker('o',x.id,
      ts.map(t=>String(t.id)), TRIPS.map(t=>({id:t.id,txt:t.text})), 'a new objective','o');
  if(ouverte&&pkOn('lien','r',x.id)) bas=lienPicker('r',x.id,
      rs.map(r=>String(r.id)), REPS.map(r=>({id:r.id,txt:r.text})), 'a new repulsion','r');
  return ligne(boiteHTML({kind:'h',id:x.id,titre:x.t,unit,minis,ouverte,haut,bas,tue:'Delete habit'}),
    ouverte?'open':'', intCols(x), k+1, x.id);
}

/* ── UN OBJECTIF ─────────────────────────────────────────────────────
   Il montre SES habitudes en navy. La deadline se pose ET se retire. */
function vueObjectif(t,k){
  const ouverte = !!open && open.kind==='t' && String(open.id)===String(t.id);
  const hs=habsOfTrip(t), late=t.days_left!=null&&t.days_left<0;
  /* PLUS DE COMPTEUR. « 3 habits » ne raconte rien — HOW suivi des trois
     habitudes raconte tout. La deadline reste : elle, elle périme. */
  const unit = ouverte
    ? '<input class="in date" type="date" data-date="'+esc(String(t.id))+'" value="'+esc(dateIn(t.target_at))+'">'
      +(t.target_at?'<button type="button" class="v-b" data-nodate="'+esc(String(t.id))+'">no deadline</button>':'')
    : '<span class="v-frq'+(late?' late':'')+'">'+esc(fmtDue(t.days_left))+'</span>';
  const minis = groupe('how', ouverte
    ? hs.map(x=>miniDel('h',x.t,'data-unlink="ho:'+esc(String(t.id))+'|'+esc(String(x.id))+'"')).join('')
      + plus('lien','h',t.id,'habit')
    : hs.map(x=>mini('h',x.t)).join(''));
  const bas = (ouverte&&pkOn('lien','h',t.id))
    ? lienPicker('h',t.id, hs.map(x=>String(x.id)),
        (state.habits||[]).map(x=>({id:x.id,txt:x.t})), 'a new habit','h') : '';
  return ligne(boiteHTML({kind:'t',id:t.id,titre:t.text,unit,minis,ouverte,bas,tue:'Delete objective'}),
    ouverte?'open':'', null, k+1, t.id);
}

/* ── UNE RÉPULSION ───────────────────────────────────────────────────
   Elle montre les habitudes qu'elle protège, en navy. */
function vueRepulsion(r,k){
  const ouverte = !!open && open.kind==='r' && String(open.id)===String(r.id);
  const hs=habsOfRep(r);
  /* UN SEUL MOT, ET IL RACONTE OÙ L'ON EN EST. Il y en avait deux :
     « protects » sur la ligne d'unité ET au-dessus des mini-boîtes — la
     même chose dite deux fois n'est pas du storytelling, c'est du bruit.
     Une répulsion n'a pas d'unité : elle n'existe que par ce qu'elle
     protège. Donc pas de ligne d'unité, et le mot du groupe change selon
     le moment :
       elle protège déjà      →  PROTECTS
       elle ne protège rien   →  WRITE A NEW ONE OR PICK AN EXISTING ONE
     Chaque clic doit dire ce qu'il attend. */
  const unit = '';
  const mot = hs.length ? 'protects' : 'write a new one or pick an existing one';
  const minis = groupe(mot, ouverte
    ? hs.map(x=>miniDel('h',x.t,'data-unlink="hr:'+esc(String(r.id))+'|'+esc(String(x.id))+'"')).join('')
      + plus('lien','hr',r.id,'habit')
    : hs.map(x=>mini('h',x.t)).join(''));
  const bas = (ouverte&&pkOn('lien','hr',r.id))
    ? lienPicker('hr',r.id, hs.map(x=>String(x.id)),
        (state.habits||[]).map(x=>({id:x.id,txt:x.t})), 'a new habit','h') : '';
  return ligne(boiteHTML({kind:'r',id:r.id,titre:r.text,unit,minis,ouverte,bas,tue:'Delete repulsion'}),
    ouverte?'open':'', null, k+1, r.id);
}

/* ══ LA COULEUR SUIT LE REGARD · 08/09/2026 ══════════════════════════
   Le rail s'éteignait selon la POSITION DANS LA LISTE — la première ligne
   pleine, les suivantes dégressives. Mais quand on défile, la première
   ligne n'est plus celle qu'on regarde : on lisait un dégradé qui ne
   parlait plus de rien.
   Désormais c'est la boîte EN HAUT DU CHAMP DE VISION qui porte sa
   couleur pleine, et celles d'en dessous s'éteignent. Le classement reste
   le même — c'est la lecture qui suit l'œil. */
const DEGRADE=[1,.62,.4,.26,.16];
function peintTraits(){
  const sc=$('fv-inner'), box=$('habits'); if(!sc||!box)return;
  const y=sc.getBoundingClientRect().top;
  const rows=[...box.querySelectorAll('.habit')];
  /* La première dont le BAS est encore sous le haut du cadre : c'est elle
     qu'on est en train de lire. */
  let tete=rows.findIndex(r=>r.getBoundingClientRect().bottom > y+4);
  if(tete<0)tete=0;
  rows.forEach((r,i)=>{
    const d=i-tete;
    r.style.setProperty('--tk', d<0?DEGRADE[DEGRADE.length-1]
      : DEGRADE[Math.min(d,DEGRADE.length-1)]);
  });
}
/* Un seul écouteur, et une seule peinture par image : au doigt, un
   `scroll` part quarante fois par seconde et repeindre à chaque fois
   coûterait plus que tout le reste de la page. */
let peintDemande=false;
(function(){ const sc=$('fv-inner'); if(!sc)return;
  sc.addEventListener('scroll',()=>{ if(peintDemande)return; peintDemande=true;
    requestAnimationFrame(()=>{peintDemande=false;peintTraits();}); },{passive:true});
})();

/* ══ OUVRIR, FERMER ══════════════════════════════════════════════════ */
function ouvrir(kind,id){
  open={kind,id:String(id)}; pk=null; renderZone();
  const b=$('habits').querySelector('.habit.open');
  if(!b)return;
  /* MESURÉ : `scrollIntoView` ne bougeait le cadre que de 2 px — dans un
     document dont le corps ne défile pas, il ne trouve pas #fv-inner de
     façon fiable. On lui dit lequel, et de combien. */
  requestAnimationFrame(()=>{const sc=$('fv-inner'); if(!sc)return;
    sc.scrollTop=sc.scrollTop+b.getBoundingClientRect().top-sc.getBoundingClientRect().top-6;});
  const f=b.querySelector('.v-name[contenteditable]');
  if(f&&window.innerWidth>700)f.focus();
}
function fermer(){
  /* UN BROUILLON QU'ON FERME N'A JAMAIS EXISTÉ. Le laisser dans la liste
     ferait croire à une répulsion enregistrée qui disparaîtrait au
     rechargement — le pire des états : visible et faux. */
  REPS=REPS.filter(z=>!z.brouillon);
  open=null; pk=null; renderZone();
  /* L'arbre se recharge ICI, une fois : pendant l'édition il fermerait la
     boîte sous les doigts, après il remet la vérité du serveur. */
  if(wDirty){wDirty=false;loadTrips(true);}
}

/* ══ CRÉER — un bouton par vue, la pièce de CETTE vue ═════════════════ */
async function creer(kind){
  if(kind==='h'){
    const x={id:'h'+(++HSEQ), t:'', f:null, i:null, is:[], o:null};
    state.habits.unshift(x); state.ord=true; save(); ouvrir('h',x.id); return;}
  if(!me){$('member-window').classList.add('show');
          if(typeof memberPaint==='function')memberPaint();return;}
  if(kind==='t'){
    const {data,error}=await sb.rpc('trip_create',{p_text:'',p_target:null});
    if(error){console.error('[totehm] trip_create:',error.message);return;}
    TRIPS.unshift({id:data,text:'',target_at:null,days_left:null,habits:[]});
    wDirty=true; ouvrir('t',data); return;}
  /* ══ UNE RÉPULSION PROTÈGE QUELQUE CHOSE — C'EST SA DÉFINITION ══════
     On ne peut donc pas la poser dans le vide : le serveur ne la rendrait
     plus, elle n'apparaît que PAR ses liens. Avant, on exigeait qu'une
     habitude existe déjà et on refusait par une alerte — un cul-de-sac.
     Maintenant on ouvre un BROUILLON : on écrit la répulsion, et c'est la
     première habitude attachée — reprise OU écrite là — qui la fait
     exister. Même format que les habitudes, logique différente. */
  REPS=REPS.filter(z=>z.id!=='new');
  REPS.unshift({id:'new',text:'',obstacle:'',hs:[],brouillon:true});
  ouvrir('r','new');
  /* APRÈS `ouvrir`, jamais avant : `ouvrir` remet le choix à zéro — c'est
     ce qui garantit qu'ouvrir une boîte n'hérite pas du menu de la
     précédente. Le brouillon ouvre donc son lookup ensuite. */
  pk={q:'lien',k:'hr',id:'new'}; renderZone();
}
/* Le brouillon devient réel : une répulsion, son premier lien, en un
   appel. `repulsion_set` crée la ligne ET le trigger pose le lien. */
async function poseBrouillon(r,habitTexte){
  const {data,error}=await sb.rpc('repulsion_set',
    {p_habit:habitTexte,p_repulsion:r.text||'',p_obstacle:''});
  if(error){console.error('[totehm] repulsion_set:',error.message);return null;}
  r.id=String(data); r.brouillon=false; r.hs=[habitTexte];
  if(open&&open.kind==='r')open.id=String(data);
  if(pk&&pk.k==='hr')pk.id=String(data);
  wDirty=true; return r.id;
}

/* ══ ATTACHER, DÉTACHER ══════════════════════════════════════════════
   Une seule fonction connaît les règles, et il n'y en a que trois :
     une habitude sert PLUSIEURS objectifs ;
     une répulsion protège PLUSIEURS habitudes ;
     détacher n'efface jamais — on retire le lien, pas la pensée. */
function attache(quoi,srcId,cibleId){
  if(quoi==='o'){ const x=habOf(srcId), t=tripOf(cibleId); if(!x||!x.t||!t)return;
    OBJ[x.t]=(OBJ[x.t]||[]).concat([String(t.id)]); posePremier(x);
    apres(sb.rpc('objective_link',{p_obj:t.id,p_habit:x.t})); }
  else if(quoi==='h'){ const t=tripOf(srcId), x=habOf(cibleId); if(!t||!x||!x.t)return;
    OBJ[x.t]=(OBJ[x.t]||[]).concat([String(t.id)]); posePremier(x);
    apres(sb.rpc('objective_link',{p_obj:t.id,p_habit:x.t})); }
  else if(quoi==='r'){ const x=habOf(srcId), r=repOf(cibleId); if(!x||!x.t||!r)return;
    if(!(r.hs||[]).includes(x.t)){r.hs.push(x.t);
      apres(sb.rpc('repulsion_link',{p_id:r.id,p_habit:x.t}));} }
  else { const r=repOf(srcId), x=habOf(cibleId); if(!r||!x||!x.t)return;   /* 'hr' */
    if(r.brouillon){ poseBrouillon(r,x.t).then(()=>renderZone()); return; }
    if(!(r.hs||[]).includes(x.t)){r.hs.push(x.t);
      apres(sb.rpc('repulsion_link',{p_id:r.id,p_habit:x.t}));} }
  wDirty=true;
}
function detache(quoi,aId,bId){
  if(quoi==='o'){ const x=habOf(aId); if(!x||!x.t)return;
    OBJ[x.t]=(OBJ[x.t]||[]).filter(o=>o!==String(bId)); posePremier(x);
    apres(sb.rpc('objective_unlink',{p_obj:bId,p_habit:x.t})); }
  else if(quoi==='ho'){ const x=habOf(bId); if(!x||!x.t)return;
    OBJ[x.t]=(OBJ[x.t]||[]).filter(o=>o!==String(aId)); posePremier(x);
    apres(sb.rpc('objective_unlink',{p_obj:aId,p_habit:x.t})); }
  else if(quoi==='r'){ const x=habOf(aId), r=repOf(bId); if(!x||!x.t||!r)return;
    r.hs=(r.hs||[]).filter(t=>t!==x.t);
    apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:x.t})); }
  else { const r=repOf(aId), x=habOf(bId); if(!r||!x||!x.t)return;          /* 'hr' */
    r.hs=(r.hs||[]).filter(t=>t!==x.t);
    apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:x.t})); }
  wDirty=true;
}
/* Écrire du neuf ET l'attacher, d'un seul geste. */
async function neufEtAttache(quoi,srcId,txt){
  if(quoi==='o'){
    const {data,error}=await sb.rpc('trip_create',{p_text:txt,p_target:null});
    if(error){console.error('[totehm] trip_create:',error.message);return;}
    TRIPS.unshift({id:data,text:txt,target_at:null,days_left:null,habits:[]});
    attache('o',srcId,data);}
  else if(quoi==='r'){
    const x=habOf(srcId); if(!x||!x.t)return;
    const {data,error}=await sb.rpc('repulsion_set',{p_habit:x.t,p_repulsion:txt,p_obstacle:''});
    if(error){console.error('[totehm] repulsion_set:',error.message);return;}
    REPS.unshift({id:data,text:txt,obstacle:'',hs:[x.t]});}
  else{ /* 'h' depuis un objectif, 'hr' depuis une répulsion */
    const x={id:'h'+(++HSEQ), t:txt, f:null, i:null, is:[], o:null};
    state.habits.unshift(x); state.ord=true; save();
    attache(quoi,srcId,x.id);}
  pk=null; renderZone();
  return;
}

/* ══ LE CÂBLAGE — un seul, posé sur la liste entière ═════════════════
   Délégation : la liste est redessinée à chaque geste, et rattacher
   trente écouteurs à chaque rendu, c'est trente fuites en puissance. */
let cableFait=false;
function cable(box){
  if(cableFait)return; cableFait=true;

  box.addEventListener('click',async e=>{
    const el=e.target.closest('[data-open],[data-add],[data-x],[data-pk],[data-int],'
      +'[data-fq],[data-lien],[data-unlink],[data-nodate],[data-kill]');
    if(!el)return;
    const d=el.dataset;

    if(d.open){ if(ordering)return; const p=d.open.split(':'); ouvrir(p[0],p[1]); return; }
    if(d.add){ if(ordering)return; creer(d.add); return; }
    if(d.x!==undefined){ e.stopPropagation(); fermer(); return; }
    if(d.pk){ e.stopPropagation(); const p=d.pk.split(':'); pkSet(p[0],p[1],p[2]); return; }

    e.stopPropagation();
    if(d.int){ const p=d.int.split('|'); const x=habOf(p[0]); if(x)intToggle(x,p[1]); renderZone(); return; }
    if(d.fq){ const p=d.fq.split('|'); const x=habOf(p[0]);
      if(x){x.f=p[1];save();} pk=null; renderZone(); return; }
    if(d.lien){ const p=d.lien.split('|'), q=p[0].split(':');
      attache(q[0],q[1],p[1]); pk=null; renderZone(); return; }
    if(d.unlink){ const p=d.unlink.split('|'), q=p[0].split(':');
      detache(q[0],q[1],p[1]); renderZone(); return; }
    if(d.nodate){ const t=tripOf(d.nodate); if(t){t.target_at=null;t.days_left=null;
      apres(sb.rpc('trip_set_target',{p_trip:t.id,p_target:null})); wDirty=true;}
      renderZone(); return; }
    if(d.kill){ const p=d.kill.split(':'); tue(p[0],p[1]); return; }
  });

  /* Le clavier ouvre ce que le doigt ouvre. */
  box.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('[data-open]');
    if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();
      const p=el.dataset.open.split(':'); ouvrir(p[0],p[1]);}
  });

  /* ══ LA SAISIE — TOUT S'ENREGISTRE EN ÉCRIVANT ═════════════════════
     Aucun bouton [Done] nulle part : ce qu'on écrit est posé. */
  box.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.edit){
      const p=t.dataset.edit.split(':'), v=t.textContent;
      if(p[0]==='h'){ const x=habOf(p[1]); if(!x)return;
        const ancien=x.t; x.t=v;
        differe(()=>{ save();
          /* Renommer ne doit pas orpheliner ce qui s'y rattache : le lien
             est du TEXTE, il se répare côté serveur en un appel. */
          if(me&&ancien&&ancien!==x.t){
            REPS.forEach(r=>{const i=(r.hs||[]).indexOf(ancien); if(i>=0)r.hs[i]=x.t;});
            if(OBJ[ancien]){OBJ[x.t]=OBJ[ancien]; delete OBJ[ancien];}
            apres(sb.rpc('habit_rename_links',{p_old:ancien,p_new:x.t}));} }); }
      else if(p[0]==='t'){ const z=tripOf(p[1]); if(!z)return; z.text=v; wDirty=true;
        differe(()=>apres(sb.rpc('trip_rename',{p_trip:z.id,p_text:z.text}))); }
      else { const r=repOf(p[1]); if(!r)return; r.text=v; wDirty=true;
        /* Un brouillon s'écrit en mémoire : il n'a pas encore de ligne en
           base, et `repulsion_set` sans habitude en créerait une invisible. */
        if(r.brouillon)return;
        differe(()=>apres(sb.rpc('repulsion_set',
          {p_habit:(r.hs||[])[0]||'', p_repulsion:r.text, p_obstacle:r.obstacle||''}))); }
      return;
    }
    /* Le rythme écrit dans sa langue : on devine à la frappe, sans réseau. */
    if(t.dataset.fqin && pk){
      pk.txt=t.value;
      const g=(typeof deduceFreq==='function')?deduceFreq(t.value):null;
      const av=pk.devine; pk.devine = (g&&FREQ_BY_ID[g])?g:null;
      if(av!==pk.devine){ const cur=t.selectionStart; renderZone();
        const n=$('habits').querySelector('[data-fqin]');
        if(n){n.focus(); try{n.setSelectionRange(cur,cur);}catch(_){}} }
    }
  });
  box.addEventListener('change',e=>{
    if(e.target.dataset.date){ const t=tripOf(e.target.dataset.date); if(!t)return;
      const v=e.target.value; t.target_at = v ? v+'T00:00:00Z' : null;
      apres(sb.rpc('trip_set_target',{p_trip:t.id,p_target:t.target_at}));
      wDirty=true; }
  });
  box.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const t=e.target;
    if(t.dataset.nw){ e.preventDefault();
      const v=t.value.trim(); if(!v)return;
      const q=t.dataset.nw.split(':'); neufEtAttache(q[0],q[1],v); return; }
    if(t.dataset.fqin){ e.preventDefault();
      if(pk&&pk.devine){ const x=habOf(pk.id); if(x){x.f=pk.devine;save();} pk=null; renderZone(); } }
  });
}

/* SUPPRIMER — ici, et nulle part ailleurs. */
function tue(kind,id){
  if(kind==='h'){ const x=habOf(id); if(!x)return;
    logTotehmEvent('habit_removed',x.t,{f:x.f,i:x.i});
    state.habits=state.habits.filter(z=>z.id!==id);
    REPS.forEach(r=>{const i=(r.hs||[]).indexOf(x.t);
      if(i>=0){r.hs.splice(i,1); if(me)apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:x.t}));}});
    if(x.t&&OBJ[x.t]){OBJ[x.t].forEach(o=>apres(sb.rpc('objective_unlink',{p_obj:o,p_habit:x.t})));
      delete OBJ[x.t];}
    save(); }
  else if(kind==='t'){ TRIPS=TRIPS.filter(t=>String(t.id)!==String(id));
    (state.habits||[]).forEach(x=>{ if(x.t&&OBJ[x.t]){
      OBJ[x.t]=OBJ[x.t].filter(o=>o!==String(id)); posePremier(x);} });
    apres(sb.rpc('trip_close',{p_trip:id,p_outcome:'dropped'})); }
  else { const r=repOf(id); REPS=REPS.filter(z=>String(z.id)!==String(id));
    if(r&&!r.brouillon)apres(sb.rpc('repulsion_retire',{p_id:Number(id)})); }
  wDirty=true; fermer();
}

/* ══ LE CLASSEMENT PAR IMPORTANCE ════════════════════════════════════
   Un seul chemin pour le doigt et la souris — Pointer Events. On coupe le
   natif (`touch-action:none` en CSS) parce que le geste porte une fonction
   produit : sans ça le navigateur avale le glissement vertical et le
   classement se perd une fois sur deux.
   L'ordre n'est pas cosmétique. Il descend jusqu'au bot, et jusqu'à la
   carte : `places_matching_habits` départage deux lieux à classement égal
   par `matched_rank`, c'est-à-dire par CET ordre-là. */
/* FIRST, LAST, INVERT, PLAY — les quatre temps d'un déplacement qui
   ressemble à un déplacement. Sans lui, la liste se retrouve rangée mais
   personne n'a vu la carte bouger. */
function glisse(redessine){
  const box=$('habits'); if(!box){redessine();return;}
  const avant=new Map();
  box.querySelectorAll('.habit[data-row]').forEach(el=>
    avant.set(el.dataset.row, el.getBoundingClientRect().top));
  redessine();
  const bouge=[];
  box.querySelectorAll('.habit[data-row]').forEach(el=>{
    const y0=avant.get(el.dataset.row); if(y0==null)return;
    const d=y0-el.getBoundingClientRect().top;
    if(Math.abs(d)<1)return;
    el.style.transition='none'; el.style.transform='translateY('+d+'px)';
    bouge.push(el);
  });
  if(!bouge.length)return;
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    bouge.forEach(el=>{
      el.style.transition='transform .34s cubic-bezier(.22,.61,.36,1)';
      el.style.transform='';
      /* On nettoie : un style en ligne oublié reprendrait la main sur le
         rendu suivant, et la carte resterait figée. */
      setTimeout(()=>{el.style.transition='';el.style.transform='';},380);

    const i=VIEW_ORDER.indexOf(view)+(dx<0?1:-1);

/* ══ LE TRACKPAD FAIT CE QUE FAIT LE POUCE · 09/09/2026 ══════════════
   La molette VERTICALE ne pilote toujours rien — c'est la règle qui a
   réglé « le filtre manque de fluidité », et elle tient. Mais un trackpad
   glisse aussi HORIZONTALEMENT, et ce geste-là n'est en concurrence avec
   rien : la liste ne défile pas en X.
   Deux verrous pour ne pas déclencher sur un scroll un peu oblique :
   l'horizontale doit dominer nettement (1,6×), et il faut ACCUMULER
   jusqu'à un seuil — un trackpad envoie trente petits événements pour un
   seul geste, et sans accumulateur on traverserait les trois vues d'un
   coup. Le compteur se vide après 220 ms d'immobilité : deux gestes
   séparés ne s'additionnent pas. */
(function(){
  let acc=0, t=0;
  addEventListener('wheel',e=>{
    if(document.body.classList.contains('gate'))return;
    if(Math.abs(e.deltaX) < Math.abs(e.deltaY)*1.6) return;

    acc+=e.deltaX;
    if(Math.abs(acc)<70)return;
    const i=VIEW_ORDER.indexOf(view)+(acc>0?1:-1);
    acc=0;
    if(i>=0&&i<VIEW_ORDER.length)setView(VIEW_ORDER[i]);
  },{passive:true});
})();

/* ══════════════════════════════════════════════════════════════════════════
   LA LOCALISATION — POURQUOI ELLE NE MARCHAIT PAS SUR .space
   ══════════════════════════════════════════════════════════════════════════
   MESURÉ LE 23/08/2026 (w4.mjs, cas A) : sur un navigateur neuf, la page
   d'atterrissage appelait `getCurrentPosition` ZÉRO fois. Le code portait
   même le commentaire « JAMAIS de prompt ici » : la météo n'acceptait
   qu'une permission DÉJÀ accordée. Comme rien ne la demandait jamais, elle
   ne l'était jamais. La boucle était fermée sur elle-même.

   On la demande maintenant — une fois, sur un geste, au seul endroit où
   elle veut dire quelque chose : [Open my Totehm World]. Un prompt lâché au
   chargement, sans contexte, c'est le refus définitif garanti ; le même
   prompt sur le bouton qui dit « mon monde » se comprend tout seul.

   La position est écrite dans `totehm_geo_v2`, la clé que map.html relit :
   même origine (www.totehm.space), même localStorage. Une demande GPS pour
   les deux écrans, et la carte s'ouvre déjà localisée.
   ══════════════════════════════════════════════════════════════════════════ */
/* Deux besoins, deux fonctions. La météo se contente d'une position d'hier ;
   décider s'il faut DEMANDER exige une position fraîche, sinon une entrée
   ancienne (`totehm_map_pos_v1`, écrite sans horodatage par une version
   précédente) bloque le prompt pour toujours. */
const POS_TTL=15*60*1000;
function cachedPos(){
  for(const k of ['totehm_geo_v2','totehm_map_pos_v1']){
    try{
      const c=JSON.parse(localStorage.getItem(k)||'null');
      if(c&&isFinite(c.lat)&&isFinite(c.lng))return c;
    }catch(e){}
  }
  return null;
}
function freshPos(){
  try{
    const c=JSON.parse(localStorage.getItem('totehm_geo_v2')||'null');
    if(c&&isFinite(c.lat)&&isFinite(c.lng)&&c.t&&Date.now()-c.t<POS_TTL)return c;
  }catch(e){}
  return null;
}
/* ══ CE QUI A COÛTÉ CINQ VAGUES ══
   MESURÉ LE 23/08/2026 sur le DÉPLOYÉ, pas sur le fichier : Vercel servait
   `Permissions-Policy: geolocation=(), microphone=(), camera=()` sur tout
   totehm.space. Une liste VIDE désactive la géolocalisation pour tout le
   monde, la page comprise. Le navigateur répond alors :

     code 1 — « Geolocation has been disabled in this document by
                permissions policy. »

   …instantanément, sans jamais montrer de prompt. Et `permissions.query`
   répond quand même « granted » : rien dans l'API ne dit que c'est la
   plateforme qui a tranché. AUCUN JavaScript ne peut revenir dessus.
   Cinq lots de correctifs ont été écrits dans la mauvaise couche.

   Corrigé dans `space/vercel.json` : `geolocation=(self)`.
   Ce diagnostic reste pour que la prochaine régression se lise en une
   seconde au lieu de cinq vagues. */
function geoDiag(e){
  if(!e||e.code!==1)return;
  if(!/permissions policy|feature policy|disabled in this document/i.test(e.message||''))return;
  console.warn('[totehm] La géolocalisation est coupée par un EN-TÊTE, pas par '
    +'l\'utilisateur. Vérifier space/vercel.json : Permissions-Policy doit dire '
    +'geolocation=(self), jamais geolocation=(). Message du navigateur : '+e.message);
}
function storePos(pos){
  const p={lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5),
           acc:Math.round(pos.coords.accuracy||0),t:Date.now()};
  try{localStorage.setItem('totehm_geo_v2',JSON.stringify(p));}catch(e){}
  return p;
}

/* ══ SEARCH A TOTEHM — RÉÉCRITE LE 04/09/2026 ═══════════════════════
   CE QUI N'ALLAIT PAS, et qui se voyait tout de suite :

   1. `ilike('%'||q||'%').limit(1)` rendait UN résultat, choisi par le
      hasard du plan d'exécution. Taper deux lettres ouvrait le Totehm
      d'un inconnu. Aucune liste, aucun classement, aucun choix.
   2. Un invité (non connecté) ne peut pas lire `profiles` — la RLS ne
      vise que `authenticated`. Le fichier compensait avec TROIS PROFILS
      INVENTÉS en dur. Quelqu'un cherchait une personne et trouvait de
      la fiction. C'est parti.
   3. « this Totehm is private » s'affichait aussi quand le nom n'existait
      pas, et quand le Totehm existait mais était vide. Trois situations,
      un seul message, aucun moyen de savoir laquelle.

   Une seule RPC, `search_totehms()`, ouverte à `anon` : elle ne rend que
   des Totehms explicitement partagés, jamais un e-mail ni un id, et elle
   classe exact > préfixe > sous-chaîne — l'ordre dans lequel un humain
   cherche un nom qu'il connaît déjà. */

const INT_DOT = i => '<span class="sr-dot" style="background:'+intColor(i)+'"></span>';

async function runSearch(q, noteEl){
  noteEl.classList.remove('hide');
  noteEl.className = 'note dim';
  noteEl.textContent = 'searching\u2026';
  let rows = [];
  try{
    const {data,error} = await sb.rpc('search_totehms',{p_q:q,p_limit:8});
    if(error) throw error;
    rows = data || [];
  }catch(e){
    noteEl.className='note no'; noteEl.textContent='search is unreachable right now';
    return;
  }
  if(!rows.length){
    noteEl.className='note dim';
    /* On dit ce qui est vrai : soit personne ne porte ce nom, soit
       personne ne l'a partagé. Jamais « privé » par défaut. */
    noteEl.textContent='no shared Totehm by that name';
    return;
  }
  noteEl.className='note dim';
  noteEl.innerHTML = '<div class="sr-list">' + rows.map(r =>
      '<button class="sr-row" type="button" data-pseudo="'+esc(r.pseudo)+'">'
    +   '<span class="sr-name">'+esc(r.pseudo)+'</span>'
    +   '<span class="sr-ints">'
    +     (r.intentions||[]).filter(i=>INT_BY_ID[i]).map(INT_DOT).join('')
    +   '</span>'
    +   '<span class="sr-meta">'+(r.habits||0)+' habit'+((r.habits||0)===1?'':'s')+'</span>'
    +   '</button>').join('') + '</div>';
  noteEl.querySelectorAll('.sr-row').forEach(b=>{
    b.onclick = () => {
      $('member-window').classList.remove('show');
      location.href = 'totehm.html?ro=' + encodeURIComponent(b.dataset.pseudo);
    };
  });
}

$('search-input').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=$('search-input').value.trim();
  const n=$('search-note');
  if(v.length<2){n.className='note dim';n.textContent='two letters, minimum';return;}
  runSearch(v, n);
});

   Un seul palier remplace Seed / Plant / Tree : essai 7 jours, puis un tarif
   unique qui inclut la Higher Map et le Totehm Cloth.

   ⚠️ SEUL ENDROIT À ÉDITER pour ton tarif réel. `price` / `priceAlt` sont des

   NOM : le brief disait « Figher Club ». Je l'ai lu « Higher Club » — cohérent
   avec la marque HIGHER omniprésente (asset #higher-word, « Get Higher »…).
   Pour revenir en arrière : change simplement CLUB.name ci-dessous. */
const CLUB={

/* ══ TOTEHMBOT ══════════════════════════════════════════════════════
   Le membre pose un spot depuis Telegram : /spot, sept boutons, une
   position native. Aucun geocodage, donc aucune API payante.

   La liaison passe par un code a usage unique, valable 10 minutes, cree
   par new_bot_link_code() et lu par bot-reply au /start. Le compte n'est
   JAMAIS transmis par le message : le bot le retrouve en base.

   telegram_id n'est ni lisible ni ecrivable par le membre (GRANT par
   colonne) — sans quoi n'importe qui pouvait s'attribuer le Telegram
   d'un autre et recevoir ses questions a sa place. D'ou bot_linked(),
   qui ne rend qu'un booleen sur SA ligne. */

async function paintTelegram(sub){
  const box=$('tg-block'); if(!box) return;
  const live = sub && ['active','trialing','past_due'].includes(sub.status);
  /* Pas d'abonnement = /spot repondrait « reserve aux membres du Club ».
     On ne montre pas une porte qui se ferme. */
  box.classList.toggle('hide', !(me && live));
  if(!(me && live)) return;
  /* `bot_state()` rend TROIS choses en un appel : lié, actif, en attente.
     `bot_linked()` n'en rendait qu'une — et le membre voyait « connected »
     sur un bot qui n'avait pas le droit de parler. */
  let st=null;
  try{ const {data}=await sb.rpc('bot_state'); st=data||null; }catch(_){ st=null; }
  tgLinked=!!(st&&st.linked);
  botOn=!!(st&&st.on);
  const b=$('tg-btn'), n=$('tg-note');
  b.classList.toggle('claimed', tgLinked);
  b.textContent = tgLinked ? 'TotehmBot connected' : 'Connect TotehmBot';
  const t=$('tg-toggle');
  if(t){
    t.classList.toggle('hide', !tgLinked);
    t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  }
  if(n) n.textContent = !tgLinked ? ''
    : (botOn ? 'send /tonight for what is on around you · /spot to post a place'
             : 'paused — /tonight and /spot still work');
}
let botOn=false;

  const t=$('tg-toggle');
  t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  const n=$('tg-note');
