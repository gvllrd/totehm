/* ══════════════════════════════════════════════════════════════════════════
   LANDING GATE — le logo TOTEHM recomposé (4 SVG vectoriels superposés)
   puis DÉCONSTRUIT au clic vers l'UI de l'app. Transitions CSS pures.
   Taille / placement calés sur stoner.html (#stage + #vid-wrap + bouton).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --gate-size:110px;            /* taille du logo assemblé — IDENTIQUE mobile et desktop */
  --gate-top:8vh;
  --gate-gap:3vh;               /* écart logo -> bouton */
  --gate-btn-gap:24px;          /* = margin-top de #btn-slogan (stoner.html) */
  --gate-dur:1.05s;             /* durée de la déconstruction */
  --gate-ease:cubic-bezier(.62,.02,.24,1);
  --gate-bg-scale:60;           /* zoom du fond perforé */
  --gate-bg-fade:1;             /* opacité finale du fond (0.3 pour filigrane) */
  --gate-reveal:.52s;           /* retard avant l'apparition de l'UI */
}

/* Pendant que le repli remet les calques à leur place d'arrivée, RIEN ne
   doit s'animer : sinon on voit le saut avant de voir le retour. */
#gate.no-anim,#gate.no-anim *{transition:none!important;animation:none!important}

/* ── L'écran d'atterrissage ── */
/* ══ LE BUG MOBILE, ET SA CAUSE EXACTE ══
   L'atterrissage défile (`overflow-y:auto`) depuis qu'il porte la Terre.
   Or `#gl-bg` monte à scale(60) pendant l'animation — sur mobile, faute de
   `--tf-bg` mesurable, c'est la valeur de repli. 110 px × 60 = 6 600 px de
   carré à l'intérieur d'un conteneur qui défile : MESURÉ, la hauteur de
   défilement du gate passait de 844 px à 2 525 px pendant le geste. Le
   navigateur ajustait alors la position de défilement et les boutons du bas
   sortaient de l'écran. C'était ça, « des boutons qui disparaissent ».

   Le correctif : PENDANT l'animation (déploiement comme repli), le gate ne
   défile pas. Les deux ne se produisent jamais en même temps — on ne
   parcourt pas la page pendant qu'elle se déplie. Au repos, les calques
   sont à scale(1) et le défilement redevient normal.
   Desktop n'a jamais eu le problème : `--tf-bg` y vaut ~scale(5,8), qui
   tient dans le carré. */
#gate{position:fixed;inset:0;z-index:200;background:#000;
  display:block;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  transition:opacity .32s ease}
#gate-hero{width:100%;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  position:relative;justify-content:space-between;
  padding:max(76px,13vh) 0 max(24px,env(safe-area-inset-bottom,0));overflow:hidden}
body.gate.entered #gate,body.gate.folding #gate{overflow:hidden;scroll-behavior:auto}
body:not(.gate) #gate{display:none}
#gate.gate-off{opacity:0;pointer-events:none}

/* ── Le carré du logo : taille fixe, aucune variation par viewport ── */
/* Rangée haute : logo 4-SVG + bouton côte à côte, centrés ensemble */
#gate-top-row{display:flex;flex-direction:column;align-items:center;
  gap:16px;flex-shrink:0}
#gate-logo{position:relative;flex-shrink:0;
  width:var(--gate-size);height:var(--gate-size)}

/* Chaque calque est cadré au plus juste sur son dessin (viewBox serré) :
   son rectangle DOM == le rectangle du glyphe -> le calcul FLIP est exact. */
#gate-logo .glayer{position:absolute;display:block;overflow:visible;
  transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden;
  transition:transform var(--gate-dur) var(--gate-ease),opacity var(--gate-dur) var(--gate-ease)}
#gl-bg  {left:0;      top:0;       width:100%;     height:100%;     z-index:1}
#gl-rail{left:9.200%; top:.100%;   width:7.650%;   height:99.799%;  z-index:2}
#gl-t   {left:35.501%;top:21.386%; width:29.700%;  height:29.870%;  z-index:3}
#gl-wm  {left:33.349%;top:54.268%; width:34.500%;  height:20.834%;  z-index:3}

/* La zone cliquable qui couvre le logo (cf. #logo-btn de stoner.html) */
#gate-enter{position:absolute;inset:0;z-index:9;background:none;border:none;padding:0;
  cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .25s ease}

/* Deux chemins des l'arrivee, le payant d'abord : la communaute d'un
   influenceur atterrit ici et doit voir le chemin Higher sans s'inscrire
   pour le decouvrir. get_higher.html accepte un visiteur sans session — il
   affiche le prix et ne demande le compte qu'au moment de payer. */
#gate-open{margin-top:0;transition:opacity .25s ease}
/* La phrase « By opening your Totehm… » sous le bouton faisait lire un
   contrat au moment d'entrer. Le lien reste — obligation — mais au coin,
   là où on le cherche quand on le cherche. */
#terms-corner{position:fixed;right:16px;top:14px;z-index:4;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#8a8a8a;text-decoration:none;
  padding:6px 2px;transition:color .15s ease,opacity .25s ease}
body.gate.entered #terms-corner{opacity:0;pointer-events:none}

/* ══ ÉTAT 2 — LA DÉCONSTRUCTION ══
   Les valeurs --tf-* sont mesurées une fois en JS (positions réelles de l'UI)
   puis écrites en variables CSS : l'animation elle-même reste 100% CSS. */
body.gate.entered #gl-bg  {transform:scale(var(--gate-bg-scale));opacity:var(--gate-bg-fade)}
body.gate.entered #gl-t   {transform:var(--tf-t,translateY(-40vh))}
body.gate.entered #gl-wm  {transform:var(--tf-wm,translateY(40vh))}
body.gate.entered #gl-rail{transform:var(--tf-rail,translateX(-30vw))}
body.gate.entered #gate-enter,
body.gate.entered #gate-open,
body.gate.entered #gate-bottom,
body.gate.entered #ctx-down,
body.gate.entered #conn-bar{opacity:0;pointer-events:none}

/* ══ L'UI de l'app : masquée pendant l'état 1, fondu entrant pendant l'état 2 ══ */
body.gate #rail,body.gate #bigT,body.gate #wordmark,
body.gate #floorview,body.gate #menu-arrow,
body.gate #filter-arrow,body.gate #fv-status,body.gate #fold-x,
body.gate #views,body.gate #vname,
body.gate #filter-badge{
  opacity:0;pointer-events:none;transition:opacity .55s ease}
body.gate.entered #rail,body.gate.entered #bigT,body.gate.entered #wordmark,
body.gate.entered #floorview,
body.gate.entered #menu-arrow,body.gate.entered #filter-arrow,
body.gate.entered #fv-status,body.gate.entered #fold-x,
body.gate.entered #views,body.gate.entered #vname,
body.gate.entered #filter-badge{
  opacity:1;pointer-events:auto;transition:opacity .55s ease var(--gate-reveal)}

/* Le rail de l'app reprend exactement le gris du logo (#626286) */
#rail{background:#626286}

@media(prefers-reduced-motion:reduce){
  #gate-logo .glayer{transition-duration:.01ms!important}
  body.gate #rail,body.gate #bigT,body.gate #wordmark,
  body.gate #floorview,body.gate #menu-arrow,
  body.gate #filter-arrow,body.gate #fv-status,body.gate #fold-x,
  body.gate #filter-badge{transition-duration:.01ms!important}
}
/* ── Gate: zone basse (Search + phrase) — margin-top:auto pousse vers le bas ── */
#gate-bottom{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;width:100%;flex-shrink:0;transition:opacity .25s ease}
#conn-bar{transition:color .15s,opacity .25s ease}
/* ── Gate: Search bar — style moteur de recherche ── */
/* Une box rectangulaire pleine, #626283 — pas la tuile perforée navy des
   boutons. `border-image:none` est obligatoire : sans lui la tuile héritée
   de .line-input reste peinte PAR-DESSUS le fond et rien ne change. */
#gate-search-input{width:min(320px,82vw);min-width:0;font-size:15px}
#gate-search-input,#search-input{background:#626283;border:6px solid #626283;
  border-image:none;color:#fff;caret-color:#fff}
#gate-search-input::placeholder,#search-input::placeholder{color:rgba(255,255,255,.55)}
/* ── Desktop : texte gris → blanc au survol ── */
@media(hover:hover){
  .set-note,.bot-txt,.acct-note,.hp-lbl,.hp-def,.fp-int .df,.mw-mail,.mw-body{transition:color .15s}
  .set-note:hover,.bot-txt:hover,.acct-note:hover,.hp-lbl:hover,.hp-def:hover,.fp-int .df:hover,.mw-mail:hover,.mw-body:hover{color:#fff}
}
/* SUPPRIMÉ (29/08) — .sn-tile, les tuiles perforées qui portaient un chevron
   dans les boutons My Wisdom / My next objective du menu membre. */
/* ── Le T de la ligne d'ajout clignote : c'est l'invitation, il n'y a
      plus un mot pour la dire. Il ouvre temporalité puis intention. ── */
@keyframes t-pulse{0%,100%{opacity:1}50%{opacity:.18}}
.h-T.blink{animation:t-pulse 2.2s ease-in-out infinite}

/* ── LA CROIX DE REPLI ──
   Sur le flanc droit du Totehm, à mi-hauteur : le seul endroit libre de
   tout — le badge de filtre occupe le coin haut droit, les chevrons de
   navigation vivent HORS du carré. Elle rejoue le déploiement à l'envers
   et ramène à l'atterrissage. */
#fold-x{position:fixed;top:10px;right:10px;z-index:34;
  background:none;border:none;cursor:pointer;padding:10px;line-height:0;
  -webkit-tap-highlight-color:transparent}
#fold-x svg{width:20px;height:20px;color:rgba(255,255,255,.5);display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
  transition:color .15s}
@media(hover:hover){#fold-x:hover svg{color:#fff}}
#fold-x:active svg{color:#fff}

/* ── L'ATTERRISSAGE : la Terre et la porte du monde ──
   La vidéo n'est chargée QUE si elle entre dans le champ (IntersectionObserver).
   1,9 Mo servis à chaque visiteur qui ne descend jamais, c'est de l'egress
   payé pour rien. */
/* La Terre suit le bloc Search, elle ne se colle PAS au bas du cadre :
   `margin-top:auto` la plaquait en bas et ouvrait un trou noir de 350 px
   au milieu de l'atterrissage. Une marge franche, et la page se lit d'un
   trait — logo, portes, Terre. */
#ctx-down{margin-top:2.5vh;margin-bottom:calc(3vh + env(safe-area-inset-bottom,0));flex-shrink:0;
  background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;
  transition:opacity .25s ease}
.ctx-label{font-family:'Quantico',sans-serif;font-weight:400;font-size:14px;
  color:#b0b0b0;transition:color .15s ease}
.chev{width:22px;height:22px;color:#909090;transition:color .15s ease}
@media(hover:hover){#ctx-down:hover .ctx-label,#ctx-down:hover .chev{color:#fff}}
/* SUPPRIMÉ (29/08) — #ctx-up, le chevron vers le haut. Il avait déjà été
   annulé en vague 5B ; son bouton et son écouteur partent avec lui. Le
   retour se fait par le scroll, comme l'aller. */
@keyframes ctx-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.bob{animation:ctx-bob 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bob{animation:none}#gate{scroll-behavior:auto}}


/* ══ DESKTOP : le logo habité devient un carré ══════════════════════════════
   Ce bloc est EN FIN DE FEUILLE, pas au début : à spécificité égale c'est le
   dernier déclaré qui gagne. Placé en tête, `html,body{background:#000}` se
   faisait battre par le `html,body{background:var(--navy)}` des règles de
   base — la page restait navy et le carré navy devenait invisible.

   Le fond n'est pas un cadre : c'est le calque #gl-bg lui-même, le carré navy
   perforé du logo. Le noir, c'est la page derrière lui.

   La bordure transparente vaut exactement la profondeur des perforations
   (r = 13.86 / 224.88 = 6.16 % du côté). Comme #stage porte un transform, il
   est le bloc conteneur de tous ses descendants position:fixed, et ceux-ci se
   résolvent sur sa PADDING box : la bordure les écarte donc des trous d'un
   seul coup, sans toucher une ligne de positionnement existante.
   Un padding n'aurait rien fait : sans bordure, padding box == border box.

   La typo ne bouge pas — elle reste celle du mobile. Seul le rail suit le
   carré : les libellés de fréquence vivent à sa gauche et sortaient du cadre.
   ══════════════════════════════════════════════════════════════════════════ */
@media(min-width:700px){
  :root{
    /* 78vw et pas 94vw : il faut de la place de chaque côté pour les deux
       boîtes de navigation, sinon elles sortent de la fenêtre.
       Encombrement total = --stage * (1 + 2 * (.058 + .05)) = --stage * 1.216. */
    --stage:min(92vh,78vw,640px);
    --pad:calc(var(--stage) * .0616);   /* profondeur d'une perforation */
    --side:max(56px,calc(var(--stage) * .10));   /* carré élargi : chevron + intitulé */
    --side-gap:calc(var(--stage) * .085);         /* éloigné du Totehm */
    --rl:max(38px,calc(var(--stage) * .072));   /* dégage les T des perforations */
    --rw:max(16px,calc(var(--stage) * .034));   /* rail de saisie, pas rail de logo */
  }
  html,body{background:#000}
  #stage{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:var(--stage);height:var(--stage);
    border:var(--pad) solid transparent;
    background:var(--logo-navy) 0 0/100% 100% no-repeat border-box;
    overflow:hidden;z-index:10;
  }
  /* Le rail s'arrête au T en haut et au wordmark en bas, au lieu de courir
     d'un bord à l'autre : 30px, la même valeur que #bigT et #wordmark. */
  #rail{top:30px;bottom:30px}
  /* Les carrés sont centrés sous le T dans les deux cas : le T est plus
     petit ici (46px), la rangée remonte d'autant. */
  #views{top:100px}
  #vname{top:124px}
  /* SUPPRIMÉ (05/09) — le papier ne change pas de couleur. Une seule
     tuile, la navy. Ce sont les BOÎTES qui portent les trois couleurs.
     Retour arrière : ces deux lignes reprenaient --logo-blue/--logo-rep,
     tous deux toujours définis en tête de feuille. */
  #stage.z-set{background-image:none}
  /* Le rail est à sa place du logo : il ne reste pas 190 px pour un libellé
     de fréquence. Comme sur mobile, il disparaît — la fréquence se lit en
     ouvrant le T, qui porte déjà fréquence et intention. */
  .habit .h-freq{display:none}

  /* Les iframes couvrent le carré : elles portent leur propre couleur.
     background:#000 reste en place — il est le rideau du fondu enchaîné. */

  /* Les quatre calques du logo convergent vers le mode saisie : le T vers
     #bigT, le wordmark vers #wordmark, le rail vers #rail — et le fond vers
     #stage lui-meme, au lieu du scale(60) qui noyait l'écran de navy. La
     valeur est mesurée en JS ; sur mobile #stage n'a pas de boîte, la mesure
     est ignorée et le scale(60) d'origine reprend la main. */
  body.gate.entered #gl-bg{transform:var(--tf-bg,scale(var(--gate-bg-scale)));opacity:1}

  /* SUPPRIMÉ (29/08) — les carrés perforés .side-nav, leur chevron et leur
     intitulé. Puis les curseurs .tnav qui les avaient remplacés (05/09).
     La navigation passe par les trois carrés #views, en haut à gauche,
     ordinateur et mobile — et il n'y a plus trois fichiers, il y en a un.
     Retour arrière : le bloc #views en tête de feuille. */
  #settings-nav .sn-row{display:none}
  /* ══ LE TOTEHM SE REPLIE ══
     Le repli ne passe plus par un étage : c'est le module GATE qui rejoue
     le déploiement à l'envers, sur les quatre pièces du logo —
     #gl-bg -> le fond navy de #stage, #gl-t -> #bigT,
     #gl-wm -> #wordmark, #gl-rail -> #rail. Même durée, même easing
     (--gate-dur, --gate-ease) : l'aller et le retour sont le même geste. */
  #fv-inner{scroll-snap-type:none}
  #habits{flex-shrink:0;height:auto}

  #settings-nav .sn-row{display:flex;flex-direction:column;
    align-items:center;gap:10px;margin-bottom:2px}
  #settings-nav .sn-btn{font-size:14px}

  /* Settings desktop : seul le logo reste, sans My Wisdom / My next objective */
  #settings-nav .sn-row{display:none!important}
  #sn-home{display:flex}
  #sn-home img{width:54px;height:auto}
  #sn-home:hover,#sn-home:active{border-image-source:none;color:#b0b0b0}
  /* Desktop : freq-panel reste ancré en haut aussi. Un utilisateur qui
     revient de mobile ne doit pas voir la carte sauter selon le device. */
  .fp-card{max-height:calc(100vh - 88px)}
}
























































































/* ══ MOBILE — COIN HAUT GAUCHE HARMONISÉ AVEC LA CROIX · 07/09/2026 ═════
   Sur mobile, #ordbtn (classer) prend la même géométrie que #fold-x — même
   top, même padding, même dimensions — pour créer un tout harmonieux avec
   la croix à droite. #conn-bar quitte le coin gauche (il y a maintenant
   l'icône classer) et se pose au-dessus du T, centré. Le T descend d'une
   ligne pour laisser la place.
   Le rail se colle au bord GAUCHE (var(--rl):0) : les boîtes d'habitudes
   récupèrent la largeur qu'occupait l'espace entre le bord et le rail.
   Le tick devient un TIRET VERTICAL de la hauteur de la boîte : la
   première boîte porte la couleur vive de son intention, les suivantes
   deviennent de plus en plus transparentes sur le gris du rail. La ligne
   en tête de liste (`.featured`, posée par le scroll) monte d'un léger
   effet de loupe — une boîte pleine légèrement agrandie, sans ombre :
   BRAND.md interdit l'ombre décorative. */
@media(max-width:699px){
  :root{--rl:0px;--rw:6px;--band-t:150px}
  /* #ordbtn = boîte 40×40 comme #fold-x (svg 20×20 + padding 10×10) :
     trois barres largeur 20/14/8 sur 20px de haut (2px × 3 barres +
     7px × 2 gaps), padding 10 → 40×40. Même géométrie exactement, en
     miroir de la croix à droite. */
  #ordbtn{top:10px;left:10px;padding:10px;gap:7px}
  #ordbtn .ob-1{width:20px}#ordbtn .ob-2{width:14px}#ordbtn .ob-3{width:8px}
  #ordbtn span{height:2px}
  /* L'accès membre quitte le coin gauche (repris par #ordbtn) et se pose
     au-dessus du T, centré. `body:not(.gate)` : dans l'atterrissage,
     #conn-bar garde sa place d'origine — le logo composé du gate occupe
     déjà le centre. */
  body:not(.gate) #conn-bar{top:8px;left:50%;right:auto;transform:translateX(-50%);padding:6px 10px}
  #bigT{top:44px}
  #bigT svg{height:48px}
  #views{top:118px}
  #vname{top:142px}
  /* Rail fin et sourd — une trace, pas une bande. Il tient la colonne du
     regard sans peser. */
  #rail{background:rgba(255,255,255,.16)}
  .habit .h-body{margin-left:calc(var(--rw) + 4px)}
  /* Mobile pousse la loupe un peu plus fort (1.035 au lieu de 1.02) :
     la liste tient sur un pouce, le regard cherche un point d'ancrage. */
  .habit.featured .h-body{transform:scale(1.035)}
}

<!-- ══ LES DEUX IFRAMES ONT DISPARU · 05/09/2026 ══════════════════════
     `#book` et `#nextobj` chargeaient book.html et next_objective.html.
     Les trois écrans sont devenus TROIS VUES du même modèle — objectifs,
     habitudes, répulsions — et une vue n'a pas besoin d'un document.

     Ce que leur départ emporte, et c'était le vrai coût :
       · le contrat postMessage en quatre messages (une iframe ne peut pas
         couvrir l'écran, c'est le parent qui ouvrait pour elle) ;
       · `pushMetrics()` et le piège du jeton `--rl` — une propriété
         personnalisée est SUBSTITUÉE, pas calculée, donc l'iframe la
         résolvait contre SA fenêtre ;
       · le fondu enchaîné et son rideau noir entre deux documents ;
       · trois `createClient`, trois vérifications de session, trois copies
         des SVG du logo et des carrés perforés.
     Tout ça pour afficher trois listes du même objet. -->

/* détecte un mot-clé simple sur des tokens */
const hasKw=(n,arr)=>arr.some(k=>new RegExp('(^|\\s)'+k+'($|\\s)').test(n));
const hasPhr=(n,arr)=>arr.some(p=>n.indexOf(norm(p))!==-1);

/* deduceFreq : trouve TOUJOURS un ID (fallback = sometimes) */
function deduceFreq(raw){
  const original=String(raw||'').trim();
  let n=norm(raw);
  /* pas de tokens latins mais du texte non vide : fallback direct */
  if(!n){ return original.length ? 'sometimes' : null; }

  /* match exact sur un label */
  const exact=FREQS.find(f=>f.label===n);
  if(exact)return exact.id;

  /* phrases idiomatiques d'abord (avant tokenisation qui pourrait couper) */
  const PHRASE_TO_ID={weekend:'every_weekend',weekday:'every_weekday',afternoon:'every_afternoon',morning:'every_morning',evening:'every_evening',night:'every_night',birthday:'every_birthday',newyear:'every_newyear',sometimes:'sometimes',seasonal:'seasonal',every_1st_month:'every_1st_month',every_15th_month:'every_15th_month',daily:'daily',weekly:'weekly'};
  for(const k of Object.keys(PHRASES)){
    if(hasPhr(n,PHRASES[k]))return PHRASE_TO_ID[k]||k;
  }

  /* fragments de label (ex "twice week" -> "twice a week") */
  if(n.length>=4){
    const partial=FREQS.find(f=>{
      const fl=f.label;
      return fl.indexOf(n)!==-1 || (n.length>=fl.length-3 && n.indexOf(fl)!==-1);
    });
    if(partial)return partial.id;
  }

  /* nombres en lettres → chiffres */
  n=n.replace(/(^|\s)(deux|two|dos|due|zwei|twee)($|\s)/g,'$12$3')
     .replace(/(^|\s)(trois|three|tres|tre|drei|drie)($|\s)/g,'$13$3')
     .replace(/(^|\s)(quatre|four|cuatro|quattro|vier)($|\s)/g,'$14$3')
     .replace(/(^|\s)(cinq|five|cinco|cinque|funf)($|\s)/g,'$15$3')
     .replace(/(^|\s)(six|seis|sei|sechs|zes)($|\s)/g,'$16$3')
     .replace(/(^|\s)(sept|seven|siete|sette|sieben|zeven)($|\s)/g,'$17$3');

  let mult=false,num=null;
  if(/(^|\s)(twice|bihebdo|zweimal)($|\s)/.test(n)){mult=true;num=2;}
  if(/(^|\s)(thrice|dreimal)($|\s)/.test(n)){mult=true;num=3;}
  if(/(^|\s)(once|einmal|una vez|una volta|1 fois)($|\s)/.test(n)){num=num||1;}
  const nm=n.match(/(\d+)/);
  if(nm)num=parseInt(nm[1],10);
  if(/(?:^|\s)(x\d+|\d+x|times|fois|vezes|veces|vez|volte|volta|mal|keer|per|par|por|al|pro|nel|dans|dentro)(?:$|\s)/.test(n))mult=true;
  if(/(^|\s)(several|plusieurs|varias|varios|varie|mehrmals|meermaals|multiple|many|beaucoup)($|\s)/.test(n))mult=true;

  /* jours nommés */
  for(const d in DAYS){if(hasKw(n,DAYS[d]))return 'every_'+d;}

  /* dates spéciales */
  if(hasKw(n,LEX.birthday))return 'every_birthday';
  if(hasKw(n,LEX.newyear))return 'every_newyear';
  if(hasKw(n,LEX.season)){return 'seasonal';}

  /* fenêtres de journée */
  if(hasKw(n,LEX.afternoon))return 'every_afternoon';
  if(hasKw(n,LEX.morning))return 'every_morning';
  if(hasKw(n,LEX.evening))return 'every_evening';
  if(hasKw(n,LEX.night))return 'every_night';

  /* weekend / weekday */
  if(hasKw(n,LEX.weekend))return 'every_weekend';
  if(hasKw(n,LEX.weekday))return 'every_weekday';

  /* fortnight */
  if(hasKw(n,LEX.fortnight))return 'biweekly';

  /* random / sometimes (avant fenêtres génériques) */
  if(hasKw(n,LEX.random))return 'randomly';
  if(hasKw(n,LEX.sometimes))return 'sometimes';

  /* minute / heure */
  if(hasKw(n,LEX.minute))return 'every_minute';
  if(hasKw(n,LEX.hour))return 'hourly';

  /* jour */
  if(hasKw(n,LEX.day)){
    if(/(^|\s)(other|alterni|alternos|sur 2)($|\s)/.test(n))return 'every_other_day';
    if(num===2&&!mult)return 'every_other_day';
    if(mult&&num&&num>=2)return 'several_daily';
    if(/(^|\s)(several|plusieurs|varias|varios|varie|mehrmals|meermaals)($|\s)/.test(n))return 'several_daily';
    return 'daily';
  }

  /* semaine */
  if(hasKw(n,LEX.week)){
    if(num===2&&mult)return 'twice_week';
    if(num===2&&!mult)return 'biweekly';
    if(num&&num>=3&&!mult)return 'monthly';
    return 'weekly';
  }

  /* mois */
  if(hasKw(n,LEX.month)){
    if(num===2&&mult)return 'twice_month';
    if(num===1)return 'every_1st_month';
    if(num===15)return 'every_15th_month';
    if(num&&num>=5&&!mult)return 'semiannual';
    if(num&&num>=3&&!mult)return 'quarterly';
    return 'monthly';
  }

  /* trimestre / semestre / année */
  if(hasKw(n,LEX.quarter))return 'quarterly';
  if(hasKw(n,LEX.semi))return 'semiannual';
  if(hasKw(n,LEX.year)){
    if(num&&num>=2&&!mult)return 'sometimes';

/* ── CLOUD : un snapshot = une ligne totehms ── */
async function cloudSave(){
  if(RO)return;                 /* second verrou, ceinture et bretelles */
  if(!me)return;
  $('mw-sync').textContent='syncing…';
  try{
    /* ══ `bot` N'EST PLUS DANS CE SNAPSHOT — CORRIGÉ LE 03/09/2026 ══
       La colonne était écrite ici avec `bot:!!profile.bot`, un champ
       qu'AUCUN bouton du produit ne cochait : elle valait donc `false`
       pour tout le monde, et surtout, allumer le bot ailleurs (par la
       liaison Telegram) était annulé au prochain enregistrement
       d'habitude. Un upsert PostgREST ne met à jour que les colonnes
       envoyées : en la retirant, l'interrupteur cesse d'être un effet de
       bord de la saisie. Il vit dans `set_bot()`. */
    const {error}=await sb.from('totehms').upsert({
      user_id:me.id,
      totehm_visibility:(state.vis==='members')?'members':'private',
      steps:state.habits,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});
    if(error)throw error;
    $('mw-sync').textContent='synced ✓';
    setTimeout(()=>{if($('mw-sync').textContent==='synced ✓')$('mw-sync').textContent='';},1400);
  }catch(e){$('mw-sync').textContent='sync failed — will retry';}
}
/* Un state venu du localStorage d'avant la migration porte l'ancienne valeur. */
if(state&&state.vis==='network')state.vis='members';
function scheduleCloudSave(){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(cloudSave,900);}
async function cloudLoad(){
  if(!me)return;
  const {data,error}=await sb.from('totehms').select('*').eq('user_id',me.id);
  if(error||!data||!data.length)return;
  const habits=[];const seen={};
  /* ⚠️ `o` EST TRANSPORTÉ, PAS DÉDUIT. Il porte l'objectif que sert cette
     habitude, et il est écrit par `habit_set_trip()` côté serveur. Le
     reconstruire en `{t,f,i}` le jetait — et comme `cloudSave` réécrit
     `steps` EN ENTIER, la liaison disparaissait à la frappe suivante.
     Même piège que `totehms.bot` le 03/09 : un snapshot qui écrase tout
     doit transporter tout ce qu'il écrase. */
  data.forEach(r=>{(Array.isArray(r.steps)?r.steps:[]).forEach(s=>{const k=norm(s.t);if(s.t&&!seen[k]){seen[k]=1;habits.push({t:s.t,f:FREQ_BY_ID[s.f]?s.f:null,i:INT_BY_ID[s.i]?s.i:null,o:s.o||null});}});});
  /* L'ORDRE DU MEMBRE EST UNE DONNÉE. `state` est reconstruit de zéro
     ici : sans ce report, l'ordre choisi à la main était oublié au
     premier chargement depuis le nuage. L'ordre lui-même voyage dans
     `steps` — c'est l'ordre du tableau ; seul le DRAPEAU se perdait. */
  const ordonne = !!(state && state.ord);
  state={habits, vis:data.some(r=>r.totehm_visibility==='members')?'members':'private'};
  if(ordonne)state.ord=true;
  if(data[0].bot!=null)profile.bot=!!data[0].bot;
  try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(KEYP,JSON.stringify(profile));}catch(e){}
}

   `authenticated` et adossée à la MÊME visibilité — un seul interrupteur
   pour les trois volets, celui que le membre connaît déjà.

function updateFilterBadge(){
  saveFilter();
  const badge=$('filter-badge');
  if(!filterF && !filterI){badge.classList.add('hide');return;}
  $('fb-freq').textContent = filterF ? flabel(filterF) : '';
  if(filterI && INT_BY_ID[filterI]){
    const x=INT_BY_ID[filterI];
    $('fb-int').innerHTML = '<span style="color:'+x.color+'">'+x.name+'</span>';
  }else{
    $('fb-int').textContent = '';
  }
  badge.classList.remove('hide');
}
$('fb-clear').onclick=()=>{filterF=null;filterI=null;updateFilterBadge();renderHabits();};
function applyFreq(id){
  if(fpTarget==null||!FREQ_BY_ID[id]){closeFreqPanel();return;}
  if(fpTarget==='filter'){
    filterF=id; saveFilter();
    $('fp-skip').textContent='any intention';
    showFpStage('int');
    return;
  }
  if(fpTarget==='new'){
    pendingF=id;
    closeFreqPanel();
    /* Nouveau flow peek : au lieu de cascader vers la stage intention
       dans le même panneau (ancien wizard), on rouvre la fenêtre d'aperçu
       si l'intention manque encore. Sinon on crée l'habit. */
    if(!pendingI){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(!state.habits[fpTarget]){closeFreqPanel();return;}
  const prevF=state.habits[fpTarget].f;
  state.habits[fpTarget].f=id;save();
  if(prevF&&prevF!==id)logTotehmEvent('freq_changed',state.habits[fpTarget].t,{from:prevF,to:id});
  if(!state.habits[fpTarget].i){showFpStage('int');renderHabits();return;}
  closeFreqPanel();renderHabits();
}
/* étape 2 : l'intention colore le T et se pose à côté de la fréquence */
function applyIntent(id){
  if(fpTarget==='new'){
    pendingI=id;
    closeFreqPanel();
    /* Si la fréquence manque encore, rouvre le peek pour la définir.
       Sinon crée l'habit (renderHabits gère la conversion pending → state). */
    if(!pendingF){renderHabits();openNewHabitPeek();return;}
    renderHabits();const na=$('h-add');if(na)na.focus();return;
  }
  if(fpTarget==='filter'){filterI=id;closeFreqPanel();updateFilterBadge();renderHabits();return;}
  if(state.habits[fpTarget]){const prevI=state.habits[fpTarget].i;state.habits[fpTarget].i=id;save();if(prevI!==id)logTotehmEvent('intention_changed',state.habits[fpTarget].t,{from:prevI||null,to:id||null});}
  closeFreqPanel();renderHabits();
}
/* Rendu aligné sur book.html (.pk-int) : T EN BLOC au-dessus du nom,
   définition dessous, pilier dessous. Colonne centrée. Même objet visuel

      +'<span class="fp-pillar">'+esc(x.pillar)+'</span>';

}
$('fp-skip').onclick=()=>applyIntent(null);

/* ══ LES MESURES DU RAIL : DONNÉES, PLUS DÉDUITES ══
   book.html et next_objective.html recalculaient `--rl` et `--rw` depuis
   `100vw` avec un facteur dérivé (.0821 = .072 / .8768). Deux formules pour
   une même mesure, c'est un endroit où l'écart finit toujours par s'installer :
   il suffit d'une barre de défilement, d'un arrondi, ou d'une retouche d'un
   seul côté. Le parent envoie désormais ses valeurs calculées. Elles ne sont
   plus égales par arithmétique — elles sont identiques par construction. */
/* ══ `pushMetrics()` A DISPARU · 05/09/2026 ═══════════════════════════
   Elle poussait la valeur RÉSOLUE de `--rl` aux deux iframes, parce
   qu'une propriété personnalisée est SUBSTITUÉE et pas calculée : l'iframe
   recevait le jeton `max(38px,calc(min(92vh,78vw,640px) * .072))` et le
   résolvait contre SA fenêtre — donc faux.
   Dans un seul document, le rail est le même pour tout le monde. Le
   problème n'est pas résolu : il n'existe plus. */
/* « une zone est ouverte » = on n'est pas sur les habitudes. */
function hOpen(){return view!=='habits';}
/* ══ LES TROIS VUES — UN SEUL MOTEUR · 06/09/2026 ═════════════════════
   `view` vaut 'habits' | 'objectives' | 'repulsions'.

   LE PAPIER NE CHANGE PAS : il est navy dans les trois vues. Ce sont les
   BOÎTES qui portent la couleur — navy, bleu clair, rouge-violet. Le
   Totehm ne se repeint pas, il se déplie : ce qui se déplie, ce sont ses
   pièces, et une pièce a une couleur.

   OUVRIR UNE BOÎTE MONTRE LE TRIP ENTIER, dans ses trois couleurs, ordonné
   par la vue d'où l'on vient : la pièce qu'on touche passe en premier,
   c'est elle qu'on est venu voir. On ne change JAMAIS de vue en éditant.

   IL N'Y A PLUS DE [Add a Trip]. Un seul bouton par vue, qui crée la pièce
   de CETTE vue, vide, et ouvre le triplet dessus. Les deux autres pièces
   sont OFFERTES — reprendre une existante (lookup) ou en écrire une neuve
   — jamais imposées : une habitude sans objectif reste une habitude, et
   forcer les trois empêcherait d'écrire. */
let view='habits';
/* L'ordre AFFICHÉ des trois carrés : c'est lui que suit le doigt et lui
   que suivent les flèches. Une seule liste, sinon les deux divergent. */
const VIEW_ORDER=['repulsions','habits','objectives'];
let TRIPS=[], REPS=[], tripsLoaded=false;

/* Ce qui est ouvert, et ce qui est en train d'être choisi. Six états
   séparés, jamais deux à la fois : deux menus ouverts en même temps, c'est
   un menu de trop. `editH`/`editR` survivent au rendu — c'est le panneau
   qui se souvient de la pièce qu'on écrit. */
let open=null, selOpen=null, intFor=null, lkFor=null,
    editH=null, editR=null, pickFor=null, ordering=false;

/* ── L'IDENTITÉ D'UNE HABITUDE ───────────────────────────────────────
   Une habitude vit dans `state.habits`, un tableau sans identifiant. On
   lui en donne un À L'AFFICHAGE : il ne sert qu'à désigner la ligne qu'on
   édite pendant cette session. Rien ne s'y rattache en base — une
   répulsion pointe une habitude par son TEXTE, parce que `steps` est du
   texte. C'est pour ça que renommer appelle `habit_rename_links`. */
let HSEQ=0;
function habIds(){ (state.habits||[]).forEach(x=>{ if(!x.id)x.id='h'+(++HSEQ); }); }
const habOf  =id=>(state.habits||[]).find(x=>x.id===id)||null;
const habByT =t =>(state.habits||[]).find(x=>x.t===t)||null;
const tripOf =id=>TRIPS.find(t=>String(t.id)===String(id))||null;
const repOf  =id=>REPS.find(r=>String(r.id)===String(id))||null;
/* `hs` porte des TEXTES d'habitudes — c'est ce que rend le serveur. */
const repsOfHab=id=>{const x=habOf(id);
  return x?REPS.filter(r=>(r.hs||[]).includes(x.t)):[];};
const habsOfRep=r=>(r.hs||[]).map(habByT).filter(Boolean);
const habsOfTrip=t=>(state.habits||[]).filter(x=>String(x.o||'')===String(t.id));

/* ── LE PAPIER, LES ONGLETS, LE LOGO ─────────────────────────────────
   Le wordmark vit HORS de #stage : c'est <body> qui porte la vue pour lui.
   Une seule expression pose toutes les classes du corps — `className=`
   écrase TOUT, et le mode classement y perdait sa classe à chaque rendu. */
function paintZone(){
  const st=$('stage'); if(!st)return;
  st.classList.toggle('v-h',view==='habits');
  st.classList.toggle('v-o',view==='objectives');
  st.classList.toggle('v-r',view==='repulsions');
  /* L'état du logo suit le SUJET, pas la vue : un objectif s'écrit aussi
     depuis la vue habitudes, et c'est encore un objectif. */
  const oLive = view==='objectives' || (open&&open.kind==='t');
  document.body.classList.toggle('v-habits',view==='habits');
  document.body.classList.toggle('v-objectives',view==='objectives');
  document.body.classList.toggle('v-repulsions',view==='repulsions');
  document.body.classList.toggle('o-live',!!oLive);
  document.body.classList.toggle('ordering',ordering);
  document.querySelectorAll('.vt').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.v===view ? 'true':'false');
  });
  const vn=$('vname'); if(vn)vn.textContent=view;
}
/* Changer de vue ne charge rien et ne quitte rien : c'est la même page,
   la même session, la même mémoire. C'est tout l'intérêt de la fusion. */
function setView(v){
  if(busy)return;
  /* ON NE CHANGE JAMAIS DE VUE EN ÉDITANT. Une boîte ouverte est un
     travail en cours : la vue qui bouge sous les doigts perd la saisie. */
  if(open)return;
  /* Les objectifs et les répulsions sont des données du serveur : sans
     session il n'y a rien à montrer, et l'écran vide ne dirait pas
     pourquoi. */
  if(v!=='habits'&&!me){
    $('member-window').classList.add('show');
    if(typeof memberPaint==='function')memberPaint();
    return;
  }
  view=v; renderZone();
  if(v!=='habits')loadTrips();
}
function showBook(on){ setView(on?'repulsions':'habits'); if(on)save(); }
function showNext(on){ setView(on?'objectives':'habits');  if(on)save(); }
function renderView(){ return renderZone(); }

/* L'arbre entier en UN appel : objectifs, leurs habitudes, les répulsions
   de chaque habitude. Chargé à la première ouverture d'une des deux vues,
   pas au démarrage — le Totehm doit s'ouvrir sans attendre le réseau. */
async function loadTrips(force){
  if(!me)return;
  if(tripsLoaded&&!force)return;
  try{
    const {data,error}=await sb.rpc('my_trips');
    /* Une erreur de RPC se JOURNALISE, toujours : sans ce log, une liste
       vide ne dit pas si le membre n'a rien posé ou si l'appel casse. */
    if(error)throw error;
    if(!data||!data.signed_in)return;
    TRIPS=data.trips||[];
    /* UNE RÉPULSION, UNE LIGNE — même si elle protège quatre habitudes.
       Le serveur la renvoie une fois par habitude protégée ; on déduplique
       sur son id, et `habits` porte la liste complète. Sans ça, la vue
       répulsions afficherait la même pensée quatre fois. */
    const vu={}; REPS=[];
    (TRIPS.concat([{habits:data.loose||[]}])).forEach(t=>
      (t.habits||[]).forEach(h=>(h.repulsions||[]).forEach(r=>{
        if(vu[r.id])return; vu[r.id]=1;
        REPS.push({id:r.id, text:r.repulsion, obstacle:r.obstacle||'',
                   hs:Array.isArray(r.habits)&&r.habits.length?r.habits.slice():[h.t]});})));
    tripsLoaded=true;
    renderZone();
  }catch(e){
    console.error('[totehm] my_trips:',e&&e.message||e);
  }
}

/* `days_left` vient du SERVEUR : un client qui compare des dates compare
   aussi son horloge, et celle d'un téléphone ment plus souvent qu'on ne
   croit. `fmtDue` ne calcule rien, elle met en mots. */
function fmtDue(d){
  if(d==null)return 'no deadline';
  if(d<0)  return Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' overdue';
  if(d===0)return 'today';
  if(d===1)return 'tomorrow';
  if(d<31) return d+' days left';
  const m=Math.round(d/30);
  return m+' month'+(m===1?'':'s')+' left';
}
/* Le <input type="date"> veut AAAA-MM-JJ, le serveur rend un timestamp. */
const dateIn=t=>t?String(t).slice(0,10):'';

/* ══ LES ÉCRITURES ═══════════════════════════════════════════════════
   Optimistes : on pose la valeur en mémoire, on dessine, et on envoie.
   Recharger l'arbre à chaque frappe fermerait le panneau sous les doigts.
   L'arbre est rafraîchi À LA FERMETURE, une fois, et pas avant. */
let wDirty=false, wTimer=null;
function apres(p){ /* une erreur de RPC se journalise, toujours */
  return Promise.resolve(p).then(({error}={})=>{ if(error)console.error('[totehm] rpc:',error.message); })
    .catch(e=>console.error('[totehm] rpc:',e&&e.message||e)); }
function differe(fn){ clearTimeout(wTimer); wTimer=setTimeout(fn,700); }

/* ══ LA LIGNE FERMÉE ═════════════════════════════════════════════════
   AUCUNE ICÔNE DANS UNE BOÎTE. Une boîte porte du TEXTE. Ce qui la
   qualifie, c'est sa COULEUR (la vue) et sa LIGNE D'UNITÉ.
   Le tiret du rail prend la couleur de l'intention : le rail est une
   pièce du logo, et il devient le spectre d'une vie, lisible avant même
   d'avoir lu une ligne. Sans intention il reste blanc — le blanc est
   l'absence, pas une huitième couleur. */
const ligne=(inner,cls,col,rank,id)=>'<div class="habit timed '+(cls||'')+'"'
  +(id?' data-row="'+esc(id)+'"':'')+'>'
  +'<span class="tick"'+(col?' style="background:'+col+'"':'')+'></span>'
  +(ordering&&rank?'<span class="rank">'+rank+'</span>':'')
  +'<span class="h-body">'+inner+'</span></div>';
const boite=(nom,sous,attr)=>'<span class="v-col" '+attr+' role="button" tabindex="0">'
  +'<span class="v-name">'+nom+'</span><span class="v-sub">'+sous+'</span></span>';

/* ══ LE PANNEAU — LE TRIP VU DEPUIS N'IMPORTE QUELLE BOÎTE ═══════════
   Les mots disent le LIEN, pas la catégorie : la couleur dit déjà la
   catégorie. WHY remonte, HOW descend, PROTECTS tient. */
const LBL={
  o:{h:'why',            t:'objective',      r:'why'},
  h:{h:'habit',          t:'how',            r:'it protects'},
  r:{h:'protected by',   t:'protected by',   r:'repulsion'}};
/* La pièce de la vue passe EN PREMIER : c'est elle qu'on est venu voir. */
const ORDRE={h:['h','o','r'], t:['o','h','r'], r:['r','h','o']};

/* UN SEUL COMPOSANT DE CHOIX, partout. `key` identifie le déroulant
   ouvert ; deux menus ouverts en même temps, c'est un menu de trop. */
/* MESURÉ : le bouton affichait `every_minute` — l'IDENTIFIANT, pas le
   libellé. La valeur qui COMPARE et le texte qui S'AFFICHE ne sont pas la
   même chose : `val` sert au `.on`, `aff` se lit. */
const pick=(key,val,opts,aff)=>
  '<span class="selw"><button type="button" class="selb" data-sel="'+esc(key)+'">'
  +esc(aff||'—')+' <span class="sel-v">\u25be</span></button>'
  +'<span class="selp'+(selOpen===key?' on':'')+'"><span class="selp-in">'
  +opts.map(o=>'<button type="button" class="selo'+(o.v===val?' on':'')
    +'" data-selv="'+esc(o.v)+'" data-selk="'+esc(key)+'">'+esc(o.l)+'</button>').join('')
  +'</span></span></span>';
const freqOpts=()=>FREQS.map(f=>({v:f.id,l:f.label}));

/* LE CHOIX D'INTENTION : le NOM et le PILIER, pas un pictogramme. Une
   intention n'est pas une icône, c'est un mot — et son pilier dit à quoi
   elle sert dans une vie. Pas de surlignage : la tuile prend un FONDU de
   sa couleur, et se remplit quand elle est choisie. */
const intGrid=(sel,hid)=>'<div class="ints">'+INTS.map(x=>
  '<button type="button" class="int'+(sel===x.id?' on':'')+'" data-i="'+x.id+'" data-ih="'+esc(hid)+'"'
  +' aria-pressed="'+(sel===x.id)+'" style="--ic:'+x.color+'">'
  +'<span class="int-n">'+esc(x.name)+'</span><span class="int-p">'+esc(x.pillar)+'</span></button>')
  .join('')+'</div>';

/* ── L'OBJECTIF ──────────────────────────────────────────────────── */
const blkO=(t,edit,mode)=>'<div class="blk blk-o">'
  +'<span class="blk-l">'+LBL.o[mode]+'</span>'
  +(edit
     ?'<textarea class="blk-t w-name" rows="1" data-tt="'+esc(t.id)+'">'+esc(t.text)+'</textarea>'
     :'<button type="button" class="blk-t go" data-goto="t:'+esc(t.id)+'">'+esc(t.text||'untitled')+'</button>')
  +'<div class="blk-u">'+(edit
     ?'<input class="in date" type="date" data-td="'+esc(t.id)+'" value="'+esc(dateIn(t.target_at))+'">'
     :'<span>'+esc(fmtDue(t.days_left))+'</span>')
  +'<span>'+habsOfTrip(t).length+' habit'+(habsOfTrip(t).length===1?'':'s')+'</span></div>'
  +'</div>';

/* ── UNE HABITUDE ────────────────────────────────────────────────── */
const blkH=(x,edit,mode)=>'<div class="blk blk-h">'
  +'<span class="blk-l">'+LBL.h[mode]+'</span>'
  +(edit
     ?'<textarea class="blk-t w-name" rows="1" data-ht="'+esc(x.id)+'">'+esc(x.t)+'</textarea>'
     :'<button type="button" class="blk-t go" data-goto="h:'+esc(x.id)+'">'+esc(x.t||'untitled')+'</button>')
  +'<button type="button" class="blk-x" data-hx="'+esc(x.id)+'" aria-label="Remove">&times;</button>'
  +'<div class="blk-u">'+pick('h:'+x.id, x.f, freqOpts(), x.f?flabel(x.f):'no rhythm')
  +'<button type="button" class="blk-i" data-ip="'+esc(x.id)+'" style="color:'
  +(x.i?intColor(x.i):'rgba(255,255,255,.62)')+'">'
  +(x.i?esc(intName(x.i))+' · '+esc(intPillar(x.i)):'set intention')+'</button></div>'
  +(intFor===x.id?'<div class="w-sec">'+intGrid(x.i,x.id)+'</div>':'')
  +'</div>';

/* ── UNE RÉPULSION ───────────────────────────────────────────────────
   Elle porte EN PREVIEW les habitudes qu'elle protège, en navy. C'est le
   lookup : on voit d'un coup d'œil ce que « la procrastination » menace,
   et on l'attache ou la détache d'un doigt. */
const blkR=(r,edit,mode)=>'<div class="blk blk-r">'
  +'<span class="blk-l">'+LBL.r[mode]+'</span>'
  +(edit
     ?'<textarea class="blk-t w-name" rows="1" data-rt="'+esc(r.id)+'">'+esc(r.text)+'</textarea>'
     :'<button type="button" class="blk-t go" data-goto="r:'+esc(r.id)+'">'+esc(r.text||'untitled')+'</button>')
  +'<button type="button" class="blk-x" data-rx="'+esc(r.id)+'" aria-label="Remove">&times;</button>'
  +'<div class="lk">'
  +  habsOfRep(r).map(h=>'<span class="lk-on">'+esc(h.t||'untitled habit')+'</span>').join('')
  +  '<button type="button" class="lk-add" data-lk="'+esc(r.id)+'">'
  +  (lkFor===String(r.id)?'done':'+ link a habit')+'</button>'
  +'</div>'
  +(lkFor===String(r.id)?'<div class="lk-pick">'
    +(state.habits||[]).map(h=>
      '<button type="button" class="lk-o'+((r.hs||[]).includes(h.t)?' on':'')
      +'" data-lkh="'+esc(r.id)+'|'+esc(h.id)+'">'+esc(h.t||'untitled habit')+'</button>').join('')
    +'</div>':'')
  +'</div>';

/* UN BLOC VIDE N'EST PAS UN TROU : c'est une invitation à deux temps —
   reprendre une pièce qui existe déjà, ou en écrire une nouvelle. C'est la
   règle du lookup : on ne réécrit jamais ce qui est déjà là. */
const blkVide=(key,mode,liste,ph)=>{
  const cls={o:'blk-o',h:'blk-h',r:'blk-r'}[key], on=pickFor===key;
  return '<div class="blk '+cls+'">'
   +'<span class="blk-l">'+LBL[key][mode]+'</span>'
   +'<div class="lk"><button type="button" class="lk-add" data-pk="'+key+'">'
   +(on?'close':'+ pick or write')+'</button></div>'
   +(on?'<div class="lk-pick">'
      +'<input class="in nw" data-nw="'+key+'" placeholder="'+esc(ph)+'">'
      +liste.map(o=>'<button type="button" class="lk-o" data-pick="'+key+'|'+esc(o.id)+'">'
        +esc(o.txt||'untitled')+'</button>').join('')
      +'</div>':'')
   +'</div>';};

function panneau(mode,t,hs,rs){
  const bloc={
    o: t ? blkO(t, mode==='t', mode)
         : blkVide('o',mode,TRIPS.map(x=>({id:x.id,txt:x.text})),'a new objective'),
    h: (hs.length?hs.map(x=>blkH(x, mode==='h'||x.id===editH, mode)).join('')
                 :blkVide('h',mode,(state.habits||[]).map(x=>({id:x.id,txt:x.t})),'a new habit'))
       +(mode!=='h'&&hs.length?'<button type="button" class="dash" data-ah="'+esc(t?t.id:'')+'">+ add a habit</button>':''),
    r: (rs.length?rs.map(r=>blkR(r, mode==='r'||String(r.id)===editR, mode)).join('')
                 :blkVide('r',mode,REPS.map(x=>({id:x.id,txt:x.text})),'a new repulsion'))
       +(hs.length&&rs.length?'<button type="button" class="dash" data-ar="'+esc(hs[0].id)+'">+ add a repulsion</button>':'')};
  return '<div class="w-top"><button type="button" class="w-x" data-x="1" aria-label="Close">&times;</button></div>'
   + ORDRE[mode].map(k=>bloc[k]).join('')
   + '<div class="acts">'
   +   (mode==='h'?'<button type="button" class="btn g" data-kill="'+esc(open.id)+'">Delete habit</button>':'')
   +   (mode==='t'?'<button type="button" class="btn g" data-tkill="'+esc(open.id)+'">Delete objective</button>':'')
   +   (mode==='r'?'<button type="button" class="btn g" data-rkill="'+esc(open.id)+'">Delete repulsion</button>':'')
   +   '<button type="button" class="btn" data-x="1">Done</button></div>';
}
function panneauHTML(){
  if(open.kind==='h'){const x=habOf(open.id); if(!x)return '';
    return panneau('h', x.o?tripOf(x.o):null, [x], repsOfHab(x.id));}
  if(open.kind==='t'){const t=tripOf(open.id); if(!t)return '';
    const hs=habsOfTrip(t), vu={}, rs=[];
    hs.forEach(h=>repsOfHab(h.id).forEach(r=>{if(!vu[r.id]){vu[r.id]=1;rs.push(r);}}));
    return panneau('t', t, hs, rs);}
  const r=repOf(open.id); if(!r)return '';
  const hs=habsOfRep(r);
  return panneau('r', hs[0]&&hs[0].o?tripOf(hs[0].o):null, hs, [r]);
}

/* ══ LE RENDU ════════════════════════════════════════════════════════
   Un seul rendu pour les trois vues et pour la boîte ouverte : la liste et
   le détail ne peuvent pas diverger s'ils sont dessinés ensemble. */
let lastView=null;
function renderZone(anim){
  habIds();
  const box=$('habits'); if(!box)return;
  /* `anim` dit ce qui doit s'animer POUR CE RENDU. Sans ça, l'animation
     d'ouverture se rejouait à chaque frappe : une boîte qui repousse à
     chaque lettre n'est pas fluide, elle est nerveuse. */
  const change = lastView!==null && lastView!==view;
  lastView=view;
  const sc=$('fv-inner');
  /* MESURÉ : le défilement dérivait de quelques pixels à chaque rendu. Sur
     une longue liste, choisir une intention te déplaçait. On le garde et on
     le repose — sauf quand on vient d'ouvrir, où on VEUT bouger. */
  const keep = sc ? sc.scrollTop : null;
  paintZone();
  let h='';
  if(view==='habits'){
    /* L'ORDRE DU MEMBRE GAGNE. Tant qu'il n'a rien classé, les habitudes
       coulent par rythme (les plus fréquentes en haut) ; dès qu'il en
       déplace une, c'est SON ordre — et c'est celui que le bot suivra. */
    if(!state.ord)sortHabits();
    const list=(state.habits||[]).filter(x=>{
      if(filterF && x.f!==filterF) return false;
      if(filterI && x.i!==filterI) return false;
      return true;});
    h=list.map((x,k)=>{
      if(open&&open.kind==='h'&&open.id===x.id)
        return ligne('<span class="v-col open-in">'+panneauHTML()+'</span>','open'+(open.neuf?' neuf':''),null,null,x.id);
      const n=repsOfHab(x.id).length, t=x.o?tripOf(x.o):null;
      /* PAS DE CADRE NAVY SUR UNE BOÎTE DÉJÀ NAVY. `.h-frame` existe pour
         qu'une habitude reste navy quand elle est POSÉE AILLEURS — dans le
         noir d'un Trip, dans le rouge-violet d'une répulsion. Ici la boîte
         est la vue : le cadre ne faisait qu'un double filet. */
      return ligne(boite(esc(x.t),
        (x.i?'<span class="v-int" style="color:'+intColor(x.i)+'">'+esc(intName(x.i))+'</span>'
             +'<span class="v-pil">'+esc(intPillar(x.i))+'</span>'
            :'<span class="v-pil">set intention</span>')
        +'<span class="v-frq">'+esc(x.f?flabel(x.f):'no rhythm')+'</span>'
        +(n?'<span class="v-pil">'+n+' repulsion'+(n>1?'s':'')+'</span>':'')
        /* « no objective » ne s'écrit QUE si on sait qu'il n'y en a pas.
           Tant que l'arbre n'est pas chargé, une habitude rattachée n'a pas
           encore son objectif en mémoire : l'annoncer libre serait faux, et
           un écran qui ment une seconde est un écran auquel on ne croit
           plus. On se tait, puis on dit. */
        +(t?'<span class="v-pil">'+esc(t.text)+'</span>'
           :(!x.o?'<span class="v-pil">no objective</span>':'')),
        'data-h="'+esc(x.id)+'"'), '', x.i?intColor(x.i):null, k+1, x.id);}).join('');
    if(!list.length)h+='<div class="void">'+(state.habits&&state.habits.length
      ?'nothing matches this filter':'no habit yet')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="1">+ <b>Add a Habit</b></button>','add');
  }else if(view==='objectives'){
    h=TRIPS.map((t,k)=>{
      if(open&&open.kind==='t'&&String(open.id)===String(t.id))
        return ligne('<span class="v-col open-in">'+panneauHTML()+'</span>','open'+(open.neuf?' neuf':''),null,null,t.id);
      const n=habsOfTrip(t).length, late=t.days_left!=null&&t.days_left<0;
      return ligne(boite(esc(t.text),
        '<span class="v-frq'+(late?' late':'')+'">'+esc(fmtDue(t.days_left))+'</span>'
        +'<span class="v-pil">'+n+' habit'+(n===1?'':'s')+'</span>',
        'data-t="'+esc(t.id)+'"'), '', null, k+1, t.id);}).join('');
    if(!TRIPS.length)h+='<div class="void">'+(tripsLoaded?'no objective yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="1">+ <b>Add an Objective</b></button>','add');
  }else{
    h=REPS.map((r,k)=>{
      if(open&&open.kind==='r'&&String(open.id)===String(r.id))
        return ligne('<span class="v-col open-in">'+panneauHTML()+'</span>','open'+(open.neuf?' neuf':''),null,null,r.id);
      const x=habsOfRep(r)[0];
      return ligne(boite(esc(r.text),
        '<span class="v-pil">protects</span>'
        +'<span class="h-frame u-mini">'+esc(x?x.t:'—')+'</span>',
        'data-r="'+esc(r.id)+'"'), '', x&&x.i?intColor(x.i):null, k+1, r.id);}).join('');
    if(!REPS.length)h+='<div class="void">'+(tripsLoaded?'no repulsion yet':'loading…')+'</div>';
    h+=ligne('<button type="button" class="add-box" data-add="1">+ <b>Add a Repulsion</b></button>','add');
  }
  /* La barre se pose ICI et pas dans `h` : chacune des trois branches
     REMPLACE `h` (`h=...`), donc un préfixe posé avant serait écrasé. Le
     genre de bug qui ne se voit qu'à l'écran — et qui s'est vu. */
  box.innerHTML=(ordering
    ? '<div class="ordbar">order by importance — the bot follows this order</div>' : '')+h;
  /* Retirer, forcer un reflow, remettre : sans le reflow le navigateur ne
     rejoue pas une animation dont la classe est déjà là. */
  /* On ne retire la classe QUE pour la remettre : la retirer au rendu
     suivant coupait le fondu en plein vol — `loadTrips` redessine deux
     cents millisecondes après le changement de vue, en plein milieu des
     260 ms de l'animation. */
  if(change){ box.classList.remove('swap'); void box.offsetWidth;
              box.classList.add('swap'); }
  if(keep!=null&&sc)sc.scrollTop=keep;
  const carte=box.querySelector('.habit.open');
  if(carte){ if(anim!=='grow')carte.style.animation='none'; cable(carte); }
  /* ══ LE DIAGNOSTIC ══ Tout écran qui peut être vide porte le sien. Un
     écran vide SANS diagnostic, c'est trois allers-retours au lieu d'un :
     on ne sait pas si le membre n'a rien posé, si la session est tombée,
     ou si la RPC casse. Des compteurs et des booléens, JAMAIS une valeur
     de clé ni un texte du membre. C'est le bloc à coller dans la console.
     Même contrat que `window.__totehm_map` et `window.__totehm_self`. */
  window.__totehm_zone={vue:view, session:!!me, arbre_charge:tripsLoaded,
    habitudes:(state.habits||[]).length, objectifs:TRIPS.length, repulsions:REPS.length,
    filtre:{rythme:!!filterF, intention:!!filterI},
    boite_ouverte:open?open.kind:null, classement:ordering, ordre_du_membre:!!state.ord};
  box.querySelectorAll('[data-h],[data-t],[data-r],[data-add]').forEach(el=>{
    const go=()=>{
      /* En mode classement, un appui DÉPLACE — il n'ouvre pas. */
      if(ordering)return;
      if(el.dataset.add)creerDansLaVue();
      else if(el.dataset.h)ouvrir('h',el.dataset.h);
      else if(el.dataset.t)ouvrir('t',el.dataset.t);
      else ouvrir('r',el.dataset.r);};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

/* Ouvrir, c'est agrandir la boîte À SA PLACE : on reste dans le Totehm,
   rien ne recouvre le logo. */
function ouvrir(kind,id,neuf){
  open={kind,id:String(id),neuf:!!neuf}; selOpen=null; intFor=null; lkFor=null; pickFor=null;
  editH = kind==='h'?String(id):null; editR = kind==='r'?String(id):null;
  renderZone('grow');
  const b=$('habits').querySelector('.habit.open');
  if(b){
    /* MESURÉ : `scrollIntoView` ne bougeait le cadre que de 2 px. Il cherche
       « l'ancêtre défilant le plus proche » et, dans un document dont le
       corps ne défile pas, il ne trouve pas #fv-inner de façon fiable. On
       lui dit lequel, et de combien : plus de devinette. Affectation
       directe, pas `behavior:'smooth'` — un défilement doux est annulé
       quand le système demande moins d'animation. */
    requestAnimationFrame(()=>{const sc=$('fv-inner'); if(!sc)return;
      sc.scrollTop=sc.scrollTop+b.getBoundingClientRect().top-sc.getBoundingClientRect().top-6;});
    const f=b.querySelector('textarea.w-name');
    if(f&&window.innerWidth>700)f.focus();
  }
}
function fermer(){
  open=null;selOpen=null;intFor=null;lkFor=null;pickFor=null;editH=null;editR=null;
  renderZone();
  /* L'arbre se recharge ICI, une fois : pendant l'édition il fermerait le
     panneau sous les doigts, et après il remet la vérité du serveur. */
  if(wDirty){wDirty=false;loadTrips(true);}
}

/* ══ CRÉER — UN SEUL BOUTON PAR VUE ══════════════════════════════════
   Il crée la pièce de SA vue, vide, et ouvre le triplet dessus. La fenêtre
   qui sert à modifier est celle qui sert à créer : un deuxième chemin de
   création finirait par diverger. */
async function creerDansLaVue(){
  if(view==='habits'){
    const x={id:'h'+(++HSEQ), t:'', f:pendingF||null, i:pendingI||null, o:null};
    state.habits.unshift(x); state.ord=true; save(); ouvrir('h',x.id,true); return;
  }
  if(!me){$('member-window').classList.add('show');
          if(typeof memberPaint==='function')memberPaint();return;}
  if(view==='objectives'){
    const {data,error}=await sb.rpc('trip_create',{p_text:'',p_target:null});
    if(error){console.error('[totehm] trip_create:',error.message);return;}
    TRIPS.unshift({id:data,text:'',target_at:null,days_left:null,habits:[]});
    ouvrir('t',data,true); return;
  }
  /* Une répulsion se rattache à une habitude : le serveur la classe par
     `habit_text`. Sans habitude, il n'y a rien à protéger — on le dit. */
  const h0=(state.habits||[])[0];
  if(!h0||!h0.t){alert('write a habit first — a repulsion protects something');return;}
  const {data,error}=await sb.rpc('repulsion_set',{p_habit:h0.t,p_repulsion:'',p_obstacle:''});
  if(error){console.error('[totehm] repulsion_set:',error.message);return;}
  REPS.unshift({id:data,text:'',obstacle:'',hs:[h0.t]});
  ouvrir('r',String(data),true);
}

/* ══ LE CÂBLAGE DE LA BOÎTE OUVERTE ══════════════════════════════════ */
function grow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function cable(carte){
  const on=(sel,ev,fn)=>carte.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  const stop=fn=>e=>{e.stopPropagation();fn(e);};
  /* MESURÉ : `.w-name` retombait à zéro. `grow()` lisait `scrollHeight`
     pendant que la boîte n'était pas encore affichée. On mesure APRÈS. */
  carte.querySelectorAll('textarea.w-name').forEach(grow);

  /* ── LE DÉROULANT ─────────────────────────────────────────────────── */
  on('[data-sel]','click',stop(e=>{
    const k=e.currentTarget.dataset.sel; selOpen=(selOpen===k?null:k); renderZone();}));
  on('[data-selv]','click',stop(e=>{
    const k=e.currentTarget.dataset.selk, v=e.currentTarget.dataset.selv;
    selOpen=null;
    if(k.indexOf('h:')===0){const x=habOf(k.slice(2)); if(x){x.f=v;save();}}
    renderZone();}));

  /* ── FERMER ───────────────────────────────────────────────────────── */
  on('[data-x]','click',stop(()=>fermer()));

  /* ── ÉDITER UNE AUTRE PIÈCE, SANS CHANGER DE VUE ──────────────────── */
  on('[data-goto]','click',stop(e=>{
    const d=e.currentTarget.dataset.goto, k=d.slice(0,1), id=d.slice(2);
    if(k==='h')editH=id; else if(k==='r')editR=id;
    intFor=null;lkFor=null;renderZone();}));

  /* ── LA SAISIE ────────────────────────────────────────────────────── */
  on('[data-tt]','input',e=>{
    const t=tripOf(e.target.dataset.tt); if(!t)return;
    t.text=e.target.value; grow(e.target); wDirty=true;
    differe(()=>apres(sb.rpc('trip_rename',{p_trip:t.id,p_text:t.text})));});
  on('[data-td]','change',e=>{
    const t=tripOf(e.target.dataset.td); if(!t)return;
    const v=e.target.value;
    t.target_at=v?v+'T00:00:00Z':null; wDirty=true;
    apres(sb.rpc('trip_set_target',{p_trip:t.id,p_target:t.target_at}));});
  on('[data-ht]','input',e=>{
    const x=habOf(e.target.dataset.ht); if(!x)return;
    const ancien=x.t; x.t=e.target.value; grow(e.target);
    differe(()=>{
      save();
      /* Renommer une habitude ne doit pas orpheliner ce qui la protège :
         le lien est du TEXTE, il se répare côté serveur, en un appel. */
      if(me&&ancien&&ancien!==x.t){
        REPS.forEach(r=>{const i=(r.hs||[]).indexOf(ancien); if(i>=0)r.hs[i]=x.t;});
        apres(sb.rpc('habit_rename_links',{p_old:ancien,p_new:x.t}));}
    });});
  on('[data-rt]','input',e=>{
    const r=repOf(e.target.dataset.rt); if(!r)return;
    r.text=e.target.value; grow(e.target); wDirty=true;
    differe(()=>apres(sb.rpc('repulsion_set',
      {p_habit:(r.hs||[])[0]||'', p_repulsion:r.text, p_obstacle:r.obstacle||''})));});

  /* ── L'INTENTION, sur l'habitude qu'on touche ─────────────────────── */
  on('[data-ip]','click',stop(e=>{
    const id=e.currentTarget.dataset.ip;
    intFor=(intFor===id?null:id); lkFor=null; renderZone();}));
  on('[data-i]','click',stop(e=>{
    const x=habOf(e.currentTarget.dataset.ih); if(!x)return;
    const v=e.currentTarget.dataset.i;
    x.i=(x.i===v?null:v); intFor=null; save(); renderZone();}));

  /* ── LE LOOKUP : une répulsion protège PLUSIEURS habitudes ────────── */
  on('[data-lk]','click',stop(e=>{
    const id=String(e.currentTarget.dataset.lk);
    lkFor=(lkFor===id?null:id); intFor=null; renderZone();}));
  on('[data-lkh]','click',stop(e=>{
    const p=e.currentTarget.dataset.lkh.split('|');
    const r=repOf(p[0]), x=habOf(p[1]); if(!r||!x||!x.t)return;
    const i=(r.hs||[]).indexOf(x.t);
    if(i<0){r.hs.push(x.t); apres(sb.rpc('repulsion_link',{p_id:r.id,p_habit:x.t}));}
    else   {r.hs.splice(i,1); apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:x.t}));}
    wDirty=true; renderZone();}));

  /* ── LE LOOKUP D'UN BLOC VIDE — reprendre, ou écrire ──────────────── */
  on('[data-pk]','click',stop(e=>{
    const k=e.currentTarget.dataset.pk;
    pickFor=(pickFor===k?null:k); intFor=null; lkFor=null; renderZone();}));
  on('[data-pick]','click',stop(e=>{
    const p=e.currentTarget.dataset.pick.split('|');
    lier(p[0],p[1]); pickFor=null; renderZone();}));
  on('[data-nw]','keydown',e=>{
    if(e.key!=='Enter')return; e.preventDefault();
    const v=e.target.value.trim(); if(!v)return;
    creerEtLier(e.target.dataset.nw, v);});

  /* ── AJOUTER UNE PIÈCE AU TRIP ────────────────────────────────────── */
  on('[data-ah]','click',stop(e=>{
    const x={id:'h'+(++HSEQ), t:'', f:null, i:null, o:e.currentTarget.dataset.ah||null};
    state.habits.unshift(x); state.ord=true; save(); editH=x.id; editR=null; renderZone();
    const el=$('habits').querySelector('[data-ht="'+x.id+'"]'); if(el)el.focus();}));
  on('[data-ar]','click',stop(async e=>{
    const x=habOf(e.currentTarget.dataset.ar); if(!x||!x.t)return;
    const {data,error}=await sb.rpc('repulsion_set',{p_habit:x.t,p_repulsion:'',p_obstacle:''});
    if(error){console.error('[totehm] repulsion_set:',error.message);return;}
    REPS.unshift({id:data,text:'',obstacle:'',hs:[x.t]});
    editR=String(data); editH=null; wDirty=true; renderZone();
    const el=$('habits').querySelector('[data-rt="'+data+'"]'); if(el)el.focus();}));

  /* ── RETIRER ──────────────────────────────────────────────────────── */
  on('[data-hx],[data-kill]','click',stop(e=>{
    const id=e.currentTarget.dataset.hx||e.currentTarget.dataset.kill;
    const x=habOf(id); if(!x)return;
    logTotehmEvent('habit_removed',x.t,{f:x.f,i:x.i});
    state.habits=state.habits.filter(h=>h.id!==id);
    /* Une répulsion qui ne protège plus rien RESTE : elle a été écrite,
       elle se rattache ailleurs. On retire le lien, pas la pensée. */
    REPS.forEach(r=>{const i=(r.hs||[]).indexOf(x.t);
      if(i>=0){r.hs.splice(i,1); if(me)apres(sb.rpc('repulsion_unlink',{p_id:r.id,p_habit:x.t}));}});
    save();
    if(editH===id)editH=null;
    if(open&&open.kind==='h'&&open.id===id)fermer(); else renderZone();}));
  on('[data-rx],[data-rkill]','click',stop(e=>{
    const id=String(e.currentTarget.dataset.rx||e.currentTarget.dataset.rkill);
    REPS=REPS.filter(r=>String(r.id)!==id);
    apres(sb.rpc('repulsion_retire',{p_id:Number(id)}));
    if(editR===id)editR=null;
    if(open&&open.kind==='r'&&String(open.id)===id)fermer(); else renderZone();}));
  on('[data-tkill]','click',stop(e=>{
    const id=String(e.currentTarget.dataset.tkill);
    TRIPS=TRIPS.filter(t=>String(t.id)!==id);
    (state.habits||[]).forEach(h=>{if(String(h.o||'')===id)h.o=null;});
    save(); apres(sb.rpc('trip_close',{p_trip:id,p_outcome:'dropped'}));
    fermer();}));
}

/* LE LIEN SE POSE DEPUIS CE QU'ON A OUVERT. C'est la seule fonction qui
   connaît les règles de rattachement, et il n'y en a que trois :
     un objectif tient plusieurs habitudes ;
     une habitude sert UN objectif ;
     une répulsion protège plusieurs habitudes. */
function lier(k,id){
  const m=open.kind;
  if(k==='o'){
    const x = m==='h'?habOf(open.id) : m==='r'?habsOfRep(repOf(open.id)||{hs:[]})[0] : null;
    if(x){x.o=id; save();}
  }else if(k==='h'){

(function(){
  const box=$('habits'); if(!box)return;
  let from=null, cible=null;
  const rowAt=(x,y)=>{const el=document.elementFromPoint(x,y);
    return el&&el.closest?el.closest('.habit[data-row]'):null;};
  box.addEventListener('pointerdown',e=>{
    if(!ordering)return;
    const row=e.target.closest&&e.target.closest('.habit[data-row]'); if(!row)return;
    from=row; row.classList.add('drag');
    try{row.setPointerCapture(e.pointerId);}catch(_){}
  });
  box.addEventListener('pointermove',e=>{
    if(!from)return;
    const over=rowAt(e.clientX,e.clientY);
    if(cible&&cible!==over)cible.classList.remove('over');
    if(over&&over!==from){over.classList.add('over');cible=over;}
  });
  const fin=()=>{
    if(!from)return;
    from.classList.remove('drag');
    if(cible){
      cible.classList.remove('over');
      const arr=listeDe(view).slice();
      const a=arr.findIndex(o=>String(o.id)===from.dataset.row);
      const b=arr.findIndex(o=>String(o.id)===cible.dataset.row);
      if(a>=0&&b>=0){const m=arr.splice(a,1)[0];arr.splice(b,0,m);poseListe(view,arr);}
    }
    from=null;cible=null;renderZone();
  };
  box.addEventListener('pointerup',fin);
  box.addEventListener('pointercancel',fin);
})();

   chargement, sans contexte, c'est le refus définitif garanti ; le même

/* Deux besoins, deux fonctions. La météo se contente d'une position d'hier ;
   décider s'il faut DEMANDER exige une position fraîche, sinon une entrée
   ancienne (`totehm_map_pos_v1`, écrite sans horodatage par une version
   précédente) bloque le prompt pour toujours. */
const POS_TTL=15*60*1000;
function cachedPos(){
  for(const k of ['totehm_geo_v2','totehm_map_pos_v1']){
    try{
      const c=JSON.parse(localStorage.getItem(k)||'null');
      if(c&&isFinite(c.lat)&&isFinite(c.lng))return c;
    }catch(e){}
  }
  return null;
}
function freshPos(){
  try{
    const c=JSON.parse(localStorage.getItem('totehm_geo_v2')||'null');
    if(c&&isFinite(c.lat)&&isFinite(c.lng)&&c.t&&Date.now()-c.t<POS_TTL)return c;
  }catch(e){}
  return null;
}
/* ══ CE QUI A COÛTÉ CINQ VAGUES ══
   MESURÉ LE 23/08/2026 sur le DÉPLOYÉ, pas sur le fichier : Vercel servait
   `Permissions-Policy: geolocation=(), microphone=(), camera=()` sur tout
   totehm.space. Une liste VIDE désactive la géolocalisation pour tout le
   monde, la page comprise. Le navigateur répond alors :

     code 1 — « Geolocation has been disabled in this document by
                permissions policy. »

   …instantanément, sans jamais montrer de prompt. Et `permissions.query`
   répond quand même « granted » : rien dans l'API ne dit que c'est la
   plateforme qui a tranché. AUCUN JavaScript ne peut revenir dessus.
   Cinq lots de correctifs ont été écrits dans la mauvaise couche.

   Corrigé dans `space/vercel.json` : `geolocation=(self)`.
   Ce diagnostic reste pour que la prochaine régression se lise en une
   seconde au lieu de cinq vagues. */
function geoDiag(e){
  if(!e||e.code!==1)return;
  if(!/permissions policy|feature policy|disabled in this document/i.test(e.message||''))return;
  console.warn('[totehm] La géolocalisation est coupée par un EN-TÊTE, pas par '
    +'l\'utilisateur. Vérifier space/vercel.json : Permissions-Policy doit dire '
    +'geolocation=(self), jamais geolocation=(). Message du navigateur : '+e.message);
}
function storePos(pos){
  const p={lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5),
           acc:Math.round(pos.coords.accuracy||0),t:Date.now()};
  try{localStorage.setItem('totehm_geo_v2',JSON.stringify(p));}catch(e){}
  return p;
}

   cherche un nom qu'il connaît déjà. */

const INT_DOT = i => '<span class="sr-dot" style="background:'+intColor(i)+'"></span>';

async function runSearch(q, noteEl){
  noteEl.classList.remove('hide');
  noteEl.className = 'note dim';
  noteEl.textContent = 'searching\u2026';
  let rows = [];
  try{
    const {data,error} = await sb.rpc('search_totehms',{p_q:q,p_limit:8});
    if(error) throw error;
    rows = data || [];
  }catch(e){
    noteEl.className='note no'; noteEl.textContent='search is unreachable right now';
    return;
  }
  if(!rows.length){
    noteEl.className='note dim';
    /* On dit ce qui est vrai : soit personne ne porte ce nom, soit
       personne ne l'a partagé. Jamais « privé » par défaut. */
    noteEl.textContent='no shared Totehm by that name';
    return;
  }
  noteEl.className='note dim';
  noteEl.innerHTML = '<div class="sr-list">' + rows.map(r =>
      '<button class="sr-row" type="button" data-pseudo="'+esc(r.pseudo)+'">'
    +   '<span class="sr-name">'+esc(r.pseudo)+'</span>'
    +   '<span class="sr-ints">'
    +     (r.intentions||[]).filter(i=>INT_BY_ID[i]).map(INT_DOT).join('')
    +   '</span>'
    +   '<span class="sr-meta">'+(r.habits||0)+' habit'+((r.habits||0)===1?'':'s')+'</span>'
    +   '</button>').join('') + '</div>';
  noteEl.querySelectorAll('.sr-row').forEach(b=>{
    b.onclick = () => {
      $('member-window').classList.remove('show');
      location.href = 'totehm.html?ro=' + encodeURIComponent(b.dataset.pseudo);
    };
  });
}

$('search-input').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=$('search-input').value.trim();
  const n=$('search-note');
  if(v.length<2){n.className='note dim';n.textContent='two letters, minimum';return;}
  runSearch(v, n);
});

/* ══ L'OFFRE UNIQUE — HIGHER CLUB ═══════════════════════════════════════════
   Un seul palier remplace Seed / Plant / Tree : essai 7 jours, puis un tarif
   unique qui inclut la Higher Map et le Totehm Cloth.

   ⚠️ SEUL ENDROIT À ÉDITER pour ton tarif réel. `price` / `priceAlt` sont des
   marques-places (je n'ai pas accès à ton Stripe) : j'ai repris le tarif Plant,
   ton moteur de MRR (148 abonnés = 1 k€/mois). Ajuste-les ici, nulle part ailleurs.

   NOM : le brief disait « Figher Club ». Je l'ai lu « Higher Club » — cohérent
   avec la marque HIGHER omniprésente (asset #higher-word, « Get Higher »…).
   Pour revenir en arrière : change simplement CLUB.name ci-dessous. */
const CLUB={
  key:'higher',
  name:'Higher Club',
  trial:'7-day free trial',
  price:'€7 / month',
  priceAlt:'€70 / year',
  /* Le palier se vendait en un paragraphe et trois puces. Le nom, l'essai et
     le prix suffisent : qui est déjà dans son Totehm n'a pas besoin qu'on lui
     explique ce qu'il y trouve. Pour rétablir l'argumentaire, il suffit de
     remplir `why` et `perks` — paintSubscription() les affiche dès qu'ils
     ne sont pas vides. */
  why:'',
  perks:[]
};

/* Lit l'abonnement de l'utilisateur. Rien n'est écrit depuis le client :
   c'est le webhook du fournisseur de paiement qui fait foi. */
/* Deux chemins, deux objets en base, aucun email côté client :
   ma propre accréditation vient de stoner_access, protégée par une policy
   « ma ligne » ; celle d'autrui vient de la vue higher_badges, qui n'expose
   que l'id et le pseudo. */
let myHigher=false;
const HI_SVG='<span class="hi-badge" title="Higher"><svg viewBox="0 0 600 200" aria-label="Higher" role="img"><use href="#higher-badge"></use></svg></span>';
/* Un seul endroit pose la classe, un seul endroit la retire : le drapeau et
   l'affichage ne peuvent pas diverger. */
function paintHigher(){
  document.body.classList.toggle('higher',!!myHigher);
  /* Plus d'iframe à prévenir : `body.higher` suffit, tout est dans ce
     document et lit la même classe. */
}
async function loadHigher(){
  myHigher=false; paintHigher();
  if(!me)return;
  try{
    /* ══ DEUX CONDITIONS, PAS UNE ══
       Le badge disait « j'ai fait la méthode Stoner ». Il doit dire
       « je suis membre actif ET j'ai fait la méthode » — c'est l'engagement
       complet dans l'écosystème qu'il valorise, pas un achat isolé sur .com.
       La RLS de `stoner_access` restreint déjà la lecture à sa propre ligne
       (lower(email) = lower(auth.jwt()->>'email')) : le front ne peut pas
       lire celle d'un autre, et ne décide de rien tout seul. */
    const [{data:st},{data:sub}]=await Promise.all([
      sb.from('stoner_access').select('granted_at').limit(1),
      sb.from('subscriptions').select('status').eq('user_id',me.id)
        .in('status',['active','trialing']).limit(1)
    ]);
    myHigher=!!(st&&st.length&&st[0].granted_at) && !!(sub&&sub.length);
  }catch(_){ myHigher=false; /* illisible = pas de badge, jamais d'erreur */ }
  paintHigher();
}
async function isHigher(profileId){
  if(!me||!profileId)return false;
  try{
    const {data}=await sb.from('higher_badges').select('id').eq('id',profileId).limit(1);
    return !!(data&&data.length);
  }catch(_){ return false; }
}
async function loadSubscription(){
  if(!me) return null;
  try{
    const {data}=await sb.from('subscriptions')
      .select('tier,status,current_period_end,cancel_at_period_end')
      .eq('user_id',me.id).maybeSingle();
    return data||null;
  }catch(e){ return null; }
}

function paintSubscription(sub){
  const box=$('mw-sub'); if(!box) return;
  const live=sub && ['active','trialing','past_due'].includes(sub.status);
  if(live){
    /* Un seul palier : quel que soit le `tier` en base (y compris d'anciens
       seed/plant/tree), c'est le Higher Club. */
    const end=sub.current_period_end?new Date(sub.current_period_end):null;
    const when=end?end.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
    const meta=sub.cancel_at_period_end
      ? (when?'ends '+when:'ending')
      : (sub.status==='trialing'?(when?'trial ends '+when:'trial')
        :(sub.status==='past_due'?'payment failed':(when?'renews '+when:'active')));
    box.innerHTML='<div class="s-lab">Your membership</div>'
      +'<div class="s-tier">'+esc(CLUB.name)+'</div>'
      +'<div class="s-meta">'+esc(meta)+'</div>'
      +(CLUB.perks.length?'<ul class="s-perks">'+CLUB.perks.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')
      +'<button class="s-act" id="mw-sub-change">Manage membership</button>';

  }else{
    box.innerHTML='<div class="s-lab">Membership</div>'
      +'<div class="s-plan s-club">'
      +'<span class="p-top"><span class="p-name">'+esc(CLUB.name)+'</span>'
      +'<span class="p-price">'+esc(CLUB.trial)
      +'<span class="p-alt">then '+esc(CLUB.price)+' \u00b7 '+esc(CLUB.priceAlt)+'</span></span></span>'
      +(CLUB.why?'<span class="p-why">'+esc(CLUB.why)+'</span>':'')
      +(CLUB.perks.length?'<ul class="s-perks">'+CLUB.perks.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')

      /* Point d'accroche de subscription-checkout. La redirection devra viser
         window.top : lancee depuis une iframe, Stripe est annule en silence. */
      btn.blur();
    };
  }
}
/* ══ TOTEHMBOT ══════════════════════════════════════════════════════
   Le membre pose un spot depuis Telegram : /spot, sept boutons, une
   position native. Aucun geocodage, donc aucune API payante.

   La liaison passe par un code a usage unique, valable 10 minutes, cree
   par new_bot_link_code() et lu par bot-reply au /start. Le compte n'est
   JAMAIS transmis par le message : le bot le retrouve en base.

   telegram_id n'est ni lisible ni ecrivable par le membre (GRANT par
   colonne) — sans quoi n'importe qui pouvait s'attribuer le Telegram
   d'un autre et recevoir ses questions a sa place. D'ou bot_linked(),
   qui ne rend qu'un booleen sur SA ligne. */

async function paintTelegram(sub){
  const box=$('tg-block'); if(!box) return;
  const live = sub && ['active','trialing','past_due'].includes(sub.status);
  /* Pas d'abonnement = /spot repondrait « reserve aux membres du Club ».
     On ne montre pas une porte qui se ferme. */
  box.classList.toggle('hide', !(me && live));
  if(!(me && live)) return;
  /* `bot_state()` rend TROIS choses en un appel : lié, actif, en attente.
     `bot_linked()` n'en rendait qu'une — et le membre voyait « connected »
     sur un bot qui n'avait pas le droit de parler. */
  let st=null;
  try{ const {data}=await sb.rpc('bot_state'); st=data||null; }catch(_){ st=null; }
  tgLinked=!!(st&&st.linked);
  botOn=!!(st&&st.on);
  const b=$('tg-btn'), n=$('tg-note');
  b.classList.toggle('claimed', tgLinked);
  b.textContent = tgLinked ? 'TotehmBot connected' : 'Connect TotehmBot';
  const t=$('tg-toggle');
  if(t){
    t.classList.toggle('hide', !tgLinked);
    t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  }
  if(n) n.textContent = !tgLinked ? ''
    : (botOn ? 'send /tonight for what is on around you · /spot to post a place'
             : 'paused — /tonight and /spot still work');
}
let botOn=false;
/* Le membre coupe et rallume depuis la page. Le bot en fait autant avec
   /pause et /reprendre : deux portes, un seul interrupteur en base. */
if($('tg-toggle')) $('tg-toggle').onclick=async()=>{
  const next=!botOn;
  const {error}=await sb.rpc('set_bot',{p_on:next});
  if(error)return;
  botOn=next;
  const t=$('tg-toggle');
  t.textContent = botOn ? 'pause the daily question' : 'resume the daily question';
  const n=$('tg-note');
  if(n) n.textContent = botOn
    ? 'send /tonight for what is on around you · /spot to post a place'
    : 'paused — /tonight and /spot still work';
};

  /* La fenetre s'ouvre AVANT l'await : ouverte apres, elle n'est plus
     rattachee au clic et Safari la bloque. On la remplit ensuite. */
  const w=window.open('','_blank');

  setTimeout(()=>{ loadSubscription().then(paintTelegram); }, 4000);
};
