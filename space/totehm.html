/* ══════════════════════════════════════════════════════════════════════════
   LANDING GATE — déconstruction vectorielle, ET SON EXACT CONTRAIRE
   Le JS ne fait QUE mesurer (une fois) où l'UI se trouve réellement, et
   écrit le résultat dans des variables CSS. Toute l'animation est ensuite
   jouée par les transitions CSS sur transform / opacity : netteté absolue.

   LE REPLI. Le gate n'est PLUS détruit après l'entrée (`gate.remove()`) :
   il fallait pouvoir le rejouer à l'envers. Il reste dans le document,
   masqué par `body:not(.gate) #gate{display:none}` — coût : zéro repaint,
   zéro écouteur actif. `fold()` remet body.gate ET body.entered dans la
   même frame (les pièces restent donc où elles sont), force un reflow,
   puis retire `entered` : les quatre calques repartent vers le logo, l'UI
   de l'app s'efface. Aller et retour sont le même geste, à l'envers.
   ══════════════════════════════════════════════════════════════════════════ */
(()=>{
  const gate=$('gate'); if(!gate) return;
  const root=document.documentElement, body=document.body;

  /* Couples calque-du-logo -> élément d'UI d'arrivée */
  const PAIRS=[
    {v:'--tf-t',    from:'gl-t',    to:'ui-t',  uniform:true },
    {v:'--tf-wm',   from:'gl-wm',   to:'ui-wm', uniform:true },
    {v:'--tf-rail', from:'gl-rail', to:'rail',  uniform:false},
    /* Desktop seulement : sur mobile #stage n'a ni largeur ni hauteur, la
       boucle passe son tour et le calque garde son scale(60) plein écran. */
    {v:'--tf-bg',   from:'gl-bg',   to:'stage', uniform:false}
  ];

  /* Chaque calque du logo a un viewBox serré : son rectangle DOM EST le
     rectangle du dessin. Le mapping se réduit donc à un rect -> rect. */
  function measure(){
    for(const p of PAIRS){
      const a=$(p.from), b=$(p.to);
      if(!a||!b) continue;
      const f=a.getBoundingClientRect(), t=b.getBoundingClientRect();
      /* Cible sans boîte — sur mobile #stage n'a que des enfants `fixed`,
         donc une hauteur nulle. On EFFACE la variable au lieu de garder
         l'ancienne : une valeur mesurée en desktop puis rejouée en portrait
         après rotation replierait le fond sur un carré qui n'existe plus. */
      if(!f.width||!f.height||!t.width||!t.height){
        root.style.removeProperty(p.v);
        /* Et on ramène l'échelle de repli à ce qu'il FAUT pour couvrir
           l'écran. `scale(60)` sur 110 px, c'est 6 600 px de carré dans un
           conteneur qui défile : la cause du bug mobile. Il suffit de sortir
           les perforations du champ — au-delà, on ne fait que fabriquer du
           débordement. Le 1,8 est la marge qui les met dehors dans tous les
           sens, y compris quand le logo n'est pas centré verticalement. */
        if(p.v==='--tf-bg'&&f.width){
          const need=Math.ceil(Math.max(window.innerWidth,window.innerHeight)/f.width*1.8);
          root.style.setProperty('--gate-bg-scale',String(Math.max(8,Math.min(60,need))));
        }
        continue;
      }
      const dx=(t.left+t.right)/2-(f.left+f.right)/2;
      const dy=(t.top+t.bottom)/2-(f.top+f.bottom)/2;
      const sx=t.width/f.width, sy=t.height/f.height;
      const s=p.uniform
        ? 'scale('+sx.toFixed(5)+')'
        : 'scale('+sx.toFixed(5)+','+sy.toFixed(5)+')';
      root.style.setProperty(p.v,'translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) '+s);
    }
  }

  const DUR=1050, REVEAL=520;
  let open=false, moving=false, timer=null;

  function enter(then){
    if(open||moving) return;
    moving=true;
    gate.classList.remove('no-anim');
    gate.scrollTop=0;                /* on mesure toujours depuis le haut */
    measure();                       /* dernière mesure juste avant le départ */
    void gate.offsetWidth;           /* reflow : garantit le point de départ  */
    body.classList.add('entered');

    clearTimeout(timer);
    timer=setTimeout(()=>{
      gate.classList.add('gate-off');
      timer=setTimeout(()=>{
        body.classList.remove('gate','entered');
        open=true; moving=false;
        if(then) then();
      },340);
    },DUR+REVEAL+120);
  }

  /* ══ LE REPLI — le déploiement, exactement à l'envers ══

     L'ORDRE DES OPÉRATIONS EST LE CŒUR DU PROBLÈME, ET C'ÉTAIT LE BUG.
     `measure()` lit `getBoundingClientRect()`, qui renvoie le rectangle
     APRÈS transformation. En posant `.entered` AVANT de mesurer, on
     mesurait des calques déjà déplacés : `--tf-bg` était alors recalculé
     depuis la position d'arrivée au lieu de la position de départ, et
     l'échelle du fond se composait avec elle-même. À chaque repli le carré
     navy partait à une taille différente — le « conflit de ratio ».

     Donc : on affiche le gate AU REPOS, on mesure là, et seulement ensuite
     on pose l'état d'arrivée — sans rien animer (`no-anim`), sinon on
     verrait le saut avant de voir le retour.

     `#gate-world` et `#conn-bar` reviennent par le même chemin : ils
     n'ont pas de style inline, seulement la règle `body.gate.entered`.
     Retirer `entered` leur rend `opacity:1` et `pointer-events:auto`. */
  function fold(){
    if(!open||moving) return;
    moving=true;
    clearTimeout(timer);

    gate.classList.add('no-anim');        /* 1. rien ne bouge              */
    gate.classList.remove('gate-off');
    body.classList.add('gate','folding'); /* 2. le gate au repos, opaque,  */
                                          /*    et il NE DÉFILE PAS        */
    gate.scrollTop=0;                     /*    on mesure toujours du haut */
    void gate.offsetWidth;
    measure();                            /* 3. rect NON transformé        */
    body.classList.add('entered');        /* 4. saut à la position d'UI    */
    void gate.offsetWidth;
    gate.classList.remove('no-anim');     /* 5. transitions rendues        */
    void gate.offsetWidth;
    body.classList.remove('entered');     /* 6. et le repli part           */

    open=false;
    timer=setTimeout(()=>{
      body.classList.remove('folding');   /* le défilement redevient normal */
      moving=false;
    },DUR+120);
  }

  /* Le reste du script replie par ici. */
  foldToGate=fold;

  /* ══ LE SECOND VERROU ══
     `overflow:hidden` empêche l'utilisateur de faire défiler, PAS le
     navigateur : un `scrollTop` programmatique, une mise au point sur un
     champ ou un reste d'inertie passent quand même — mesuré, le bouton du
     bas se faisait chasser hors de l'écran. Alors pendant l'animation on
     réépingle le défilement à zéro à chaque tentative. Piloté par
     l'événement, jamais en boucle : zéro coût au repos. */
  gate.addEventListener('scroll',()=>{
    if(gate.scrollTop&&(body.classList.contains('entered')||body.classList.contains('folding')))
      gate.scrollTop=0;
  },{passive:true});

  /* État 1 (la classe est déjà posée sur <body> dans le HTML : zéro flash) */
  body.classList.add('gate');

  /* Pendant l'état 1, aucun geste ne doit atteindre l'app en dessous — mais
     l'atterrissage a ses propres champs et sa propre vidéo : un geste NÉ
     dans le gate lui appartient. Sans cette exception, la touche Entrée
     n'atteignait jamais le champ de recherche, capturée au niveau window. */
  const swallow=e=>{
    if(!body.classList.contains('gate')) return;
    const t=e.target;
    if(t&&t.closest&&t.closest('#gate,#member-window')) return;
    e.stopPropagation();
  };
  ['touchstart','touchmove','touchend','wheel','keydown'].forEach(t=>
    window.addEventListener(t,swallow,{capture:true,passive:true}));
  requestAnimationFrame(()=>requestAnimationFrame(measure));
  window.addEventListener('resize',()=>{ if(!open) measure(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!open) measure(); });

  /* Le clic sur le logo = la déconstruction */
  $('gate-enter').onclick=()=>enter();

  /* [Open my Totehm] : strictement le même geste que le clic sur le logo */
  $('gate-open').onclick=()=>enter();

  /* ── Search a Totehm : un bouton, la boîte n'arrive qu'au clic ── */
  const gsb=$('gate-search-btn'), gsi=$('gate-search-input'), gsn=$('gate-search-note');
  if(gsb&&gsi) gsb.onclick=()=>{
    gsb.classList.add('hide');
    gsi.classList.remove('hide');
    if(gsn) gsn.classList.remove('hide');
    setTimeout(()=>{try{gsi.focus();}catch(e){}},100);
  };
  if(gsi) gsi.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ gsi.classList.add('hide'); if(gsn)gsn.classList.add('hide');
                          gsb.classList.remove('hide'); return; }
    if(e.key!=='Enter')return;
    const v=gsi.value.trim();
    if(v.length<2){ if(gsn){gsn.classList.remove('hide');gsn.textContent='two letters, minimum';} return; }
    /* L'atterrissage cherche SANS se déployer : on ne fait pas entrer
       quelqu'un dans son Totehm pour lui montrer une liste de noms. */
    runSearch(v, gsn);
  });

  /* ══ NAVIGATION VERS LA HIGHER MAP ══
     Clic sur #ctx-down ou swipe dans n'importe quelle direction verticale
     (>40 px) → map.html. Le sélecteur d'intention est sur map.html. */
  {
    const ctxDown=$('ctx-down');
    if(ctxDown) ctxDown.addEventListener('click',()=>{ window.location.href='map.html'; });
    let _gsY=0;
    gate.addEventListener('touchstart',e=>{ _gsY=e.touches[0].clientY; },{passive:true});
    gate.addEventListener('touchend',e=>{
      if(entered||folding)return;
      if(Math.abs(e.changedTouches[0].clientY-_gsY)>40) window.location.href='map.html';
    },{passive:true});
  }
})();

/* ══ LA PREMIÈRE HABITUDE EST EN AVANT — LOUPE AU SCROLL · 07/09/2026 ═══
   Mobile ET desktop. La ligne en tête de liste porte la classe
   `.featured` : sa boîte s'agrandit d'un pouce (scale 1.02 desktop,
   1.035 mobile), sans ombre — BRAND.md interdit l'ombre. Au scroll,
   c'est la ligne qui vient de se poser en haut du cadre qui prend la
   classe. La liste est TOUJOURS visible : rien ne sort, rien ne se
   cache — c'est un effet de loupe, pas un carrousel. */
(function featureFirstHabit(){
  const sc=document.getElementById('fv-inner');
  const list=document.getElementById('habits');
  if(!sc||!list)return;
  let raf=null;
  function update(){
    raf=null;
    const items=list.querySelectorAll(':scope > .habit:not(.add)');
    if(!items.length)return;
    const scTop=sc.getBoundingClientRect().top;
    let first=null,minDelta=1/0;
    items.forEach(el=>{
      const r=el.getBoundingClientRect();
      const delta=r.top-scTop;
      if(delta>=-6 && delta<minDelta){minDelta=delta;first=el;}
    });
    items.forEach(el=>el.classList.toggle('featured',el===first));
  }
  const schedule=()=>{if(!raf)raf=requestAnimationFrame(update);};
  sc.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  new MutationObserver(schedule).observe(list,{childList:true});
  schedule();
})();
</script>
