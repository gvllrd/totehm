<style>
/* POLICES — BASE (01/10) : Space Mono et Quantico, rien d'autre ; un bouton hérite. */
html{font-family:'Space Mono',monospace}button,input,select,textarea{font-family:inherit}
:root{
  color-scheme:dark;
  --bg:#000;--hi:#fff;--mid:#b0b0b0;--lo:#9a9a9a;--dim:#606060;
  --g1:#0e0e10;--g2:#141416;--g3:#1c1c1f;--g4:#26262b;
  --on:#639922;--no:#ff9a9a;--enrich:#fcbe21;
  --title:'Space Mono',monospace;--q:'Quantico',sans-serif;--mono:'Space Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--mid);font-family:var(--mono);font-size:13px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.hide{display:none!important}

#member{position:fixed;top:16px;left:16px;z-index:40;display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
  font-family:var(--q);font-weight:700;font-size:13px;color:#a0a0a0;padding:6px 4px;-webkit-tap-highlight-color:transparent;transition:color .15s}
#member i{width:10px;height:10px;border-radius:50%;background:#3a3a40;display:block;transition:background .3s,box-shadow .3s}
#member.is-in i{background:#fff;box-shadow:0 0 9px #fff}
/* Le menu membre — SIMPLE TERMS OF USE toujours en dernier (01/10). */
#mmenu{position:fixed;top:0;left:0;z-index:45;width:min(300px,86vw);background:#141416;padding:58px 16px 18px;display:flex;flex-direction:column;gap:6px;
  transform:translateY(-104%);visibility:hidden;transition:transform .3s ease}
#mmenu.is-open{transform:none;visibility:visible}
#mmenu .m-it{display:block;text-align:left;background:#1c1c1f;border:none;border-radius:10px;padding:3px 3px;cursor:pointer;color:var(--mid);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
#mmenu .m-terms{background:none;color:var(--lo);margin-top:8px}

/* Boutons : Space Mono Bold, gris, arrondis (brief §36 · 27/09). */
.btn{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);background:var(--g3);
  border:none;border-radius:10px;cursor:pointer;padding:3px 4px;line-height:1.4;display:inline-block;width:fit-content;
  -webkit-tap-highlight-color:transparent;transition:color .15s,background .15s,transform .15s}
.btn.main{color:#fff;background:var(--g4)}
@media(hover:hover){.btn:hover{color:#fff;background:#303036;transform:scale(1.03)}#mmenu .m-it:hover,.lnk:hover,.tab:hover{color:#fff}}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.lnk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lo);background:none;border:none;cursor:pointer;padding:2px 0}
.in{font-family:var(--q);font-size:15px;color:#fff;background:#1c1c22;outline:none;border:none;border-radius:10px;padding:9px 12px;
  caret-color:#fff;width:100%;-webkit-appearance:none;appearance:none}
.in:focus{background:#26262e}
.in::placeholder{color:rgba(255,255,255,.38)}
select.in{cursor:pointer}
.note{font-size:9px;letter-spacing:.14em;text-transform:uppercase;min-height:14px;color:var(--lo)}
.note.ok{color:var(--on)}.note.no{color:var(--no)}
.cap{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.cap b{color:#fff;font-weight:400}

main{width:100%;max-width:980px;margin:0 auto;padding:78px 16px 80px}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:22px}
.kick{font-family:var(--title);font-size:11.2px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700}
h1{font-family:var(--title);font-weight:700;color:#fff;font-size:clamp(31.7px,7.3vw,55.4px);line-height:1.1;-webkit-text-stroke:1px #fff;text-transform:uppercase}
h2{font-family:var(--title);font-weight:700;color:#fff;font-size:18.5px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.say{max-width:46ch;font-size:12px;color:var(--mid)}
.say b{color:#fff;font-weight:400}

.tabs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 18px}
.tab{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lo);background:var(--g2);
  border:none;border-radius:10px;padding:2px 4px;cursor:pointer;transition:color .15s,background .15s}
.tab.is-on{background:#34343c;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}   /* 01/10 : aucun fond blanc */

.banner{background:var(--g2);padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:4px;text-align:center}
.banner b{font-family:var(--title);font-size:17.2px;color:#fff;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sec{margin:6px 0 22px}
.sec > .cap{display:block;margin-bottom:8px}

/* Une œuvre = une boîte grise pleine ; le fond fait le cadre (aucune bordure). */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{background:var(--g2);display:flex;flex-direction:column;cursor:pointer;transition:transform .22s cubic-bezier(.2,.9,.25,1),background .2s;
  text-align:left;border:none;color:inherit;font:inherit;padding:0}
@media(hover:hover){.card:hover{transform:scale(1.02);background:var(--g3)}}
.media{position:relative;width:100%;aspect-ratio:1/1;background:#0a0a0c;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .ph{font-family:var(--title);font-size:19.8px;letter-spacing:.06em;color:#fff;text-align:center;line-height:1.1;padding:12px;font-weight:700;text-transform:uppercase}
.media .ph small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--lo);margin-top:8px}
.meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.meta .ti{font-family:var(--title);font-size:14.5px;color:#fff;line-height:1;letter-spacing:.04em;font-weight:700;text-transform:uppercase}
.meta .co{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--lo)}
.meta .pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.meta .pr b{font-family:var(--mono);font-weight:700;font-size:13px;color:#fff}
.meta .pr span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tag{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#2a2a30;border-radius:6px;padding:1px 6px;width:fit-content}
.tag.dim{background:var(--g4);color:var(--mid)}

.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.col{background:var(--g2);padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;border:none;color:inherit;font:inherit;
  transition:transform .22s cubic-bezier(.2,.9,.25,1),background .2s}
@media(hover:hover){.col:hover{transform:scale(1.02);background:var(--g3)}}
.col .h{font-family:var(--title);font-size:21.1px;color:#fff;line-height:1.1;font-weight:700;text-transform:uppercase}
.col p{font-size:12px;color:var(--mid)}
.nums{display:flex;gap:14px;flex-wrap:wrap}
.nums span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lo)}
.nums b{font-family:var(--mono);color:#fff;font-weight:400;margin-right:4px}

.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--g2);display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px;align-items:start}
.row .media{aspect-ratio:1/1}
.row .ti{font-family:var(--title);font-size:14.5px;color:#fff;line-height:1;font-weight:700;text-transform:uppercase}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row .acts .in{width:120px}
.kv{display:flex;flex-direction:column;gap:2px;font-size:11px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv b{color:#fff;font-weight:400}

/* La fiche — plein écran, ancrée en haut (règle des overlays, 03/09). */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:none;align-items:flex-start;justify-content:center;
  padding:max(44px,6dvh) 16px 30px;overflow-y:auto}
#sheet.is-open{display:flex}
.sh{width:100%;max-width:560px;background:var(--g1);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.sh .x{position:absolute;top:10px;right:12px}
.sh .media{aspect-ratio:1/1}
.sh .buy{display:flex;flex-direction:column;gap:8px;background:var(--g2);padding:12px}
.waiver{display:flex;gap:8px;align-items:flex-start;font-size:10px;line-height:1.5;color:var(--lo);cursor:pointer}
.waiver input{margin-top:2px;accent-color:#fff}
.own{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:11px}
.own + .own{border-top:1px solid rgba(255,255,255,.05)}

.empty{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:16px 0;text-align:center}
.row .media .ph{font-size:12px;padding:4px;letter-spacing:.02em}.row .media .ph small{display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.meta .ti{font-size:18px}.media .ph{font-size:22px}}
@media(prefers-reduced-motion:reduce){.card,.col,.btn{transition:none}}



/* ══ SURVOL — BLOC GÉNÉRÉ, NE PAS ÉDITER À LA MAIN (hover.py) ══ */
/* Le gris en survol devient blanc. Généré depuis la feuille
   elle-même : un nouveau bloc gris entre ici tout seul.        */

#member:hover,
#mmenu .m-it:hover,
#mmenu .m-terms:hover,
.btn:hover,
.lnk:hover,

.cap:hover,
.kick:hover,
.say:hover,
.tab:hover,
.media .ph small:hover,
.meta .co:hover,
.meta .pr span:hover,
.tag.dim:hover,
.col p:hover,
.nums span:hover,
.waiver:hover,
.empty:hover{color:#fff}
}
/* ══ FIN DU BLOC GÉNÉRÉ ══ */

/* 03/10 — the member's TOTEHM name: Quantico Coral, without status dots. */
#conn-bar,#conn-bar:hover,#conn-txt,#member,#member:hover,#member-txt,.mw-pseudo,.mw-pseudo:hover,.mw-who,.mw-who:hover,#mw-who,#mw-who:hover,#ro-who,#ro-who:hover,.tv-name,.tv-name:hover,#member-txt:hover,#conn-txt:hover{font-family:'Quantico',sans-serif;font-weight:400;color:#fbd5ca;text-transform:none}

/* ══ LE COIN MEMBRE — copié de tools/member_corner.css dans chaque page (jamais importé), EN DERNIER dans son style ══
   L'élément porte la classe `mc` ; la page pose `is-in` quand le membre est connecté (rien d'autre à faire),
   et met le nom dans son `#member-txt` (ou son dernier enfant texte) : le bloc fait le reste.
   Déconnecté : CONNECT WITH MY TOTEHM = un bouton normal (gris, 10 px de rayon, ajusté au label), jamais coral.
   Connecté : LE TOTEHM, une seule pièce qui TOURNE (Wah) — recto le logo plein, verso le NOM du membre en
   Quantico coral posé sur tout le carré (nomenclature : `tools/totehm_name.js`). Un seul morceau de papier,
   vu des deux côtés : les perforations sont symétriques, donc les deux faces ont la même silhouette.
   « Simple terms of use » (`mc-terms`) : tout en bas, discret ; la page l'efface sur une vue qui défile. */
.mc:not(.is-in){font:700 10px/1.45 'Space Mono',monospace!important;letter-spacing:.06em!important;text-transform:uppercase!important;
  color:#b0b0b0!important;background:#252529!important;border:0!important;border-radius:10px!important;padding:.65em .95em!important;
  width:auto!important;height:auto!important;min-width:0!important;max-width:min(62vw,250px)!important;text-align:left!important;
  white-space:normal!important;overflow-wrap:normal!important;box-shadow:none!important;gap:0!important;cursor:pointer}
.mc:not(.is-in) *{font:inherit!important;letter-spacing:inherit!important;text-transform:inherit!important;color:inherit!important;
  max-width:none!important;white-space:normal!important;overflow:visible!important}
/* ⚠️ LE PAPIER N'EST PLUS SUR LE BOUTON : il est sur ses DEUX FACES, sinon la pièce n'a pas d'envers.
   `backface-visibility` AUSSI sur les enfants des faces (Safari les laisse traverser autrement). */
.mc.is-in{--mc-s:64px;position:relative!important;display:block!important;
  width:var(--mc-s)!important;height:var(--mc-s)!important;min-width:var(--mc-s)!important;max-width:var(--mc-s)!important;

  box-shadow:none!important;background:none!important;overflow:visible!important;
  perspective:calc(var(--mc-s) * 4.36);cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:mc-pose .35s cubic-bezier(.2,.9,.25,1) both}
.mc.is-in>*:not(.mcp){display:none!important}   /* le libellé de la page : la pièce le remplace */

.mcp-f{position:absolute;inset:0;background:0 0/100% 100% no-repeat;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcp-f *{backface-visibility:hidden;-webkit-backface-visibility:hidden}

/* ══ LE MOT TOTEHM EST LE TOTEHM — copié de tools/totehm_word.css dans chaque page (jamais importé) ══
   Wah (12/11) : « à chaque fois qu'il y a le mot totehm, le TOTEHM recto-verso rotatif — recto le logo,
   verso le nom du membre — dont la grandeur s'adapte au texte ». Donc : dans TOUT texte des quatre
   domaines, le mot devient LA PIÈCE. Une seule pièce de papier, vue des deux côtés, exactement celle du
   coin membre (`tools/member_corner.css`) : mêmes faces, mêmes perforations, même nomenclature de nom
   (`tools/totehm_name.js`). Règle n° 1 : rien n'est réinterprété ici, tout est copié de la source.
   Le mot reste DANS le document (`.tw-s`, hors écran) : la page se lit, se cherche et s'entend comme avant.
   ⚠️ UNE SEULE ROTATION POUR TOUTE LA PAGE : l'angle est une variable CSS posée sur `:root` par un seul
   rAF (`--tw-th`) — vingt pièces dans un texte coûtent alors vingt `transform` de GPU, pas vingt boucles. */
.tw{position:relative;display:inline-block;width:1.12em;height:1.12em;vertical-align:-.22em;margin:0 .16em;
  perspective:5em;flex:none;font-size:inherit;line-height:1}
.tw-s{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tw-p{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--tw-th,0deg))}

const FN = SB_URL + '/functions/v1/';
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

/* ══ LE PONT SSO v2 — COPIÉ de tools/sso_snippet.js (30/09/2026) ══════
   totehm.com est l'autorité : se connecter ici = passer PAR totehm.com
   (authorization code + PKCE). Le lien entre domaines reste le pont. */
/* LE NOM DE CE DOMAINE — 'space' | 'club' | 'boutique'. Jamais une URL. */
const SSO_CLIENT = 'space';
const SSO_AUTH = 'https://www.totehm.com/auth';
const SSO_KNOWN = 'totehm_sso_known';   // localStorage : ce navigateur s'est déjà connecté ici
const SSO_TRIED = 'totehm_sso_tried';   // sessionStorage : l'aller-retour silencieux a eu lieu
const SSO_PKCE  = 'totehm_sso_pkce';    // sessionStorage : { verifier, state } le temps du voyage
const SSO_EPOCH = 'totehm_sso_epoch';  // localStorage : le numero de sortie vu en entrant

const ssoB64 = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const ssoStore = (s, k, v) => { try{ v === null ? s.removeItem(k) : s.setItem(k, v); }catch(_){} };
const ssoRead = (s, k) => { try{ return s.getItem(k); }catch(_){ return null; } };

/* ── ARRIVÉE ────────────────────────────────────────────────────────
   ⚠️ LE CODE SORT DE L'URL AVANT TOUT AUTRE GESTE — et SEULEMENT lui :
   le reste du fragment (#create, #reveal…) reste à la page. Un code
   laissé dans la barre d'adresse se retrouve dans un signet, un partage,
   un historique. Avec un `state`, c'est une connexion centrale : il doit
   être celui que CE navigateur a envoyé (sinon quelqu'un essaie de nous
   connecter à SON compte) et le `verifier` part avec le code. */
async function ssoArrivee(sb){
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  const code = h.get('sso') || q.get('sso'), st = h.get('state'), err = h.get('sso_error');
  if(!code && !err) return false;
  ['sso','state','sso_error'].forEach(k => { h.delete(k); q.delete(k); });
  const reste = [...h.keys()].length ? '#' + h.toString().replace(/=(&|$)/g, '$1') : '';
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + reste);
  const pk = (() => { try{ return JSON.parse(ssoRead(sessionStorage, SSO_PKCE) || 'null'); }catch(_){ return null; } })();
  ssoStore(sessionStorage, SSO_PKCE, null);
  if(err || !/^[a-f0-9]{64}$/.test(code || '')) return false;
  let verifier;
  if(st){
    if(!pk || pk.state !== st){ console.error('[sso] state'); return false; }
    verifier = pk.verifier;
  }
  try{
    const r = await fetch(FN + 'sso-redeem', {
      method:'POST',
      headers:{'content-type':'application/json', 'apikey':SB_ANON, 'authorization':'Bearer '+SB_ANON},
      body: JSON.stringify(verifier ? { code, verifier } : { code })
    });
    if(!r.ok){ console.error('[sso] redeem', r.status); return false; }
    const { token_hash, email } = await r.json();
    if(!token_hash) return false;
    /* `verifyOtp` ouvre une session NORMALE dans ce `localStorage`. */
    const { error } = await sb.auth.verifyOtp({ type:'email', token_hash });
    if(error){ console.error('[sso] verify', error.message); return false; }
    return true;
  }catch(e){ console.error('[sso]', e && e.message || e); return false; }
}

/* ── SE CONNECTER — PAR TOTEHM.COM ──────────────────────────────────
   `silent` : `prompt=none` — totehm.com ne montre rien, il rend un code
   ou `login_required`. `retour` : un CHEMIN de ce domaine (jamais une
   URL) ; totehm.com refuse tout le reste. */
async function ssoLogin(silent, retour){
  const v = ssoB64(crypto.getRandomValues(new Uint8Array(32)));
  const c = ssoB64(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  const st = ssoB64(crypto.getRandomValues(new Uint8Array(16)));
  ssoStore(sessionStorage, SSO_PKCE, JSON.stringify({ verifier: v, state: st }));
  const ret = retour || (location.pathname + location.search);
  location.href = SSO_AUTH + '?client=' + SSO_CLIENT + '&challenge=' + c + '&state=' + st +
                  '&return=' + encodeURIComponent(ret) + (silent ? '&prompt=none' : '');
}

/* ── DÉPART ─────────────────────────────────────────────────────────
   `cible` est un NOM DE PRODUIT — 'com' | 'space' | 'boutique' | 'club'.
   ⚠️ SI LE PONT ÉCHOUE, ON PART QUAND MÊME : dégradé, pas cassé. */
async function ssoVersDomaine(sb, cible, url){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const r = await fetch(FN + 'sso-mint', {
        method:'POST',

        body: JSON.stringify({ target: cible })

        if(code){ location.href = url + (url.includes('#') ? '&' : '#') + 'sso=' + code; return; }

}

/* ── LE DÉMARRAGE — BLOQUANT, ET JAMAIS PLUS DE 2,5 S ───────────────
   `await` au niveau du module : quand la page lit sa session, la session
   est déjà là. Puis, sans session et si ce navigateur s'est déjà
   connecté ici : UN aller-retour silencieux par onglet vers totehm.com.
   La page ne se dessine pas pendant qu'elle part (promesse qui ne se
   résout pas) : pas de clignotement de porte fermée. Le repère se pose à
   la connexion et s'efface à la déconnexion — sortir d'ici ne vous y
   reconnecte pas en silence. */
await Promise.race([ ssoArrivee(sb), new Promise(r => setTimeout(() => r(false), 2500)) ]);
sb.auth.onAuthStateChange(ev => {
  if(ev === 'SIGNED_IN') ssoStore(localStorage, SSO_KNOWN, '1');
  if(ev === 'SIGNED_OUT') ssoStore(localStorage, SSO_KNOWN, null);
});
{
  const { data:{ session } } = await sb.auth.getSession();
  if(session) ssoStore(localStorage, SSO_KNOWN, '1');
  else if(ssoRead(localStorage, SSO_KNOWN) && !ssoRead(sessionStorage, SSO_TRIED)){
    ssoStore(sessionStorage, SSO_TRIED, '1');
    await ssoLogin(true);
    await new Promise(() => {});
  }
}
/* ── SORTIR DE TOTEHM.COM SORT D'ICI AUSSI · 08/11/2026 ─────────────
   Wah : « je ne peux pas me deconnecter d'un compte sur un domaine quand je
   me deconnecte de totehm.com ». Mesure : com sortait en `scope:'global'`
   (les jetons de rafraichissement sont revoques, mais CE site garde un jeton
   d'ACCES valide jusqu'a une heure) et quatre pages de com sortaient en
   `scope:'local'`, qui ne revoque RIEN — on restait connecte ici, sans fin.
   La console centrale pose un NUMERO DE SORTIE en base. Ce site retient
   celui qu'il a vu, le relit au demarrage et a chaque retour d'onglet :
   plus grand = la console a ferme, on sort. Une lecture SQL, zero centime,
   et la decision vit sur le SERVEUR, pas dans un navigateur. Une erreur de
   reseau ne deconnecte JAMAIS : sans numero lisible, on ne touche a rien.
   Le repere s'efface AVANT le rechargement, sinon l'aller-retour silencieux
   nous reconnecte au chargement suivant. */
async function ssoVerifierSortie(sb){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ ssoStore(localStorage, SSO_EPOCH, null); return false; }
    const { data, error } = await sb.rpc('sso_epoch');
    if(error){ console.error('[sso_epoch]', error.message); return false; }
    if(typeof data !== 'number' || data <= 0) return false;
    const vu = Number(ssoRead(localStorage, SSO_EPOCH) || 0);
    if(!vu || data <= vu){ ssoStore(localStorage, SSO_EPOCH, String(data)); return false; }
    ssoStore(localStorage, SSO_KNOWN, null);
    ssoStore(localStorage, SSO_EPOCH, null);
    ssoStore(sessionStorage, SSO_TRIED, '1');
    try{ await sb.auth.signOut({ scope:'local' }); }catch(_){}
    location.reload();
    return true;
  }catch(_){ return false; }
}
ssoVerifierSortie(sb);
document.addEventListener('visibilitychange', () => { if(!document.hidden) ssoVerifierSortie(sb); });



/* SORTIR — la seule façon de quitter un satellite. Le repère s'efface ICI :
   `SIGNED_OUT` arrive trop tard et un repère resté en place relance
   l'aller-retour silencieux, qui nous reconnecte. `scope:'local'` ne ferme
   QUE ce site. Une page appelle CECI, jamais `sb.auth.signOut()`. */
async function ssoLogout(sb){
  ssoStore(localStorage, SSO_KNOWN, null);
  ssoStore(sessionStorage, SSO_TRIED, '1');
  ssoStore(sessionStorage, SSO_PKCE, null);
  ssoStore(localStorage, SSO_EPOCH, null);
  try{ await sb.auth.signOut({ scope:'local' }); }catch(_){}
}

function playVisible(){
  const visible=[...candidates].filter(([v,ratio])=>ratio>=.5&&v.isConnected).sort((a,b)=>b[1]-a[1]);
  const chosen=!document.hidden ? visible[0]?.[0] : null;
  document.querySelectorAll('video').forEach(v=>{
    if(v!==chosen){v.pause();return;}
    if(!v.src)v.src=v.dataset.src;
    if(!reducedMotion.matches)v.play().catch(()=>{});else v.pause();
  });
}
function wakeMedia(root){
  io?.disconnect();pauseMedia();candidates.clear();mediaRoot=root||document;
  io=new IntersectionObserver(es=>{es.forEach(e=>candidates.set(e.target,e.intersectionRatio));playVisible();},{threshold:[0,.5,.75,1]});
  mediaRoot.querySelectorAll('video[data-src]').forEach(v=>io.observe(v));
}

(() => {
  const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
  const R = Math.PI / 180, W0 = 22;                 /* 22°/s de face : le tour moyen fait ~24 s */
  const LUM = (() => { const x = -.35, y = -.55, z = 1, n = Math.hypot(x, y, z); return [x / n, y / n, z / n]; })();
  const vivantes = [];
  let raf = 0, last = 0;

  function boucle(now){
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - (last || now)) / 1000)); last = now;
    for (const p of vivantes){
      const s = Math.sin(p.th * R), nat = W0 * (.34 + .66 * s * s);
      p.om += (nat - p.om) * (1 - Math.exp(-dt / 1.6));
      p.th += p.om * dt;
      if (p.th > 3600) p.th %= 360;
      peindre(p);
    }
    if (vivantes.length && !document.hidden) raf = requestAnimationFrame(boucle);
  }
  function relancer(){ if (!raf && vivantes.length && !document.hidden && !RM.matches){ last = 0; raf = requestAnimationFrame(boucle); } }
  document.addEventListener('visibilitychange', relancer);

  function peindre(p){
    p.card.style.transform = 'rotateY(' + p.th.toFixed(2) + 'deg)';
    /* la normale de la face, passée par la rotation : elle dit ce que chaque côté prend de lumière */
    const d = (Math.sin(p.th * R) * LUM[0] + Math.cos(p.th * R) * LUM[2]) / LUM[2];
    eclairer(p.lr, d); eclairer(p.lb, -d);
  }
  /* la formule du papier d'origine : la face qui se détourne s'ASSOMBRIT, celle qui se tourne vers la
     lumière prend un souffle (jamais une ombre portée — BRAND : aucune ombre) */
  function eclairer(el, f){
    if (!el || f <= 0) return;
    if (f < 1){ el.style.background = '#000'; el.style.opacity = Math.min(.5, (1 - f) * .6).toFixed(3); }
    else      { el.style.background = '#fff'; el.style.opacity = Math.min(.06, (f - 1) * .3).toFixed(3); }
  }

  /* ⚠️ Le nom se lit SANS la pièce : elle vit dans le bouton, et ses lettres feraient un nom qui se
     recopie lui-même. Les pages qui n'ont pas de `#member-txt` écrivent le nom à même le bouton. */
  const nomDe = el => {
    const t = el.querySelector('#member-txt');
    if (t) return (t.textContent || '').trim();
    let s = '';
    for (const n of el.childNodes) if (n.nodeType === 3) s += n.nodeValue;   /* le nom écrit à même le bouton */
    if ((s = s.trim())) return s;
    const d = el.querySelector(':scope > span:not(.mcp)');
    return d ? (d.textContent || '').trim() : '';
  };

  function batir(el){
    let card = el.querySelector('.mcp');
    if (card) return card;
    card = document.createElement('span'); card.className = 'mcp'; card.setAttribute('aria-hidden', 'true');
    const r = document.createElement('span'); r.className = 'mcp-f mcp-r';
    const b = document.createElement('span'); b.className = 'mcp-f mcp-b';
    const lr = document.createElement('i'); lr.className = 'mcp-l';
    const lb = document.createElement('i'); lb.className = 'mcp-l';
    r.appendChild(lr); b.appendChild(lb);
    card.appendChild(r); card.appendChild(b);
    el.appendChild(card);
    return card;
  }

  function fit(el){
    const dedans = el.classList.contains('is-in');
    const p = el.__mcp;
    if (!dedans){
      if (p){ const i = vivantes.indexOf(p); if (i >= 0) vivantes.splice(i, 1); p.card.remove(); el.__mcp = null; }
      return;
    }
    const nom = nomDe(el), S = el.clientWidth;
    if (!S || !window.TOTEHM_NOM) return;
    const card = batir(el);
    const dos = card.querySelector('.mcp-b');
    if (dos.getAttribute('data-nom') !== nom) window.TOTEHM_NOM.poser(dos, nom, S);
    if (nom) el.setAttribute('aria-label', nom + ' — my TOTEHM on totehm.com');
    if (!el.__mcp){
      /* elle commence sur son VERSO : le nom d'abord, le logo ensuite */
      el.__mcp = { card, th:180, om:0, lr:card.querySelector('.mcp-r .mcp-l'), lb:card.querySelector('.mcp-b .mcp-l') };
      if (RM.matches){ peindre(el.__mcp); return; }
      vivantes.push(el.__mcp); relancer();
    } else if (el.__mcp.card !== card){
      /* ⚠️ la page qui réécrit le nom par `textContent` EFFACE la pièce : `batir` en refait une, et le
         moteur doit suivre la nouvelle, sinon il peint un nœud détaché et la pièce reste immobile. */
      el.__mcp.card = card;
      el.__mcp.lr = card.querySelector('.mcp-r .mcp-l');
      el.__mcp.lb = card.querySelector('.mcp-b .mcp-l');
      peindre(el.__mcp); relancer();
    }
  }

  const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(list => list.forEach(e => fit(e.target))) : null;
  const watch = el => {
    if (el.__mc) return; el.__mc = 1; fit(el); if (ro) ro.observe(el);
    new MutationObserver(() => fit(el)).observe(el, { childList:true, characterData:true, subtree:true, attributes:true, attributeFilter:['class'] });
  };
  const start = () => {
    document.querySelectorAll('.mc').forEach(watch);
    document.fonts?.ready?.then(() => document.querySelectorAll('.mc').forEach(el => {
      const d = el.querySelector('.mcp-b'); if (d) d.removeAttribute('data-nom');   /* mesuré avec la vraie police */
      fit(el);
    }));
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once:true }); else start();
})();
</script>
<script>
/* ══ LE MOT TOTEHM EST LE TOTEHM — copié de tools/totehm_word.js dans chaque page (jamais importé) ══
   Wah (12/11) : « à chaque fois qu'il y a le mot totehm, mettre le TOTEHM recto-verso rotatif, recto le
   logo, verso le nom du TOTEHM de l'utilisateur, dont la grandeur s'adapte au texte — dans tous les
   textes des 4 plateformes ». Le mot n'est donc plus écrit : il est la PIÈCE, celle du coin membre
   (`tools/member_corner.*`) à la taille du texte qui la porte. Règle n° 1 : rien n'est réinterprété.

   CE QUI NE CHANGE PAS : le mot reste dans le document, hors écran (`.tw-s`) — la page se lit à la voix,
   se cherche au clavier, et un test qui lit `textContent` trouve le même texte qu'avant.
   CE QUI N'EST JAMAIS TOUCHÉ : ce que le membre a ÉCRIT (une box, une mini-box, son nom, un champ), une
   adresse (`totehm.com`, `www.totehm.space`), un mot qui continue (`TOTEHMIZE`), et tout nœud marqué
   `data-notw`. Un domaine se reconnaît à ce qui suit : un point SUIVI d'une lettre.
   UNE SEULE BOUCLE pour toute la page : l'angle est une variable CSS de `:root` (`--tw-th`) ; vingt
   pièces coûtent vingt transformations de GPU, pas vingt boucles. Elle s'arrête sans pièce, sans nom,
   onglet caché, ou en mouvement réduit (la pièce est alors posée sur son verso, le nom lisible).
   La taille vient de la POLICE héritée (`getComputedStyle`), jamais de `clientWidth` : mesurer la boîte
   forcerait un calcul de mise en page à chaque peinture de la liste du Totehm. */
window.TOTEHM_MOT = (() => {
  const MOT = 'TOTEHM', NM = MOT.length, K = 1.12;      /* K = la taille de la pièce, en em (CSS) */
  const SAUT = /^(SCRIPT|STYLE|TITLE|TEXTAREA|INPUT|SELECT|OPTION|CODE|PRE|NOSCRIPT|IFRAME|CANVAS|VIDEO|AUDIO|IMG|SVG)$/;
  /* les classes de ce que le MEMBRE a écrit, et celles de la pièce elle-même */
  const CL = ['tw', 'v-name', 'v-int', 'mini', 'mini-t', 'mi', 'nm', 'tn-l', 'mc', 'sl-name', 'ms-w', 'ns-mot'];
  const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
  const diag = { mots:0, pieces:0, passes:0, nom:'' };
  const cache = new Map();
  let nom = '', neuves = [], vivantes = new Set(), rafP = 0, raf = 0, th = 180, om = 0, last = 0, tmr = 0, aFaire = [];

  /* ── où le mot se trouve dans un texte ───────────────────────────────── */
  function places(s){
    const u = s.toUpperCase(), out = [];
    for(let i = 0;;){
      const a = u.indexOf(MOT, i); if(a < 0) break;
      const b = a + NM; i = b;
      if(a > 0 && /[\w/@.\-]/.test(s[a - 1])) continue;        /* www.totehm · /@totehm · un mot collé */
      const ap = s.slice(b, b + 2);
      if(/^[\w\-]/.test(ap)) continue;                          /* TOTEHMIZE · totehm-link */
      if(/^\.[A-Za-z]/.test(ap)) continue;                      /* totehm.com · totehm.space */
      out.push(a);
    }
    return out;
  }
  /* ── ce qu'on ne traverse jamais ─────────────────────────────────────── */
  function saute(el){
    if(!el || el.nodeType !== 1) return false;
    if(el.namespaceURI && el.namespaceURI !== 'http://www.w3.org/1999/xhtml') return true;
    if(SAUT.test(el.tagName)) return true;
    if(el.isContentEditable || el.hasAttribute('contenteditable')) return true;
    if(el.hasAttribute('data-notw') || el.hasAttribute('data-nom') || el.hasAttribute('data-edit')) return true;
    if(el.id === 'member-txt' || el.id === 'ast-name') return true;
    const c = el.classList;
    for(let i = 0; i < CL.length; i++) if(c.contains(CL[i])) return true;
    return false;
  }
  const interdit = n => { for(let e = n.parentNode; e && e.nodeType === 1; e = e.parentNode) if(saute(e)) return true; return false; };

  /* ── la pièce ────────────────────────────────────────────────────────── */
  function piece(mot){
    const s = document.createElement('span');
    s.className = 'tw';
    s.innerHTML = '<span class="tw-s">' + mot + '</span><span class="tw-p" aria-hidden="true">'
      + '<span class="tw-f tw-r"></span><span class="tw-f tw-b"></span></span>';
    diag.pieces++;
    return s;
  }
  function remplacer(t){
    const s = t.nodeValue;
    if(!s || s.length < NM || !t.parentNode) return;
    const occ = places(s); if(!occ.length) return;
    const frag = document.createDocumentFragment();
    let k = 0;
    for(const a of occ){
      if(a > k) frag.appendChild(document.createTextNode(s.slice(k, a)));
      const p = piece(s.substr(a, NM));
      frag.appendChild(p); neuves.push(p); vivantes.add(p);
      k = a + NM;
    }
    if(k < s.length) frag.appendChild(document.createTextNode(s.slice(k)));
    t.parentNode.replaceChild(frag, t);
    diag.mots += occ.length;
    planifier();
  }
  function parcourir(n){
    if(!n) return;
    if(n.nodeType === 3) return remplacer(n);
    if(n.nodeType !== 1 || saute(n)) return;
    const kids = n.childNodes, l = [];
    for(let i = 0; i < kids.length; i++) l.push(kids[i]);
    for(const k of l){ if(k.nodeType === 3) remplacer(k); else if(k.nodeType === 1) parcourir(k); }
  }

  /* ── le verso : le nom, par la nomenclature du TOTEHM ────────────────── */
  function dessinNom(S){
    const cle = nom + '|' + Math.round(S);
    let h = cache.get(cle);
    if(h != null) return h;
    const tmp = document.createElement('span');
    if(window.TOTEHM_NOM) window.TOTEHM_NOM.poser(tmp, nom, S);
    else {
      /* sans la nomenclature dans la page : une ligne, ajustée, jamais une devinette de grille */
      const l = Array.from(nom).slice(0, 16), px = Math.max(3, Math.min(S * .34, S * .82 / Math.max(1, l.length * .62)));
      const e = document.createElement('span');
      e.className = 'tn-l'; e.textContent = l.join('');
      e.style.cssText = 'left:50%;top:50%;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(' + (px / 24).toFixed(4) + ')';
      tmp.appendChild(e);
    }
    /* ⚠️ LA LETTRE N'EST PAS DU TEXTE DU DOCUMENT · 12/11. Posée en nœud de texte, elle entrait dans le
       `textContent` de la phrase : « your TOTEHMwah Habit… ». Elle passe donc en `data-c` et c'est le CSS
       qui la dessine (`content:attr(data-c)`) — un contenu généré ne compte dans aucun `textContent`, ni
       dans une recherche de page, ni dans un test. Le mot hors écran (`.tw-s`) reste le seul texte. */
    tmp.querySelectorAll('.tn-l').forEach(e => { e.setAttribute('data-c', e.textContent || ''); e.textContent = ''; });
    h = tmp.innerHTML;
    if(cache.size > 40) cache.clear();
    cache.set(cle, h);
    return h;
  }
  function habiller(el, S){
    const dos = el.querySelector('.tw-b'); if(!dos) return;
    el.classList.toggle('is-plat', !nom);
    if(!nom || !S){ if(dos.firstChild) dos.textContent = ''; dos.removeAttribute('data-vu'); return; }
    const cle = nom + '|' + Math.round(S);
    if(dos.getAttribute('data-vu') === cle) return;
    dos.innerHTML = dessinNom(S);
    dos.setAttribute('data-vu', cle);
  }
  function planifier(){ if(!rafP) rafP = requestAnimationFrame(poser); }
  function poser(){
    rafP = 0;
    const l = neuves; neuves = [];
    if(!l.length){ relancer(); return; }
    /* les tailles d'abord (calcul de style), les écritures ensuite : jamais entrelacées */
    const t = l.map(e => e.isConnected ? parseFloat(getComputedStyle(e).fontSize) * K || 0 : 0);
    l.forEach((e, i) => { if(t[i]) habiller(e, t[i]); });
    diag.passes++; relancer();
  }

  /* ── la rotation, une pour toute la page ─────────────────────────────── */
  function boucle(now){
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - (last || now)) / 1000)); last = now;
    const s = Math.sin(th * Math.PI / 180), nat = 22 * (.34 + .66 * s * s);   /* 22°/s de face : ~24 s le tour */
    om += (nat - om) * (1 - Math.exp(-dt / 1.6));
    th += om * dt; if(th > 3600) th %= 360;
    document.documentElement.style.setProperty('--tw-th', th.toFixed(2) + 'deg');
    if(vif()) raf = requestAnimationFrame(boucle);
  }
  const vif = () => !!nom && !document.hidden && !RM.matches && vivantes.size > 0;
  function relancer(){
    for(const p of vivantes) if(!p.isConnected) vivantes.delete(p);
    if(!raf && vif()){ last = 0; raf = requestAnimationFrame(boucle); }
  }
  document.addEventListener('visibilitychange', relancer);

  /* ── le nom : la page peut le dire, sinon il se trouve tout seul ─────── */
  function trouver(){
    const t = document.getElementById('member-txt');
    if(t && (t.textContent || '').trim()) return (t.textContent || '').trim();
    const a = document.getElementById('ast-name');
    if(a && (a.textContent || '').trim()) return (a.textContent || '').trim();
    const g = document.querySelector('[data-nom]');
    if(g && (g.getAttribute('data-nom') || '').trim()) return (g.getAttribute('data-nom') || '').trim();
    return '';
  }
  function setNom(n){
    const v = String(n || '').trim();
    if(v === nom) return;
    nom = v; diag.nom = v; cache.clear();
    for(const p of vivantes){ if(!p.isConnected){ vivantes.delete(p); continue; }
      const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu');
      neuves.push(p); }
    planifier();
  }

  /* ── les textes qui arrivent après : un seul observateur, amorti ─────── */
  function vider(){
    tmr = 0;
    const l = aFaire; aFaire = [];
    for(const n of l){ if(!n.isConnected || interdit(n)) continue; parcourir(n); }
    setNom(trouver());
  }
  function observer(){
    if(typeof MutationObserver !== 'function') return;
    new MutationObserver(list => {
      for(const m of list){
        if(m.type === 'childList'){ for(const n of m.addedNodes) if(n.nodeType === 1 || n.nodeType === 3) aFaire.push(n); }
        else if(m.target) aFaire.push(m.target);
      }
      if(aFaire.length && !tmr) tmr = setTimeout(vider, 60);
    }).observe(document.body, { childList:true, subtree:true, characterData:true });
  }
  function demarrer(){
    if(!document.body) return;
    parcourir(document.body);
    setNom(trouver());
    observer();
    document.fonts?.ready?.then(() => {                       /* mesuré avant la vraie police = faux */
      cache.clear();
      for(const p of vivantes){ const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu'); neuves.push(p); }
      planifier();
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer, { once:true }); else demarrer();
  const api = { scan:parcourir, setNom, nom:() => nom,
                etat:() => Object.assign({ vivantes:vivantes.size, tourne:!!raf }, diag) };
  window.__totehm_mot = api.etat;
  return api;
})();
/* ══ fin LE MOT TOTEHM ══ */
</script>
</body>
