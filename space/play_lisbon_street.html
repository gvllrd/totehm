<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<style>html,body{color-scheme:dark;background:#000}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="/desktop-access.js"></script>
<script>
const streetEntry=new URLSearchParams(location.search);
if(streetEntry.get('board')==='1'&&streetEntry.get('discover')!=='1'){
 document.documentElement.classList.add('controller-deep-link');
 if(window.parent!==window&&streetEntry.get('embedded')==='1'&&streetEntry.get('projection')==='1')document.documentElement.classList.add('ufo-board-entry');
}
</script>
<title>TOTEHM — Lisbon Streets Higher</title>
<link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/experience-back.css">
<style>
/* POLICES — BASE (01/10) : Space Mono et Quantico, rien d'autre ; un bouton hérite. */
html{font-family:'Space Mono',monospace}button,input,select,textarea{font-family:inherit}
:root{
  --coral:#fbd5ca;--g-light:#e0e0e0;--g-mid:#909090;--g-dark:#606060;--bg:#000;
  --futura-light:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}

.t-futura{font-family:var(--futura-light);font-weight:300;font-size:14px;color:var(--g-light);line-height:1.7;letter-spacing:.02em;padding:0 20px;}

.higher-inline{display:inline-flex;align-items:center;width:54px;vertical-align:middle;line-height:0;margin:0 2px;}
.higher-inline svg{display:block;width:100%;height:auto;fill:currentColor}
.get-word{font-weight:700;color:var(--coral)}

.btn-sig{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:0;color:#b0b0b0;background:#1f1f24;border-radius:10px;cursor:pointer;border:2px solid transparent;padding:0;line-height:1.5;text-decoration:none;display:inline-flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:color .15s ease;text-align:center}
.btn-sig.claimed{color:#fff;border-image-source:none;border-image-slice:6 fill;border-image-repeat:round;background:#2e2e36}
@media(hover:hover){.btn-sig:hover{color:#fff;border-image-source:none;border-image-slice:6 fill;border-image-repeat:round;background:#2e2e36}}
.btn-sig:active{color:#fff;border-image-source:none;border-image-slice:6 fill;border-image-repeat:round;background:#2e2e36}

.note{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;min-height:14px;text-align:center}

.disc-block{
  position:absolute;width:90%;max-width:580px;text-align:center;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);
  transition:opacity .65s ease,transform .65s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.disc-block.active{visibility:visible}
.disc-block.show{opacity:1;transform:translateY(0);pointer-events:auto}
.disc-block.instant{transition:none}
.disc-block>.btn-sig{min-height:44px;padding:10px 20px;font-size:12px;letter-spacing:.04em}

/* ─── STREET DISCOVER (page principale) ─── */
#street-disc{position:fixed;inset:0;z-index:1;background:#000;}
#sdisc-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
#sdisc-stage{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;padding:60px 24px 70px;
  pointer-events:none;
}
#sdisc-trig{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;padding:0;
  text-align:center;white-space:nowrap;
  opacity:1;transition:opacity .3s ease;
}
#sdisc-trig.gone{opacity:0;pointer-events:none}
#street-access-status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;width:calc(100% - 40px);max-width:620px;text-align:center;color:#bbb;font:11px/1.5 "Space Mono",monospace;pointer-events:none}
@media(pointer:coarse){#sdisc-trig .trigger-label{display:none}}
.trigger-label{
  font-family:'Space Mono',monospace;font-size:10px;color:#9a9a9a;
  letter-spacing:.14em;text-transform:uppercase;line-height:1.5;transition:color .15s;
}
.chev{width:22px;height:22px;color:#a0a0a0;flex-shrink:0;transition:color .15s}
@keyframes bob-chev{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.bob-chev{animation:bob-chev 1.8s ease-in-out infinite}
@media(hover:hover){
  #sdisc-trig:hover .trigger-label,
  #sdisc-trig:hover .chev{color:#fff}
}

/* ═══ SIGN XP ═══ */
.xp{
  position:fixed;inset:0;z-index:90;background:#000;
  opacity:0;pointer-events:none;transition:opacity .55s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
}
.xp.up{opacity:1;pointer-events:auto}
.vbox-scene{
  --vbs:min(72vmin,300px);--vbd:40px;--vbhd:20px;
  perspective:900px;width:var(--vbs);height:var(--vbs);
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  flex-shrink:0;opacity:0;transition:opacity .5s ease;
}
.vbox-scene.in{opacity:1}
.vbox{
  width:var(--vbs);height:var(--vbs);
  position:relative;transform-style:preserve-3d;will-change:transform;
}
.vbf{position:absolute;left:0;top:0;}
.vb-front{
  width:var(--vbs);height:var(--vbs);transform:translateZ(var(--vbhd));
  background:rgba(255,255,255,.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.vb-front::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 40%,transparent 65%);
}
.vb-back{
  width:var(--vbs);height:var(--vbs);
  transform:rotateY(180deg) translateZ(var(--vbhd));
  background:#000;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.vb-inner{
  width:var(--vbs);height:var(--vbs);transform:translateZ(0);
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
}
.vb-inner video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
.vbside{position:absolute;left:0;top:0;background:#000;}
.vb-right{width:var(--vbd);height:var(--vbs);transform:translateX(calc(var(--vbs) - var(--vbhd))) rotateY(-90deg);}
.vb-left {width:var(--vbd);height:var(--vbs);transform:translateX(calc(-1 * var(--vbhd))) rotateY(90deg);}
.vb-top  {width:var(--vbs);height:var(--vbd);transform:translateY(calc(-1 * var(--vbhd))) rotateX(90deg);}
.vb-bot  {width:var(--vbs);height:var(--vbd);transform:translateY(calc(var(--vbs) - var(--vbhd))) rotateX(-90deg);}
@media(prefers-reduced-motion:reduce){.vbox{will-change:auto}}

/* Controller works are read as a fullscreen phrase before the film plays. */
#xp[data-sequence]{
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  place-items:center;padding:44px 28px;gap:0
}
#xp[data-sequence] #xp-close{z-index:2}
#xp[data-sequence] :is(#xp-label,#xp-buy),
#xp[data-sequence="phrase"] #vidWrap,#xp-phrase[hidden]{display:none}
#xp-phrase{
  width:min(100%,1100px);margin:0;text-align:center;color:var(--coral);
  font:400 clamp(28px,5.2vmin,72px)/1.25 'Quantico',sans-serif
}
.xp-phrase-word{display:inline-block;white-space:nowrap}
.xp-phrase-glyph{position:relative;opacity:0}
.xp-phrase-glyph.is-typed{opacity:1}
.xp-phrase-glyph.has-caret::after{
  content:'';position:absolute;top:.18em;right:-.11em;width:.065em;height:.89em;background:currentColor
}
#xp[data-sequence="art"] #vidWrap{
  grid-column:1;grid-row:1;width:min(100%,1480px);height:min(100%,1000px);
  cursor:default;touch-action:auto;perspective:none
}
#xp[data-sequence="art"] #vidBox,#xp[data-sequence="art"] .vb-inner{
  width:100%;height:100%;transform:none;will-change:auto
}
#xp[data-sequence="art"] #vid{object-fit:contain}
#xp[data-sequence="art"] :is(.vb-front,.vb-back,.vbside){display:none}
@media(prefers-reduced-motion:no-preference){
  #xp[data-sequence="art"] #vidWrap.in{animation:xp-art-in .26s ease-out backwards}
}
@keyframes xp-art-in{from{opacity:0}to{opacity:1}}

/* ─── AUTH OVERLAY ─── */
#auth-overlay{
  position:fixed;inset:0;z-index:100;background:#000;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
  display:flex;align-items:center;justify-content:center;
}
#auth-overlay.in{opacity:1;pointer-events:auto}
.mw-card{background:#131316;border:none;max-width:360px;width:100%;padding:30px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.line-input{font-family:'Quantico',sans-serif;font-weight:400;font-size:14px;color:#fff;background:#1f1f24;outline:none;border:6px solid transparent;border-image-source:none;border-image-slice:6 fill;border-image-repeat:round;padding:0 6px;text-align:center;caret-color:var(--coral);min-width:260px;border-radius:10px}
.line-input::placeholder{color:rgba(255,255,255,.33)}

@media(hover:hover){
  .t-futura:hover{color:#fff}
  #sdisc-back:hover{color:#fff}
}

/* ── XP GALLERY LABEL ── */
#xp-label{width:min(72vmin,300px);flex-shrink:0;opacity:0;transition:opacity .4s ease .3s}
#xp-label.in{opacity:1}
.xp-la{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;color:#8a8a8a;text-transform:uppercase;margin-bottom:3px}
.xp-lt{font-family:'Space Mono',monospace;font-size:clamp(10.6px,2.3vmin,17.2px);letter-spacing:.06em;color:#fff;line-height:1;margin-bottom:3px;font-weight:700;text-transform:uppercase}
.xp-lm{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.1em;color:#8a8a8a;text-transform:uppercase;margin-bottom:6px}
.xp-lph{font-family:'Space Mono',monospace;font-weight:400;font-size:12px;color:#c8c8c8;line-height:1.5;margin-bottom:9px}
.xp-ld{width:100%;height:1px;background:#222;margin-bottom:9px}
.xp-lr{display:flex;justify-content:space-between;align-items:baseline}
.xp-lp{font-family:'Space Mono',monospace;font-size:12px;color:var(--coral);letter-spacing:.04em}
.xp-le{font-family:'Space Mono',monospace;font-size:8px;color:#8a8a8a;letter-spacing:.1em;text-transform:uppercase}
.xp-teaser{margin-top:15px;padding-top:12px;border-top:1px solid #222}
.xp-teaser p{margin:0 0 10px;font:10px/1.6 'Space Mono',monospace;color:#999}
#xp-get-higher{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:9px 12px;text-decoration:none;font-size:11px;letter-spacing:.02em}

/* ─── ROTATE PROMPT (board mode, portrait mobile) ─── */
#rotate-prompt{
  position:fixed;inset:0;z-index:85;
  display:none;flex-direction:column;align-items:center;justify-content:space-between;
  padding:48px 24px 52px;text-align:center;pointer-events:none;
}
#rotate-prompt.active{display:flex}
@media(orientation:landscape){#rotate-prompt.active{display:none}}
.rotate-spinner{width:52px;height:52px;color:#606060;animation:spin 3.2s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.rotate-hint{font-family:'Space Mono',monospace;font-weight:400;font-size:11px;color:#606060;line-height:1.6;letter-spacing:.1em;text-transform:uppercase}
@media(orientation:landscape){
  .xp{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:44px 5vw 28px;gap:3vw 5vw}
  .vbox-scene{grid-column:1;grid-row:1/3;--vbs:min(62vh,40vw)}
  #xp-label{grid-column:2;grid-row:1;width:100%;max-width:320px;text-align:left}
  #xp-buy{grid-column:2;grid-row:2;justify-self:start}
}


/* 30/09 : le prix du THP, posé par le serveur (voir le module). */
.thp-price::after{content:var(--thp,"")}

@media(prefers-reduced-motion:reduce){
  .disc-block,.xp,.vbox-scene,#xp-label{transition:none}
  .bob-chev,.rotate-spinner{animation:none}
}

/* Discover: the full-screen type scale and reading rhythm of Think same. */
#sdisc-stage{padding:80px 24px 118px}
#sdisc-stage .disc-block{width:min(100%,680px);max-width:680px;gap:18px}
#sdisc-stage .t-futura{font:400 clamp(16px,2vw,23px)/1.6 'Space Mono',monospace;letter-spacing:0;padding:0;color:#ddd;white-space:pre-line}
#sdisc-stage .disc-block.is-first .t-futura:first-child{font:400 clamp(26px,4vw,51px)/1.16 Quantico,sans-serif}
#sdisc-stage .higher-inline{width:3.1em}
#sdisc-stage .disc-block>.btn-sig{font-size:12px;min-height:44px;padding:10px 18px;margin-top:22px!important;max-width:100%}
#sdisc-bg{opacity:.2;transition:opacity .55s ease}
body.is-street-board #sdisc-bg,body.is-snapping #sdisc-bg{opacity:1}
#sdisc-rail{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
#sdisc-rail span{width:18px;height:2px;background:#242424;transition:background .3s}
#sdisc-rail span.on{background:#bdbdbd}
#sdisc-trig{bottom:18px;min-width:44px;min-height:44px;justify-content:center}
#street-access-status{bottom:90px}
body.is-street-board #sdisc-rail,body.is-street-board #sdisc-progress,body.is-snapping #sdisc-rail,body.is-snapping #sdisc-progress{display:none}
@media(max-width:650px){#sdisc-stage{padding:74px 23px 128px}#sdisc-stage .t-futura{font-size:clamp(15px,4vw,17px);line-height:1.5}#sdisc-stage .disc-block.is-first .t-futura:first-child{font-size:clamp(26px,8vw,35px)}#sdisc-progress{top:25px}}
@media(prefers-reduced-motion:reduce){.disc-block,#sdisc-bg{transition:none}.bob-chev{animation:none}}


/* One authored moving first page, also projected from the saucer. */
#experience-front-canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh * 16 / 9));height:auto;aspect-ratio:16/9;display:block;pointer-events:none;transition:opacity .7s}
#sdisc-bg{opacity:1}
#sdisc-bg>.street-rock{opacity:0;pointer-events:none}
body.is-street-board #sdisc-bg>.street-rock{opacity:1;pointer-events:auto}
body.is-snapping #experience-front-canvas{visibility:hidden}
#controller-assembly{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
html.ufo-board-entry,html.ufo-board-entry body,html.ufo-board-entry #street-disc{background:transparent}
html.ufo-board-entry :is(#sdisc-stage,#sdisc-cover-next,#sdisc-back,#sdisc-trig,#sdisc-progress,#sdisc-rail,#experience-front-canvas){visibility:hidden!important}
html.ufo-board-entry #controller-3d-view{opacity:0;transition:opacity .52s ease}
html.ufo-board-entry body.is-controller-forming #controller-3d-view{opacity:1}
body.is-snapping :is(#sdisc-stage,#sdisc-back,#sdisc-trig){opacity:0;transition:opacity .38s ease;pointer-events:none}
#sdisc-cover-next{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);z-index:3;border:1px solid #343434;border-radius:10px;background:#111;color:#aaa;font:11px 'Space Mono',monospace;padding:13px 22px;cursor:pointer;transition:opacity .4s,transform .6s}
body:not(.is-street-front) #sdisc-cover-next{opacity:0;transform:translate(-50%,18px);pointer-events:none}
.is-street-front #sdisc-stage,.is-street-front #sdisc-progress,.is-street-front #sdisc-rail,.is-street-front #sdisc-trig{opacity:0!important;visibility:hidden;pointer-events:none}
#sdisc-stage{transition:opacity .7s}
#controller-3d-view{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease;}
#controller-3d-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.is-controller-forming #controller-3d-view,body.is-street-board #controller-3d-view,body.is-controller-entry #controller-3d-view{opacity:1}
body.is-controller-forming #controller-3d-view{transition:opacity 1.05s cubic-bezier(.22,.52,.32,1) 70ms}
body.is-controller-entry #controller-3d-view{transition:none}
html.is-table-lift,html.is-table-lift body,html.is-table-lift #street-disc{background:#000}
html.is-table-lift #street-disc>:not(#sdisc-bg),html.is-table-lift #experience-front-canvas{visibility:hidden!important}
html.is-table-lift #controller-3d-view{opacity:1;transition:none}
#controller-meaning{display:none;position:absolute;left:50%;bottom:clamp(62px,14vh,148px);transform:translateX(-50%);z-index:2;color:#c9c9ce;text-decoration:none;text-align:center;font-size:clamp(14px,1.25vw,19px);line-height:1.35;padding:8px 6px;max-width:calc(100% - 32px)}
body.is-street-board #street-disc:not([inert]) #controller-meaning{display:flex;align-items:center;justify-content:center;gap:8px}
#controller-meaning .get-word{font-family:Quantico,sans-serif;font-size:clamp(23px,2.1vw,32px);font-weight:700;color:var(--coral)}
#controller-meaning .higher-inline{width:clamp(70px,7vw,100px)}
#controller-meaning:hover,#controller-meaning:focus-visible{color:#fff}
#controller-credit{
  display:none;position:absolute;inset:auto 16px max(12px,env(safe-area-inset-bottom)) 16px;
  z-index:2;pointer-events:none;justify-content:center;align-items:center;gap:10px;
  margin:0;color:#c9c9ce;text-align:center;font:400 clamp(10px,1.2vw,15px)/1.4 'Space Mono',monospace;
}
body.is-street-board #street-disc:not([inert]) #controller-credit{display:flex}
#controller-credit .wah-signature{
  flex:0 0 clamp(30px,3.5vw,48px);height:clamp(36px,4.2vw,54px);background:#e4dfda;
  mask:url('/assets/img/wavywah_signature.png') center/contain no-repeat;
  mask-mode:luminance;
}
@media(max-height:500px){
  #controller-credit{bottom:max(4px,env(safe-area-inset-bottom));font-size:10px}
  #controller-credit .wah-signature{height:34px}
  #controller-meaning{bottom:40px}
}
#controller-meaning:focus-visible{outline:1px solid #a6b5d4;border-radius:6px;outline-offset:3px}
body.is-controller-locked #controller-3d-view{opacity:.20}
body.is-controller-locked :is(#experience-front-canvas,#sdisc-cover-next,#sdisc-rail,#sdisc-progress,#sdisc-trig){display:none!important}
body.is-street-board :is(#experience-front-canvas,#sdisc-cover-next){display:none}
body.is-controller-locked #street-access-status{clip-path:inset(50%)}
body.is-controller-locked #sdisc-stage{background:radial-gradient(ellipse at center,#000d 0%,#0008 35%,transparent 66%)}
:is(.controller-deep-link,.is-controller-entry) :is(#experience-front-canvas,#sdisc-stage,#sdisc-cover-next,#sdisc-back,#sdisc-trig,#sdisc-progress,#sdisc-rail){visibility:hidden}
body.is-street-board.has-controller-3d #sdisc-bg>.street-rock>img{opacity:0}
body.is-street-board #sdisc-bg>.street-rock.is-key-down>img{filter:brightness(.68);transform:scale(.96)}
#sdisc-bg .street-rock .played-sticker{
  position:absolute;display:block;pointer-events:none;line-height:0;transform:translate(-50%,-50%) rotate(var(--angle));
  filter:drop-shadow(0 .5px 0 #b7aea6) drop-shadow(0 1px .7px #0a0910b3);
}
#sdisc-bg .street-rock .played-sticker .higher-inline{width:100%;margin:0}
body.has-controller-3d #sdisc-bg .street-rock .played-sticker{display:none}
body.is-street-board #sdisc-bg>.street-rock:focus-visible{outline:2px solid #a6b5d4;border-radius:8px;outline-offset:4px}
@media(prefers-reduced-motion:reduce){#controller-3d-view{transition:none}}

/* ══ SURVOL — BLOC GÉNÉRÉ, NE PAS ÉDITER À LA MAIN (hover.py) ══ */
/* Le gris en survol devient blanc. Généré depuis la feuille
   elle-même : un nouveau bloc gris entre ici tout seul.        */
@media(hover:hover){
.t-futura:hover,
.btn-sig:hover,
#sdisc-back:hover,
#sdisc-board-close:hover,
.trigger-label:hover,
.chev:hover,
#xp-close:hover,
#auth-back-btn:hover,
.line-input:hover::placeholder,
.xp-la:hover,
.xp-lm:hover,
.xp-lph:hover,
.xp-le:hover,
.rotate-spinner:hover,
.rotate-hint:hover{color:#fff}
}
/* ══ FIN DU BLOC GÉNÉRÉ ══ */

/* ══ LE MOT TOTEHM EST LE TOTEHM — copié de tools/totehm_word.css dans chaque page (jamais importé) ══
   ⚠️ 14/11 (Wah) — ANNULATION DU REMPLACEMENT GÉNÉRAL : « annule la décision de remplacer TOUS les textes
   Totehm par le logo totehm. À la place, sélectionne seulement les textes TOTEHM les plus stratégiques et
   brandés = les endroits qui posent le moins de problème dans la structure globale. Et très important :
   ceux que tu gardes en mode logo doivent être AGRANDIS, car actuellement on ne voit quasiment rien d'eux. »
   Donc : la pièce ne se pose plus sur tout texte, elle se pose là où la PAGE le demande (`data-tw`), et
   elle est deux fois plus grande (`--tw-k`).

   La pièce est celle du coin membre (`tools/member_corner.css`) : mêmes faces, mêmes perforations, même
   nomenclature de nom (`tools/totehm_name.js`). Règle n° 1 : rien n'est réinterprété ici, tout est copié
   de la source. Le mot reste DANS le document (`.tw-s`, hors écran) : la page se lit, se cherche et
   s'entend comme avant.
   ⚠️ UNE SEULE ROTATION POUR TOUTE LA PAGE : un seul rAF pose l'angle (`--tw-th`) sur chaque pièce VISIBLE —
   jamais sur `:root`, qui ferait recalculer le style de toute la page à chaque image (16/11, mesuré).

   d'autorisation : soixante secondes, un seul usage, un seul domaine
   cible, stocké haché côté serveur, lié à un défi PKCE pour la connexion
   centrale, et il n'ouvre rien par lui-même — il faut l'échanger.
   ═══════════════════════════════════════════════════════════════════ */

const SSO_FN = 'https://abujjbkbbiumxrokozph.supabase.co/functions/v1/';
/* ⚠️ LA CLÉ ANONYME EST OBLIGATOIRE : les Edge Functions sont déployées

   publique — déjà en clair au `createClient`. */
/* LE NOM DE CE DOMAINE — 'space' | 'club' | 'boutique'. Jamais une URL. */
const SSO_CLIENT = 'space';
const SSO_AUTH = 'https://www.totehm.com/auth';
const SSO_KNOWN = 'totehm_sso_known';   // localStorage : ce navigateur s'est déjà connecté ici
const SSO_TRIED = 'totehm_sso_tried';   // sessionStorage : l'aller-retour silencieux a eu lieu
const SSO_PKCE  = 'totehm_sso_pkce';    // sessionStorage : { verifier, state } le temps du voyage
const SSO_EPOCH = 'totehm_sso_epoch';  // localStorage : le numero de sortie vu en entrant

const ssoB64 = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const ssoStore = (s, k, v) => { try{ v === null ? s.removeItem(k) : s.setItem(k, v); }catch(_){} };
const ssoRead = (s, k) => { try{ return s.getItem(k); }catch(_){ return null; } };

/* ── ARRIVÉE ────────────────────────────────────────────────────────
   ⚠️ LE CODE SORT DE L'URL AVANT TOUT AUTRE GESTE — et SEULEMENT lui :
   le reste du fragment (#create, #reveal…) reste à la page. Un code
   laissé dans la barre d'adresse se retrouve dans un signet, un partage,
   un historique. Avec un `state`, c'est une connexion centrale : il doit
   être celui que CE navigateur a envoyé (sinon quelqu'un essaie de nous
   connecter à SON compte) et le `verifier` part avec le code. */
async function ssoArrivee(sb){
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  const code = h.get('sso') || q.get('sso'), st = h.get('state'), err = h.get('sso_error');
  if(!code && !err) return false;
  ['sso','state','sso_error'].forEach(k => { h.delete(k); q.delete(k); });
  const reste = [...h.keys()].length ? '#' + h.toString().replace(/=(&|$)/g, '$1') : '';
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + reste);
  const pk = (() => { try{ return JSON.parse(ssoRead(sessionStorage, SSO_PKCE) || 'null'); }catch(_){ return null; } })();
  ssoStore(sessionStorage, SSO_PKCE, null);
  if(err || !/^[a-f0-9]{64}$/.test(code || '')) return false;
  let verifier;
  if(st){
    if(!pk || pk.state !== st){ console.error('[sso] state'); return false; }
    verifier = pk.verifier;
  }
  try{
    const r = await fetch(SSO_FN + 'sso-redeem', {
      method:'POST',
      headers:{'content-type':'application/json', 'apikey':SB_ANON, 'authorization':'Bearer '+SB_ANON},
      body: JSON.stringify(verifier ? { code, verifier } : { code })
    });
    if(!r.ok){ console.error('[sso] redeem', r.status); return false; }
    const { token_hash, email } = await r.json();
    if(!token_hash) return false;
    /* `verifyOtp` ouvre une session NORMALE dans ce `localStorage`.
       ⚠️ 02/10 : `token_hash` + `type` SEULS — avec `email`, Supabase Auth
       répond 400 « Only the token_hash and type should be provided ». */
    const { error } = await sb.auth.verifyOtp({ type:'email', token_hash });
    if(error){ console.error('[sso] verify', error.message); return false; }
    return true;
  }catch(e){ console.error('[sso]', e && e.message || e); return false; }
}

/* ── SE CONNECTER — PAR TOTEHM.COM ──────────────────────────────────
   `silent` : `prompt=none` — totehm.com ne montre rien, il rend un code
   ou `login_required`. `retour` : un CHEMIN de ce domaine (jamais une
   URL) ; totehm.com refuse tout le reste. */
async function ssoLogin(silent, retour){
  const v = ssoB64(crypto.getRandomValues(new Uint8Array(32)));
  const c = ssoB64(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  const st = ssoB64(crypto.getRandomValues(new Uint8Array(16)));
  ssoStore(sessionStorage, SSO_PKCE, JSON.stringify({ verifier: v, state: st }));
  const ret = retour || streetReturnPath();
  navigateStreetExperience(SSO_AUTH + '?client=' + SSO_CLIENT + '&challenge=' + c + '&state=' + st +
                  '&return=' + encodeURIComponent(ret) + (silent ? '&prompt=none' : ''));
}

/* ── DÉPART ─────────────────────────────────────────────────────────
   `cible` est un NOM DE PRODUIT — 'com' | 'space' | 'boutique' | 'club'.
   ⚠️ SI LE PONT ÉCHOUE, ON PART QUAND MÊME : dégradé, pas cassé. */
async function ssoVersDomaine(sb, cible, url){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const r = await fetch(SSO_FN + 'sso-mint', {
        method:'POST',
        headers:{ 'authorization':'Bearer '+session.access_token, 'apikey':SB_ANON, 'content-type':'application/json' },
        body: JSON.stringify({ target: cible })
      });
      if(r.ok){
        const { code } = await r.json();
        if(code){ location.href = url + (url.includes('#') ? '&' : '#') + 'sso=' + code; return; }
      } else console.error('[sso] mint', r.status);
    }
  }catch(e){ console.error('[sso]', e && e.message || e); }
  location.href = url;
}

/* ── SORTIR DE TOTEHM.COM SORT D'ICI AUSSI · 08/11/2026 ─────────────
   Wah : « je ne peux pas me deconnecter d'un compte sur un domaine quand je
   me deconnecte de totehm.com ». Mesure : com sortait en `scope:'global'`
   (les jetons de rafraichissement sont revoques, mais CE site garde un jeton
   d'ACCES valide jusqu'a une heure) et quatre pages de com sortaient en
   `scope:'local'`, qui ne revoque RIEN — on restait connecte ici, sans fin.
   La console centrale pose un NUMERO DE SORTIE en base. Ce site retient
   celui qu'il a vu, le relit au demarrage et a chaque retour d'onglet :
   plus grand = la console a ferme, on sort. Une lecture SQL, zero centime,
   et la decision vit sur le SERVEUR, pas dans un navigateur. Une erreur de
   reseau ne deconnecte JAMAIS : sans numero lisible, on ne touche a rien.
   Le repere s'efface AVANT le rechargement, sinon l'aller-retour silencieux
   nous reconnecte au chargement suivant. */
async function ssoVerifierSortie(sb){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ ssoStore(localStorage, SSO_EPOCH, null); return false; }
    const { data, error } = await sb.rpc('sso_epoch');
    if(error){ console.error('[sso_epoch]', error.message); return false; }
    if(typeof data !== 'number' || data <= 0) return false;
    const vu = Number(ssoRead(localStorage, SSO_EPOCH) || 0);
    if(!vu || data <= vu){ ssoStore(localStorage, SSO_EPOCH, String(data)); return false; }
    ssoStore(localStorage, SSO_KNOWN, null);
    ssoStore(localStorage, SSO_EPOCH, null);
    ssoStore(sessionStorage, SSO_TRIED, '1');
    try{ await sb.auth.signOut({ scope:'local' }); }catch(_){}
    location.reload();
    return true;
  }catch(_){ return false; }
}

      if(typedGlyphs<phraseLength&&!reducedMotion.matches)glyphs[typedGlyphs-1]?.classList.add('has-caret');

      if(lastTime!==null&&!document.hidden)elapsed+=Math.min(64,now-lastTime);
      lastTime=now;
      const progress=Math.max(0,Math.min(1,(elapsed-lead)/duration));
      reveal(reducedMotion.matches?phraseLength:Math.floor(phraseLength*progress));
      if(typedGlyphs===phraseLength)finishedAt??=elapsed;
      if(finishedAt!==null&&elapsed-finishedAt>=hold){finish(true);return;}
      frame=requestAnimationFrame(tick);

function waitForSignFrame(signal){
  if(vid.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA)return Promise.resolve('ready');
  return new Promise(resolve=>{
    const ready=()=>finish('ready'),failed=()=>finish('error'),aborted=()=>finish('aborted');

    function finish(state){
      clearTimeout(timer);vid.removeEventListener('loadeddata',ready);vid.removeEventListener('error',failed);
      signal.removeEventListener('abort',aborted);resolve(state);
    }
    vid.addEventListener('loadeddata',ready,{once:true});
    vid.addEventListener('error',failed,{once:true});
    signal.addEventListener('abort',aborted,{once:true});
    if(signal.aborted)aborted();

        const rectangle=artworkCorners(flight.from.width,flight.from.height,pose.rotation);
        flight.perspective=pose.corners.map((point,i)=>({
          x:(point.x-pose.x)*innerWidth-rectangle[i].x,

      }
      flight.to={x:target.x-host.left+target.width/2,y:target.y-host.top+target.height/2,width:target.width,height:target.height};
      const dx=flight.to.x-flight.from.x,dy=flight.to.y-flight.from.y,distance=Math.hypot(dx,dy);
      const curve=Math.min(88,distance*.16)*(index%2?1:-1)/Math.max(distance,1);
      flight.arcX=-dy*curve;flight.arcY=dx*curve;

    context.clearRect(0,0,canvasWidth,canvasHeight);levels.clear();

      const progress=unit((elapsed-delay)/travel),position=smooth(progress);
      const dock=smooth(unit((elapsed-delay-travel)/blendTime));
      if(dock>0)levels.set(rock.id,dock);
      if(dock===1||!rock.img.naturalWidth)continue;
      const arc=Math.sin(Math.PI*position);
      const width=mix(from.width,to.width,position),height=mix(from.height,to.height,position);

          x:point.x+perspective[i].x*distortion,y:point.y+perspective[i].y*distortion

}

      tmp.appendChild(e);
    }
    /* ⚠️ LA LETTRE N'EST PAS DU TEXTE DU DOCUMENT · 12/11. Posée en nœud de texte, elle entrait dans le
       `textContent` de la phrase : « your TOTEHMwah Habit… ». Elle passe donc en `data-c` et c'est le CSS
       qui la dessine (`content:attr(data-c)`) — un contenu généré ne compte dans aucun `textContent`, ni
       dans une recherche de page, ni dans un test. Le mot hors écran (`.tw-s`) reste le seul texte. */
    tmp.querySelectorAll('.tn-l').forEach(e => { e.setAttribute('data-c', e.textContent || ''); e.textContent = ''; });
    h = tmp.innerHTML;
    if(cache.size > 40) cache.clear();
    cache.set(cle, h);
    return h;
  }
  function habiller(el, S){
    const dos = el.querySelector('.tw-b'); if(!dos) return;
    el.classList.toggle('is-plat', !nom);
    if(!nom || !S){ if(dos.firstChild) dos.textContent = ''; dos.removeAttribute('data-vu'); return; }
    const cle = nom + '|' + Math.round(S);
    if(dos.getAttribute('data-vu') === cle) return;
    dos.innerHTML = dessinNom(S);
    dos.setAttribute('data-vu', cle);
  }
  function planifier(){ if(!rafP) rafP = requestAnimationFrame(poser); }
  function poser(){
    rafP = 0;
    const l = neuves; neuves = [];
    if(!l.length){ relancer(); return; }
    /* les tailles d'abord (calcul de style), les écritures ensuite : jamais entrelacées */
    const t = l.map(e => e.isConnected ? parseFloat(getComputedStyle(e).fontSize) * K || 0 : 0);
    l.forEach((e, i) => { if(t[i]) habiller(e, t[i]); });
    diag.passes++; relancer();
  }

  /* ── la rotation, une pour toute la page ─────────────────────────────── */
  function boucle(now){
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - (last || now)) / 1000)); last = now;
    const s = Math.sin(th * Math.PI / 180), nat = 22 * (.34 + .66 * s * s);   /* 22°/s de face : ~24 s le tour */
    om += (nat - om) * (1 - Math.exp(-dt / 1.6));
    th += om * dt; if(th > 3600) th %= 360;
    const a = angle();
    for(const p of vues){ if(p.isConnected) p.style.setProperty('--tw-th', a); else vues.delete(p); }
    if(vif()) raf = requestAnimationFrame(boucle);
  }
  const vif = () => !!nom && !document.hidden && !RM.matches && vues.size > 0;
  function relancer(){
    for(const p of vivantes) if(!p.isConnected){ vivantes.delete(p); vues.delete(p); if(io) io.unobserve(p); }
    if(!raf && vif()){ last = 0; raf = requestAnimationFrame(boucle); }
  }
  document.addEventListener('visibilitychange', relancer);

  /* ── le nom : la page peut le dire, sinon il se trouve tout seul ─────── */
  /* ⚠️ LE NOM NE SE LIT QUE SUR UN COIN CONNECTÉ · 12/11, mesuré EN PRODUCTION sur figher.club.
     `#member-txt` existe aussi DÉCONNECTÉ : il porte alors le libellé du bouton, et le verso de chaque
     pièce affichait « CONNECT WITH MY TOTEHM ». La marque `is-in` (posée par la page quand le membre est
     là) est donc la condition, et on lit le nom comme `member_corner.js` : `#member-txt`, sinon le texte
     écrit à même le bouton, sinon son dernier enfant. Sans coin connecté : `#ast-name` (com), puis un
     `[data-nom]`, que seule la nomenclature pose — et jamais un libellé. */
  function trouver(){
    const mc = document.querySelector('.mc.is-in');
    if(mc){
      const t = mc.querySelector('#member-txt');
      let v = t ? (t.textContent || '').trim() : '';
      if(!v){ for(const n of mc.childNodes) if(n.nodeType === 3) v += n.nodeValue; v = v.trim(); }
      if(!v){ const d = mc.querySelector(':scope > span:not(.mcp)'); v = d ? (d.textContent || '').trim() : ''; }
      if(v) return v;
    }
    const a = document.getElementById('ast-name');
    if(a && (a.textContent || '').trim()) return (a.textContent || '').trim();
    const g = document.querySelector('[data-nom]');
    if(g && (g.getAttribute('data-nom') || '').trim()) return (g.getAttribute('data-nom') || '').trim();
    return '';
  }
  function setNom(n){
    const v = String(n || '').trim();
    if(v === nom) return;
    nom = v; diag.nom = v; cache.clear();
    for(const p of vivantes){ if(!p.isConnected){ vivantes.delete(p); continue; }
      const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu');
      neuves.push(p); }
    planifier();
  }

  /* ── les hôtes qui arrivent après : un seul observateur, amorti ──────── */
  function vider(){
    tmr = 0;
    const l = aFaire; aFaire = [];
    for(const n of l){ if(n.isConnected) poserDans(n); }
    setNom(trouver());
  }
  function observer(){
    if(typeof MutationObserver !== 'function') return;
    new MutationObserver(list => {
      for(const m of list){
        /* ⚠️ UN TEXTE QUI ARRIVE (`textContent = …`) change le NOM : le nœud de texte ajouté compte, par son
           parent — sans lui, le coin membre qui se remplit (« wah » après « CONNECT… ») n'était jamais relu. */
        if(m.type === 'childList'){ for(const n of m.addedNodes){ if(n.nodeType === 1) aFaire.push(n); else if(n.parentNode) aFaire.push(n.parentNode); } }
        else if(m.target && m.target.nodeType === 1) aFaire.push(m.target);
        else if(m.target && m.target.parentNode) aFaire.push(m.target.parentNode);
      }
      if(aFaire.length && !tmr) tmr = setTimeout(vider, 60);
    }).observe(document.body, { childList:true, subtree:true, characterData:true });
  }
  function demarrer(){
    if(!document.body) return;
    poserDans(document.body);
    setNom(trouver());
    observer();
    document.fonts?.ready?.then(() => {                       /* mesuré avant la vraie police = faux */
      cache.clear();
      for(const p of vivantes){ const d = p.querySelector('.tw-b'); if(d) d.removeAttribute('data-vu'); neuves.push(p); }
      planifier();
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer, { once:true }); else demarrer();
  const api = { scan:poserDans, setNom, nom:() => nom,
                etat:() => Object.assign({ vivantes:vivantes.size, vues:vues.size, tourne:!!raf }, diag) };
  window.__totehm_mot = api.etat;
  return api;
})();
/* ══ fin LE MOT TOTEHM ══ */
</script>
</body>
</html>
