name: Higher ChatGPT
on:
  pull_request:
    paths:
      - 'com/**'
      - 'backend/supabase/functions/**'
      - 'backend/supabase/migrations/*chatgpt*'
      - 'backend/supabase/migrations/*tracking*'
      - 'tests/**'
      - '.github/workflows/chatgpt.yml'
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests/fn --ignore-scripts
      - run: npm --prefix tests/fn run test:chatgpt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests/browser --no-save playwright @supabase/supabase-js esbuild
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: node -e "require('fs').writeFileSync('tests/browser/entry.js', 'export * from \"@supabase/supabase-js\";')"
      - run: tests/browser/node_modules/.bin/esbuild tests/browser/entry.js --bundle --format=esm --platform=browser --outfile=tests/browser/supabase.mjs
      - run: mkdir -p work
      - run: curl --fail --silent --show-error --output work/gpt.png https://abujjbkbbiumxrokozph.supabase.co/storage/v1/object/public/com/gpt.png
      - run: node tests/browser/com_chatgpt.mjs work/chatgpt-view
      - run: node tests/browser/chatgpt_connect.mjs work/chatgpt-connection
      - run: node tests/browser/com_orders.mjs work/chatgpt-orders
      - run: node tests/browser/com_element_link.mjs work/chatgpt-elements
      - run: node tests/browser/com_telegram_practice.mjs work/chatgpt-practice
      - run: node tests/browser/com_intitules.mjs work
      - run: node tests/browser/com_habit_rhythm.mjs work/chatgpt-rhythm
      - run: node tests/browser/com_tracking.mjs work/chatgpt-tracking
      - run: node tests/browser/com_verso_dashboard.mjs work/chatgpt-dashboard
      - run: node tests/browser/com_member_menu.mjs work/chatgpt-menu
      - run: node tests/browser/com_verso_loupe.mjs work/chatgpt-loupe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-browser
          path: work/chatgpt-*
