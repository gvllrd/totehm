version: "3.3"

# ═══════════════════════════════════════════════════════════════
# TOTEHM · n8n
# Serveur : Oracle Cloud Infrastructure, Ubuntu, ~/n8n-server
# Domaine : n8n.higher.boutique (DNS Vercel, A -> IP publique OCI)
# Rôle    : automatisation Totehm Cloth (Printful, Replicate, Resend)
#
# Les secrets vivent dans .env sur le serveur, JAMAIS dans ce fichier.
# ═══════════════════════════════════════════════════════════════

services:

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      - N8N_HOST=n8n.higher.boutique
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.higher.boutique/
      - GENERIC_TIMEZONE=Europe/Lisbon
      # Auth — sans ça, ton n8n est ouvert à tout Internet sur 443
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Chiffrement des credentials stockés
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # ⚠️ SANS CES DEUX BLOCS, LA CHAÎNE STREETWEAR NE PEUT PAS TOURNER.
      # Les Code nodes lisent leurs clés par `$env.X` ; n8n refuse l'accès à
      # l'environnement dans un Code node tant que ce drapeau est vrai, et une
      # variable du `.env` n'entre PAS dans le conteneur si elle n'est pas
      # listée ici. Les secrets restent dans le `.env` à côté de ce fichier.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SB_KEY=${SB_KEY}
      - PRINTFUL_TOKEN=${PRINTFUL_TOKEN}
      - PF_STORE_ID=${PF_STORE_ID}
      - TG_TOKEN=${TG_TOKEN}
      - TG_CHAT=${TG_CHAT}
      - TG_WEBHOOK_SECRET=${TG_WEBHOOK_SECRET}
      - TG_ADMIN_IDS=${TG_ADMIN_IDS}
      - OPENAI_KEY=${OPENAI_KEY}
      - REPLICATE_KEY=${REPLICATE_KEY}
      - REPLICATE_VERSION=${REPLICATE_VERSION}
      - RESEND_KEY=${RESEND_KEY}
    volumes:
      # SANS ce volume, un `docker compose down` efface TOUS tes workflows
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
